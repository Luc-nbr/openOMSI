[package]
name = "omsi-launcher-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The launcher page's commands (desktop launcher and phone web view alike): JSON in, JSON or picture bytes out"

[dependencies]
serde.workspace = true
serde_json.workspace = true
omsi-launcher-core = { path = "../omsi-launcher-core" }
omsi-cfg = { path = "../omsi-cfg" }
omsi-timetable = { path = "../omsi-timetable" }
# (the version the release was built as: OPENOMSI_VERSION, as the game's)
omsi-platform = { path = "../omsi-platform" }
omsi-net = { path = "../omsi-net" }
omsi-weather = { path = "../omsi-weather" }
# Omsi-Hub: what our commands read (`src/omsihub`: the maps' facts, the METAR airports, the
# editors' timetables and depot files), crates the launcher's core is built of anyway
omsi-map = { path = "../omsi-map" }
omsi-content = { path = "../omsi-content" }
# Omsi-Hub: the buses' depot files (`src/omsihub/hub_more.rs`: the bus that fits the duty best)
omsi-vehicle = { path = "../omsi-vehicle" }
# Omsi-Hub: what a bus offers as bus options (`src/omsihub/hub_more/busoptions.rs`: its model and
# its liveries as the game reads them), crates the launcher is built of anyway
omsi-model = { path = "../omsi-model" }
omsi-sim = { path = "../omsi-sim" }
# (and the display font's previews: the fonts' bitmaps, `hub_more/displayfont.rs`)
omsi-texture = { path = "../omsi-texture" }
# Omsi-Hub: the page's own 3D view reads the buses' meshes as the game does (`src/omsihub/bus3d`)
omsi-o3d = { path = "../omsi-o3d" }
# Omsi-Hub: the livery studio's core (`src/omsihub/lak`: the projects, the zones, the save into
# the game), shared with the game program's studio
omsihub-livery = { path = "../omsihub-livery" }
# Omsi-Hub as an add-on: the openOMSI folder checked, the plugin installed (`src/omsihub/addon.rs`)
omsihub-plugin = { path = "../omsihub-plugin" }
glam.workspace = true
sha2.workspace = true
anyhow.workspace = true

[dev-dependencies]
# (the livery studio's tests write a picture)
image.workspace = true
# (the add-on plugin's Lua judgement of a trip held against the company's: `omsihub/addon.rs`;
# the same Lua as openOMSI's plugin runtime)
mlua = { version = "0.10", features = ["lua54", "vendored"] }
