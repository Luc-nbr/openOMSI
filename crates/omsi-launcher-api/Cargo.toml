[package]
name = "omsi-launcher-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The launcher page's commands (desktop launcher and phone web view alike): JSON in, JSON or picture bytes out"

[dependencies]
serde.workspace = true
serde_json.workspace = true
omsi-launcher-core = { path = "../omsi-launcher-core" }
omsi-cfg = { path = "../omsi-cfg" }
# (the version the release was built as: OPENOMSI_VERSION, as the game's)
omsi-platform = { path = "../omsi-platform" }
omsi-net = { path = "../omsi-net" }
omsi-weather = { path = "../omsi-weather" }
# Omsi-Hub: what our commands read (`src/omsihub`: the maps' facts, the METAR airports, the
# editors' timetables and depot files), crates the launcher's core is built of anyway
omsi-map = { path = "../omsi-map" }
omsi-content = { path = "../omsi-content" }
omsi-timetable = { path = "../omsi-timetable" }
omsi-vehicle = { path = "../omsi-vehicle" }
