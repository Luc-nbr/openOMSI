_version: 2
# Breakdowns and accidents on the way (Beta 57, tester feedback on Beta 56): said at once in the
# inbox and the pages with the spare buses free, a spare bus until its own tour, accidents that
# take a bus off the road, the Roster tab's mark and what can still be sent, and the day
# report's words for the trips the bus sent ran.
"Bus %{bus} had an accident on line %{n}":
  de: "Bus %{bus} hatte einen Unfall auf Linie %{n}"
  fr: "Le bus %{bus} a eu un accident sur la ligne %{n}"
  nl: "Bus %{bus} kreeg een ongeluk op lijn %{n}"
  pl: "Autobus %{bus} miał wypadek na linii %{n}"
  ru: "Автобус %{bus} попал в аварию на линии %{n}"
  uk: "Автобус %{bus} потрапив в аварію на лінії %{n}"
"Spare bus %{spare} takes over the trips of bus %{bus} on line %{n} from %{time} until %{until}":
  de: "Ersatzbus %{spare} übernimmt von %{time} bis %{until} die Fahrten von Bus %{bus} auf Linie %{n}"
  fr: "Le bus de réserve %{spare} reprend les courses du bus %{bus} sur la ligne %{n} de %{time} à %{until}"
  nl: "Reservebus %{spare} neemt van %{time} tot %{until} de ritten van bus %{bus} op lijn %{n} over"
  pl: "Autobus rezerwowy %{spare} przejmuje od %{time} do %{until} kursy autobusu %{bus} na linii %{n}"
  ru: "Резервный автобус %{spare} с %{time} до %{until} берёт рейсы автобуса %{bus} на линии %{n}"
  uk: "Резервний автобус %{spare} з %{time} до %{until} бере рейси автобуса %{bus} на лінії %{n}"
"Bus %{bus} broke down":
  de: "Bus %{bus} hatte eine Panne"
  fr: "Le bus %{bus} est tombé en panne"
  nl: "Bus %{bus} kreeg pech"
  pl: "Autobus %{bus} zepsuł się"
  ru: "Автобус %{bus} сломался"
  uk: "Автобус %{bus} зламався"
"Bus %{bus} had an accident":
  de: "Bus %{bus} hatte einen Unfall"
  fr: "Le bus %{bus} a eu un accident"
  nl: "Bus %{bus} kreeg een ongeluk"
  pl: "Autobus %{bus} miał wypadek"
  ru: "Автобус %{bus} попал в аварию"
  uk: "Автобус %{bus} потрапив в аварію"
"On line %{n} at %{time}. Spare buses free now: %{spares}.":
  de: "Auf Linie %{n} um %{time}. Jetzt freie Ersatzbusse: %{spares}."
  fr: "Sur la ligne %{n} à %{time}. Bus de réserve libres maintenant : %{spares}."
  nl: "Op lijn %{n} om %{time}. Nu vrije reservebussen: %{spares}."
  pl: "Na linii %{n} o %{time}. Wolne teraz autobusy rezerwowe: %{spares}."
  ru: "На линии %{n} в %{time}. Свободные сейчас резервные автобусы: %{spares}."
  uk: "На лінії %{n} о %{time}. Вільні зараз резервні автобуси: %{spares}."
"On line %{n} at %{time}. No spare bus is free now: a rental bus can take over its trips from %{arrive} for %{amount}, or they are dropped.":
  de: "Auf Linie %{n} um %{time}. Jetzt ist kein Ersatzbus frei: ein Mietbus kann seine Fahrten ab %{arrive} für %{amount} übernehmen, sonst fallen sie aus."
  fr: "Sur la ligne %{n} à %{time}. Aucun bus de réserve n'est libre maintenant : un bus de location peut reprendre ses courses à partir de %{arrive} pour %{amount}, sinon elles sont supprimées."
  nl: "Op lijn %{n} om %{time}. Er is nu geen reservebus vrij: een huurbus kan zijn ritten vanaf %{arrive} overnemen voor %{amount}, anders vallen ze uit."
  pl: "Na linii %{n} o %{time}. Żaden autobus rezerwowy nie jest teraz wolny: autobus z wynajmu może przejąć jego kursy od %{arrive} za %{amount}, inaczej przepadają."
  ru: "На линии %{n} в %{time}. Свободных резервных автобусов сейчас нет: арендный автобус может взять его рейсы с %{arrive} за %{amount}, иначе они отменяются."
  uk: "На лінії %{n} о %{time}. Вільних резервних автобусів зараз немає: орендний автобус може взяти його рейси з %{arrive} за %{amount}, інакше вони скасовуються."
"On line %{n} at %{time}. Spare bus %{spare} takes over its trips from %{arrive}.":
  de: "Auf Linie %{n} um %{time}. Ersatzbus %{spare} übernimmt seine Fahrten ab %{arrive}."
  fr: "Sur la ligne %{n} à %{time}. Le bus de réserve %{spare} reprend ses courses à partir de %{arrive}."
  nl: "Op lijn %{n} om %{time}. Reservebus %{spare} neemt zijn ritten vanaf %{arrive} over."
  pl: "Na linii %{n} o %{time}. Autobus rezerwowy %{spare} przejmuje jego kursy od %{arrive}."
  ru: "На линии %{n} в %{time}. Резервный автобус %{spare} берёт его рейсы с %{arrive}."
  uk: "На лінії %{n} о %{time}. Резервний автобус %{spare} бере його рейси з %{arrive}."
"On line %{n} at %{time}. Spare bus %{spare} takes over its trips from %{arrive} until %{leaves}, when it goes out on its own tour.":
  de: "Auf Linie %{n} um %{time}. Ersatzbus %{spare} übernimmt seine Fahrten von %{arrive} bis %{leaves}, dann fährt er seinen eigenen Umlauf."
  fr: "Sur la ligne %{n} à %{time}. Le bus de réserve %{spare} reprend ses courses de %{arrive} à %{leaves}, puis part pour son propre service."
  nl: "Op lijn %{n} om %{time}. Reservebus %{spare} neemt zijn ritten van %{arrive} tot %{leaves} over; dan rijdt hij zijn eigen omloop."
  pl: "Na linii %{n} o %{time}. Autobus rezerwowy %{spare} przejmuje jego kursy od %{arrive} do %{leaves}, potem rusza na własny obieg."
  ru: "На линии %{n} в %{time}. Резервный автобус %{spare} берёт его рейсы с %{arrive} до %{leaves}, потом уходит на свой выпуск."
  uk: "На лінії %{n} о %{time}. Резервний автобус %{spare} бере його рейси з %{arrive} до %{leaves}, потім виходить на свій випуск."
"On line %{n} at %{time}. A rental bus takes over its trips from %{arrive} for %{amount}.":
  de: "Auf Linie %{n} um %{time}. Ein Mietbus übernimmt seine Fahrten ab %{arrive} für %{amount}."
  fr: "Sur la ligne %{n} à %{time}. Un bus de location reprend ses courses à partir de %{arrive} pour %{amount}."
  nl: "Op lijn %{n} om %{time}. Een huurbus neemt zijn ritten vanaf %{arrive} over voor %{amount}."
  pl: "Na linii %{n} o %{time}. Autobus z wynajmu przejmuje jego kursy od %{arrive} za %{amount}."
  ru: "На линии %{n} в %{time}. Арендный автобус берёт его рейсы с %{arrive} за %{amount}."
  uk: "На лінії %{n} о %{time}. Орендний автобус бере його рейси з %{arrive} за %{amount}."
"On line %{n} at %{time}. Its trips are dropped for the rest of the day.":
  de: "Auf Linie %{n} um %{time}. Seine Fahrten fallen für den Rest des Tages aus."
  fr: "Sur la ligne %{n} à %{time}. Ses courses sont supprimées pour le reste de la journée."
  nl: "Op lijn %{n} om %{time}. Zijn ritten vallen de rest van de dag uit."
  pl: "Na linii %{n} o %{time}. Jego kursy przepadają do końca dnia."
  ru: "На линии %{n} в %{time}. Его рейсы отменены до конца дня."
  uk: "На лінії %{n} о %{time}. Його рейси скасовано до кінця дня."
"The bus had an accident on the way":
  de: "Der Bus hatte unterwegs einen Unfall"
  fr: "Le bus a eu un accident en route"
  nl: "De bus kreeg onderweg een ongeluk"
  pl: "Autobus miał wypadek w trasie"
  ru: "Автобус попал в аварию в пути"
  uk: "Автобус потрапив в аварію в дорозі"
"It had an accident on line %{n}: its damage is repaired in the workshop.":
  de: "Er hatte einen Unfall auf Linie %{n}: sein Schaden wird in der Werkstatt repariert."
  fr: "Il a eu un accident sur la ligne %{n} : ses dégâts sont réparés à l'atelier."
  nl: "Hij kreeg een ongeluk op lijn %{n}: zijn schade wordt in de werkplaats hersteld."
  pl: "Miał wypadek na linii %{n}: jego uszkodzenia są naprawiane w warsztacie."
  ru: "Он попал в аварию на линии %{n}: повреждения устраняют в мастерской."
  uk: "Він потрапив в аварію на лінії %{n}: пошкодження усувають у майстерні."
"It was on line %{n}; it goes to the workshop.":
  de: "Er war auf Linie %{n}; er kommt in die Werkstatt."
  fr: "Il était sur la ligne %{n} ; il part à l'atelier."
  nl: "Hij reed op lijn %{n}; hij gaat naar de werkplaats."
  pl: "Był na linii %{n}; jedzie do warsztatu."
  ru: "Он был на линии %{n}; он отправляется в мастерскую."
  uk: "Він був на лінії %{n}; він їде до майстерні."
"No spare bus of the fleet is free now. A rental bus can take over its trips from %{time} for %{amount}; else its trips are dropped for the rest of the day, with the contract's penalty.":
  de: "Jetzt ist kein Ersatzbus der Flotte frei. Ein Mietbus kann seine Fahrten ab %{time} für %{amount} übernehmen; sonst fallen seine Fahrten für den Rest des Tages aus, mit der Vertragsstrafe."
  fr: "Aucun bus de réserve de la flotte n'est libre maintenant. Un bus de location peut reprendre ses courses à partir de %{time} pour %{amount} ; sinon ses courses sont supprimées pour le reste de la journée, avec la pénalité du contrat."
  nl: "Er is nu geen reservebus van de vloot vrij. Een huurbus kan zijn ritten vanaf %{time} overnemen voor %{amount}; anders vallen zijn ritten de rest van de dag uit, met de boete van het contract."
  pl: "Żaden autobus rezerwowy floty nie jest teraz wolny. Autobus z wynajmu może przejąć jego kursy od %{time} za %{amount}; inaczej jego kursy przepadają do końca dnia, z karą z umowy."
  ru: "Свободных резервных автобусов парка сейчас нет. Арендный автобус может взять его рейсы с %{time} за %{amount}; иначе его рейсы отменяются до конца дня, со штрафом по договору."
  uk: "Вільних резервних автобусів парку зараз немає. Орендний автобус може взяти його рейси з %{time} за %{amount}; інакше його рейси скасовуються до кінця дня, зі штрафом за договором."
"A spare bus of the fleet can take over its trips from %{spare}; a rental bus from %{time} for %{amount}; else its trips are dropped for the rest of the day, with the contract's penalty.":
  de: "Ein Ersatzbus der Flotte kann seine Fahrten ab %{spare} übernehmen, ein Mietbus ab %{time} für %{amount}; sonst fallen seine Fahrten für den Rest des Tages aus, mit der Vertragsstrafe."
  fr: "Un bus de réserve de la flotte peut reprendre ses courses à partir de %{spare}, un bus de location à partir de %{time} pour %{amount} ; sinon ses courses sont supprimées pour le reste de la journée, avec la pénalité du contrat."
  nl: "Een reservebus van de vloot kan zijn ritten vanaf %{spare} overnemen, een huurbus vanaf %{time} voor %{amount}; anders vallen zijn ritten de rest van de dag uit, met de boete van het contract."
  pl: "Autobus rezerwowy floty może przejąć jego kursy od %{spare}, autobus z wynajmu od %{time} za %{amount}; inaczej jego kursy przepadają do końca dnia, z karą z umowy."
  ru: "Резервный автобус парка может взять его рейсы с %{spare}, арендный — с %{time} за %{amount}; иначе его рейсы отменяются до конца дня, со штрафом по договору."
  uk: "Резервний автобус парку може взяти його рейси з %{spare}, орендний — з %{time} за %{amount}; інакше його рейси скасовуються до кінця дня, зі штрафом за договором."
