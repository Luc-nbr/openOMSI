"No country of that name.":
  de: "Kein Land mit diesem Namen."
  fr: "Aucun pays de ce nom."
  nl: "Geen land met die naam."
  pl: "Brak kraju o tej nazwie."
  ru: "Нет страны с таким названием."
  uk: "Немає країни з такою назвою."
"Your staff, applicants and passengers get names of this country. The map's country is proposed; you can change it later in the company's settings.":
  de: "Dein Personal, deine Bewerber und deine Fahrgäste bekommen Namen aus diesem Land. Das Land der Karte ist vorgeschlagen; du kannst es später in den Einstellungen des Unternehmens ändern."
  fr: "Votre personnel, vos candidats et vos passagers portent des noms de ce pays. Le pays de la carte est proposé ; vous pourrez le changer plus tard dans les réglages de l'entreprise."
  nl: "Je personeel, sollicitanten en reizigers krijgen namen uit dit land. Het land van de kaart wordt voorgesteld; je kunt het later wijzigen in de instellingen van het bedrijf."
  pl: "Twój personel, kandydaci i pasażerowie dostają imiona i nazwiska z tego kraju. Proponowany jest kraj mapy; możesz go później zmienić w ustawieniach firmy."
  ru: "Ваш персонал, соискатели и пассажиры получают имена этой страны. Предлагается страна карты; позже её можно изменить в настройках компании."
  uk: "Ваш персонал, кандидати й пасажири отримують імена цієї країни. Пропонується країна мапи; пізніше її можна змінити в налаштуваннях компанії."
"The names of the people you hire from now on. The people you have keep their names.":
  de: "Die Namen der Leute, die du ab jetzt einstellst. Deine bisherigen Leute behalten ihre Namen."
  fr: "Les noms des personnes que vous embauchez désormais. Vos employés actuels gardent leur nom."
  nl: "De namen van de mensen die je vanaf nu aanneemt. De mensen die je al hebt, houden hun naam."
  pl: "Imiona i nazwiska osób, które zatrudnisz od teraz. Obecni pracownicy zachowują swoje nazwiska."
  ru: "Имена людей, которых вы нанимаете с этого момента. Нынешние сотрудники сохраняют свои имена."
  uk: "Імена людей, яких ви наймаєте відтепер. Теперішні працівники зберігають свої імена."
"Your new people come from %{country} now. The people you have keep their names.":
  de: "Deine neuen Leute kommen jetzt aus diesem Land: %{country}. Deine bisherigen Leute behalten ihre Namen."
  fr: "Vos nouvelles recrues viennent désormais de ce pays : %{country}. Vos employés actuels gardent leur nom."
  nl: "Je nieuwe mensen komen nu uit %{country}. De mensen die je al hebt, houden hun naam."
  pl: "Nowi pracownicy pochodzą teraz z kraju: %{country}. Obecni pracownicy zachowują swoje nazwiska."
  ru: "Новые сотрудники теперь из страны: %{country}. Нынешние сотрудники сохраняют свои имена."
  uk: "Нові працівники тепер із країни: %{country}. Теперішні працівники зберігають свої імена."
