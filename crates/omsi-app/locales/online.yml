"An account is optional. With one you add friends, see who is online and invite them to your company. Without one, everything else works as before.":
  de: "Ein Konto ist freiwillig. Damit fügst du Freunde hinzu, siehst, wer online ist, und lädst sie in dein Unternehmen ein. Ohne Konto funktioniert alles andere wie bisher."
  fr: "Un compte est facultatif. Avec lui, vous ajoutez des amis, voyez qui est en ligne et les invitez dans votre entreprise. Sans compte, tout le reste fonctionne comme avant."
  nl: "Een account is niet verplicht. Daarmee voeg je vrienden toe, zie je wie online is en nodig je ze uit in je bedrijf. Zonder account werkt al het andere zoals altijd."
  pl: "Konto jest opcjonalne. Dzięki niemu dodasz znajomych, zobaczysz, kto jest online, i zaprosisz ich do swojej firmy. Bez konta wszystko inne działa jak dotąd."
  ru: "Аккаунт не обязателен. С ним вы добавляете друзей, видите, кто в сети, и приглашаете их в свою компанию. Без аккаунта всё остальное работает как раньше."
  uk: "Обліковий запис не обов'язковий. З ним ви додаєте друзів, бачите, хто в мережі, і запрошуєте їх до своєї компанії. Без нього все інше працює як раніше."
"You play without an account.":
  de: "Du spielst ohne Konto."
  fr: "Vous jouez sans compte."
  nl: "Je speelt zonder account."
  pl: "Grasz bez konta."
  ru: "Вы играете без аккаунта."
  uk: "Ви граєте без облікового запису."
