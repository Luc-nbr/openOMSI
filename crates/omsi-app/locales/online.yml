"Create your account on the Omsi-Hub website, confirm your email address, then sign in here.":
  de: "Erstelle dein Konto auf der Omsi-Hub-Website, bestätige deine E-Mail-Adresse und melde dich dann hier an."
  fr: "Créez votre compte sur le site d'Omsi-Hub, confirmez votre adresse e-mail, puis connectez-vous ici."
  nl: "Maak je account aan op de Omsi-Hub-website, bevestig je e-mailadres en log dan hier in."
  pl: "Załóż konto na stronie Omsi-Hub, potwierdź adres e-mail, a potem zaloguj się tutaj."
  ru: "Создайте аккаунт на сайте Omsi-Hub, подтвердите адрес электронной почты, затем войдите здесь."
  uk: "Створіть обліковий запис на сайті Omsi-Hub, підтвердьте адресу електронної пошти, потім увійдіть тут."
