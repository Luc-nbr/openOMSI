_version: 2
# RosterFlow makes the company's lines' timetables: with the add-on on, the line editor does a
# line's route alone, and its timetable is made in RosterFlow's Timeplan once it is confirmed.
"Set the running times and departures, save, then Refresh to make the buses and duties":
  de: "Fahrzeiten und Abfahrten festlegen, speichern, dann mit Aktualisieren die Busse und Dienste bilden"
  fr: "Définissez les temps de parcours et les départs, enregistrez, puis Actualiser pour faire les bus et les services"
  nl: "Stel de rijtijden en vertrektijden in, sla op en kies dan Vernieuwen om de bussen en diensten te maken"
  pl: "Ustaw czasy przejazdu i odjazdy, zapisz, a potem Odśwież, aby utworzyć autobusy i służby"
  ru: "Задайте время хода и отправления, сохраните, затем нажмите «Обновить», чтобы составить автобусы и смены"
  uk: "Задайте час руху й відправлення, збережіть, потім натисніть «Оновити», щоб скласти автобуси й зміни"
"The timetable is made in RosterFlow's Timeplan after you confirm":
  de: "Der Fahrplan wird nach dem Bestätigen im Fahrplanentwurf von RosterFlow erstellt"
  fr: "L'horaire se fait dans le Plan horaire de RosterFlow une fois la ligne confirmée"
  nl: "De dienstregeling maak je na het bevestigen in het Dienstregelingsplan van RosterFlow"
  pl: "Rozkład powstaje w Planie rozkładu RosterFlow po zatwierdzeniu"
  ru: "Расписание составляется в «Плане расписания» RosterFlow после подтверждения"
  uk: "Розклад складається в «Плані розкладу» RosterFlow після підтвердження"
"The line's timetable is made in RosterFlow's Timeplan.":
  de: "Der Fahrplan der Linie wird im Fahrplanentwurf von RosterFlow erstellt."
  fr: "L'horaire de la ligne se fait dans le Plan horaire de RosterFlow."
  nl: "De dienstregeling van de lijn maak je in het Dienstregelingsplan van RosterFlow."
  pl: "Rozkład linii powstaje w Planie rozkładu RosterFlow."
  ru: "Расписание линии составляется в «Плане расписания» RosterFlow."
  uk: "Розклад лінії складається в «Плані розкладу» RosterFlow."
"Confirm the route here: the line runs no tour until its timetable is saved there.":
  de: "Bestätigen Sie hier die Strecke: Die Linie fährt keinen Umlauf, bis ihr Fahrplan dort gespeichert ist."
  fr: "Confirmez ici l'itinéraire : la ligne ne fait aucun service tant que son horaire n'y est pas enregistré."
  nl: "Bevestig hier de route: de lijn rijdt geen omloop tot haar dienstregeling daar is opgeslagen."
  pl: "Zatwierdź tutaj trasę: linia nie obsługuje żadnego kursu, dopóki jej rozkład nie zostanie tam zapisany."
  ru: "Подтвердите здесь маршрут: линия не выполняет ни одного оборота, пока там не сохранено её расписание."
  uk: "Підтвердьте тут маршрут: лінія не виконує жодного обороту, доки там не збережено її розклад."
"No timetable yet":
  de: "Noch kein Fahrplan"
  fr: "Pas encore d'horaire"
  nl: "Nog geen dienstregeling"
  pl: "Jeszcze bez rozkładu"
  ru: "Расписания пока нет"
  uk: "Розкладу ще немає"
"Open in the Timeplan":
  de: "Im Fahrplanentwurf öffnen"
  fr: "Ouvrir dans le Plan horaire"
  nl: "Openen in het Dienstregelingsplan"
  pl: "Otwórz w Planie rozkładu"
  ru: "Открыть в «Плане расписания»"
  uk: "Відкрити в «Плані розкладу»"
"Save the line's changes first (or undo them): the Timeplan opens the line as it is saved.":
  de: "Speichern Sie zuerst die Änderungen der Linie (oder machen Sie sie rückgängig): Der Fahrplanentwurf öffnet die Linie so, wie sie gespeichert ist."
  fr: "Enregistrez d'abord les modifications de la ligne (ou annulez-les) : le Plan horaire ouvre la ligne telle qu'elle est enregistrée."
  nl: "Sla eerst de wijzigingen van de lijn op (of maak ze ongedaan): het Dienstregelingsplan opent de lijn zoals ze is opgeslagen."
  pl: "Najpierw zapisz zmiany linii (albo je cofnij): Plan rozkładu otwiera linię w zapisanej postaci."
  ru: "Сначала сохраните изменения линии (или отмените их): «План расписания» открывает линию в сохранённом виде."
  uk: "Спершу збережіть зміни лінії (або скасуйте їх): «План розкладу» відкриває лінію в збереженому вигляді."
"Estimated with a usual timetable: you make the line's own in RosterFlow's Timeplan":
  de: "Geschätzt mit einem üblichen Fahrplan: den eigenen der Linie erstellen Sie im Fahrplanentwurf von RosterFlow"
  fr: "Estimé avec un horaire habituel : celui de la ligne se fait dans le Plan horaire de RosterFlow"
  nl: "Geschat met een gebruikelijke dienstregeling: die van de lijn zelf maak je in het Dienstregelingsplan van RosterFlow"
  pl: "Szacunek dla zwykłego rozkładu: właściwy rozkład linii tworzysz w Planie rozkładu RosterFlow"
  ru: "Оценка по обычному расписанию: собственное расписание линии составляется в «Плане расписания» RosterFlow"
  uk: "Оцінка за звичайним розкладом: власний розклад лінії складається в «Плані розкладу» RosterFlow"
"Line %{n} is the company's now: %{amount} paid. Make its timetable in RosterFlow's Timeplan.":
  de: "Linie %{n} gehört jetzt dem Unternehmen: %{amount} bezahlt. Erstellen Sie ihren Fahrplan im Fahrplanentwurf von RosterFlow."
  fr: "La ligne %{n} appartient maintenant à l'entreprise : %{amount} payés. Faites son horaire dans le Plan horaire de RosterFlow."
  nl: "Lijn %{n} is nu van het bedrijf: %{amount} betaald. Maak haar dienstregeling in het Dienstregelingsplan van RosterFlow."
  pl: "Linia %{n} należy teraz do firmy: zapłacono %{amount}. Utwórz jej rozkład w Planie rozkładu RosterFlow."
  ru: "Линия %{n} теперь принадлежит компании: оплачено %{amount}. Составьте её расписание в «Плане расписания» RosterFlow."
  uk: "Лінія %{n} тепер належить компанії: сплачено %{amount}. Складіть її розклад у «Плані розкладу» RosterFlow."
"The line keeps the map's timetable: change it here if you like, save, then Refresh":
  de: "Die Linie behält den Fahrplan der Karte: Ändern Sie ihn hier nach Wunsch, speichern Sie, dann Aktualisieren"
  fr: "La ligne garde l'horaire de la carte : modifiez-le ici si vous voulez, enregistrez, puis Actualiser"
  nl: "De lijn houdt de dienstregeling van de kaart: pas hem hier aan als je wilt, sla op en kies dan Vernieuwen"
  pl: "Linia zachowuje rozkład z mapy: zmień go tutaj, jeśli chcesz, zapisz, a potem Odśwież"
  ru: "Линия сохраняет расписание карты: измените его здесь, если хотите, сохраните, затем «Обновить»"
  uk: "Лінія зберігає розклад карти: змініть його тут, якщо хочете, збережіть, потім «Оновити»"
"New line: draw its route in the line editor, then make its timetable here":
  de: "Neue Linie: ihre Strecke im Linieneditor zeichnen, dann hier ihren Fahrplan erstellen"
  fr: "Nouvelle ligne : tracez son itinéraire dans l'éditeur de lignes, puis faites son horaire ici"
  nl: "Nieuwe lijn: teken haar route in de lijneditor en maak dan hier haar dienstregeling"
  pl: "Nowa linia: narysuj jej trasę w edytorze linii, a potem utwórz tu jej rozkład"
  ru: "Новая линия: проложите её маршрут в редакторе линий, затем составьте здесь её расписание"
  uk: "Нова лінія: прокладіть її маршрут у редакторі ліній, потім складіть тут її розклад"
"Timetable: the line's running times and departures in RosterFlow's Timeplan":
  de: "Fahrplan: Fahrzeiten und Abfahrten der Linie im Fahrplanentwurf von RosterFlow"
  fr: "Horaire : les temps de parcours et les départs de la ligne dans le Plan horaire de RosterFlow"
  nl: "Dienstregeling: de rijtijden en vertrektijden van de lijn in het Dienstregelingsplan van RosterFlow"
  pl: "Rozkład: czasy przejazdu i odjazdy linii w Planie rozkładu RosterFlow"
  ru: "Расписание: время хода и отправления линии в «Плане расписания» RosterFlow"
  uk: "Розклад: час руху й відправлення лінії в «Плані розкладу» RosterFlow"
"Edit the line in the line editor: its route and displays":
  de: "Die Linie im Linieneditor bearbeiten: ihre Strecke und Anzeigen"
  fr: "Modifier la ligne dans l'éditeur de lignes : son itinéraire et ses girouettes"
  nl: "Bewerk de lijn in de lijneditor: haar route en displays"
  pl: "Edytuj linię w edytorze linii: jej trasę i wyświetlacze"
  ru: "Изменить линию в редакторе линий: её маршрут и указатели"
  uk: "Змінити лінію в редакторі ліній: її маршрут і покажчики"
"The line runs no tour until it has a timetable. Click to make it in RosterFlow's Timeplan.":
  de: "Die Linie fährt keinen Umlauf, bis sie einen Fahrplan hat. Klicken Sie, um ihn im Fahrplanentwurf von RosterFlow zu erstellen."
  fr: "La ligne ne fait aucun service tant qu'elle n'a pas d'horaire. Cliquez pour le faire dans le Plan horaire de RosterFlow."
  nl: "De lijn rijdt geen omloop tot ze een dienstregeling heeft. Klik om die te maken in het Dienstregelingsplan van RosterFlow."
  pl: "Linia nie obsługuje żadnego kursu, dopóki nie ma rozkładu. Kliknij, aby utworzyć go w Planie rozkładu RosterFlow."
  ru: "Линия не выполняет ни одного оборота, пока у неё нет расписания. Нажмите, чтобы составить его в «Плане расписания» RosterFlow."
  uk: "Лінія не виконує жодного обороту, доки в неї немає розкладу. Натисніть, щоб скласти його в «Плані розкладу» RosterFlow."
"The line runs no tour until it has a timetable. Click to make it in the line editor.":
  de: "Die Linie fährt keinen Umlauf, bis sie einen Fahrplan hat. Klicken Sie, um ihn im Linieneditor zu erstellen."
  fr: "La ligne ne fait aucun service tant qu'elle n'a pas d'horaire. Cliquez pour le faire dans l'éditeur de lignes."
  nl: "De lijn rijdt geen omloop tot ze een dienstregeling heeft. Klik om die te maken in de lijneditor."
  pl: "Linia nie obsługuje żadnego kursu, dopóki nie ma rozkładu. Kliknij, aby utworzyć go w edytorze linii."
  ru: "Линия не выполняет ни одного оборота, пока у неё нет расписания. Нажмите, чтобы составить его в редакторе линий."
  uk: "Лінія не виконує жодного обороту, доки в неї немає розкладу. Натисніть, щоб скласти його в редакторі ліній."
"Draw a line of the company's own in the line editor: you confirm and pay for its route there, then make its timetable in RosterFlow's Timeplan":
  de: "Zeichnen Sie im Linieneditor eine eigene Linie des Unternehmens: Dort bestätigen und bezahlen Sie ihre Strecke, dann erstellen Sie ihren Fahrplan im Fahrplanentwurf von RosterFlow"
  fr: "Tracez une ligne propre à l'entreprise dans l'éditeur de lignes : vous y confirmez et payez son itinéraire, puis faites son horaire dans le Plan horaire de RosterFlow"
  nl: "Teken een eigen lijn van het bedrijf in de lijneditor: daar bevestig en betaal je haar route, daarna maak je haar dienstregeling in het Dienstregelingsplan van RosterFlow"
  pl: "Narysuj własną linię firmy w edytorze linii: tam zatwierdzasz i opłacasz jej trasę, a potem tworzysz jej rozkład w Planie rozkładu RosterFlow"
  ru: "Проложите собственную линию компании в редакторе линий: там вы подтверждаете и оплачиваете её маршрут, затем составляете её расписание в «Плане расписания» RosterFlow"
  uk: "Прокладіть власну лінію компанії в редакторі ліній: там ви підтверджуєте й оплачуєте її маршрут, потім складаєте її розклад у «Плані розкладу» RosterFlow"
"Line %{n} is the company's: here is its timetable. Plan its tours and start its service on the Roster tab.":
  de: "Linie %{n} gehört dem Unternehmen: Hier ist ihr Fahrplan. Planen Sie ihre Umläufe und starten Sie ihren Betrieb im Reiter Dienstplan."
  fr: "La ligne %{n} appartient à l'entreprise : voici son horaire. Planifiez ses services et lancez son exploitation dans l'onglet Roulement."
  nl: "Lijn %{n} is van het bedrijf: hier is haar dienstregeling. Plan haar omlopen en start haar dienst op het tabblad Rooster."
  pl: "Linia %{n} należy do firmy: oto jej rozkład. Zaplanuj jej kursy i uruchom jej obsługę na karcie Grafik."
  ru: "Линия %{n} принадлежит компании: вот её расписание. Спланируйте её обороты и запустите её работу на вкладке «График»."
  uk: "Лінія %{n} належить компанії: ось її розклад. Сплануйте її обороти й запустіть її роботу на вкладці «Графік»."
"Line %{n} has no timetable yet: make it in the Timeplan":
  de: "Linie %{n} hat noch keinen Fahrplan: Erstellen Sie ihn im Fahrplanentwurf"
  fr: "La ligne %{n} n'a pas encore d'horaire : faites-le dans le Plan horaire"
  nl: "Lijn %{n} heeft nog geen dienstregeling: maak die in het Dienstregelingsplan"
  pl: "Linia %{n} nie ma jeszcze rozkładu: utwórz go w Planie rozkładu"
  ru: "У линии %{n} пока нет расписания: составьте его в «Плане расписания»"
  uk: "Лінія %{n} ще не має розкладу: складіть його в «Плані розкладу»"
"Lines without a timetable":
  de: "Linien ohne Fahrplan"
  fr: "Lignes sans horaire"
  nl: "Lijnen zonder dienstregeling"
  pl: "Linie bez rozkładu"
  ru: "Линии без расписания"
  uk: "Лінії без розкладу"
