  nl: "Bij hun ritten zetten"
  de: "Zu ihren Fahrten hinzufügen"
  fr: "Ajouter à leurs trajets"
  pl: "Dodaj do ich kursów"
  ru: "Добавить к их рейсам"
  uk: "Додати до їхніх рейсів"
"Replace: the days ticked run these trips, with their running times, instead of their own.":
  nl: "Vervangen: de aangevinkte dagen rijden deze ritten, met hun rijtijden, in plaats van hun eigen."
  de: "Ersetzen: Die angehakten Tage fahren diese Fahrten mit ihren Fahrzeiten statt ihrer eigenen."
  fr: "Remplacer : les jours cochés font ces trajets, avec leurs temps de parcours, au lieu des leurs."
  pl: "Zastąp: zaznaczone dni jeżdżą tymi kursami, z ich czasami przejazdu, zamiast własnych."
  ru: "Заменить: отмеченные дни выполняют эти рейсы, с их временем хода, вместо своих."
  uk: "Замінити: позначені дні виконують ці рейси, з їхнім часом руху, замість своїх."
"Add: the trips go beside the days' own; one there already the same way at the same minute is not copied twice.":
  nl: "Toevoegen: de ritten komen naast de eigen ritten van die dagen; een rit die er al is, dezelfde kant op op dezelfde minuut, wordt niet dubbel gekopieerd."
  de: "Hinzufügen: Die Fahrten kommen neben die eigenen der Tage; eine, die schon in derselben Richtung zur selben Minute da ist, wird nicht doppelt kopiert."
  fr: "Ajouter : les trajets s'ajoutent à ceux des jours ; un trajet déjà présent dans le même sens à la même minute n'est pas copié deux fois."
  pl: "Dodaj: kursy trafiają obok własnych kursów tych dni; kurs, który już jest w tym samym kierunku o tej samej minucie, nie jest kopiowany dwa razy."
  ru: "Добавить: рейсы встают рядом с собственными рейсами дней; рейс, который уже есть в том же направлении в ту же минуту, не копируется дважды."
  uk: "Додати: рейси стають поруч із власними рейсами днів; рейс, який уже є в тому самому напрямку в ту саму хвилину, не копіюється двічі."
"It goes into the draft: Save keeps it, Undo takes it back. Saved and refreshed, SAVE › Apply to in Vehicles and Drivers copies the plan onto those days as well.":
  nl: "Het komt in het concept: Opslaan bewaart het, Ongedaan maken neemt het terug. Opgeslagen en ververst kopieert OPSLAAN › Toepassen op in Voertuigen en Chauffeurs ook de planning naar die dagen."
  de: "Es kommt in den Entwurf: Speichern behält es, Rückgängig nimmt es zurück. Gespeichert und aufgefrischt kopiert SPEICHERN › Anwenden auf in Fahrzeuge und Fahrer auch die Planung auf diese Tage."
  fr: "Cela va dans le brouillon : Enregistrer le garde, Annuler le reprend. Enregistré et actualisé, ENREGISTRER › Appliquer à dans Véhicules et Conducteurs copie aussi la planification sur ces jours."
  pl: "Trafia do szkicu: Zapisz go zachowuje, Cofnij go wycofuje. Po zapisaniu i odświeżeniu ZAPISZ › Zastosuj do w Pojazdach i Kierowcach skopiuje też plan na te dni."
  ru: "Это идёт в черновик: «Сохранить» оставляет, «Отменить» возвращает. После сохранения и обновления СОХРАНИТЬ › Применить к во вкладках «Транспорт» и «Водители» скопирует и план на эти дни."
  uk: "Це йде в чернетку: «Зберегти» залишає, «Скасувати» повертає. Після збереження й оновлення ЗБЕРЕГТИ › Застосувати до у вкладках «Транспорт» і «Водії» скопіює й план на ці дні."
"Keep as a template":
  nl: "Als sjabloon bewaren"
  de: "Als Vorlage behalten"
  fr: "Garder comme modèle"
  pl: "Zachowaj jako szablon"
  ru: "Сохранить как шаблон"
  uk: "Зберегти як шаблон"
"The trips chosen, kept by name to copy onto any day later.":
  nl: "De gekozen ritten, onder een naam bewaard om later naar elke dag te kopiëren."
  de: "Die gewählten Fahrten, unter einem Namen behalten, um sie später auf jeden Tag zu kopieren."
  fr: "Les trajets choisis, gardés sous un nom pour les copier plus tard sur n'importe quel jour."
  pl: "Wybrane kursy zachowane pod nazwą, by później kopiować je na dowolny dzień."
  ru: "Выбранные рейсы, сохранённые под именем, чтобы потом копировать их на любой день."
  uk: "Вибрані рейси, збережені під назвою, щоб потім копіювати їх на будь-який день."
"This day's timetable, kept by name to copy onto any day later.":
  nl: "De dienstregeling van deze dag, onder een naam bewaard om later naar elke dag te kopiëren."
  de: "Der Fahrplan dieses Tages, unter einem Namen behalten, um ihn später auf jeden Tag zu kopieren."
  fr: "L'horaire de ce jour, gardé sous un nom pour le copier plus tard sur n'importe quel jour."
  pl: "Rozkład tego dnia zachowany pod nazwą, by później kopiować go na dowolny dzień."
  ru: "Расписание этого дня, сохранённое под именем, чтобы потом копировать его на любой день."
  uk: "Розклад цього дня, збережений під назвою, щоб потім копіювати його на будь-який день."
"A name, such as School days":
