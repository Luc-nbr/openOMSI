_version: 2
# RosterFlow's Timeplan, its timetable: trips chosen together (moved, given another pattern,
# taken out at once) and "Copy to…" - the day, the trips chosen or a template copied onto other
# day groups, and the templates kept, renamed and thrown away.
"Click to choose the trip: Shift+click a range, Ctrl+click one more, Ctrl+A all":
  nl: "Klik om de rit te kiezen: Shift+klik een reeks, Ctrl+klik er een bij, Ctrl+A alle"
  de: "Klicken, um die Fahrt zu wählen: Umschalt+Klick einen Bereich, Strg+Klick eine dazu, Strg+A alle"
  fr: "Cliquez pour choisir le trajet : Maj+clic une plage, Ctrl+clic un de plus, Ctrl+A tous"
  pl: "Kliknij, aby wybrać kurs: Shift+klik zakres, Ctrl+klik jeszcze jeden, Ctrl+A wszystkie"
  ru: "Щёлкните, чтобы выбрать рейс: Shift+щелчок — диапазон, Ctrl+щелчок — ещё один, Ctrl+A — все"
  uk: "Клацніть, щоб вибрати рейс: Shift+клацання — діапазон, Ctrl+клацання — ще один, Ctrl+A — усі"
