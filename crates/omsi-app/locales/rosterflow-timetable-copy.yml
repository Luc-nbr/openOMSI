  fr: "%{n} trajets copiés vers %{days} : Enregistrer les garde, Annuler les reprend."
  pl: "Skopiowano kursów: %{n} do %{days}. Zapisz je zachowuje, Cofnij je wycofuje."
  ru: "Скопировано рейсов: %{n} в %{days}. «Сохранить» оставляет их, «Отменить» возвращает."
  uk: "Скопійовано рейсів: %{n} у %{days}. «Зберегти» залишає їх, «Скасувати» повертає."
