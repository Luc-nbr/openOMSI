"No templates of this line yet: keep the day or the trips chosen as one below, to copy onto any day later.":
  nl: "Nog geen sjablonen van deze lijn: bewaar de dag of de gekozen ritten hieronder als sjabloon, om later naar elke dag te kopiëren."
  de: "Noch keine Vorlagen dieser Linie: Behalten Sie unten den Tag oder die gewählten Fahrten als Vorlage, um sie später auf jeden Tag zu kopieren."
  fr: "Pas encore de modèle pour cette ligne : gardez ci-dessous le jour ou les trajets choisis comme modèle, à copier plus tard sur n'importe quel jour."
  pl: "Ta linia nie ma jeszcze szablonów: zachowaj poniżej dzień lub wybrane kursy jako szablon, by później kopiować go na dowolny dzień."
  ru: "У этой линии ещё нет шаблонов: сохраните ниже день или выбранные рейсы как шаблон, чтобы потом копировать его на любой день."
  uk: "У цієї лінії ще немає шаблонів: збережіть нижче день або вибрані рейси як шаблон, щоб потім копіювати його на будь-який день."
