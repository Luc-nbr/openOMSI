"%{s} % of the reference  ·  chance to win, as it looks now: about %{p} %":
  de: "%{s} % der Referenz  ·  Gewinnchance, wie es jetzt aussieht: etwa %{p} %"
  fr: "%{s} % de la référence  ·  chance de gagner, en l'état : environ %{p} %"
  nl: "%{s} % van de referentie  ·  kans om te winnen, zoals het er nu uitziet: ongeveer %{p} %"
  pl: "%{s} % referencji  ·  szansa na wygraną, jak teraz wygląda: około %{p} %"
  ru: "%{s} % эталона  ·  шанс на победу сейчас: около %{p} %"
  uk: "%{s} % еталона  ·  шанс на перемогу зараз: близько %{p} %"
"Recommended: %{amount} (%{s} % of the reference), about %{p} % to win":
  de: "Empfohlen: %{amount} (%{s} % der Referenz), etwa %{p} % Gewinnchance"
  fr: "Recommandé : %{amount} (%{s} % de la référence), environ %{p} % de chance"
  nl: "Aanbevolen: %{amount} (%{s} % van de referentie), ongeveer %{p} % kans"
  pl: "Zalecane: %{amount} (%{s} % referencji), około %{p} % szans"
  ru: "Рекомендуется: %{amount} (%{s} % эталона), около %{p} % на победу"
  uk: "Рекомендовано: %{amount} (%{s} % еталона), близько %{p} % на перемогу"
"%{who} won the line with an ask of %{amount}.":
  de: "%{who} hat die Linie mit einem Angebot von %{amount} gewonnen."
  fr: "%{who} a remporté la ligne avec une offre de %{amount}."
  nl: "%{who} won de lijn met een vraagprijs van %{amount}."
  pl: "%{who} wygrał linię z ofertą %{amount}."
  ru: "%{who} выиграл линию с заявкой %{amount}."
  uk: "%{who} виграв лінію із заявкою %{amount}."
"The concession runs until %{date}, at %{p} % of the reference.":
  de: "Die Konzession läuft bis %{date}, zu %{p} % der Referenz."
  fr: "La concession court jusqu'au %{date}, à %{p} % de la référence."
  nl: "De concessie loopt tot %{date}, tegen %{p} % van de referentie."
  pl: "Koncesja trwa do %{date}, po %{p} % referencji."
  ru: "Концессия действует до %{date}, по %{p} % эталона."
  uk: "Концесія діє до %{date}, за %{p} % еталона."
"Ask %{amount}":
  de: "%{amount} anbieten"
  fr: "Proposer %{amount}"
  nl: "%{amount} vragen"
  pl: "Zaproponuj %{amount}"
  ru: "Заявить %{amount}"
  uk: "Заявити %{amount}"
"Bids until %{time} (%{left} from now), scored 70 % price and 30 % quality. Ask at most %{amount} to lead now; buying it outright: %{buy}.":
  de: "Angebote bis %{time} (noch %{left}), bewertet zu 70 % Preis und 30 % Qualität. Bieten Sie höchstens %{amount}, um jetzt vorn zu liegen; sofort kaufen: %{buy}."
  fr: "Offres jusqu'à %{time} (dans %{left}), notées à 70 % prix et 30 % qualité. Demandez au plus %{amount} pour mener ; l'acheter d'office : %{buy}."
  nl: "Biedingen tot %{time} (nog %{left}), beoordeeld op 70 % prijs en 30 % kwaliteit. Vraag hoogstens %{amount} om nu voor te liggen; direct kopen: %{buy}."
  pl: "Oferty do %{time} (za %{left}), ocena 70 % cena i 30 % jakość. Zaproponuj najwyżej %{amount}, by teraz prowadzić; kupno od razu: %{buy}."
  ru: "Заявки до %{time} (через %{left}), оценка 70 % цена и 30 % качество. Заявите не больше %{amount}, чтобы лидировать; купить сразу: %{buy}."
  uk: "Заявки до %{time} (через %{left}), оцінка 70 % ціна і 30 % якість. Заявіть не більше %{amount}, щоб лідирувати; купити одразу: %{buy}."
"Ask at least 100 €.":
  de: "Bieten Sie mindestens 100 €."
  fr: "Demandez au moins 100 €."
  nl: "Vraag minstens 100 €."
  pl: "Zaproponuj co najmniej 100 €."
  ru: "Заявите не меньше 100 €."
  uk: "Заявіть не менше 100 €."
"Another bid scores better: ask at most the bid that leads.":
  de: "Ein anderes Angebot punktet besser: Bieten Sie höchstens das führende Angebot."
  fr: "Une autre offre a un meilleur score : demandez au plus l'offre qui mène."
  nl: "Een ander bod scoort beter: vraag hoogstens het bod dat leidt."
  pl: "Inna oferta ma lepszy wynik: zaproponuj najwyżej prowadzącą kwotę."
  ru: "Другая заявка набирает больше: заявите не больше лидирующей суммы."
  uk: "Інша заявка набирає більше: заявіть не більше суми, що лідирує."
