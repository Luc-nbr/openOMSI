_version: 2
# Tenders scored 70 % price and 30 % quality (Luc 2026-10-15): the bidders ask a sum for
# running the line over the term, the lowest ask gets the full price points.
"Won with an ask of %{amount}":
  de: "Gewonnen mit einem Angebot von %{amount}"
  fr: "Remporté avec une offre de %{amount}"
  nl: "Gewonnen met een vraagprijs van %{amount}"
  pl: "Wygrany z ofertą %{amount}"
  ru: "Выигран с заявкой %{amount}"
  uk: "Виграно із заявкою %{amount}"
"Lost to %{who}, who asked %{amount}":
  de: "Verloren an %{who}, Angebot %{amount}"
  fr: "Perdu face à %{who}, qui demandait %{amount}"
  nl: "Verloren aan %{who}, die %{amount} vroeg"
  pl: "Przegrany z %{who}, który zaproponował %{amount}"
  ru: "Проигран %{who}, заявка %{amount}"
  uk: "Програно %{who}, заявка %{amount}"
"Scored 70 % price, 30 % quality: the lowest ask gets all 70 price points, others lowest ÷ ask of them. Your quality %{q} of 100 (reputation, punctuality, fleet) is worth %{p} points. The best total wins.":
  de: "Bewertet zu 70 % Preis, 30 % Qualität: Das niedrigste Angebot bekommt alle 70 Preispunkte, die anderen niedrigstes ÷ eigenes davon. Ihre Qualität %{q} von 100 (Ruf, Pünktlichkeit, Flotte) bringt %{p} Punkte. Die beste Summe gewinnt."
  fr: "Noté à 70 % sur le prix, 30 % sur la qualité : l'offre la plus basse obtient les 70 points de prix, les autres la plus basse ÷ la leur. Votre qualité %{q} sur 100 (réputation, ponctualité, flotte) vaut %{p} points. Le meilleur total gagne."
  nl: "Beoordeeld op 70 % prijs, 30 % kwaliteit: de laagste vraagprijs krijgt alle 70 prijspunten, de andere laagste ÷ eigen deel ervan. Je kwaliteit %{q} van 100 (reputatie, stiptheid, vloot) is %{p} punten waard. Het beste totaal wint."
  pl: "Ocena: 70 % cena, 30 % jakość: najniższa oferta dostaje wszystkie 70 punktów za cenę, pozostałe najniższa ÷ własna. Twoja jakość %{q} na 100 (reputacja, punktualność, flota) daje %{p} pkt. Wygrywa najlepsza suma."
  ru: "Оценка: 70 % цена, 30 % качество: самая низкая заявка получает все 70 ценовых баллов, остальные — наименьшая ÷ своя. Ваше качество %{q} из 100 (репутация, пунктуальность, парк) даёт %{p} баллов. Побеждает лучшая сумма."
  uk: "Оцінка: 70 % ціна, 30 % якість: найнижча заявка отримує всі 70 цінових балів, інші — найменша ÷ своя. Ваша якість %{q} зі 100 (репутація, пунктуальність, парк) дає %{p} балів. Перемагає найкраща сума."
