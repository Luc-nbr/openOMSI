  fr: "%{p} prix + %{q} qualité = %{t} points"
  nl: "%{p} prijs + %{q} kwaliteit = %{t} punten"
  pl: "%{p} cena + %{q} jakość = %{t} pkt"
  ru: "%{p} цена + %{q} качество = %{t} баллов"
  uk: "%{p} ціна + %{q} якість = %{t} балів"
