  ru: "Фирменная"
  uk: "Фірмова"
"The planning gives the duty its bus, in the company's livery: it is not chosen here.":
  de: "Die Planung gibt dem Dienst seinen Bus in der Lackierung des Unternehmens: Er wird hier nicht gewählt."
  fr: "La planification donne au service son bus, aux couleurs de l'entreprise : il ne se choisit pas ici."
  nl: "De planning geeft de dienst zijn bus, in de huisstijl van het bedrijf: die kies je hier niet."
  pl: "Planowanie przydziela służbie autobus w malowaniu firmy: nie wybiera się go tutaj."
  ru: "Планирование назначает смене автобус в фирменной окраске: здесь он не выбирается."
  uk: "Планування призначає зміні автобус у фірмовому фарбуванні: тут він не обирається."
"Cannot start":
  de: "Start nicht möglich"
  fr: "Démarrage impossible"
  nl: "Kan niet starten"
  pl: "Nie można rozpocząć"
  ru: "Нельзя начать"
  uk: "Не можна почати"
"Before you start":
  de: "Vor dem Start"
  fr: "Avant de commencer"
  nl: "Voor je start"
  pl: "Przed rozpoczęciem"
  ru: "Перед началом"
  uk: "Перед початком"
"The game starts on %{date} at %{time}, %{lead} min before the first departure: the company's clock, not the computer's.":
  de: "Das Spiel beginnt am %{date} um %{time}, %{lead} Min. vor der ersten Abfahrt: nach der Uhr des Unternehmens, nicht der des Computers."
  fr: "Le jeu commence le %{date} à %{time}, %{lead} min avant le premier départ : l'horloge de l'entreprise, pas celle de l'ordinateur."
  nl: "Het spel begint op %{date} om %{time}, %{lead} min voor het eerste vertrek: de klok van het bedrijf, niet die van de computer."
  pl: "Gra zaczyna się %{date} o %{time}, %{lead} min przed pierwszym odjazdem: według zegara firmy, nie komputera."
  ru: "Игра начнётся %{date} в %{time}, за %{lead} мин до первого отправления: по часам компании, а не компьютера."
  uk: "Гра почнеться %{date} о %{time}, за %{lead} хв до першого відправлення: за годинником компанії, а не комп'ютера."
"Nothing of the duty can be changed here: the planning fixes it. Only the weather is yours to choose; sound, camera and traffic are as in the Settings.":
  de: "Am Dienst lässt sich hier nichts ändern: Die Planung legt ihn fest. Nur das Wetter wählen Sie selbst; Ton, Kamera und Verkehr sind wie in den Einstellungen."
  fr: "Rien du service ne peut être changé ici : la planification le fixe. Seule la météo est à votre choix ; son, caméra et trafic sont comme dans les Paramètres."
  nl: "Aan de dienst verander je hier niets: de planning legt hem vast. Alleen het weer kies je zelf; geluid, camera en verkeer zijn zoals in de Instellingen."
  pl: "Niczego w służbie nie można tu zmienić: ustala ją planowanie. Wybierasz tylko pogodę; dźwięk, kamera i ruch są jak w Ustawieniach."
  ru: "Здесь ничего в смене не изменить: её задаёт планирование. Выбрать можно только погоду; звук, камера и трафик — как в настройках."
  uk: "Тут нічого у зміні не змінити: її задає планування. Обрати можна лише погоду; звук, камера й трафік — як у налаштуваннях."
"Planned for %{name}":
  de: "Geplant für %{name}"
  fr: "Prévu pour %{name}"
  nl: "Gepland voor %{name}"
  pl: "Zaplanowano dla: %{name}"
  ru: "Запланировано для: %{name}"
  uk: "Заплановано для: %{name}"
"As forecast (weather cycle)":
  de: "Wie vorhergesagt (Wetterzyklus)"
  fr: "Selon les prévisions (cycle météo)"
  nl: "Zoals voorspeld (weercyclus)"
  pl: "Zgodnie z prognozą (cykl pogody)"
  ru: "По прогнозу (цикл погоды)"
  uk: "За прогнозом (цикл погоди)"
"The duty waits until the game has ended.":
  de: "Der Dienst wartet, bis das Spiel beendet ist."
  fr: "Le service attend que le jeu soit terminé."
  nl: "De dienst wacht tot het spel is afgesloten."
  pl: "Służba poczeka, aż gra się zakończy."
  ru: "Смена подождёт, пока игра не закроется."
  uk: "Зміна зачекає, доки гра не закриється."
"Close the game, then start the duty again.":
  de: "Schließen Sie das Spiel und starten Sie den Dienst dann erneut."
  fr: "Fermez le jeu, puis relancez le service."
  nl: "Sluit het spel en start de dienst daarna opnieuw."
  pl: "Zamknij grę, a potem ponownie rozpocznij służbę."
  ru: "Закройте игру, затем начните смену снова."
  uk: "Закрийте гру, потім почніть зміну знову."
"Starting your company's duty…":
  de: "Der Dienst Ihres Unternehmens wird gestartet…"
  fr: "Démarrage du service de votre entreprise…"
  nl: "De dienst van je bedrijf wordt gestart…"
  pl: "Rozpoczynanie służby Twojej firmy…"
  ru: "Запуск смены вашей компании…"
  uk: "Запуск зміни вашої компанії…"
"Route of the duty":
  de: "Route des Dienstes"
  fr: "Itinéraire du service"
  nl: "Route van de dienst"
  pl: "Trasa służby"
  ru: "Маршрут смены"
  uk: "Маршрут зміни"
"This duty is no longer in the planning":
  de: "Dieser Dienst ist nicht mehr in der Planung"
  fr: "Ce service n'est plus dans la planification"
  nl: "Deze dienst staat niet meer in de planning"
  pl: "Tej służby nie ma już w planowaniu"
  ru: "Этой смены больше нет в планировании"
  uk: "Цієї зміни більше немає в плануванні"
"The timetable or the planning changed since. Choose the duty again in RosterFlow.":
  de: "Fahrplan oder Planung haben sich seitdem geändert. Wählen Sie den Dienst in RosterFlow erneut."
  fr: "L'horaire ou la planification a changé depuis. Choisissez à nouveau le service dans RosterFlow."
  nl: "De dienstregeling of de planning is sindsdien veranderd. Kies de dienst opnieuw in RosterFlow."
  pl: "Od tego czasu zmienił się rozkład lub planowanie. Wybierz służbę ponownie w RosterFlow."
  ru: "С тех пор изменилось расписание или планирование. Выберите смену снова в RosterFlow."
  uk: "Відтоді змінився розклад або планування. Оберіть зміну знову в RosterFlow."
"No bus is planned for this duty":
  de: "Für diesen Dienst ist kein Bus geplant"
  fr: "Aucun bus n'est prévu pour ce service"
  nl: "Voor deze dienst is geen bus gepland"
  pl: "Dla tej służby nie zaplanowano autobusu"
  ru: "Для этой смены не запланирован автобус"
  uk: "Для цієї зміни не заплановано автобус"
"Give its tour a bus of the fleet in RosterFlow.":
  de: "Geben Sie seinem Umlauf in RosterFlow einen Bus der Flotte."
  fr: "Donnez à son roulement un bus de la flotte dans RosterFlow."
  nl: "Geef zijn omloop in RosterFlow een bus uit de vloot."
  pl: "Przydziel jej obiegowi autobus z floty w RosterFlow."
  ru: "Назначьте его обороту автобус из парка в RosterFlow."
  uk: "Призначте його обороту автобус із парку в RosterFlow."
"A rental bus runs this tour":
  de: "Auf diesem Umlauf fährt ein Mietbus"
  fr: "Un bus de location assure ce roulement"
  nl: "Op deze omloop rijdt een huurbus"
  pl: "Ten obieg obsługuje autobus wynajęty"
  ru: "Этот оборот обслуживает арендованный автобус"
  uk: "Цей оборот обслуговує орендований автобус"
"The company has no bus of its own on it to start with: give the tour a bus of the fleet in RosterFlow.":
  de: "Das Unternehmen hat dort keinen eigenen Bus, mit dem gestartet werden kann: Geben Sie dem Umlauf in RosterFlow einen Bus der Flotte."
  fr: "L'entreprise n'y a pas de bus à elle pour démarrer : donnez au roulement un bus de la flotte dans RosterFlow."
  nl: "Het bedrijf heeft daar geen eigen bus om mee te starten: geef de omloop in RosterFlow een bus uit de vloot."
  pl: "Firma nie ma tam własnego autobusu, którym można zacząć: przydziel obiegowi autobus z floty w RosterFlow."
  ru: "У компании там нет своего автобуса, чтобы начать: назначьте обороту автобус из парка в RosterFlow."
  uk: "У компанії там немає власного автобуса, щоб почати: призначте обороту автобус із парку в RosterFlow."
"The planned bus cannot run this day":
  de: "Der geplante Bus kann an diesem Tag nicht fahren"
  fr: "Le bus prévu ne peut pas rouler ce jour-là"
  nl: "De geplande bus kan die dag niet rijden"
  pl: "Zaplanowany autobus nie może jeździć tego dnia"
  ru: "Запланированный автобус не может выйти в этот день"
  uk: "Запланований автобус не може вийти цього дня"
"Give the tour another bus of the fleet in RosterFlow.":
  de: "Geben Sie dem Umlauf in RosterFlow einen anderen Bus der Flotte."
  fr: "Donnez au roulement un autre bus de la flotte dans RosterFlow."
  nl: "Geef de omloop in RosterFlow een andere bus uit de vloot."
  pl: "Przydziel obiegowi inny autobus z floty w RosterFlow."
  ru: "Назначьте обороту другой автобус из парка в RosterFlow."
  uk: "Призначте обороту інший автобус із парку в RosterFlow."
"The planned bus has no bus file":
  de: "Der geplante Bus hat keine Busdatei"
  fr: "Le bus prévu n'a pas de fichier de bus"
  nl: "De geplande bus heeft geen busbestand"
  pl: "Zaplanowany autobus nie ma pliku autobusu"
  ru: "У запланированного автобуса нет файла автобуса"
  uk: "Запланований автобус не має файлу автобуса"
"The planned bus is not installed":
  de: "Der geplante Bus ist nicht installiert"
  fr: "Le bus prévu n'est pas installé"
  nl: "De geplande bus is niet geïnstalleerd"
  pl: "Zaplanowany autobus nie jest zainstalowany"
  ru: "Запланированный автобус не установлен"
  uk: "Запланований автобус не встановлено"
"Install it again, or give the tour another bus of the fleet in RosterFlow.":
  de: "Installieren Sie ihn erneut oder geben Sie dem Umlauf in RosterFlow einen anderen Bus der Flotte."
  fr: "Réinstallez-le, ou donnez au roulement un autre bus de la flotte dans RosterFlow."
  nl: "Installeer hem opnieuw, of geef de omloop in RosterFlow een andere bus uit de vloot."
  pl: "Zainstaluj go ponownie albo przydziel obiegowi inny autobus z floty w RosterFlow."
  ru: "Установите его снова или назначьте обороту другой автобус из парка в RosterFlow."
  uk: "Встановіть його знову або призначте обороту інший автобус із парку в RosterFlow."
"Nobody is planned on this duty":
  de: "Für diesen Dienst ist niemand geplant"
  fr: "Personne n'est prévu sur ce service"
  nl: "Op deze dienst is niemand gepland"
  pl: "Nikt nie jest zaplanowany na tę służbę"
  ru: "На эту смену никто не запланирован"
  uk: "На цю зміну ніхто не запланований"
"Plan yourself on it in RosterFlow (\"You\") to drive it.":
  de: "Planen Sie sich in RosterFlow selbst darauf ein (\"Sie\"), um ihn zu fahren."
  fr: "Planifiez-vous dessus dans RosterFlow (\"Vous\") pour le conduire."
  nl: "Plan jezelf erop in RosterFlow (\"Jij\") om hem te rijden."
  pl: "Zaplanuj na nią siebie w RosterFlow (\"Ty\"), aby ją poprowadzić."
  ru: "Назначьте на неё себя в RosterFlow («Вы»), чтобы её проехать."
  uk: "Призначте на неї себе в RosterFlow («Ви»), щоб її проїхати."
"Another driver is planned on this duty":
  de: "Für diesen Dienst ist ein anderer Fahrer geplant"
  fr: "Un autre conducteur est prévu sur ce service"
  nl: "Op deze dienst is een andere chauffeur gepland"
  pl: "Na tę służbę zaplanowano innego kierowcę"
  ru: "На эту смену запланирован другой водитель"
  uk: "На цю зміну запланований інший водій"
"You drove this duty already":
  de: "Sie haben diesen Dienst schon gefahren"
  fr: "Vous avez déjà effectué ce service"
  nl: "Je hebt deze dienst al gereden"
  pl: "Ta służba została już przez Ciebie przejechana"
  ru: "Вы уже проехали эту смену"
  uk: "Ви вже проїхали цю зміну"
"Its trips are reported to the company. Choose another duty of yours in RosterFlow.":
  de: "Seine Fahrten sind dem Unternehmen gemeldet. Wählen Sie in RosterFlow einen anderen Ihrer Dienste."
  fr: "Ses courses sont déclarées à l'entreprise. Choisissez un autre de vos services dans RosterFlow."
  nl: "Zijn ritten zijn aan het bedrijf gemeld. Kies een andere dienst van je in RosterFlow."
  pl: "Jej kursy zgłoszono firmie. Wybierz inną swoją służbę w RosterFlow."
  ru: "Её рейсы переданы компании. Выберите другую свою смену в RosterFlow."
  uk: "Її рейси передано компанії. Оберіть іншу свою зміну в RosterFlow."
"The time of this duty has passed":
  de: "Die Zeit dieses Dienstes ist vorbei"
  fr: "L'heure de ce service est passée"
  nl: "De tijd van deze dienst is voorbij"
  pl: "Czas tej służby minął"
  ru: "Время этой смены прошло"
  uk: "Час цієї зміни минув"
"The company's clock is past its end. Choose a later duty in RosterFlow.":
  de: "Die Uhr des Unternehmens ist über sein Ende hinaus. Wählen Sie in RosterFlow einen späteren Dienst."
  fr: "L'horloge de l'entreprise a dépassé sa fin. Choisissez un service plus tardif dans RosterFlow."
  nl: "De klok van het bedrijf is voorbij het einde ervan. Kies een latere dienst in RosterFlow."
  pl: "Zegar firmy minął jej koniec. Wybierz późniejszą służbę w RosterFlow."
  ru: "Часы компании уже после её окончания. Выберите более позднюю смену в RosterFlow."
  uk: "Годинник компанії вже після її кінця. Оберіть пізнішу зміну в RosterFlow."
"The timetable changed":
  de: "Der Fahrplan hat sich geändert"
  fr: "L'horaire a changé"
  nl: "De dienstregeling is veranderd"
  pl: "Rozkład się zmienił"
  ru: "Расписание изменилось"
  uk: "Розклад змінився"
"The day's timetable no longer has this duty's trips as planned. Plan the day again in RosterFlow.":
  de: "Der Fahrplan des Tages hat die Fahrten dieses Dienstes nicht mehr wie geplant. Planen Sie den Tag in RosterFlow neu."
  fr: "L'horaire du jour n'a plus les courses de ce service telles que prévues. Replanifiez la journée dans RosterFlow."
  nl: "De dienstregeling van de dag heeft de ritten van deze dienst niet meer zoals gepland. Plan de dag opnieuw in RosterFlow."
  pl: "Rozkład dnia nie ma już kursów tej służby zgodnie z planem. Zaplanuj dzień ponownie w RosterFlow."
  ru: "В расписании дня больше нет рейсов этой смены по плану. Спланируйте день заново в RosterFlow."
  uk: "У розкладі дня більше немає рейсів цієї зміни за планом. Сплануйте день заново в RosterFlow."
