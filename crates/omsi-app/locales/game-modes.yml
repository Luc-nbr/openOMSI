"The company runs its routine by itself: rosters, spare parts, repairs, staff and research, with simple screens and generous money. The planning, the depot, the workshop, the concessions, the research and the contracts pages are left out.":
  en: "The company runs its routine by itself: rosters, spare parts, repairs, staff and research, with simple screens and generous money. The planning, the depot, the workshop, the concessions, the research and the contracts pages are left out."
  nl: "Het bedrijf doet zijn routine zelf: roosters, onderdelen, reparaties, personeel en onderzoek, met eenvoudige schermen en royaal geld. De pagina's planning, remise, werkplaats, concessies, onderzoek en contracten vallen weg."
  de: "Das Unternehmen erledigt seine Routine selbst: Dienstpläne, Ersatzteile, Reparaturen, Personal und Forschung, mit einfachen Bildschirmen und großzügigen Finanzen. Die Seiten Planung, Betriebshof, Werkstatt, Konzessionen, Forschung und Verträge entfallen."
  fr: "L'entreprise gère sa routine toute seule : plannings, pièces détachées, réparations, personnel et recherche, avec des écrans simples et des finances généreuses. Les pages planification, dépôt, atelier, concessions, recherche et contrats disparaissent."
  ru: "Компания сама ведёт свою рутину: графики, запчасти, ремонт, персонал и исследования, с простыми экранами и щедрыми финансами. Страницы планирования, депо, мастерской, концессий, исследований и контрактов скрываются."
  uk: "Компанія сама веде свою рутину: графіки, запчастини, ремонт, персонал і дослідження, з простими екранами та щедрими фінансами. Сторінки планування, депо, майстерні, концесій, досліджень і контрактів приховуються."
  pl: "Firma sama prowadzi swoją rutynę: grafiki, części zamienne, naprawy, personel i badania, z prostymi ekranami i hojnymi finansami. Strony planowania, zajezdni, warsztatu, koncesji, badań i kontraktów znikają."
"RosterFlow is switched off; its plans are kept.":
  en: "RosterFlow is switched off; its plans are kept."
  nl: "RosterFlow wordt uitgezet; zijn plannen blijven bewaard."
  de: "RosterFlow wird ausgeschaltet; seine Pläne bleiben erhalten."
  fr: "RosterFlow est désactivé ; ses plans sont conservés."
  ru: "RosterFlow выключается; его планы сохраняются."
  uk: "RosterFlow вимикається; його плани зберігаються."
  pl: "RosterFlow zostaje wyłączony; jego plany zostają zachowane."
"Every page opens and you run the company yourself: the roster, the workshop, the concessions and the research.":
  en: "Every page opens and you run the company yourself: the roster, the workshop, the concessions and the research."
  nl: "Elke pagina gaat open en je leidt het bedrijf zelf: het rooster, de werkplaats, de concessies en het onderzoek."
  de: "Jede Seite öffnet sich und Sie führen das Unternehmen selbst: den Dienstplan, die Werkstatt, die Konzessionen und die Forschung."
  fr: "Toutes les pages s'ouvrent et vous dirigez l'entreprise vous-même : le planning, l'atelier, les concessions et la recherche."
  ru: "Открываются все страницы, и вы сами управляете компанией: графиком, мастерской, концессиями и исследованиями."
  uk: "Відкриваються всі сторінки, і ви самі керуєте компанією: графіком, майстернею, концесіями та дослідженнями."
  pl: "Otwierają się wszystkie strony i sam prowadzisz firmę: grafik, warsztat, koncesje i badania."
"Forgiving rules and calmer days: fewer illnesses, breakdowns and delays, and the dispatcher repairs the roster every morning.":
  en: "Forgiving rules and calmer days: fewer illnesses, breakdowns and delays, and the dispatcher repairs the roster every morning."
  nl: "Vergevingsgezinde regels en rustigere dagen: minder ziekte, pech en vertragingen, en de planner herstelt het rooster elke ochtend."
  de: "Nachsichtige Regeln und ruhigere Tage: weniger Krankheiten, Pannen und Verspätungen, und der Disponent repariert jeden Morgen den Dienstplan."
  fr: "Des règles indulgentes et des journées plus calmes : moins de maladies, de pannes et de retards, et le régulateur répare le planning chaque matin."
  ru: "Мягкие правила и более спокойные дни: меньше болезней, поломок и опозданий, а диспетчер каждое утро чинит график."
  uk: "М'які правила та спокійніші дні: менше хвороб, поломок і запізнень, а диспетчер щоранку лагодить графік."
  pl: "Wyrozumiałe zasady i spokojniejsze dni: mniej chorób, awarii i opóźnień, a dyspozytor co rano naprawia grafik."
"Real-life wages, prices and rules, and real disruptions: more illness, breakdowns and delays. The roster is no longer repaired by itself: you solve everything yourself.":
  en: "Real-life wages, prices and rules, and real disruptions: more illness, breakdowns and delays. The roster is no longer repaired by itself: you solve everything yourself."
  nl: "Echte lonen, prijzen en regels, en echte verstoringen: meer ziekte, pech en vertragingen. Het rooster herstelt zich niet meer vanzelf: je lost alles zelf op."
  de: "Echte Löhne, Preise und Regeln, und echte Störungen: mehr Krankheit, Pannen und Verspätungen. Der Dienstplan repariert sich nicht mehr selbst: Sie lösen alles selbst."
  fr: "Des salaires, prix et règles réels, et de vraies perturbations : plus de maladies, de pannes et de retards. Le planning ne se répare plus tout seul : vous réglez tout vous-même."
  ru: "Реальные зарплаты, цены и правила, и настоящие сбои: больше болезней, поломок и опозданий. График больше не чинится сам: всё решаете вы сами."
  uk: "Реальні зарплати, ціни та правила, і справжні збої: більше хвороб, поломок і запізнень. Графік більше не лагодиться сам: усе вирішуєте ви самі."
  pl: "Prawdziwe płace, ceny i zasady oraz prawdziwe zakłócenia: więcej chorób, awarii i opóźnień. Grafik nie naprawia się już sam: wszystko rozwiązujesz sam."
"Your buses, people, lines, money and history stay as they are, and you can switch back at any time.":
  en: "Your buses, people, lines, money and history stay as they are, and you can switch back at any time."
  nl: "Je bussen, mensen, lijnen, geld en geschiedenis blijven zoals ze zijn, en je kunt altijd terugschakelen."
  de: "Ihre Busse, Mitarbeiter, Linien, Finanzen und Geschichte bleiben, wie sie sind, und Sie können jederzeit zurückwechseln."
  fr: "Vos bus, votre personnel, vos lignes, votre argent et votre historique restent tels quels, et vous pouvez revenir en arrière à tout moment."
  ru: "Ваши автобусы, люди, линии, деньги и история остаются как есть, и вы можете вернуться в любое время."
  uk: "Ваші автобуси, люди, лінії, гроші й історія залишаються як є, і ви можете повернутися будь-коли."
  pl: "Twoje autobusy, ludzie, linie, pieniądze i historia zostają bez zmian, a w każdej chwili możesz wrócić."
"The company runs in Casual now: it sees to its routine by itself.":
  en: "The company runs in Casual now: it sees to its routine by itself."
  nl: "Het bedrijf draait nu in Casual: het doet zijn routine zelf."
  de: "Das Unternehmen läuft jetzt im Modus Entspannt: es erledigt seine Routine selbst."
  fr: "L'entreprise est maintenant en mode Détente : elle gère sa routine toute seule."
  ru: "Компания теперь в казуальном режиме: она сама ведёт свою рутину."
  uk: "Компанія тепер у казуальному режимі: вона сама веде свою рутину."
  pl: "Firma działa teraz w trybie Swobodnym: sama prowadzi swoją rutynę."
"The company runs in Normal now: every page is open, and the dispatcher helps.":
  en: "The company runs in Normal now: every page is open, and the dispatcher helps."
  nl: "Het bedrijf draait nu in Normaal: elke pagina is open, en de planner helpt."
  de: "Das Unternehmen läuft jetzt im Modus Normal: jede Seite ist offen, und der Disponent hilft."
  fr: "L'entreprise est maintenant en mode Normal : toutes les pages sont ouvertes, et le régulateur aide."
  ru: "Компания теперь в обычном режиме: открыты все страницы, а диспетчер помогает."
  uk: "Компанія тепер у нормальному режимі: відкриті всі сторінки, а диспетчер допомагає."
  pl: "Firma działa teraz w trybie Normalnym: każda strona jest otwarta, a dyspozytor pomaga."
"The company runs in Realistic now: real-life rules, and you solve everything yourself.":
  en: "The company runs in Realistic now: real-life rules, and you solve everything yourself."
  nl: "Het bedrijf draait nu in Realistisch: echte regels, en je lost alles zelf op."
  de: "Das Unternehmen läuft jetzt im Modus Realistisch: echte Regeln, und Sie lösen alles selbst."
  fr: "L'entreprise est maintenant en mode Réaliste : des règles réelles, et vous réglez tout vous-même."
  ru: "Компания теперь в реалистичном режиме: настоящие правила, и всё решаете вы сами."
  uk: "Компанія тепер у реалістичному режимі: справжні правила, і все вирішуєте ви самі."
  pl: "Firma działa teraz w trybie Realistycznym: prawdziwe zasady i wszystko rozwiązujesz sam."
"The company's game mode: change it in the company's settings":
  en: "The company's game mode: change it in the company's settings"
  nl: "De spelmodus van het bedrijf: wijzig hem in de instellingen van het bedrijf"
  de: "Der Spielmodus des Unternehmens: ändern Sie ihn in den Einstellungen des Unternehmens"
  fr: "Le mode de jeu de l'entreprise : changez-le dans les paramètres de l'entreprise"
  ru: "Режим игры компании: измените его в настройках компании"
  uk: "Режим гри компанії: змініть його в налаштуваннях компанії"
  pl: "Tryb gry firmy: zmień go w ustawieniach firmy"
"Casual does not research this by itself: switch to Normal and start it on its Research page.":
  en: "Casual does not research this by itself: switch to Normal and start it on its Research page."
  nl: "Casual onderzoekt dit niet vanzelf: schakel over naar Normaal en start het op de pagina Onderzoek."
  de: "Im Modus Entspannt wird dies nicht von selbst erforscht: wechseln Sie zu Normal und starten Sie es auf der Seite Forschung."
  fr: "Le mode Détente ne le recherche pas tout seul : passez en Normal et lancez-le sur la page Recherche."
  ru: "В казуальном режиме это не исследуется само: перейдите в обычный режим и начните исследование на странице «Исследования»."
  uk: "У казуальному режимі це не досліджується само: перейдіть у нормальний режим і почніть дослідження на сторінці «Дослідження»."
  pl: "Tryb Swobodny nie bada tego sam: przełącz na Normalny i rozpocznij to na stronie Badania."
"The company builds more parking spaces by itself before the yard is full, when its cash allows. To build them now, switch to Normal.":
  en: "The company builds more parking spaces by itself before the yard is full, when its cash allows. To build them now, switch to Normal."
  nl: "Het bedrijf bouwt zelf meer parkeerplaatsen voordat het terrein vol is, als de kas het toelaat. Om ze nu te bouwen, schakel je over naar Normaal."
  de: "Das Unternehmen baut selbst mehr Stellplätze, bevor der Hof voll ist, wenn die Kasse es erlaubt. Um sie jetzt zu bauen, wechseln Sie zu Normal."
  fr: "L'entreprise construit d'elle-même plus de places de stationnement avant que le dépôt soit plein, quand sa trésorerie le permet. Pour les construire maintenant, passez en Normal."
  ru: "Компания сама строит больше стоянок, пока площадка не заполнена, если позволяют деньги. Чтобы построить их сейчас, перейдите в обычный режим."
  uk: "Компанія сама будує більше стоянок, поки майданчик не заповнений, якщо дозволяють гроші. Щоб побудувати їх зараз, перейдіть у нормальний режим."
  pl: "Firma sama buduje więcej miejsc postojowych, zanim plac się zapełni, gdy pozwala na to kasa. Aby zbudować je teraz, przełącz na Normalny."
"The company researches them by itself once a researcher works here and the trophies and the money are there. To start it now, switch to Normal.":
  en: "The company researches them by itself once a researcher works here and the trophies and the money are there. To start it now, switch to Normal."
  nl: "Het bedrijf onderzoekt ze zelf zodra er een onderzoeker werkt en de trofeeën en het geld er zijn. Om het nu te starten, schakel je over naar Normaal."
  de: "Das Unternehmen erforscht sie selbst, sobald hier ein Forscher arbeitet und die Trophäen und das Geld da sind. Um es jetzt zu starten, wechseln Sie zu Normal."
  fr: "L'entreprise les recherche d'elle-même dès qu'un chercheur y travaille et que les trophées et l'argent sont là. Pour la lancer maintenant, passez en Normal."
  ru: "Компания исследует их сама, как только здесь работает исследователь и есть трофеи и деньги. Чтобы начать сейчас, перейдите в обычный режим."
  uk: "Компанія досліджує їх сама, щойно тут працює дослідник і є трофеї та гроші. Щоб почати зараз, перейдіть у нормальний режим."
  pl: "Firma bada je sama, gdy tylko pracuje tu badacz i są trofea oraz pieniądze. Aby rozpocząć teraz, przełącz na Normalny."
# The founding wizard's game-mode cards
"Starting capital %{amount}":
  en: "Starting capital %{amount}"
  nl: "Startkapitaal %{amount}"
  de: "Startkapital %{amount}"
  fr: "Capital de départ %{amount}"
  ru: "Стартовый капитал %{amount}"
  uk: "Стартовий капітал %{amount}"
  pl: "Kapitał początkowy %{amount}"
"Switch the game mode at any time in the company's settings. RosterFlow, the professional scheduling studio, can be switched on there as an add-on.":
  en: "Switch the game mode at any time in the company's settings. RosterFlow, the professional scheduling studio, can be switched on there as an add-on."
  nl: "Wissel de spelmodus wanneer je wilt in de instellingen van het bedrijf. RosterFlow, de professionele planningsstudio, zet je daar aan als uitbreiding."
  de: "Wechseln Sie den Spielmodus jederzeit in den Einstellungen des Unternehmens. RosterFlow, das professionelle Planungsstudio, lässt sich dort als Erweiterung einschalten."
  fr: "Changez de mode de jeu à tout moment dans les paramètres de l'entreprise. RosterFlow, le studio de planification professionnel, s'y active comme module."
  ru: "Режим игры можно сменить в любое время в настройках компании. Там же можно включить дополнение RosterFlow — профессиональную студию планирования."
  uk: "Режим гри можна змінити будь-коли в налаштуваннях компанії. Там само можна ввімкнути доповнення RosterFlow — професійну студію планування."
  pl: "Tryb gry zmienisz w każdej chwili w ustawieniach firmy. Tam też włączysz dodatek RosterFlow, profesjonalne studio planowania."
"Switch the game mode at any time in the company's settings: nothing is lost.":
  en: "Switch the game mode at any time in the company's settings: nothing is lost."
  nl: "Wissel de spelmodus wanneer je wilt in de instellingen van het bedrijf: er gaat niets verloren."
  de: "Wechseln Sie den Spielmodus jederzeit in den Einstellungen des Unternehmens: nichts geht verloren."
  fr: "Changez de mode de jeu à tout moment dans les paramètres de l'entreprise : rien n'est perdu."
  ru: "Режим игры можно сменить в любое время в настройках компании: ничего не теряется."
  uk: "Режим гри можна змінити будь-коли в налаштуваннях компанії: нічого не втрачається."
  pl: "Tryb gry zmienisz w każdej chwili w ustawieniach firmy: nic nie przepada."
"Casual buys at the list price, in one click: the buses are yours at once.":
  en: "Casual buys at the list price, in one click: the buses are yours at once."
  nl: "Casual koopt tegen de catalogusprijs, met één klik: de bussen zijn meteen van jou."
  de: "Im Modus Entspannt kaufen Sie zum Listenpreis, mit einem Klick: die Busse gehören sofort Ihnen."
  fr: "En mode Détente, on achète au prix catalogue, en un clic : les bus sont à vous tout de suite."
  ru: "В казуальном режиме покупка по прейскуранту, в один клик: автобусы сразу ваши."
  uk: "У казуальному режимі купівля за прейскурантом, в один клік: автобуси одразу ваші."
  pl: "W trybie Swobodnym kupujesz po cenie katalogowej, jednym kliknięciem: autobusy są od razu twoje."
# The company's tour
"Give the company a name, its colours, its home map with a depot and its game mode: Casual, Normal or Realistic. Once it runs, this tour shows you round its pages.":
  en: "Give the company a name, its colours, its home map with a depot and its game mode: Casual, Normal or Realistic. Once it runs, this tour shows you round its pages."
  nl: "Geef het bedrijf een naam, zijn kleuren, zijn thuiskaart met een remise en zijn spelmodus: Casual, Normaal of Realistisch. Zodra het draait, leidt deze rondleiding je langs zijn pagina's."
  de: "Geben Sie dem Unternehmen einen Namen, seine Farben, seine Heimatkarte mit einem Betriebshof und seinen Spielmodus: Entspannt, Normal oder Realistisch. Sobald es läuft, führt Sie diese Tour durch seine Seiten."
  fr: "Donnez à l'entreprise un nom, ses couleurs, sa carte d'attache avec un dépôt et son mode de jeu : Détente, Normal ou Réaliste. Une fois lancée, cette visite vous fait parcourir ses pages."
  ru: "Дайте компании название, цвета, домашнюю карту с депо и режим игры: казуальный, обычный или реалистичный. Когда она заработает, этот тур проведёт вас по её страницам."
  uk: "Дайте компанії назву, кольори, домашню карту з депо та режим гри: казуальний, нормальний або реалістичний. Коли вона запрацює, цей тур проведе вас її сторінками."
  pl: "Nadaj firmie nazwę, kolory, mapę macierzystą z zajezdnią i tryb gry: Swobodny, Normalny lub Realistyczny. Gdy ruszy, ta wycieczka oprowadzi cię po jej stronach."
"The company sees to its routine by itself: no planning, no auctions, no workshop to run. A click here opens the settings, where Normal or Realistic shows every page with nothing lost.":
  en: "The company sees to its routine by itself: no planning, no auctions, no workshop to run. A click here opens the settings, where Normal or Realistic shows every page with nothing lost."
  nl: "Het bedrijf zorgt zelf voor zijn routine: geen planning, geen veilingen, geen werkplaats om te runnen. Een klik hier opent de instellingen, waar Normaal of Realistisch elke pagina toont zonder dat er iets verloren gaat."
  de: "Das Unternehmen kümmert sich selbst um seine Routine: keine Planung, keine Ausschreibungen, keine Werkstatt zu führen. Ein Klick hier öffnet die Einstellungen, wo Normal oder Realistisch jede Seite zeigt, ohne dass etwas verloren geht."
  fr: "L'entreprise gère sa routine toute seule : pas de planification, pas d'enchères, pas d'atelier à gérer. Un clic ici ouvre les paramètres, où Normal ou Réaliste affiche toutes les pages sans rien perdre."
  ru: "Компания сама ведёт свою рутину: ни планирования, ни аукционов, ни мастерской. Щелчок здесь открывает настройки, где обычный или реалистичный режим показывает все страницы, ничего не теряя."
  uk: "Компанія сама веде свою рутину: ні планування, ні аукціонів, ні майстерні. Клацання тут відкриває налаштування, де нормальний або реалістичний режим показує всі сторінки, нічого не втрачаючи."
  pl: "Firma sama dba o swoją rutynę: bez planowania, bez przetargów, bez warsztatu do prowadzenia. Kliknięcie tutaj otwiera ustawienia, gdzie tryb Normalny lub Realistyczny pokazuje każdą stronę bez żadnych strat."
