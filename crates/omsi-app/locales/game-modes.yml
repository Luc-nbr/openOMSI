"Advanced: modelled on professional scheduling software that real transport operators use.":
  en: "Advanced: modelled on professional scheduling software that real transport operators use."
  nl: "Gevorderd: naar het voorbeeld van professionele planningssoftware die echte vervoerders gebruiken."
  de: "Für Fortgeschrittene: nach dem Vorbild professioneller Planungssoftware, die echte Verkehrsunternehmen nutzen."
  fr: "Avancé : inspiré des logiciels de planification professionnels qu'utilisent de vrais exploitants de transport."
  ru: "Для опытных: по образцу профессиональных программ планирования, которыми пользуются настоящие перевозчики."
  uk: "Для досвідчених: за зразком професійних програм планування, якими користуються справжні перевізники."
  pl: "Zaawansowane: wzorowane na profesjonalnym oprogramowaniu do planowania, z którego korzystają prawdziwi przewoźnicy."
"RosterFlow is on: the planning is its studio now.":
  en: "RosterFlow is on: the planning is its studio now."
  nl: "RosterFlow staat aan: de planning is nu zijn studio."
  de: "RosterFlow ist an: die Planung ist jetzt sein Studio."
  fr: "RosterFlow est activé : la planification est désormais son studio."
  ru: "RosterFlow включён: планирование теперь — его студия."
  uk: "RosterFlow увімкнено: планування тепер — його студія."
  pl: "RosterFlow jest włączony: planowanie jest teraz jego studiem."
"RosterFlow is off: the planning is the day's roster. Its plans are kept.":
  en: "RosterFlow is off: the planning is the day's roster. Its plans are kept."
  nl: "RosterFlow staat uit: de planning is het rooster van de dag. Zijn plannen blijven bewaard."
  de: "RosterFlow ist aus: die Planung ist der Dienstplan des Tages. Seine Pläne bleiben erhalten."
  fr: "RosterFlow est désactivé : la planification est le planning du jour. Ses plans sont conservés."
  ru: "RosterFlow выключен: планирование — это график дня. Его планы сохранены."
  uk: "RosterFlow вимкнено: планування — це графік дня. Його плани збережено."
  pl: "RosterFlow jest wyłączony: planowanie to grafik dnia. Jego plany zostają zachowane."
