"Every page and every function: you run the company, and the dispatcher repairs the roster every morning. Forgiving rules and fewer disruptions.":
  en: "Every page and every function: you run the company, and the dispatcher repairs the roster every morning. Forgiving rules and fewer disruptions."
  nl: "Elke pagina en elke functie: jij leidt het bedrijf, en de planner herstelt het rooster elke ochtend. Vergevingsgezinde regels en minder verstoringen."
  de: "Jede Seite und jede Funktion: Sie führen das Unternehmen, und der Disponent repariert jeden Morgen den Dienstplan. Nachsichtige Regeln und weniger Störungen."
  fr: "Chaque page et chaque fonction : vous dirigez l'entreprise, et le régulateur répare le planning chaque matin. Des règles indulgentes et moins de perturbations."
  ru: "Все страницы и все функции: вы управляете компанией, а диспетчер каждое утро чинит график. Мягкие правила и меньше сбоев."
  uk: "Усі сторінки й усі функції: ви керуєте компанією, а диспетчер щоранку лагодить графік. М'які правила та менше збоїв."
  pl: "Każda strona i każda funkcja: prowadzisz firmę, a dyspozytor co rano naprawia grafik. Wyrozumiałe zasady i mniej zakłóceń."
"Every page and every function, with real-life wages, rules and disruptions: you plan, repair and solve everything yourself.":
  en: "Every page and every function, with real-life wages, rules and disruptions: you plan, repair and solve everything yourself."
  nl: "Elke pagina en elke functie, met echte lonen, regels en verstoringen: je plant, herstelt en lost alles zelf op."
  de: "Jede Seite und jede Funktion, mit echten Löhnen, Regeln und Störungen: Sie planen, reparieren und lösen alles selbst."
  fr: "Chaque page et chaque fonction, avec des salaires, des règles et des perturbations réels : vous planifiez, réparez et réglez tout vous-même."
  ru: "Все страницы и все функции, с реальными зарплатами, правилами и сбоями: вы сами планируете, чините и решаете всё."
  uk: "Усі сторінки й усі функції, з реальними зарплатами, правилами та збоями: ви самі плануєте, лагодите й вирішуєте все."
  pl: "Każda strona i każda funkcja, z prawdziwymi płacami, zasadami i zakłóceniami: sam planujesz, naprawiasz i rozwiązujesz wszystko."
# The morning's repair of the roster (Normal)
"The roster was repaired":
  en: "The roster was repaired"
  nl: "Het rooster is hersteld"
  de: "Der Dienstplan wurde repariert"
  fr: "Le planning a été réparé"
  ru: "График исправлен"
  uk: "Графік виправлено"
  pl: "Grafik został naprawiony"
"The dispatcher gave %{n} places of today's roster anew: their driver or bus could not run them (ill, on holiday, a clash or no bus). The rest of the roster is as you planned it.":
  en: "The dispatcher gave %{n} places of today's roster anew: their driver or bus could not run them (ill, on holiday, a clash or no bus). The rest of the roster is as you planned it."
  nl: "De planner heeft %{n} plekken van het rooster van vandaag opnieuw ingevuld: hun chauffeur of bus kon ze niet rijden (ziek, op vakantie, een overlap of geen bus). De rest van het rooster is zoals jij het plande."
  de: "Der Disponent hat %{n} Plätze im heutigen Dienstplan neu vergeben: ihr Fahrer oder Bus konnte sie nicht fahren (krank, im Urlaub, eine Überschneidung oder kein Bus). Der Rest des Dienstplans ist so, wie Sie ihn geplant haben."
  fr: "Le régulateur a réattribué %{n} places du planning d'aujourd'hui : leur conducteur ou leur bus ne pouvait pas les assurer (malade, en congé, un conflit ou pas de bus). Le reste du planning est tel que vous l'avez prévu."
  ru: "Диспетчер заново распределил %{n} мест в сегодняшнем графике: их водитель или автобус не мог их выполнить (болезнь, отпуск, накладка или нет автобуса). Остальной график остался таким, как вы его составили."
  uk: "Диспетчер заново розподілив %{n} місць у сьогоднішньому графіку: їхній водій або автобус не міг їх виконати (хвороба, відпустка, накладка або немає автобуса). Решта графіка така, як ви її склали."
  pl: "Dyspozytor na nowo obsadził %{n} miejsc w dzisiejszym grafiku: ich kierowca lub autobus nie mógł ich obsłużyć (choroba, urlop, kolizja lub brak autobusu). Reszta grafiku jest taka, jak ją zaplanowałeś."
"Roster repaired, places still open":
  en: "Roster repaired, places still open"
  nl: "Rooster hersteld, nog plekken open"
  de: "Dienstplan repariert, Plätze noch offen"
  fr: "Planning réparé, des places restent ouvertes"
  ru: "График исправлен, есть незакрытые места"
  uk: "Графік виправлено, є незакриті місця"
  pl: "Grafik naprawiony, miejsca wciąż wolne"
"The dispatcher gave %{n} places of today's roster anew, but found nobody free for %{open} of them: give them a driver or a bus in the planning, or they fall out.":
  en: "The dispatcher gave %{n} places of today's roster anew, but found nobody free for %{open} of them: give them a driver or a bus in the planning, or they fall out."
  nl: "De planner heeft %{n} plekken van het rooster van vandaag opnieuw ingevuld, maar vond voor %{open} ervan niemand vrij: geef ze in de planning een chauffeur of een bus, anders vallen ze uit."
  de: "Der Disponent hat %{n} Plätze im heutigen Dienstplan neu vergeben, fand aber für %{open} davon niemanden frei: geben Sie ihnen in der Planung einen Fahrer oder einen Bus, sonst fallen sie aus."
  fr: "Le régulateur a réattribué %{n} places du planning d'aujourd'hui, mais n'a trouvé personne de libre pour %{open} d'entre elles : donnez-leur un conducteur ou un bus dans la planification, sinon elles sont supprimées."
  ru: "Диспетчер заново распределил %{n} мест в сегодняшнем графике, но для %{open} из них никого свободного не нашёл: назначьте им водителя или автобус в планировании, иначе они выпадут."
  uk: "Диспетчер заново розподілив %{n} місць у сьогоднішньому графіку, але для %{open} з них нікого вільного не знайшов: призначте їм водія або автобус у плануванні, інакше вони випадуть."
  pl: "Dyspozytor na nowo obsadził %{n} miejsc w dzisiejszym grafiku, ale dla %{open} z nich nie znalazł nikogo wolnego: przydziel im kierowcę lub autobus w planowaniu, inaczej wypadną."
