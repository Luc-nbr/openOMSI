"Run the rest of the day: the buses drive, the money comes in, and you start the next morning":
  en: "Run the rest of the day: the buses drive, the money comes in, and you start the next morning"
  nl: "Laat de rest van de dag lopen: de bussen rijden, het geld komt binnen, en je begint de volgende ochtend"
  de: "Lass den Rest des Tages laufen: die Busse fahren, das Geld kommt herein, und du beginnst am nächsten Morgen"
  fr: "Faites passer le reste de la journée : les bus roulent, l'argent rentre, et vous commencez le lendemain matin"
  ru: "Прокрутить остаток дня: автобусы ездят, деньги приходят, а вы начинаете следующее утро"
  uk: "Прокрутити решту дня: автобуси їздять, гроші надходять, а ви починаєте наступний ранок"
  pl: "Przewiń resztę dnia: autobusy jeżdżą, pieniądze wpływają, a ty zaczynasz następny poranek"
