"Every bus of your company, with its age and condition. Repairs and services happen by themselves. Click a bus to paint it or sell it; Buy a bus opens the shop.":
  en: "Every bus of your company, with its age and condition. Repairs and services happen by themselves. Click a bus to paint it or sell it; Buy a bus opens the shop."
  nl: "Elke bus van je bedrijf, met zijn leeftijd en staat. Reparaties en onderhoud gaan vanzelf. Klik op een bus om hem te spuiten of te verkopen; Bus kopen opent de winkel."
  de: "Jeder Bus deines Unternehmens, mit Alter und Zustand. Reparaturen und Wartung laufen von selbst. Klicke einen Bus an, um ihn zu lackieren oder zu verkaufen; Bus kaufen öffnet den Laden."
  fr: "Chaque bus de votre entreprise, avec son âge et son état. Réparations et entretien se font tout seuls. Cliquez sur un bus pour le peindre ou le vendre ; Acheter un bus ouvre la boutique."
  ru: "Каждый автобус вашей компании, с возрастом и состоянием. Ремонт и обслуживание идут сами. Нажмите на автобус, чтобы перекрасить или продать его; «Купить автобус» открывает магазин."
  uk: "Кожен автобус вашої компанії, з віком і станом. Ремонт і обслуговування йдуть самі. Натисніть на автобус, щоб перефарбувати чи продати його; «Купити автобус» відкриває магазин."
  pl: "Każdy autobus twojej firmy, z wiekiem i stanem. Naprawy i serwis dzieją się same. Kliknij autobus, aby go pomalować lub sprzedać; Kup autobus otwiera sklep."
"The bus shop":
  en: "The bus shop"
  nl: "De buswinkel"
  de: "Der Busladen"
  fr: "La boutique de bus"
  ru: "Магазин автобусов"
  uk: "Магазин автобусів"
  pl: "Sklep z autobusami"
"The buses that fit your lines best come first. Pick one to see its price and buy it in one click: it joins the fleet and drives from the next morning.":
  en: "The buses that fit your lines best come first. Pick one to see its price and buy it in one click: it joins the fleet and drives from the next morning."
  nl: "De bussen die het best bij je lijnen passen, staan vooraan. Kies er een om de prijs te zien en koop hem met één klik: hij komt bij de vloot en rijdt vanaf de volgende ochtend."
  de: "Die Busse, die am besten zu deinen Linien passen, stehen vorn. Wähle einen, sieh seinen Preis und kauf ihn mit einem Klick: er kommt in die Flotte und fährt ab dem nächsten Morgen."
  fr: "Les bus qui conviennent le mieux à vos lignes viennent en premier. Choisissez-en un pour voir son prix et achetez-le en un clic : il rejoint la flotte et roule dès le lendemain matin."
  ru: "Сначала идут автобусы, лучше всего подходящие вашим линиям. Выберите один, посмотрите цену и купите в один клик: он войдёт в парк и выйдет на линию со следующего утра."
  uk: "Спершу йдуть автобуси, що найкраще пасують вашим лініям. Виберіть один, подивіться ціну й купіть одним кліком: він увійде до парку й вийде на лінію з наступного ранку."
  pl: "Najpierw autobusy, które najlepiej pasują do twoich linii. Wybierz jeden, zobacz cenę i kup jednym kliknięciem: dołączy do floty i jeździ od następnego ranka."
"The lines your company runs, with their buses and passengers this week. The slider sets a line's fare: the advice keeps passengers and earns well.":
  en: "The lines your company runs, with their buses and passengers this week. The slider sets a line's fare: the advice keeps passengers and earns well."
  nl: "De lijnen die je bedrijf rijdt, met hun bussen en reizigers van deze week. De schuif zet het tarief van een lijn: het advies houdt reizigers vast en verdient goed."
  de: "Die Linien deines Unternehmens, mit ihren Bussen und Fahrgästen dieser Woche. Der Regler setzt den Fahrpreis einer Linie: die Empfehlung hält Fahrgäste und verdient gut."
  fr: "Les lignes de votre entreprise, avec leurs bus et leurs voyageurs de la semaine. Le curseur règle le tarif d'une ligne : le conseil garde les voyageurs et rapporte bien."
  ru: "Линии вашей компании, с автобусами и пассажирами за эту неделю. Ползунок задаёт тариф линии: совет сохраняет пассажиров и приносит хороший доход."
  uk: "Лінії вашої компанії, з автобусами й пасажирами за цей тиждень. Повзунок задає тариф лінії: порада зберігає пасажирів і добре заробляє."
  pl: "Linie twojej firmy, z autobusami i pasażerami z tego tygodnia. Suwak ustawia taryfę linii: porada trzyma pasażerów i dobrze zarabia."
"A new line":
  en: "A new line"
  nl: "Een nieuwe lijn"
  de: "Eine neue Linie"
  fr: "Une nouvelle ligne"
  ru: "Новая линия"
  uk: "Нова лінія"
  pl: "Nowa linia"
"Three steps: pick a line of the map or draw your own stops, choose how often it runs, done. The timetable, the shifts and the drivers are made by themselves.":
  en: "Three steps: pick a line of the map or draw your own stops, choose how often it runs, done. The timetable, the shifts and the drivers are made by themselves."
  nl: "Drie stappen: kies een lijn van de kaart of teken je eigen haltes, kies hoe vaak hij rijdt, klaar. De dienstregeling, de diensten en de chauffeurs komen vanzelf."
  de: "Drei Schritte: wähle eine Linie der Karte oder zeichne eigene Haltestellen, wähle, wie oft sie fährt, fertig. Fahrplan, Schichten und Fahrer entstehen von selbst."
  fr: "Trois étapes : choisissez une ligne de la carte ou dessinez vos propres arrêts, choisissez sa fréquence, terminé. L'horaire, les services et les conducteurs se font tout seuls."
  ru: "Три шага: выберите линию карты или нарисуйте свои остановки, выберите, как часто она ходит, готово. Расписание, смены и водители появятся сами."
  uk: "Три кроки: виберіть лінію мапи або намалюйте свої зупинки, виберіть, як часто вона ходить, готово. Розклад, зміни й водії з'являться самі."
  pl: "Trzy kroki: wybierz linię z mapy albo narysuj własne przystanki, wybierz, jak często kursuje, gotowe. Rozkład, zmiany i kierowcy powstaną same."
"Your drivers":
  en: "Your drivers"
  nl: "Je chauffeurs"
  de: "Deine Fahrer"
  fr: "Vos conducteurs"
  ru: "Ваши водители"
  uk: "Ваші водії"
  pl: "Twoi kierowcy"
"Who drives for you, how well, and today's shift. The company hires the drivers it needs by itself at night; you can hire now, give a bonus or let someone go.":
  en: "Who drives for you, how well, and today's shift. The company hires the drivers it needs by itself at night; you can hire now, give a bonus or let someone go."
  nl: "Wie er voor je rijdt, hoe goed, en de dienst van vandaag. Het bedrijf neemt 's nachts zelf de chauffeurs aan die het nodig heeft; jij kunt nu aannemen, een bonus geven of iemand laten gaan."
  de: "Wer für dich fährt, wie gut, und die Schicht von heute. Das Unternehmen stellt nachts selbst die Fahrer ein, die es braucht; du kannst jetzt einstellen, eine Prämie geben oder jemanden gehen lassen."
  fr: "Qui conduit pour vous, à quel niveau, et son service du jour. L'entreprise embauche seule la nuit les conducteurs dont elle a besoin ; vous pouvez embaucher maintenant, donner une prime ou laisser partir quelqu'un."
  ru: "Кто у вас водит, насколько хорошо, и смена на сегодня. Компания сама ночью нанимает нужных водителей; вы можете нанять сейчас, дать премию или уволить."
  uk: "Хто у вас водить, наскільки добре, і зміна на сьогодні. Компанія сама вночі наймає потрібних водіїв; ви можете найняти зараз, дати премію чи звільнити."
  pl: "Kto dla ciebie jeździ, jak dobrze i dzisiejsza zmiana. Firma sama w nocy zatrudnia potrzebnych kierowców; możesz zatrudnić teraz, dać premię albo kogoś zwolnić."
"Your money":
  en: "Your money"
  nl: "Je geld"
  de: "Dein Geld"
  fr: "Votre argent"
  ru: "Ваши деньги"
  uk: "Ваші гроші"
  pl: "Twoje pieniądze"
"What came in and what went out, week by week, and where most of it goes. Green weeks earned money, red weeks cost money.":
  en: "What came in and what went out, week by week, and where most of it goes. Green weeks earned money, red weeks cost money."
  nl: "Wat er binnenkwam en wat eruit ging, week na week, en waar het meeste heen gaat. Groene weken verdienden geld, rode weken kostten geld."
  de: "Was hereinkam und was hinausging, Woche für Woche, und wohin das meiste geht. Grüne Wochen haben Geld verdient, rote Wochen Geld gekostet."
  fr: "Ce qui est entré et ce qui est sorti, semaine après semaine, et où va la plus grande part. Les semaines vertes ont rapporté, les rouges ont coûté."
  ru: "Что пришло и что ушло, неделя за неделей, и куда уходит больше всего. Зелёные недели принесли деньги, красные стоили денег."
  uk: "Що надійшло і що пішло, тиждень за тижнем, і куди йде найбільше. Зелені тижні принесли гроші, червоні коштували грошей."
  pl: "Co wpłynęło i co wyszło, tydzień po tygodniu, i na co idzie najwięcej. Zielone tygodnie zarobiły, czerwone kosztowały."
"Your company":
  en: "Your company"
  nl: "Je bedrijf"
  de: "Dein Unternehmen"
  fr: "Votre entreprise"
  ru: "Ваша компания"
  uk: "Ваша компанія"
  pl: "Twoja firma"
"Your company's livery, painted in the livery editor, and its depot: when the buses no longer fit, buy a bigger one.":
  en: "Your company's livery, painted in the livery editor, and its depot: when the buses no longer fit, buy a bigger one."
  nl: "De huisstijl van je bedrijf, gespoten in de lakeditor, en zijn remise: passen de bussen er niet meer in, koop dan een grotere."
  de: "Die Lackierung deines Unternehmens, gestaltet im Lackierungseditor, und sein Betriebshof: passen die Busse nicht mehr hinein, kauf einen größeren."
  fr: "La livrée de votre entreprise, peinte dans l'éditeur de livrées, et son dépôt : quand les bus n'y tiennent plus, achetez-en un plus grand."
  ru: "Ливрея вашей компании, нарисованная в редакторе ливрей, и её депо: когда автобусы перестают помещаться, купите депо побольше."
  uk: "Ліврея вашої компанії, намальована в редакторі лівреї, і її депо: коли автобуси вже не вміщаються, купіть більше депо."
  pl: "Malowanie twojej firmy, zrobione w edytorze malowań, i jej zajezdnia: gdy autobusy się nie mieszczą, kup większą."
"Today's shifts of your company. Pick one and the shift's start opens, with the line, the bus and the times: you start the game there.":
  en: "Today's shifts of your company. Pick one and the shift's start opens, with the line, the bus and the times: you start the game there."
  nl: "De diensten van vandaag van je bedrijf. Kies er een en de start van de dienst opent, met de lijn, de bus en de tijden: daar start je het spel."
  de: "Die heutigen Schichten deines Unternehmens. Wähle eine, und ihr Start öffnet sich, mit Linie, Bus und Zeiten: dort startest du das Spiel."
  fr: "Les services du jour de votre entreprise. Choisissez-en un et son départ s'ouvre, avec la ligne, le bus et les horaires : vous lancez le jeu de là."
  ru: "Сегодняшние смены вашей компании. Выберите одну — откроется её старт с линией, автобусом и временем: оттуда вы запускаете игру."
  uk: "Сьогоднішні зміни вашої компанії. Виберіть одну — відкриється її старт з лінією, автобусом і часом: звідти ви запускаєте гру."
  pl: "Dzisiejsze zmiany twojej firmy. Wybierz jedną, a otworzy się jej start z linią, autobusem i godzinami: stamtąd uruchamiasz grę."
"How your company's day goes, what it solved by itself, and what you can do now. The tips say what helps; Next day runs the rest of the day.":
  en: "How your company's day goes, what it solved by itself, and what you can do now. The tips say what helps; Next day runs the rest of the day."
  nl: "Hoe de dag van je bedrijf loopt, wat het zelf heeft opgelost, en wat je nu kunt doen. De tips zeggen wat helpt; Volgende dag laat de rest van de dag lopen."
  de: "Wie der Tag deines Unternehmens läuft, was es selbst gelöst hat und was du jetzt tun kannst. Die Tipps sagen, was hilft; Nächster Tag lässt den Rest des Tages laufen."
  fr: "Comment se passe la journée de votre entreprise, ce qu'elle a réglé seule et ce que vous pouvez faire. Les conseils disent ce qui aide ; Jour suivant fait passer le reste de la journée."
  ru: "Как идёт день вашей компании, что она решила сама и что вы можете сделать сейчас. Советы подскажут, что поможет; «Следующий день» прокручивает остаток дня."
  uk: "Як минає день вашої компанії, що вона розв'язала сама і що ви можете зробити зараз. Поради підкажуть, що допоможе; «Наступний день» прокручує решту дня."
  pl: "Jak mija dzień twojej firmy, co rozwiązała sama i co możesz teraz zrobić. Wskazówki mówią, co pomaga; Następny dzień przewija resztę dnia."
"A new day. Yesterday: %{pax} passengers, %{money}.":
  en: "A new day. Yesterday: %{pax} passengers, %{money}."
  nl: "Een nieuwe dag. Gisteren: %{pax} reizigers, %{money}."
  de: "Ein neuer Tag. Gestern: %{pax} Fahrgäste, %{money}."
  fr: "Un nouveau jour. Hier : %{pax} voyageurs, %{money}."
  ru: "Новый день. Вчера: %{pax} пассажиров, %{money}."
  uk: "Новий день. Учора: %{pax} пасажирів, %{money}."
  pl: "Nowy dzień. Wczoraj: %{pax} pasażerów, %{money}."
"Next day":
  en: "Next day"
