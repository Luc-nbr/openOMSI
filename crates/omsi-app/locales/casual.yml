  nl: "Nu geen tips: alles loopt goed."
  de: "Gerade keine Tipps: alles läuft gut."
  fr: "Pas de conseil pour l'instant : tout va bien."
  ru: "Сейчас советов нет: всё идёт хорошо."
  uk: "Зараз порад немає: усе йде добре."
