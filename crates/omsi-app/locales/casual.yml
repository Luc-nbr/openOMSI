"Start the line, and it runs from now on: every morning the company gives its buses and drivers their work.":
  en: "Start the line, and it runs from now on: every morning the company gives its buses and drivers their work."
  nl: "Start de lijn en hij rijdt vanaf nu: elke ochtend geeft het bedrijf zijn bussen en chauffeurs hun werk."
  de: "Starte die Linie, und sie fährt ab jetzt: jeden Morgen gibt das Unternehmen seinen Bussen und Fahrern ihre Arbeit."
  fr: "Lancez la ligne et elle roule dès maintenant : chaque matin, l'entreprise donne leur travail à ses bus et à ses conducteurs."
  ru: "Запустите линию, и она работает с этой минуты: каждое утро компания даёт автобусам и водителям их работу."
  uk: "Запустіть лінію, і вона працює з цієї хвилини: щоранку компанія дає автобусам і водіям їхню роботу."
  pl: "Uruchom linię, a kursuje od teraz: co rano firma daje swoim autobusom i kierowcom pracę."
"The line editor opens with this timetable: click the stops on the map, and confirm the line there. It shows what the line costs and brings.":
  en: "The line editor opens with this timetable: click the stops on the map, and confirm the line there. It shows what the line costs and brings."
  nl: "De lijneditor opent met deze dienstregeling: klik de haltes aan op de kaart en bevestig de lijn daar. Hij laat zien wat de lijn kost en oplevert."
  de: "Der Linieneditor öffnet sich mit diesem Fahrplan: klicke die Haltestellen auf der Karte an und bestätige die Linie dort. Er zeigt, was die Linie kostet und bringt."
  fr: "L'éditeur de lignes s'ouvre avec cet horaire : cliquez les arrêts sur la carte et confirmez la ligne là-bas. Il montre ce qu'elle coûte et rapporte."
  ru: "Редактор линий откроется с этим расписанием: отметьте остановки на карте и подтвердите линию там. Он покажет, сколько линия стоит и приносит."
  uk: "Редактор ліній відкриється з цим розкладом: позначте зупинки на мапі й підтвердьте лінію там. Він покаже, скільки лінія коштує і приносить."
  pl: "Edytor linii otworzy się z tym rozkładem: kliknij przystanki na mapie i potwierdź tam linię. Pokaże, ile linia kosztuje i przynosi."
"Line %{n} is yours: it runs by itself from now on.":
  en: "Line %{n} is yours: it runs by itself from now on."
  nl: "Lijn %{n} is van jou: hij rijdt vanaf nu vanzelf."
  de: "Linie %{n} gehört dir: sie fährt ab jetzt von selbst."
  fr: "La ligne %{n} est à vous : elle roule seule dès maintenant."
  ru: "Линия %{n} ваша: теперь она работает сама."
  uk: "Лінія %{n} ваша: тепер вона працює сама."
  pl: "Linia %{n} jest twoja: od teraz kursuje sama."
"Line %{n} is yours: it runs by itself from tomorrow.":
  en: "Line %{n} is yours: it runs by itself from tomorrow."
  nl: "Lijn %{n} is van jou: hij rijdt vanaf morgen vanzelf."
