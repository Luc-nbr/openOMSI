# --- the tour's Casual stops ----------------------------------------------------------------------
"Your company's day":
  en: "Your company's day"
  nl: "De dag van je bedrijf"
  de: "Der Tag deines Unternehmens"
  fr: "La journée de votre entreprise"
  ru: "День вашей компании"
  uk: "День вашої компанії"
  pl: "Dzień twojej firmy"
"How the day goes, in one sentence, and under it what your company solved by itself: a bus that broke down and the spare bus that took over, drivers hired at night.":
  en: "How the day goes, in one sentence, and under it what your company solved by itself: a bus that broke down and the spare bus that took over, drivers hired at night."
  nl: "Hoe de dag loopt, in één zin, en daaronder wat je bedrijf zelf heeft opgelost: een bus met pech en de reservebus die het overnam, 's nachts aangenomen chauffeurs."
  de: "Wie der Tag läuft, in einem Satz, und darunter, was dein Unternehmen selbst gelöst hat: ein Bus mit Panne und der Ersatzbus, der übernahm, nachts eingestellte Fahrer."
  fr: "Comment se passe la journée, en une phrase, et dessous ce que votre entreprise a réglé seule : un bus en panne et le bus de réserve qui a pris le relais, des conducteurs embauchés la nuit."
  ru: "Как идёт день — одной фразой, а под ней то, что компания решила сама: сломавшийся автобус и резервный, что его заменил, водители, нанятые ночью."
  uk: "Як минає день — одним реченням, а під ним те, що компанія розв'язала сама: зламаний автобус і резервний, що його замінив, водії, найняті вночі."
  pl: "Jak mija dzień, w jednym zdaniu, a pod nim, co firma rozwiązała sama: zepsuty autobus i rezerwowy, który go zastąpił, kierowcy zatrudnieni w nocy."
"The big button: pick one of today's shifts - its line, its time, its bus - and its start opens. You start the game there.":
  en: "The big button: pick one of today's shifts - its line, its time, its bus - and its start opens. You start the game there."
  nl: "De grote knop: kies een van de diensten van vandaag - lijn, tijd, bus - en de start opent. Daar start je het spel."
  de: "Der große Knopf: wähle eine der heutigen Schichten - Linie, Zeit, Bus - und ihr Start öffnet sich. Dort startest du das Spiel."
  fr: "Le grand bouton : choisissez un des services du jour - sa ligne, son horaire, son bus - et son départ s'ouvre. Vous lancez le jeu de là."
  ru: "Большая кнопка: выберите одну из сегодняшних смен - линию, время, автобус - и откроется её старт. Оттуда вы запускаете игру."
  uk: "Велика кнопка: виберіть одну з сьогоднішніх змін - лінію, час, автобус - і відкриється її старт. Звідти ви запускаєте гру."
  pl: "Duży przycisk: wybierz jedną z dzisiejszych zmian - linię, godzinę, autobus - a otworzy się jej start. Stamtąd uruchamiasz grę."
"Four tiles":
  en: "Four tiles"
  nl: "Vier tegels"
  de: "Vier Kacheln"
  fr: "Quatre tuiles"
  ru: "Четыре плитки"
  uk: "Чотири плитки"
  pl: "Cztery kafelki"
"Your buses, your lines, your drivers and the money, each with one big number and one button. A click on a tile opens its page.":
  en: "Your buses, your lines, your drivers and the money, each with one big number and one button. A click on a tile opens its page."
  nl: "Je bussen, je lijnen, je chauffeurs en het geld, elk met één groot getal en één knop. Een klik op een tegel opent zijn pagina."
  de: "Deine Busse, Linien, Fahrer und das Geld, jedes mit einer großen Zahl und einem Knopf. Ein Klick auf eine Kachel öffnet ihre Seite."
  fr: "Vos bus, vos lignes, vos conducteurs et l'argent, chacun avec un grand chiffre et un bouton. Un clic sur une tuile ouvre sa page."
  ru: "Ваши автобусы, линии, водители и деньги — у каждой плитки одно большое число и одна кнопка. Нажатие на плитку открывает её страницу."
  uk: "Ваші автобуси, лінії, водії та гроші — у кожної плитки одне велике число й одна кнопка. Натискання на плитку відкриває її сторінку."
  pl: "Twoje autobusy, linie, kierowcy i pieniądze, każdy z jedną dużą liczbą i jednym przyciskiem. Kliknięcie kafelka otwiera jego stronę."
"Your company says what would help now, in plain words: a bus more, a fare too high, a full depot. The button beside a tip does it.":
  en: "Your company says what would help now, in plain words: a bus more, a fare too high, a full depot. The button beside a tip does it."
  nl: "Je bedrijf zegt in gewone woorden wat nu zou helpen: een bus meer, een te hoog tarief, een volle remise. De knop naast een tip doet het."
  de: "Dein Unternehmen sagt in einfachen Worten, was jetzt helfen würde: ein Bus mehr, ein zu hoher Fahrpreis, ein voller Betriebshof. Der Knopf neben einem Tipp erledigt es."
  fr: "Votre entreprise dit simplement ce qui aiderait : un bus de plus, un tarif trop élevé, un dépôt plein. Le bouton à côté d'un conseil s'en charge."
  ru: "Компания простыми словами говорит, что поможет сейчас: ещё автобус, слишком высокий тариф, полное депо. Кнопка рядом с советом это делает."
  uk: "Компанія простими словами каже, що допоможе зараз: ще автобус, зависокий тариф, повне депо. Кнопка біля поради це робить."
  pl: "Firma mówi prostymi słowami, co teraz pomoże: jeszcze jeden autobus, za wysoka taryfa, pełna zajezdnia. Przycisk obok wskazówki to robi."
"Your company runs the rest of the day by itself: the buses drive, the money comes in. Next day takes you to the next morning.":
  en: "Your company runs the rest of the day by itself: the buses drive, the money comes in. Next day takes you to the next morning."
  nl: "Je bedrijf doet de rest van de dag zelf: de bussen rijden, het geld komt binnen. Volgende dag brengt je naar de volgende ochtend."
  de: "Dein Unternehmen erledigt den Rest des Tages selbst: die Busse fahren, das Geld kommt herein. Nächster Tag bringt dich zum nächsten Morgen."
  fr: "Votre entreprise fait seule le reste de la journée : les bus roulent, l'argent rentre. Jour suivant vous mène au lendemain matin."
  ru: "Остаток дня компания проводит сама: автобусы ездят, деньги приходят. «Следующий день» переносит вас в следующее утро."
  uk: "Решту дня компанія проводить сама: автобуси їздять, гроші надходять. «Наступний день» переносить вас у наступний ранок."
  pl: "Resztę dnia firma prowadzi sama: autobusy jeżdżą, pieniądze wpływają. Następny dzień przenosi cię do następnego ranka."
"The company sees to its routine by itself: planning, workshop, staff and research. A click here opens the settings, where Normal shows every page with nothing lost.":
  en: "The company sees to its routine by itself: planning, workshop, staff and research. A click here opens the settings, where Normal shows every page with nothing lost."
  nl: "Het bedrijf regelt zijn routine zelf: planning, werkplaats, personeel en onderzoek. Een klik hier opent de instellingen, waar Normaal elke pagina toont zonder dat er iets verloren gaat."
  de: "Das Unternehmen erledigt seine Routine selbst: Planung, Werkstatt, Personal und Forschung. Ein Klick hier öffnet die Einstellungen, wo Normal jede Seite zeigt, ohne dass etwas verloren geht."
  fr: "L'entreprise gère seule sa routine : planification, atelier, personnel et recherche. Un clic ici ouvre les réglages, où Normal montre toutes les pages sans rien perdre."
  ru: "Компания сама ведёт рутину: планирование, мастерская, персонал и исследования. Нажатие здесь открывает настройки, где «Обычное» показывает все страницы без потерь."
  uk: "Компанія сама веде рутину: планування, майстерня, персонал і дослідження. Натискання тут відкриває налаштування, де «Нормальне» показує всі сторінки без втрат."
  pl: "Firma sama dba o rutynę: planowanie, warsztat, personel i badania. Kliknięcie tu otwiera ustawienia, gdzie Normalny pokazuje każdą stronę bez strat."
"Under the company's name, always in view: its cash, the trophies earned with goals, and its reputation. A click on the cash opens the money.":
  en: "Under the company's name, always in view: its cash, the trophies earned with goals, and its reputation. A click on the cash opens the money."
  nl: "Onder de naam van het bedrijf, altijd in beeld: het geld, de trofeeën verdiend met doelen, en de reputatie. Een klik op het geld opent het geld."
  de: "Unter dem Namen des Unternehmens, immer im Blick: das Geld, die mit Zielen verdienten Trophäen und der Ruf. Ein Klick auf das Geld öffnet die Finanzen."
  fr: "Sous le nom de l'entreprise, toujours en vue : sa trésorerie, les trophées gagnés avec les objectifs et sa réputation. Un clic sur la trésorerie ouvre l'argent."
  ru: "Под названием компании, всегда на виду: деньги, трофеи за цели и репутация. Нажатие на деньги открывает финансы."
  uk: "Під назвою компанії, завжди на виду: гроші, трофеї за цілі й репутація. Натискання на гроші відкриває фінанси."
  pl: "Pod nazwą firmy, zawsze na widoku: gotówka, trofea za cele i reputacja. Kliknięcie gotówki otwiera pieniądze."
"Every bus as a card, with its age and its condition. Repairs happen by themselves; Buy a bus opens the shop, the buses that fit your lines first. The icons up here open every page.":
  en: "Every bus as a card, with its age and its condition. Repairs happen by themselves; Buy a bus opens the shop, the buses that fit your lines first. The icons up here open every page."
  nl: "Elke bus als kaart, met leeftijd en staat. Reparaties gaan vanzelf; Bus kopen opent de winkel, de bussen voor je lijnen eerst. De pictogrammen hierboven openen elke pagina."
  de: "Jeder Bus als Karte, mit Alter und Zustand. Reparaturen laufen von selbst; Bus kaufen öffnet den Laden, die passenden Busse zuerst. Die Symbole hier oben öffnen jede Seite."
  fr: "Chaque bus en carte, avec son âge et son état. Les réparations se font seules ; Acheter un bus ouvre la boutique, les bus adaptés à vos lignes d'abord. Les icônes en haut ouvrent chaque page."
  ru: "Каждый автобус — карточка с возрастом и состоянием. Ремонт идёт сам; «Купить автобус» открывает магазин, подходящие автобусы первыми. Значки вверху открывают любую страницу."
  uk: "Кожен автобус — картка з віком і станом. Ремонт іде сам; «Купити автобус» відкриває магазин, придатні автобуси першими. Значки вгорі відкривають будь-яку сторінку."
  pl: "Każdy autobus jako karta, z wiekiem i stanem. Naprawy dzieją się same; Kup autobus otwiera sklep, najpierw pasujące autobusy. Ikony u góry otwierają każdą stronę."
"A question mark on every page":
  en: "A question mark on every page"
  nl: "Een vraagteken op elke pagina"
  de: "Ein Fragezeichen auf jeder Seite"
  fr: "Un point d'interrogation sur chaque page"
  ru: "Знак вопроса на каждой странице"
  uk: "Знак питання на кожній сторінці"
  pl: "Znak zapytania na każdej stronie"
"Not sure what a page is for? Its question mark says it in a few words.":
  en: "Not sure what a page is for? Its question mark says it in a few words."
  nl: "Weet je niet waar een pagina voor is? Het vraagteken zegt het in een paar woorden."
  de: "Unsicher, wozu eine Seite da ist? Ihr Fragezeichen sagt es in wenigen Worten."
  fr: "Vous ne savez pas à quoi sert une page ? Son point d'interrogation le dit en quelques mots."
  ru: "Не понятно, зачем страница? Её знак вопроса объяснит в нескольких словах."
  uk: "Не зрозуміло, для чого сторінка? Її знак питання пояснить кількома словами."
  pl: "Nie wiesz, do czego służy strona? Jej znak zapytania powie to w kilku słowach."
"Every line with its buses and passengers. The slider sets its fare, with advice beside it. Add a line takes three steps: the line, how often, done.":
  en: "Every line with its buses and passengers. The slider sets its fare, with advice beside it. Add a line takes three steps: the line, how often, done."
  nl: "Elke lijn met zijn bussen en reizigers. De schuif zet het tarief, met advies ernaast. Lijn toevoegen kost drie stappen: de lijn, hoe vaak, klaar."
  de: "Jede Linie mit ihren Bussen und Fahrgästen. Der Regler setzt den Fahrpreis, mit Empfehlung daneben. Linie hinzufügen dauert drei Schritte: die Linie, wie oft, fertig."
  fr: "Chaque ligne avec ses bus et ses voyageurs. Le curseur règle son tarif, avec un conseil à côté. Ajouter une ligne prend trois étapes : la ligne, la fréquence, terminé."
  ru: "Каждая линия с автобусами и пассажирами. Ползунок задаёт тариф, рядом совет. Добавить линию — три шага: линия, частота, готово."
  uk: "Кожна лінія з автобусами й пасажирами. Повзунок задає тариф, поруч порада. Додати лінію — три кроки: лінія, частота, готово."
  pl: "Każda linia z autobusami i pasażerami. Suwak ustawia taryfę, obok porada. Dodanie linii to trzy kroki: linia, jak często, gotowe."
"Who drives for you and how well. The company hires the drivers it needs at night; give a bonus, or let someone go.":
  en: "Who drives for you and how well. The company hires the drivers it needs at night; give a bonus, or let someone go."
  nl: "Wie er voor je rijdt en hoe goed. Het bedrijf neemt 's nachts de chauffeurs aan die het nodig heeft; geef een bonus, of laat iemand gaan."
  de: "Wer für dich fährt und wie gut. Das Unternehmen stellt nachts die Fahrer ein, die es braucht; gib eine Prämie oder lass jemanden gehen."
  fr: "Qui conduit pour vous et à quel niveau. L'entreprise embauche la nuit les conducteurs dont elle a besoin ; donnez une prime, ou laissez partir quelqu'un."
  ru: "Кто у вас водит и насколько хорошо. Компания ночью нанимает нужных водителей; дайте премию или уволите кого-то."
  uk: "Хто у вас водить і наскільки добре. Компанія вночі наймає потрібних водіїв; дайте премію або звільніть когось."
  pl: "Kto dla ciebie jeździ i jak dobrze. Firma w nocy zatrudnia potrzebnych kierowców; daj premię albo kogoś zwolnij."
"Where the money goes":
  en: "Where the money goes"
  nl: "Waar het geld heen gaat"
  de: "Wohin das Geld geht"
  fr: "Où va l'argent"
  ru: "Куда уходят деньги"
  uk: "Куди йдуть гроші"
  pl: "Na co idą pieniądze"
"Week by week what came in and went out, and the biggest costs in plain words, with a tip when something costs too much.":
  en: "Week by week what came in and went out, and the biggest costs in plain words, with a tip when something costs too much."
  nl: "Week na week wat er binnenkwam en wat eruit ging, en de grootste kosten in gewone woorden, met een tip als iets te veel kost."
  de: "Woche für Woche, was hereinkam und hinausging, und die größten Kosten in einfachen Worten, mit einem Tipp, wenn etwas zu viel kostet."
  fr: "Semaine après semaine ce qui est entré et sorti, et les plus gros frais en mots simples, avec un conseil quand quelque chose coûte trop."
  ru: "Неделя за неделей — что пришло и ушло, и крупнейшие расходы простыми словами, с советом, когда что-то стоит слишком дорого."
  uk: "Тиждень за тижнем — що надійшло і пішло, і найбільші витрати простими словами, з порадою, коли щось коштує задорого."
  pl: "Tydzień po tygodniu, co wpłynęło i wyszło, i największe koszty prostymi słowami, ze wskazówką, gdy coś kosztuje za dużo."
"Livery and depot":
  en: "Livery and depot"
  nl: "Huisstijl en remise"
  de: "Lackierung und Betriebshof"
  fr: "Livrée et dépôt"
  ru: "Ливрея и депо"
  uk: "Ліврея і депо"
  pl: "Malowanie i zajezdnia"
"Paint your buses in your company's livery, and buy a bigger depot when the buses no longer fit.":
  en: "Paint your buses in your company's livery, and buy a bigger depot when the buses no longer fit."
  nl: "Spuit je bussen in de huisstijl van je bedrijf, en koop een grotere remise als de bussen er niet meer in passen."
  de: "Lackiere deine Busse in der Farbe deines Unternehmens und kauf einen größeren Betriebshof, wenn die Busse nicht mehr hineinpassen."
  fr: "Peignez vos bus à la livrée de votre entreprise, et achetez un dépôt plus grand quand les bus n'y tiennent plus."
  ru: "Покрасьте автобусы в ливрею компании и купите депо побольше, когда автобусы перестанут помещаться."
  uk: "Пофарбуйте автобуси в ліврею компанії й купіть більше депо, коли автобуси перестануть уміщатися."
  pl: "Pomaluj autobusy w barwy firmy i kup większą zajezdnię, gdy autobusy się nie mieszczą."

# --- a popup's words in Casual ----------------------------------------------------------------
"The company builds more parking spaces by itself when its cash allows. Or buy a bigger depot now on your company's page.":
  en: "The company builds more parking spaces by itself when its cash allows. Or buy a bigger depot now on your company's page."
  nl: "Het bedrijf bouwt zelf meer parkeerplaatsen zodra het geld het toelaat. Of koop nu een grotere remise op de pagina van je bedrijf."
  de: "Das Unternehmen baut selbst mehr Stellplätze, sobald das Geld reicht. Oder kauf jetzt einen größeren Betriebshof auf der Seite deines Unternehmens."
  fr: "L'entreprise construit seule plus de places dès que sa trésorerie le permet. Ou achetez maintenant un dépôt plus grand sur la page de votre entreprise."
  ru: "Компания сама построит больше стоянок, когда позволят деньги. Или купите депо побольше сейчас на странице своей компании."
  uk: "Компанія сама збудує більше стоянок, коли дозволять гроші. Або купіть більше депо зараз на сторінці своєї компанії."
  pl: "Firma sama zbuduje więcej miejsc postojowych, gdy pozwolą pieniądze. Albo kup teraz większą zajezdnię na stronie swojej firmy."

