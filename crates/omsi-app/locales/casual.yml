"Want more control? Normal opens every page: planning, workshop, tenders. Nothing of your company is lost.":
  en: "Want more control? Normal opens every page: planning, workshop, tenders. Nothing of your company is lost."
  nl: "Meer zelf regelen? Normaal opent elke pagina: planning, werkplaats, aanbestedingen. Er gaat niets van je bedrijf verloren."
  de: "Mehr selbst steuern? Normal öffnet jede Seite: Planung, Werkstatt, Ausschreibungen. Von deinem Unternehmen geht nichts verloren."
  fr: "Envie de plus de contrôle ? Normal ouvre toutes les pages : planification, atelier, appels d'offres. Rien de votre entreprise n'est perdu."
