"Every half hour in the rush hours, every hour otherwise. Few buses, low costs.":
  en: "Every half hour in the rush hours, every hour otherwise. Few buses, low costs."
  nl: "Elk halfuur in de spits, anders elk uur. Weinig bussen, lage kosten."
  de: "Halbstündlich im Berufsverkehr, sonst stündlich. Wenige Busse, geringe Kosten."
  fr: "Toutes les demi-heures aux heures de pointe, toutes les heures sinon. Peu de bus, peu de frais."
  ru: "Каждые полчаса в час пик, в остальное время раз в час. Мало автобусов, низкие расходы."
  uk: "Щопівгодини в години пік, решту часу щогодини. Мало автобусів, низькі витрати."
  pl: "Co pół godziny w szczycie, poza nim co godzinę. Mało autobusów, niskie koszty."
"Every 15 minutes in the rush hours, every 20 to 30 otherwise.":
  en: "Every 15 minutes in the rush hours, every 20 to 30 otherwise."
  nl: "Elk kwartier in de spits, anders elke 20 tot 30 minuten."
  de: "Alle 15 Minuten im Berufsverkehr, sonst alle 20 bis 30."
  fr: "Toutes les 15 minutes aux heures de pointe, toutes les 20 à 30 sinon."
  ru: "Каждые 15 минут в час пик, в остальное время каждые 20–30."
  uk: "Кожні 15 хвилин у години пік, решту часу кожні 20–30."
  pl: "Co 15 minut w szczycie, poza nim co 20–30."
"Every 10 minutes in the rush hours, every 15 otherwise. Many passengers, many buses.":
  en: "Every 10 minutes in the rush hours, every 15 otherwise. Many passengers, many buses."
  nl: "Elke 10 minuten in de spits, anders elk kwartier. Veel reizigers, veel bussen."
  de: "Alle 10 Minuten im Berufsverkehr, sonst alle 15. Viele Fahrgäste, viele Busse."
  fr: "Toutes les 10 minutes aux heures de pointe, toutes les 15 sinon. Beaucoup de voyageurs, beaucoup de bus."
  ru: "Каждые 10 минут в час пик, в остальное время каждые 15. Много пассажиров, много автобусов."
  uk: "Кожні 10 хвилин у години пік, решту часу кожні 15. Багато пасажирів, багато автобусів."
  pl: "Co 10 minut w szczycie, poza nim co 15. Dużo pasażerów, dużo autobusów."

# --- the drivers ----------------------------------------------------------------------------------
"You have the drivers your shifts need: the company hires more by itself when a line asks for them.":
  en: "You have the drivers your shifts need: the company hires more by itself when a line asks for them."
  nl: "Je hebt de chauffeurs die je diensten nodig hebben: het bedrijf neemt er zelf meer aan als een lijn erom vraagt."
  de: "Du hast die Fahrer, die deine Schichten brauchen: das Unternehmen stellt selbst mehr ein, wenn eine Linie sie braucht."
  fr: "Vous avez les conducteurs qu'il faut à vos services : l'entreprise en embauche d'autres seule quand une ligne en demande."
  ru: "У вас есть водители для всех смен: компания сама наймёт больше, когда линии понадобится."
  uk: "У вас є водії для всіх змін: компанія сама найме більше, коли лінії знадобиться."
  pl: "Masz kierowców, których potrzebują twoje zmiany: firma sama zatrudni więcej, gdy linia ich potrzebuje."
"Nobody could be hired now: no applicant this week, or the cash is short. The company tries again tonight.":
  en: "Nobody could be hired now: no applicant this week, or the cash is short. The company tries again tonight."
  nl: "Er kon nu niemand worden aangenomen: geen sollicitant deze week, of te weinig geld. Het bedrijf probeert het vannacht opnieuw."
  de: "Gerade konnte niemand eingestellt werden: diese Woche kein Bewerber, oder das Geld reicht nicht. Das Unternehmen versucht es heute Nacht wieder."
  fr: "Personne n'a pu être embauché : pas de candidat cette semaine, ou pas assez d'argent. L'entreprise réessaie cette nuit."
  ru: "Никого нанять не удалось: на этой неделе нет кандидатов или не хватает денег. Компания попробует снова ночью."
  uk: "Нікого найняти не вдалося: цього тижня немає кандидатів або бракує грошей. Компанія спробує знову вночі."
  pl: "Nie udało się nikogo zatrudnić: brak kandydatów w tym tygodniu albo brak pieniędzy. Firma spróbuje znowu w nocy."
