_version: 2
# The line editor on the map's own lines: listed apart, opened and edited as an own line,
# saved in the original's place and restored: the English text is the key, as in app.yml.
"Lines of the map":
  de: "Linien der Karte"
  fr: "Lignes de la carte"
  nl: "Lijnen van de kaart"
  pl: "Linie mapy"
  ru: "Линии карты"
  uk: "Лінії мапи"
"edited":
  de: "bearbeitet"
  fr: "modifiée"
  nl: "bewerkt"
  pl: "zmieniona"
  ru: "изменена"
  uk: "змінена"
"%{n} m · as the map drives it":
  de: "%{n} m · wie auf der Karte"
  fr: "%{n} m · comme sur la carte"
  nl: "%{n} m · zoals op de kaart"
  pl: "%{n} m · tak jak na mapie"
  ru: "%{n} м · как на карте"
  uk: "%{n} м · як на мапі"
"The table holds the map's departures, each in the tour the map runs it in: change them there. A change to the patterns below makes that group of days anew from them.":
  de: "Die Tabelle enthält die Abfahrten der Karte, jede in dem Umlauf, in dem die Karte sie fährt: dort änderst du sie. Eine Änderung an den Mustern unten erstellt diese Tagesgruppe neu aus ihnen."
  fr: "Le tableau contient les départs de la carte, chacun dans le service où la carte le fait rouler : modifie-les là. Une modification des modèles ci-dessous refait ce groupe de jours à partir d'eux."
  nl: "De tabel bevat de vertrektijden van de kaart, elk in de omloop waarin de kaart hem rijdt: wijzig ze daar. Een wijziging in de patronen hieronder maakt die groep dagen opnieuw uit de patronen."
  pl: "Tabela zawiera odjazdy z mapy, każdy w obiegu, w którym jeździ na mapie: zmieniaj je tam. Zmiana wzorców poniżej tworzy tę grupę dni od nowa na ich podstawie."
  ru: "В таблице — отправления карты, каждое в том выпуске, в котором его выполняет карта: меняйте их там. Изменение шаблонов ниже создаёт эту группу дней заново по ним."
  uk: "У таблиці — відправлення мапи, кожне в тому випуску, у якому його виконує мапа: змінюйте їх там. Зміна шаблонів нижче створює цю групу днів наново за ними."
"Reading the map's roads: the line opens in a moment":
  de: "Die Straßen der Karte werden gelesen: die Linie öffnet sich gleich"
  fr: "Lecture des routes de la carte : la ligne s'ouvre dans un instant"
  nl: "De wegen van de kaart worden gelezen: de lijn gaat zo open"
  pl: "Wczytywanie dróg mapy: linia zaraz się otworzy"
  ru: "Читаются дороги карты: линия сейчас откроется"
  uk: "Читаються дороги мапи: лінія зараз відкриється"
"Line %{n} of the map runs no trip the timetable has: it cannot be opened":
  de: "Linie %{n} der Karte fährt keine Fahrt, die der Fahrplan kennt: sie lässt sich nicht öffnen"
  fr: "La ligne %{n} de la carte ne fait aucun trajet que l'horaire connaît : elle ne peut pas être ouverte"
  nl: "Lijn %{n} van de kaart rijdt geen rit die de dienstregeling kent: hij kan niet worden geopend"
  pl: "Linia %{n} mapy nie ma żadnego kursu znanego rozkładowi: nie można jej otworzyć"
  ru: "Линия %{n} карты не выполняет ни одного рейса из расписания: её нельзя открыть"
  uk: "Лінія %{n} мапи не виконує жодного рейсу з розкладу: її не можна відкрити"
"Line %{n} of the map is open: change it as one of your own. Saved, the game drives it instead of the map's original.":
  de: "Linie %{n} der Karte ist geöffnet: ändere sie wie eine eigene. Gespeichert fährt das Spiel sie statt des Originals der Karte."
  fr: "La ligne %{n} de la carte est ouverte : modifie-la comme une des tiennes. Enregistrée, le jeu la fait rouler à la place de l'originale de la carte."
  nl: "Lijn %{n} van de kaart is geopend: wijzig hem als een eigen lijn. Opgeslagen rijdt het spel hem in plaats van het origineel van de kaart."
  pl: "Linia %{n} mapy jest otwarta: zmieniaj ją jak własną. Po zapisaniu gra jeździ nią zamiast oryginału mapy."
  ru: "Линия %{n} карты открыта: меняйте её как свою. После сохранения игра ездит по ней вместо оригинала карты."
  uk: "Лінію %{n} мапи відкрито: змінюйте її як свою. Після збереження гра їздить нею замість оригіналу мапи."
"%{n} leg(s) the map has no way for are routed over the roads.":
  de: "%{n} Abschnitt(e), für die die Karte keinen Weg hat, sind über die Straßen geführt."
  fr: "%{n} tronçon(s) sans chemin dans la carte passent par les routes."
  nl: "%{n} traject(en) waarvoor de kaart geen weg heeft, lopen nu over de wegen."
  pl: "%{n} odcinek(ów), dla których mapa nie ma drogi, poprowadzono po drogach."
  ru: "Участков без пути на карте, проложенных по дорогам: %{n}."
  uk: "Ділянок без шляху на мапі, прокладених дорогами: %{n}."
"%{n} of its trips could not be taken: they have fewer than two stops the timetable knows.":
  de: "%{n} ihrer Fahrten ließen sich nicht übernehmen: sie haben weniger als zwei Haltestellen, die der Fahrplan kennt."
  fr: "%{n} de ses trajets n'ont pas pu être repris : ils ont moins de deux arrêts que l'horaire connaît."
  nl: "%{n} van zijn ritten konden niet worden overgenomen: ze hebben minder dan twee haltes die de dienstregeling kent."
  pl: "Nie udało się przejąć %{n} jej kursów: mają mniej niż dwa przystanki znane rozkładowi."
  ru: "Не удалось взять рейсов: %{n} — у них меньше двух остановок, известных расписанию."
  uk: "Не вдалося взяти рейсів: %{n} — у них менше двох зупинок, відомих розкладу."
"Your edit goes: the game runs the map's own line again, exactly as the map has it":
  de: "Deine Bearbeitung verschwindet: das Spiel fährt wieder die Linie der Karte, genau so, wie die Karte sie hat"
  fr: "Ta modification disparaît : le jeu refait rouler la ligne de la carte, exactement comme la carte l'a"
  nl: "Je bewerking verdwijnt: het spel rijdt weer de eigen lijn van de kaart, precies zoals de kaart hem heeft"
  pl: "Twoja zmiana znika: gra znów jeździ linią mapy, dokładnie taką, jaką ma mapa"
  ru: "Ваши изменения исчезнут: игра снова ездит по линии карты точно так, как она есть на карте"
  uk: "Ваші зміни зникнуть: гра знову їздить лінією мапи точно так, як вона є на мапі"
"Variant %{n}":
  de: "Variante %{n}"
  fr: "Variante %{n}"
  nl: "Variant %{n}"
  pl: "Wariant %{n}"
  ru: "Вариант %{n}"
  uk: "Варіант %{n}"
"Restore the map's original":
  de: "Original der Karte wiederherstellen"
  fr: "Rétablir l'originale de la carte"
  nl: "Origineel van de kaart terugzetten"
  pl: "Przywróć oryginał mapy"
  ru: "Вернуть оригинал карты"
  uk: "Повернути оригінал мапи"
"Press again: the map's original back":
  de: "Noch einmal: das Original der Karte zurück"
  fr: "Encore une fois : l'originale de la carte revient"
  nl: "Nog eens: het origineel van de kaart terug"
  pl: "Jeszcze raz: oryginał mapy wraca"
  ru: "Ещё раз: вернуть оригинал карты"
  uk: "Ще раз: повернути оригінал мапи"
"Press again: the edit goes and the game runs the map's own line as before":
  de: "Noch einmal drücken: die Bearbeitung verschwindet und das Spiel fährt die Linie der Karte wie zuvor"
  fr: "Appuie encore : la modification disparaît et le jeu fait rouler la ligne de la carte comme avant"
  nl: "Druk nog eens: de bewerking verdwijnt en het spel rijdt de eigen lijn van de kaart weer zoals eerst"
  pl: "Naciśnij jeszcze raz: zmiana znika, a gra jeździ linią mapy jak wcześniej"
  ru: "Нажмите ещё раз: изменения исчезнут, и игра будет ездить по линии карты как раньше"
  uk: "Натисніть ще раз: зміни зникнуть, і гра їздитиме лінією мапи як раніше"
"Line %{n} saved: the game drives it instead of the map's original (the next game start picks it up)":
  de: "Linie %{n} gespeichert: das Spiel fährt sie statt des Originals der Karte (der nächste Spielstart übernimmt sie)"
  fr: "Ligne %{n} enregistrée : le jeu la fait rouler à la place de l'originale de la carte (le prochain lancement du jeu la prend)"
  nl: "Lijn %{n} opgeslagen: het spel rijdt hem in plaats van het origineel van de kaart (de volgende start van het spel neemt hem mee)"
  pl: "Linia %{n} zapisana: gra jeździ nią zamiast oryginału mapy (następne uruchomienie gry ją uwzględni)"
  ru: "Линия %{n} сохранена: игра ездит по ней вместо оригинала карты (её подхватит следующий запуск игры)"
  uk: "Лінію %{n} збережено: гра їздить нею замість оригіналу мапи (її підхопить наступний запуск гри)"
"Not restored":
  de: "Nicht wiederhergestellt"
  fr: "Non rétablie"
  nl: "Niet teruggezet"
  pl: "Nie przywrócono"
  ru: "Не возвращено"
  uk: "Не повернуто"
"Taken out of your lines, but there is no content folder to put the map's line back into":
  de: "Aus deinen Linien genommen, aber es gibt keinen Inhaltsordner, in den die Linie der Karte zurückgelegt werden kann"
  fr: "Retirée de tes lignes, mais il n'y a pas de dossier de contenu où remettre la ligne de la carte"
  nl: "Uit je lijnen gehaald, maar er is geen inhoudsmap om de lijn van de kaart in terug te zetten"
  pl: "Usunięto z twoich linii, ale nie ma folderu zawartości, do którego można przywrócić linię mapy"
  ru: "Убрано из ваших линий, но нет папки контента, куда вернуть линию карты"
  uk: "Прибрано з ваших ліній, але немає теки вмісту, куди повернути лінію мапи"
"Line %{n} is the map's own again: the game runs its original as before":
  de: "Linie %{n} gehört wieder der Karte: das Spiel fährt ihr Original wie zuvor"
  fr: "La ligne %{n} est de nouveau celle de la carte : le jeu fait rouler l'originale comme avant"
  nl: "Lijn %{n} is weer van de kaart: het spel rijdt het origineel zoals eerst"
  pl: "Linia %{n} znów należy do mapy: gra jeździ jej oryginałem jak wcześniej"
  ru: "Линия %{n} снова карты: игра ездит по оригиналу как раньше"
  uk: "Лінія %{n} знову мапи: гра їздить оригіналом як раніше"
"Edit the line in the line editor: its route, timetable and displays":
  de: "Die Linie im Linieneditor bearbeiten: ihren Weg, ihren Fahrplan und ihre Anzeigen"
  fr: "Modifier la ligne dans l'éditeur de lignes : son parcours, son horaire et ses afficheurs"
  nl: "De lijn bewerken in de lijneditor: zijn route, dienstregeling en displays"
  pl: "Edytuj linię w edytorze linii: jej trasę, rozkład i wyświetlacze"
  ru: "Изменить линию в редакторе линий: маршрут, расписание и табло"
  uk: "Змінити лінію в редакторі ліній: маршрут, розклад і табло"
# The way back made by the program from the outbound (Automatic) or clicked by the player
# (Manual), and a stop clicked again on the map taken out of the direction (Shift+click: in
# again).
"Automatic: the program makes it":
  de: "Automatisch: das Programm legt ihn an"
  fr: "Automatique : le programme le crée"
  nl: "Automatisch: het programma maakt hem"
  pl: "Automatycznie: program ją tworzy"
  ru: "Автоматически: его строит программа"
  uk: "Автоматично: його будує програма"
"Manual: click its stops yourself":
  de: "Manuell: seine Haltestellen selbst anklicken"
  fr: "Manuel : cliquez vous-même ses arrêts"
  nl: "Handmatig: klik zelf de haltes aan"
  pl: "Ręcznie: sam klikasz jej przystanki"
  ru: "Вручную: щёлкайте его остановки сами"
  uk: "Вручну: клацайте його зупинки самі"
"The program makes the way back from the outbound: its stops the other way round, each the stop across the road, and again whenever they change.":
  de: "Das Programm legt den Rückweg aus dem Hinweg an: seine Haltestellen in umgekehrter Reihenfolge, jeweils die Haltestelle gegenüber – und wieder neu, sobald sie sich ändern."
  fr: "Le programme crée le retour à partir de l'aller : ses arrêts dans l'autre sens, chacun remplacé par l'arrêt d'en face, et de nouveau dès qu'ils changent."
  nl: "Het programma maakt de terugweg van de heenweg: de haltes in omgekeerde volgorde, elk de halte aan de overkant, en opnieuw zodra die veranderen."
  pl: "Program tworzy drogę powrotną z kierunku tam: przystanki w odwrotnej kolejności, każdy zastąpiony przystankiem po drugiej stronie, i tworzy ją od nowa przy każdej ich zmianie."
  ru: "Программа строит обратный путь из направления туда: остановки в обратном порядке, каждая — остановка через дорогу, и строит его заново при каждом их изменении."
  uk: "Програма будує зворотний шлях із напрямку туди: зупинки у зворотному порядку, кожна — зупинка через дорогу, і будує його заново щоразу, коли вони змінюються."
"You click the stops of the way back on the map, as the outbound's.":
  de: "Du klickst die Haltestellen des Rückwegs selbst auf der Karte an, wie die des Hinwegs."
  fr: "Vous cliquez vous-même les arrêts du retour sur la carte, comme ceux de l'aller."
  nl: "Je klikt de haltes van de terugweg zelf aan op de kaart, zoals die van de heenweg."
  pl: "Sam klikasz przystanki drogi powrotnej na mapie, tak jak kierunku tam."
  ru: "Вы сами щёлкаете остановки обратного пути на карте, как и для направления туда."
  uk: "Ви самі клацаєте зупинки зворотного шляху на мапі, як і для напрямку туди."
"Click a stop on the map to put it in, and again to take it out. Shift+click puts in a stop the line has already, as a loop needs.":
  de: "Klicke eine Haltestelle auf der Karte an, um sie aufzunehmen, und noch einmal, um sie wieder herauszunehmen. Umschalt+Klick nimmt eine Haltestelle auf, die die Linie schon hat, wie eine Schleife es braucht."
  fr: "Cliquez un arrêt sur la carte pour l'ajouter, et encore une fois pour le retirer. Maj+clic ajoute un arrêt que la ligne a déjà, comme il le faut pour une boucle."
  nl: "Klik een halte op de kaart aan om hem toe te voegen, en nog eens om hem eruit te halen. Shift+klik voegt een halte toe die de lijn al heeft, zoals een lus nodig heeft."
  pl: "Kliknij przystanek na mapie, aby go dodać, i jeszcze raz, aby go usunąć. Shift+klik dodaje przystanek, który linia już ma, jak w przypadku pętli."
  ru: "Щёлкните остановку на карте, чтобы добавить её, и ещё раз, чтобы убрать. Shift+щелчок добавляет остановку, которая уже есть в линии, — так нужно для кольца."
  uk: "Клацніть зупинку на мапі, щоб додати її, і ще раз, щоб прибрати. Shift+клацання додає зупинку, яка вже є в лінії, — так потрібно для кільця."
"Press Automatic again: the way back you made goes, and the program makes it from the outbound":
  de: "Noch einmal „Automatisch“ drücken: Dein Rückweg geht verloren, und das Programm legt ihn aus dem Hinweg an"
  fr: "Appuyez encore sur « Automatique » : le retour que vous avez fait disparaît et le programme le crée à partir de l'aller"
  nl: "Druk nog eens op Automatisch: de terugweg die je maakte verdwijnt, en het programma maakt hem van de heenweg"
  pl: "Naciśnij ponownie „Automatycznie”: Twoja droga powrotna zniknie, a program utworzy ją z kierunku tam"
  ru: "Нажмите «Автоматически» ещё раз: ваш обратный путь пропадёт, и программа построит его из направления туда"
  uk: "Натисніть «Автоматично» ще раз: ваш зворотний шлях зникне, і програма побудує його з напрямку туди"
"The way back follows the outbound: give the outbound its stops, and it is made from them":
  de: "Der Rückweg folgt dem Hinweg: Gib dem Hinweg seine Haltestellen, dann wird er daraus angelegt"
  fr: "Le retour suit l'aller : donnez ses arrêts à l'aller, et il sera créé à partir d'eux"
  nl: "De terugweg volgt de heenweg: geef de heenweg zijn haltes, dan wordt hij daaruit gemaakt"
  pl: "Droga powrotna podąża za kierunkiem tam: dodaj przystanki kierunku tam, a zostanie z nich utworzona"
  ru: "Обратный путь следует за направлением туда: задайте остановки направления туда, и он будет построен из них"
  uk: "Зворотний шлях іде за напрямком туди: задайте зупинки напрямку туди, і його буде побудовано з них"
"The program makes the way back from the outbound now, and makes it again whenever the outbound's stops change":
  de: "Das Programm legt den Rückweg jetzt aus dem Hinweg an, und wieder neu, sobald sich dessen Haltestellen ändern"
  fr: "Le programme crée maintenant le retour à partir de l'aller, et le recrée dès que les arrêts de l'aller changent"
  nl: "Het programma maakt de terugweg nu van de heenweg, en opnieuw zodra de haltes van de heenweg veranderen"
  pl: "Program tworzy teraz drogę powrotną z kierunku tam i tworzy ją od nowa, gdy zmienią się przystanki kierunku tam"
  ru: "Теперь программа строит обратный путь из направления туда и строит его заново при каждом изменении его остановок"
  uk: "Тепер програма будує зворотний шлях із напрямку туди й будує його заново щоразу, коли змінюються його зупинки"
"The way back is yours now: click stops on the map to put them in or take them out":
  de: "Der Rückweg gehört jetzt dir: Klicke Haltestellen auf der Karte an, um sie aufzunehmen oder herauszunehmen"
  fr: "Le retour est à vous maintenant : cliquez des arrêts sur la carte pour les ajouter ou les retirer"
  nl: "De terugweg is nu van jou: klik haltes op de kaart aan om ze toe te voegen of eruit te halen"
  pl: "Droga powrotna jest teraz Twoja: klikaj przystanki na mapie, aby je dodać lub usunąć"
  ru: "Теперь обратный путь ваш: щёлкайте остановки на карте, чтобы добавить или убрать их"
  uk: "Тепер зворотний шлях ваш: клацайте зупинки на мапі, щоб додати чи прибрати їх"
"Click the stops of the way back on the map, in the order the bus calls at them":
  de: "Klicke die Haltestellen des Rückwegs auf der Karte an, in der Reihenfolge, in der der Bus sie anfährt"
  fr: "Cliquez les arrêts du retour sur la carte, dans l'ordre où le bus les dessert"
  nl: "Klik de haltes van de terugweg aan op de kaart, in de volgorde waarin de bus ze aandoet"
  pl: "Klikaj przystanki drogi powrotnej na mapie w kolejności, w jakiej obsługuje je autobus"
  ru: "Щёлкайте остановки обратного пути на карте в том порядке, в каком их проходит автобус"
  uk: "Клацайте зупинки зворотного шляху на мапі в тому порядку, в якому їх проходить автобус"
"The way back is set by hand now: it no longer follows the outbound":
  de: "Der Rückweg ist jetzt von Hand angelegt: Er folgt dem Hinweg nicht mehr"
  fr: "Le retour est maintenant fait à la main : il ne suit plus l'aller"
  nl: "De terugweg is nu met de hand gemaakt: hij volgt de heenweg niet meer"
  pl: "Droga powrotna jest teraz ustawiana ręcznie: nie podąża już za kierunkiem tam"
  ru: "Теперь обратный путь задаётся вручную: он больше не следует за направлением туда"
  uk: "Тепер зворотний шлях задається вручну: він більше не йде за напрямком туди"
"Give the outbound its stops: the way back is made from them":
  de: "Gib dem Hinweg seine Haltestellen: Der Rückweg wird daraus angelegt"
  fr: "Donnez ses arrêts à l'aller : le retour est créé à partir d'eux"
  nl: "Geef de heenweg zijn haltes: de terugweg wordt daaruit gemaakt"
  pl: "Dodaj przystanki kierunku tam: droga powrotna powstanie z nich"
  ru: "Задайте остановки направления туда: обратный путь строится из них"
  uk: "Задайте зупинки напрямку туди: зворотний шлях будується з них"
"Across the road from %{name}: a name like it":
  de: "Gegenüber von %{name}: ein ähnlicher Name"
  fr: "En face de %{name} : un nom semblable"
  nl: "Aan de overkant van %{name}: een naam die erop lijkt"
  pl: "Naprzeciw %{name}: podobna nazwa"
  ru: "Напротив %{name}: похожее название"
  uk: "Навпроти %{name}: схожа назва"
"No stop across the road: the bus calls at this one both ways":
  de: "Keine Haltestelle gegenüber: Der Bus hält in beide Richtungen hier"
  fr: "Pas d'arrêt en face : le bus dessert celui-ci dans les deux sens"
  nl: "Geen halte aan de overkant: de bus doet deze in beide richtingen aan"
