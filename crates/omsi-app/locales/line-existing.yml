  nl: "%{n} deel/delen hebben geen weg over de wegen (rood): versleep ze of maak de terugweg met de hand"
  pl: "Odcinki bez drogi (czerwone): %{n}; przeciągnij je lub ustaw drogę powrotną ręcznie"
