_version: 2
# RosterFlow's planning as the day runs it (Trello #95, #96): the roster that follows the saved
# blocks and duties, the trips the day dropped and why, RosterFlow's changes not saved.
"%{n} duties have no driver in the roster: their trips are dropped until they get one (the Roster tab, Fill the roster).":
  de: "%{n} Dienste haben im Dienstplan keinen Fahrer: Ihre Fahrten fallen aus, bis sie einen bekommen (Reiter Dienstplan, Dienstplan füllen)."
  fr: "%{n} services n'ont pas de conducteur dans le roulement : leurs courses sont supprimées jusqu'à ce qu'ils en aient un (onglet Roulement, Remplir le roulement)."
  nl: "%{n} diensten hebben geen chauffeur in het rooster: hun ritten vallen uit tot ze er een krijgen (tabblad Rooster, Rooster vullen)."
  pl: "%{n} służb nie ma kierowcy w grafiku: ich kursy przepadają, dopóki go nie dostaną (karta Grafik, Wypełnij grafik)."
  ru: "У %{n} смен нет водителя в графике: их рейсы отменяются, пока он не будет назначен (вкладка «График», «Заполнить график»)."
  uk: "%{n} змін не мають водія в графіку: їхні рейси скасовуються, доки його не призначено (вкладка «Графік», «Заповнити графік»)."
"RosterFlow had changes of this day that were not saved: the day ran the saved blocks and duties. Save them in RosterFlow (or discard them) so the day runs what it shows.":
  de: "RosterFlow hatte nicht gespeicherte Änderungen für diesen Tag: Der Tag lief mit den gespeicherten Umläufen und Diensten. Speichern (oder verwerfen) Sie sie in RosterFlow, damit der Tag fährt, was es zeigt."
  fr: "RosterFlow avait des modifications de ce jour non enregistrées : la journée a suivi les roulements et services enregistrés. Enregistrez-les (ou abandonnez-les) dans RosterFlow pour que la journée suive ce qu'il affiche."
  nl: "RosterFlow had wijzigingen voor deze dag die niet waren opgeslagen: de dag reed de opgeslagen omlopen en diensten. Sla ze op in RosterFlow (of verwerp ze), zodat de dag rijdt wat het laat zien."
  pl: "RosterFlow miał niezapisane zmiany tego dnia: dzień przebiegł według zapisanych obiegów i służb. Zapisz je w RosterFlow (lub odrzuć), aby dzień przebiegał tak, jak pokazuje."
  ru: "В RosterFlow были несохранённые изменения этого дня: день прошёл по сохранённым оборотам и сменам. Сохраните их в RosterFlow (или отмените), чтобы день шёл так, как он показывает."
  uk: "У RosterFlow були незбережені зміни цього дня: день пройшов за збереженими оборотами та змінами. Збережіть їх у RosterFlow (або скасуйте), щоб день ішов так, як він показує."
