  nl: "In %{mode} telt een verlies ×%{f}; een dag kost hoogstens %{d} punten en een week %{w}. Onder 50 brengen behoorlijke dagen haar elke dag een beetje terug."
  pl: "W trybie %{mode} strata liczy się ×%{f}; dzień kosztuje najwyżej %{d} pkt, tydzień %{w}. Poniżej 50 przyzwoite dni podnoszą ją codziennie trochę."
