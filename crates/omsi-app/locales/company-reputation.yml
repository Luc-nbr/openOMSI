"What it drives: how many ride (about ±10 %), the authority's payment per kilometre (±10 %), your quality in tenders (30 % of the score), what advertisers pay, and the contracts' rating. Below 40, only half of a further loss counts for these.":
  de: "Was er bewirkt: wie viele mitfahren (etwa ±10 %), die Zahlung der Behörde je Kilometer (±10 %), Ihre Qualität bei Ausschreibungen (30 % der Wertung), was Werbekunden zahlen, und die Bewertung der Verträge. Unter 40 zählt für all das nur die Hälfte eines weiteren Verlusts."
  fr: "Ce qu'elle influence : combien de voyageurs montent (environ ±10 %), le paiement de l'autorité par kilomètre (±10 %), votre qualité aux appels d'offres (30 % de la note), ce que paient les annonceurs, et la note des contrats. Sous 40, seule la moitié d'une nouvelle perte compte pour tout cela."
  nl: "Wat ze bepaalt: hoeveel mensen meerijden (ongeveer ±10 %), de vergoeding van de overheid per kilometer (±10 %), je kwaliteit bij aanbestedingen (30 % van de score), wat adverteerders betalen, en de beoordeling bij contracten. Onder 40 telt voor dit alles maar de helft van een verder verlies."
  pl: "Na co wpływa: ilu pasażerów jeździ (około ±10 %), opłata organizatora za kilometr (±10 %), twoja jakość w przetargach (30 % oceny), ile płacą reklamodawcy i ocena kontraktów. Poniżej 40 liczy się tu tylko połowa dalszej straty."
  ru: "На что она влияет: сколько людей ездит (около ±10 %), оплата заказчика за километр (±10 %), ваше качество в тендерах (30 % оценки), сколько платят рекламодатели и рейтинг контрактов. Ниже 40 для всего этого учитывается лишь половина дальнейшей потери."
  uk: "На що вона впливає: скільки людей їздить (близько ±10 %), оплата замовника за кілометр (±10 %), ваша якість у тендерах (30 % оцінки), скільки платять рекламодавці та рейтинг контрактів. Нижче 40 для всього цього рахується лише половина подальшої втрати."
