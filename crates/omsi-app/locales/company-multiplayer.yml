"A friend runs a bus company: join it with their session code, get a role, and drive its duties in your own game.":
  de: "Ein Freund führt einen Busbetrieb: tritt mit seinem Sitzungscode bei, erhalte eine Rolle und fahre seine Dienste in deinem eigenen Spiel."
  fr: "Un ami dirige une entreprise de bus : rejoignez-la avec son code de session, obtenez un rôle et conduisez ses services dans votre propre jeu."
  nl: "Een vriend runt een busbedrijf: doe mee met de sessiecode, krijg een rol en rijd de diensten in je eigen spel."
  pl: "Znajomy prowadzi firmę autobusową: dołącz kodem sesji, otrzymaj rolę i jeździj jej służby we własnej grze."
  ru: "Друг ведёт автобусную компанию: присоединитесь по коду сессии, получите роль и выполняйте её смены в своей игре."
  uk: "Друг керує автобусною компанією: приєднайтеся за кодом сесії, отримайте роль і виконуйте її зміни у власній грі."
"The boss shares the company on its Multiplayer page and sends you the code.":
  de: "Der Chef teilt den Betrieb auf dessen Mehrspieler-Seite und schickt dir den Code."
  fr: "Le patron partage l'entreprise sur sa page Multijoueur et vous envoie le code."
  nl: "De baas deelt het bedrijf op de Multiplayer-pagina en stuurt je de code."
  pl: "Szef udostępnia firmę na jej stronie trybu wieloosobowego i wysyła ci kod."
  ru: "Босс открывает компанию на её странице «Мультиплеер» и отправляет вам код."
  uk: "Бос відкриває компанію на її сторінці «Мультиплеєр» і надсилає вам код."
