  nl: "Geef hier elke speler een rol en diensten: ze rijden ze in hun eigen spel, jouw wereld is niet nodig."
  pl: "Nadaj tu każdemu graczowi rolę i służby: jeżdżą je we własnej grze, twój świat nie jest potrzebny."
  ru: "Дайте здесь каждому игроку роль и смены: они выполняют их в своей игре, ваш мир не нужен."
  uk: "Дайте тут кожному гравцеві роль і зміни: вони виконують їх у власній грі, ваш світ не потрібен."
