"Runs the company with you: money, fleet, staff and planning.":
  de: "Führt den Betrieb mit dir: Geld, Flotte, Personal und Planung."
  fr: "Dirige l'entreprise avec vous : argent, flotte, personnel et planification."
  nl: "Runt het bedrijf met je: geld, vloot, personeel en planning."
  pl: "Prowadzi firmę razem z tobą: pieniądze, flota, personel i planowanie."
  ru: "Управляет компанией вместе с вами: деньги, парк, персонал и планирование."
  uk: "Керує компанією разом із вами: гроші, парк, персонал і планування."
