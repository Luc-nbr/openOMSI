"Not shared: the players keep their roles, but cannot reach you.":
  de: "Nicht geteilt: die Spieler behalten ihre Rollen, erreichen dich aber nicht."
  fr: "Non partagé : les joueurs gardent leurs rôles, mais ne peuvent pas vous joindre."
  nl: "Niet gedeeld: de spelers houden hun rol, maar kunnen je niet bereiken."
  pl: "Nieudostępniona: gracze zachowują role, ale nie mogą się z tobą połączyć."
  ru: "Не открыта: игроки сохраняют роли, но не могут к вам подключиться."
  uk: "Не відкрито: гравці зберігають ролі, але не можуть до вас підключитися."
"Nothing planned for you. Ask for an open duty, or wait for the boss to give you one.":
  de: "Für dich ist nichts geplant. Frag nach einem offenen Dienst oder warte, bis der Chef dir einen gibt."
  fr: "Rien de prévu pour vous. Demandez un service libre, ou attendez que le patron vous en donne un."
  nl: "Er staat niets voor je gepland. Vraag een open dienst aan, of wacht tot de baas je er een geeft."
  pl: "Nic dla ciebie nie zaplanowano. Poproś o wolną służbę albo poczekaj, aż szef ją przydzieli."
  ru: "Для вас ничего не запланировано. Запросите свободную смену или дождитесь, пока босс её выдаст."
  uk: "Для вас нічого не заплановано. Запитайте вільну зміну або зачекайте, поки бос її видасть."
"Off: they ask for a duty, and you (or a player who may approve) say yes or no.":
  de: "Aus: sie fragen nach einem Dienst, und du (oder ein Spieler, der genehmigen darf) sagst ja oder nein."
  fr: "Désactivé : ils demandent un service, et vous (ou un joueur autorisé) dites oui ou non."
  nl: "Uit: ze vragen een dienst aan, en jij (of een speler die mag goedkeuren) zegt ja of nee."
  pl: "Wyłączone: proszą o służbę, a ty (lub gracz z prawem zatwierdzania) mówisz tak albo nie."
  ru: "Выкл.: они запрашивают смену, а вы (или игрок с правом одобрения) отвечаете да или нет."
  uk: "Вимк.: вони запитують зміну, а ви (або гравець із правом схвалення) кажете так чи ні."
"Only the boss can do this, on his own launcher.":
  de: "Das kann nur der Chef, in seinem eigenen Launcher."
  fr: "Seul le patron peut faire cela, dans son propre lanceur."
  nl: "Alleen de baas kan dit, in zijn eigen launcher."
  pl: "Tylko szef może to zrobić, we własnym launcherze."
  ru: "Это может сделать только босс, в своём лаунчере."
  uk: "Це може зробити лише бос, у власному лаунчері."
