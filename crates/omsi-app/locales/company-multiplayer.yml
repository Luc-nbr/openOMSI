"A friend runs a bus company. Paste the session code they sent you: you get a role in their company and drive its duties in your own game, at your own pace.":
  de: "Ein Freund führt einen Busbetrieb. Füge den Sitzungscode ein, den du bekommen hast: Du erhältst eine Rolle im Betrieb und fährst seine Dienste in deinem eigenen Spiel, in deinem eigenen Tempo."
  fr: "Un ami dirige une entreprise de bus. Collez le code de session reçu : vous obtenez un rôle dans son entreprise et conduisez ses services dans votre propre jeu, à votre rythme."
  nl: "Een vriend runt een busbedrijf. Plak de sessiecode die je kreeg: je krijgt een rol in het bedrijf en rijdt de diensten in je eigen spel, in je eigen tempo."
  pl: "Znajomy prowadzi firmę autobusową. Wklej otrzymany kod sesji: dostaniesz rolę w firmie i będziesz jeździć jej służby we własnej grze, we własnym tempie."
  ru: "Друг ведёт автобусную компанию. Вставьте полученный код сессии: вы получите роль в компании и будете выполнять её смены в своей игре, в своём темпе."
  uk: "Друг керує автобусною компанією. Вставте отриманий код сесії: ви отримаєте роль у компанії й виконуватимете її зміни у власній грі, у своєму темпі."
