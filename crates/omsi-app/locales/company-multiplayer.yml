"Remove from the company: they cannot join again until you let them back in.":
  de: "Aus dem Betrieb entfernen: erst wenn du es wieder erlaubst, kann die Person erneut beitreten."
  fr: "Retirer de l'entreprise : impossible de rejoindre à nouveau tant que vous ne le permettez pas."
  nl: "Uit het bedrijf verwijderen: pas als jij het weer toestaat kan de speler opnieuw meedoen."
  pl: "Usuń z firmy: nie dołączy ponownie, dopóki na to nie pozwolisz."
  ru: "Удалить из компании: не сможет снова присоединиться, пока вы не разрешите."
  uk: "Видалити з компанії: не зможе знову приєднатися, доки ви не дозволите."
