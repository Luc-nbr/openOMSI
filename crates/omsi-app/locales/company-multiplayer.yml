"Send away from this session: they can join again with a new code.":
  de: "Aus dieser Sitzung schicken: mit einem neuen Code ist ein erneuter Beitritt möglich."
  fr: "Renvoyer de cette session : un nouveau code permet de rejoindre à nouveau."
  nl: "Uit deze sessie sturen: met een nieuwe code kan de speler weer meedoen."
  pl: "Wyproś z tej sesji: z nowym kodem można dołączyć ponownie."
