  uk: "Вилучено з цієї сесії"
"Share your company with friends: they join with a session code, you give each a role, and they drive the duties you give them - or ask for - in their own game, at their own pace. Everything they drive is your company's: its fares, its fines, its figures.":
  de: "Teile deinen Betrieb mit Freunden: Sie treten mit einem Sitzungscode bei, du gibst jedem eine Rolle, und sie fahren die Dienste, die du ihnen gibst - oder die sie anfragen - in ihrem eigenen Spiel, in ihrem eigenen Tempo. Alles, was sie fahren, gehört deinem Betrieb: die Fahrgeldeinnahmen, die Bußgelder, die Zahlen."
  fr: "Partagez votre entreprise avec des amis : ils rejoignent avec un code de session, vous donnez un rôle à chacun, et ils conduisent les services que vous leur donnez - ou qu'ils demandent - dans leur propre jeu, à leur rythme. Tout ce qu'ils conduisent revient à votre entreprise : recettes, amendes, chiffres."
  nl: "Deel je bedrijf met vrienden: ze doen mee met een sessiecode, jij geeft elk een rol, en ze rijden de diensten die jij ze geeft - of die ze aanvragen - in hun eigen spel, in hun eigen tempo. Alles wat ze rijden is van jouw bedrijf: de ritopbrengst, de boetes, de cijfers."
  pl: "Udostępnij firmę znajomym: dołączają kodem sesji, każdemu nadajesz rolę, a oni jeżdżą przydzielone - lub wyproszone - służby we własnej grze, we własnym tempie. Wszystko, co przejadą, należy do twojej firmy: wpływy z biletów, mandaty, wyniki."
  ru: "Поделитесь компанией с друзьями: они присоединяются по коду сессии, вы даёте каждому роль, а они выполняют выданные - или запрошенные - смены в своей игре, в своём темпе. Всё, что они проедут, принадлежит вашей компании: выручка, штрафы, показатели."
  uk: "Поділіться компанією з друзями: вони приєднуються за кодом сесії, ви даєте кожному роль, а вони виконують видані - або запитані - зміни у власній грі, у своєму темпі. Усе, що вони проїдуть, належить вашій компанії: виручка, штрафи, показники."
