"Plans lines, blocks, duties and the roster, gives duties to players and runs the day's service.":
  de: "Plant Linien, Umläufe, Dienste und den Dienstplan, vergibt Dienste an Spieler und leitet den Betrieb des Tages."
  fr: "Planifie lignes, roulements, services et tableau, donne des services aux joueurs et régule l'exploitation du jour."
  nl: "Plant lijnen, omlopen, diensten en het rooster, geeft spelers diensten en regelt de dienst van de dag."
  pl: "Planuje linie, obiegi, służby i grafik, przydziela służby graczom i prowadzi dyspozyturę dnia."
  ru: "Планирует линии, обороты, смены и график, выдаёт смены игрокам и ведёт диспетчерскую дня."
  uk: "Планує лінії, обороти, зміни й графік, видає зміни гравцям і веде диспетчерську дня."
