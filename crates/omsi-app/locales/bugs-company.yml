"%{n} things fell out this morning: drivers ill or late, buses that did not start. Choose how to cover each, or leave it to the central.":
  de: "Heute Morgen ist %{n}-mal etwas ausgefallen: kranke oder verspätete Fahrer, Busse, die nicht angesprungen sind. Wählen Sie, wie Sie es jeweils abdecken, oder überlassen Sie es der Leitstelle."
  fr: "%{n} choses ont manqué ce matin : chauffeurs malades ou en retard, bus qui n'ont pas démarré. Choisissez comment couvrir chacune, ou laissez faire la centrale."
  nl: "Vanmorgen vielen %{n} dingen uit: zieke of te late chauffeurs, bussen die niet startten. Kies hoe je elk opvangt, of laat het aan de centrale."
  pl: "Dziś rano wypadło %{n} rzeczy: chorzy lub spóźnieni kierowcy, autobusy, które nie zapaliły. Wybierz, jak obsadzić każdą, albo zostaw to centrali."
  ru: "Этим утром выпало %{n}: больные или опоздавшие водители, автобусы, которые не завелись. Выберите, как закрыть каждое, или оставьте это диспетчерскому центру."
  uk: "Цього ранку випало %{n}: хворі чи запізнілі водії, автобуси, що не завелися. Виберіть, як закрити кожне, або залиште це диспетчерському центру."
