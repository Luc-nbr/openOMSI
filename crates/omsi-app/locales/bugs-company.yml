  nl: "Reservebus %{spare} neemt vanaf %{time} de ritten van bus %{bus} op lijn %{n} over"
  pl: "Autobus rezerwowy %{spare} przejmuje od %{time} kursy autobusu %{bus} na linii %{n}"
  ru: "Резервный автобус %{spare} с %{time} берёт рейсы автобуса %{bus} на линии %{n}"
  uk: "Резервний автобус %{spare} з %{time} бере рейси автобуса %{bus} на лінії %{n}"
