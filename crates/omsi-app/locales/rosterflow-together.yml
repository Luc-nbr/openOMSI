_version: 2
# RosterFlow in company multiplayer (Luc 2026-10-15: "RosterFlow in multiplayer must work
# completely ... when one does something, it must be visible to the other immediately"): who
# changed what, an undo begun anew, a day changed meanwhile, a player's planning seen read-only.
"Somebody else changed the blocks and duties: your Undo begins again from here.":
  de: "Jemand anderes hat die Umläufe und Dienste geändert: Dein Rückgängig beginnt ab hier neu."
  fr: "Quelqu'un d'autre a modifié les blocs et les services : votre Annuler repart d'ici."
  nl: "Iemand anders heeft de omlopen en diensten gewijzigd: je Ongedaan maken begint vanaf hier opnieuw."
  pl: "Ktoś inny zmienił bloki i służby: Twoje Cofnij zaczyna się od tego miejsca."
  ru: "Кто-то другой изменил блоки и смены: ваша отмена начинается заново отсюда."
  uk: "Хтось інший змінив блоки та зміни: ваше скасування починається звідси заново."
"Somebody else changed the roster: your Undo begins again from here.":
  de: "Jemand anderes hat den Dienstplan geändert: Dein Rückgängig beginnt ab hier neu."
  fr: "Quelqu'un d'autre a modifié le roulement : votre Annuler repart d'ici."
  nl: "Iemand anders heeft het rooster gewijzigd: je Ongedaan maken begint vanaf hier opnieuw."
  pl: "Ktoś inny zmienił grafik: Twoje Cofnij zaczyna się od tego miejsca."
  ru: "Кто-то другой изменил график: ваша отмена начинается заново отсюда."
  uk: "Хтось інший змінив графік: ваше скасування починається звідси заново."
"%{who} changed the blocks and duties of %{day}.":
  de: "%{who} hat die Umläufe und Dienste von %{day} geändert."
  fr: "%{who} a modifié les blocs et les services du %{day}."
  nl: "%{who} heeft de omlopen en diensten van %{day} gewijzigd."
  pl: "%{who} zmienił(a) bloki i służby na %{day}."
  ru: "%{who} изменил(а) блоки и смены на %{day}."
  uk: "%{who} змінив(ла) блоки та зміни на %{day}."
"%{who} saved the planning of %{day}.":
  de: "%{who} hat die Planung von %{day} gespeichert."
  fr: "%{who} a enregistré la planification du %{day}."
  nl: "%{who} heeft de planning van %{day} opgeslagen."
  pl: "%{who} zapisał(a) planowanie na %{day}."
  ru: "%{who} сохранил(а) планирование на %{day}."
  uk: "%{who} зберіг(ла) планування на %{day}."
"%{who} changed the roster of %{day}.":
  de: "%{who} hat den Dienstplan von %{day} geändert."
  fr: "%{who} a modifié le roulement du %{day}."
  nl: "%{who} heeft het rooster van %{day} gewijzigd."
  pl: "%{who} zmienił(a) grafik na %{day}."
  ru: "%{who} изменил(а) график на %{day}."
  uk: "%{who} змінив(ла) графік на %{day}."
"%{who} changed a timetable.":
  de: "%{who} hat einen Fahrplan geändert."
  fr: "%{who} a modifié un horaire."
  nl: "%{who} heeft een dienstregeling gewijzigd."
  pl: "%{who} zmienił(a) rozkład jazdy."
  ru: "%{who} изменил(а) расписание."
  uk: "%{who} змінив(ла) розклад."
"%{who} changed the preferences.":
  de: "%{who} hat die Einstellungen geändert."
  fr: "%{who} a modifié les préférences."
  nl: "%{who} heeft de voorkeuren gewijzigd."
  pl: "%{who} zmienił(a) preferencje."
  ru: "%{who} изменил(а) настройки."
  uk: "%{who} змінив(ла) налаштування."
"%{who} changed the planning.":
  de: "%{who} hat die Planung geändert."
  fr: "%{who} a modifié la planification."
  nl: "%{who} heeft de planning gewijzigd."
  pl: "%{who} zmienił(a) planowanie."
  ru: "%{who} изменил(а) планирование."
  uk: "%{who} змінив(ла) планування."
"%{who} changed this day meanwhile: it is shown anew - do it once more.":
  de: "%{who} hat diesen Tag inzwischen geändert: Er wird neu angezeigt - mach es noch einmal."
  fr: "%{who} a modifié ce jour entre-temps : il est affiché à nouveau - refaites-le."
  nl: "%{who} heeft deze dag intussen gewijzigd: hij wordt opnieuw getoond - doe het nog een keer."
  pl: "%{who} zmienił(a) w międzyczasie ten dzień: jest wyświetlany od nowa - zrób to jeszcze raz."
  ru: "%{who} тем временем изменил(а) этот день: он показан заново - сделайте это ещё раз."
  uk: "%{who} тим часом змінив(ла) цей день: його показано заново - зробіть це ще раз."
"Your role lets you look at the planning, not change it: the boss can give you \"Edit the planning\" on his Multiplayer page.":
  de: "Deine Rolle lässt dich die Planung ansehen, nicht ändern: Der Chef kann dir auf seiner Mehrspieler-Seite \"Planung bearbeiten\" geben."
  fr: "Votre rôle vous permet de voir la planification, pas de la modifier : le patron peut vous donner « Modifier la planification » sur sa page Multijoueur."
  nl: "Je rol laat je de planning bekijken, niet wijzigen: de baas kan je op zijn Multiplayer-pagina \"Planning bewerken\" geven."
  pl: "Twoja rola pozwala przeglądać planowanie, ale nie zmieniać go: szef może dać Ci „Edycję planowania” na swojej stronie trybu wieloosobowego."
  ru: "Ваша роль позволяет смотреть планирование, но не менять его: начальник может дать вам «Редактирование планирования» на своей странице мультиплеера."
  uk: "Ваша роль дозволяє переглядати планування, але не змінювати його: начальник може дати вам «Редагування планування» на своїй сторінці мультиплеєра."
"Read-only":
  de: "Nur lesen"
  fr: "Lecture seule"
  nl: "Alleen lezen"
  pl: "Tylko do odczytu"
  ru: "Только чтение"
  uk: "Лише перегляд"
"Lessons change the company and put it back: they are for the boss's own launcher. The tour and the help sheet work here.":
  de: "Lektionen ändern das Unternehmen und setzen es zurück: Sie sind für den eigenen Launcher des Chefs. Die Tour und die Hilfeseite funktionieren hier."
  fr: "Les leçons modifient l'entreprise puis la remettent comme avant : elles sont pour le lanceur du patron. La visite et la fiche d'aide fonctionnent ici."
  nl: "Lessen wijzigen het bedrijf en zetten het terug: ze zijn voor de eigen launcher van de baas. De rondleiding en het hulpblad werken hier wel."
  pl: "Lekcje zmieniają firmę i przywracają ją: są dla własnego launchera szefa. Wycieczka i ściągawka działają tutaj."
  ru: "Уроки меняют компанию и возвращают её обратно: они для собственного лаунчера начальника. Тур и справка работают здесь."
  uk: "Уроки змінюють компанію і повертають її назад: вони для власного лаунчера начальника. Тур і довідка працюють тут."
"The routes are drawn on the boss's map with his line editor: he changes them on his own launcher. The trips and their times you change in the Timeplan, as your role allows.":
  de: "Die Routen werden auf der Karte des Chefs mit seinem Linieneditor gezeichnet: Er ändert sie auf seinem eigenen Launcher. Die Fahrten und ihre Zeiten änderst du im Timeplan, soweit deine Rolle es erlaubt."
  fr: "Les itinéraires sont tracés sur la carte du patron avec son éditeur de lignes : il les modifie sur son propre lanceur. Les courses et leurs horaires, vous les modifiez dans le Timeplan, selon votre rôle."
  nl: "De routes worden op de kaart van de baas getekend met zijn lijneditor: hij wijzigt ze op zijn eigen launcher. De ritten en hun tijden wijzig je in de Timeplan, voor zover je rol dat toestaat."
  pl: "Trasy są rysowane na mapie szefa jego edytorem linii: zmienia je na własnym launcherze. Kursy i ich czasy zmieniasz w Timeplanie, na ile pozwala Twoja rola."
  ru: "Маршруты рисуются на карте начальника его редактором линий: он меняет их в своём лаунчере. Рейсы и их время вы меняете в Timeplan, насколько позволяет ваша роль."
  uk: "Маршрути малюються на мапі начальника його редактором ліній: він змінює їх у власному лаунчері. Рейси та їхній час ви змінюєте в Timeplan, наскільки дозволяє ваша роль."
