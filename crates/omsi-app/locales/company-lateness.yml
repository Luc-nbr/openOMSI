  nl: "Inhoudingen voor vertragingen"
  pl: "Potrącenia za opóźnienia"
  ru: "Удержания за опоздания"
  uk: "Утримання за запізнення"
"How was this worked out?":
  de: "Wie wurde das berechnet?"
  fr: "Comment est-ce calculé ?"
  nl: "Hoe is dit berekend?"
  pl: "Jak to obliczono?"
  ru: "Как это рассчитано?"
  uk: "Як це розраховано?"
"Each late trip pays a share of its value under the contract (what dropping it would cost): 10 % up to 5 minutes, rising evenly to 100 % at 30 minutes; from 30 minutes the whole trip is deducted, as for a trip lost.":
  de: "Jede verspätete Fahrt zahlt einen Anteil ihres Werts im Vertrag (was ihr Ausfall kosten würde): 10 % bis 5 Minuten, gleichmäßig steigend bis 100 % bei 30 Minuten; ab 30 Minuten wird die ganze Fahrt abgezogen, wie bei einer ausgefallenen Fahrt."
  fr: "Chaque trajet en retard paie une part de sa valeur au contrat (ce que coûterait sa suppression) : 10 % jusqu'à 5 minutes, puis en hausse régulière jusqu'à 100 % à 30 minutes ; dès 30 minutes le trajet entier est déduit, comme un trajet perdu."
  nl: "Elke rit die te laat is betaalt een deel van zijn waarde in het contract (wat uitvallen zou kosten): 10 % tot 5 minuten, gelijkmatig oplopend tot 100 % bij 30 minuten; vanaf 30 minuten wordt de hele rit ingehouden, als bij een uitgevallen rit."
  pl: "Każdy spóźniony kurs płaci część swojej wartości z umowy (tyle, ile kosztowałoby jego odwołanie): 10 % do 5 minut, równo rosnąco do 100 % przy 30 minutach; od 30 minut potrąca się cały kurs, jak za kurs utracony."
  ru: "Каждый опоздавший рейс платит долю своей стоимости по контракту (сколько стоила бы его отмена): 10 % до 5 минут, равномерно растёт до 100 % при 30 минутах; с 30 минут удерживается весь рейс, как за потерянный."
  uk: "Кожен запізнілий рейс платить частку своєї вартості за контрактом (скільки коштувало б його скасування): 10 % до 5 хвилин, рівномірно зростає до 100 % при 30 хвилинах; від 30 хвилин утримується весь рейс, як за втрачений."
"A trip leaves when its bus is back from the trip before and its driver is there: a delay carries on along the block until a layover absorbs it. On the way the hour's traffic, the driver, the bus's condition and the day's events add minutes.":
  de: "Eine Fahrt beginnt, wenn ihr Bus von der Fahrt davor zurück und ihr Fahrer da ist: eine Verspätung zieht sich durch den Umlauf, bis eine Wendezeit sie auffängt. Unterwegs kommen der Verkehr der Stunde, der Fahrer, der Zustand des Busses und die Ereignisse des Tages hinzu."
  fr: "Un trajet part quand son bus est revenu du trajet précédent et que son conducteur est là : un retard se propage le long du bloc jusqu'à ce qu'un battement l'absorbe. En route, le trafic de l'heure, le conducteur, l'état du bus et les événements du jour ajoutent des minutes."
  nl: "Een rit vertrekt als zijn bus terug is van de rit ervoor en zijn chauffeur er is: een vertraging loopt door in de omloop tot een keertijd hem opvangt. Onderweg voegen het verkeer van het uur, de chauffeur, de staat van de bus en de gebeurtenissen van de dag minuten toe."
  pl: "Kurs rusza, gdy jego autobus wrócił z poprzedniego kursu i kierowca jest na miejscu: opóźnienie przechodzi wzdłuż bloku, aż postój je wchłonie. Na trasie minuty dodają ruch danej godziny, kierowca, stan autobusu i zdarzenia dnia."
  ru: "Рейс отправляется, когда его автобус вернулся с предыдущего рейса и водитель на месте: опоздание переходит по блоку, пока его не поглотит стоянка. В пути минуты добавляют движение в этот час, водитель, состояние автобуса и события дня."
  uk: "Рейс вирушає, коли його автобус повернувся з попереднього рейсу і водій на місці: запізнення переходить уздовж блоку, доки його не поглине стоянка. У дорозі хвилини додають рух у цю годину, водій, стан автобуса та події дня."
"Casual deducts nothing; school transport counts twice.":
  de: "Casual zieht nichts ab; Schülerverkehr zählt doppelt."
  fr: "Casual ne déduit rien ; le transport scolaire compte double."
  nl: "Casual houdt niets in; leerlingenvervoer telt dubbel."
  pl: "Casual nic nie potrąca; przewozy szkolne liczą się podwójnie."
  ru: "В Casual удержаний нет; школьные перевозки считаются вдвойне."
  uk: "У Casual утримань немає; шкільні перевезення рахуються вдвічі."
