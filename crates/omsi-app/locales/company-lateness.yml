"Add %{m} min layover at %{stop} on line %{n}: %{k} trips carried a delay on from there (block %{block}, %{time}).":
  de: "%{m} Min. mehr Wendezeit in %{stop} auf Linie %{n}: %{k} Fahrten nahmen von dort eine Verspätung mit (Umlauf %{block}, %{time})."
  fr: "Ajoutez %{m} min de battement à %{stop} sur la ligne %{n} : %{k} trajets y ont repris un retard (bloc %{block}, %{time})."
  nl: "Voeg %{m} min keertijd toe in %{stop} op lijn %{n}: %{k} ritten namen daar een vertraging mee (omloop %{block}, %{time})."
  pl: "Dodaj %{m} min postoju w %{stop} na linii %{n}: %{k} kursów przeniosło stamtąd opóźnienie (blok %{block}, %{time})."
  ru: "Добавьте %{m} мин стоянки на %{stop} на линии %{n}: %{k} рейсов унесли оттуда опоздание (блок %{block}, %{time})."
  uk: "Додайте %{m} хв стоянки на %{stop} на лінії %{n}: %{k} рейсів понесли звідти запізнення (блок %{block}, %{time})."
