"%{n} of these trips carried a delay on from the trip before: the layover was too short to take it up.":
  de: "%{n} dieser Fahrten übernahmen eine Verspätung von der Fahrt davor: die Wendezeit war zu kurz, um sie aufzufangen."
  fr: "%{n} de ces trajets ont repris un retard du trajet précédent : le temps de battement était trop court pour l'absorber."
  nl: "%{n} van deze ritten namen een vertraging over van de rit ervoor: de keertijd was te kort om die op te vangen."
  pl: "%{n} z tych kursów przejęło opóźnienie z kursu wcześniejszego: postój na pętli był za krótki, by je odrobić."
  ru: "%{n} из этих рейсов унаследовали опоздание предыдущего рейса: отстой на конечной был слишком коротким, чтобы его погасить."
  uk: "%{n} з цих рейсів успадкували запізнення попереднього рейсу: відстій на кінцевій був надто коротким, щоб його погасити."
"A trip counts as late from %{m} whole minutes behind the timetable, at its start or its end: %{under} min 59 s behind is still on time.":
  de: "Eine Fahrt gilt ab %{m} vollen Minuten hinter dem Fahrplan als verspätet, am Anfang oder am Ende: %{under} Min. 59 s dahinter ist noch pünktlich."
  fr: "Un trajet compte comme en retard à partir de %{m} minutes entières sur l'horaire, au départ ou à l'arrivée : %{under} min 59 s de retard, c'est encore à l'heure."
  nl: "Een rit telt als te laat vanaf %{m} hele minuten achter de dienstregeling, bij vertrek of aankomst: %{under} min 59 s erachter is nog op tijd."
  pl: "Kurs liczy się jako spóźniony od %{m} pełnych minut za rozkładem, na początku lub na końcu: %{under} min 59 s za rozkładem to jeszcze punktualnie."
  ru: "Рейс считается опоздавшим при отставании от расписания на %{m} полные минуты, в начале или в конце: отставание в %{under} мин 59 с ещё считается вовремя."
  uk: "Рейс вважається запізнілим за відставання від розкладу на %{m} повні хвилини, на початку або в кінці: відставання в %{under} хв 59 с ще вважається вчасно."
"Each late trip counts once in each column: in its tier, and under the cause that brought it the most minutes. A delay carried on from the trip before counts under the cause it began with (the traffic, a driver, a bus), less what the layovers took up on the way.":
  de: "Jede verspätete Fahrt zählt in jeder Spalte einmal: in ihrer Stufe und unter der Ursache, die ihr die meisten Minuten brachte. Eine von der Fahrt davor übernommene Verspätung zählt unter der Ursache, mit der sie begann (der Verkehr, ein Fahrer, ein Bus), abzüglich dessen, was die Wendezeiten unterwegs aufgefangen haben."
  fr: "Chaque trajet en retard compte une fois dans chaque colonne : dans son palier, et sous la cause qui lui a valu le plus de minutes. Un retard repris du trajet précédent compte sous la cause qui l'a fait naître (la circulation, un conducteur, un bus), moins ce que les temps de battement ont absorbé en route."
  nl: "Elke te late rit telt in elke kolom één keer: in zijn trede, en onder de oorzaak die hem de meeste minuten bracht. Een vertraging overgenomen van de rit ervoor telt onder de oorzaak waarmee ze begon (het verkeer, een chauffeur, een bus), min wat de keertijden onderweg opvingen."
  pl: "Każdy spóźniony kurs liczy się raz w każdej kolumnie: w swoim progu i pod przyczyną, która przyniosła mu najwięcej minut. Opóźnienie przejęte z kursu wcześniejszego liczy się pod przyczyną, od której się zaczęło (ruch, kierowca, autobus), pomniejszone o to, co odrobiły postoje po drodze."
  ru: "Каждый опоздавший рейс считается один раз в каждом столбце: в своей ступени и под причиной, принёсшей ему больше всего минут. Опоздание, унаследованное от предыдущего рейса, считается под причиной, с которой оно началось (движение, водитель, автобус), за вычетом того, что погасили отстои по пути."
  uk: "Кожен запізнілий рейс рахується один раз у кожному стовпці: у своєму ступені та під причиною, що принесла йому найбільше хвилин. Запізнення, успадковане від попереднього рейсу, рахується під причиною, з якої воно почалося (рух, водій, автобус), за вирахуванням того, що погасили відстої дорогою."
