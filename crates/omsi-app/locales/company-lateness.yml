  ru: "Открыть Timeplan"
  uk: "Відкрити Timeplan"
"Line %{n}: %{m} min more running time from %{from} to %{to}: %{k} trips ran late in the rush hour.":
  de: "Linie %{n}: %{m} Min. mehr Fahrzeit von %{from} bis %{to}: %{k} Fahrten waren im Berufsverkehr verspätet."
  fr: "Ligne %{n} : %{m} min de temps de parcours en plus de %{from} à %{to} : %{k} trajets étaient en retard à l'heure de pointe."
  nl: "Lijn %{n}: %{m} min meer rijtijd van %{from} tot %{to}: %{k} ritten waren in de spits te laat."
  pl: "Linia %{n}: %{m} min więcej czasu przejazdu od %{from} do %{to}: %{k} kursów spóźniło się w szczycie."
  ru: "Линия %{n}: на %{m} мин больше времени в пути с %{from} до %{to}: %{k} рейсов опоздали в час пик."
  uk: "Лінія %{n}: на %{m} хв більше часу в дорозі з %{from} до %{to}: %{k} рейсів запізнилися в годину пік."
"The relief at %{time} on block %{block} is too tight: %{name} came %{m} min late from the duty before. Plan more time between the two duties, or give it to another driver.":
  de: "Die Ablösung um %{time} auf Umlauf %{block} ist zu knapp: %{name} kam %{m} Min. zu spät aus dem Dienst davor. Planen Sie mehr Zeit zwischen den beiden Diensten oder geben Sie ihn einem anderen Fahrer."
  fr: "La relève de %{time} sur le bloc %{block} est trop serrée : %{name} est arrivé avec %{m} min de retard du service précédent. Prévoyez plus de temps entre les deux services, ou confiez-le à un autre conducteur."
  nl: "De aflossing om %{time} op omloop %{block} is te krap: %{name} kwam %{m} min te laat van de dienst ervoor. Plan meer tijd tussen de twee diensten, of geef hem aan een andere chauffeur."
  pl: "Zmiana o %{time} w bloku %{block} jest zbyt ciasna: %{name} przyszedł %{m} min za późno z poprzedniej służby. Zaplanuj więcej czasu między służbami albo daj ją innemu kierowcy."
  ru: "Пересменка в %{time} в блоке %{block} слишком плотная: %{name} пришёл с предыдущей смены на %{m} мин позже. Запланируйте больше времени между сменами или отдайте её другому водителю."
  uk: "Перезміна о %{time} у блоці %{block} надто щільна: %{name} прийшов з попередньої зміни на %{m} хв пізніше. Заплануйте більше часу між змінами або віддайте її іншому водієві."
"%{name} signed on late on %{d} of the last days: a punctuality course, a talk, or another duty that begins later.":
  de: "%{name} trat an %{d} der letzten Tage zu spät an: ein Pünktlichkeitskurs, ein Gespräch oder ein Dienst, der später beginnt."
  fr: "%{name} a pris son service en retard %{d} des derniers jours : une formation à la ponctualité, un entretien, ou un service qui commence plus tard."
  nl: "%{name} meldde zich op %{d} van de laatste dagen te laat: een cursus stiptheid, een gesprek of een dienst die later begint."
  pl: "%{name} spóźnił się na służbę w %{d} z ostatnich dni: kurs punktualności, rozmowa albo służba, która zaczyna się później."
  ru: "%{name} опаздывал на смену в %{d} из последних дней: курс пунктуальности, беседа или смена, которая начинается позже."
  uk: "%{name} запізнювався на зміну в %{d} з останніх днів: курс пунктуальності, розмова або зміна, що починається пізніше."
"%{name} drove %{s} trips late today: a punctuality course, or a duty with more time.":
  de: "%{name} fuhr heute %{s} Fahrten verspätet: ein Pünktlichkeitskurs oder ein Dienst mit mehr Zeit."
  fr: "%{name} a fait %{s} trajets en retard aujourd'hui : une formation à la ponctualité, ou un service avec plus de temps."
  nl: "%{name} reed vandaag %{s} ritten te laat: een cursus stiptheid, of een dienst met meer tijd."
  pl: "%{name} spóźnił dziś %{s} kursów: kurs punktualności albo służba z większym zapasem czasu."
  ru: "%{name} сегодня опоздал на %{s} рейсах: курс пунктуальности или смена с запасом времени."
  uk: "%{name} сьогодні запізнився на %{s} рейсах: курс пунктуальності або зміна із запасом часу."
"%{name} signed on late on %{d} of the last days and drove %{s} trips late today: a punctuality course, a talk, or another duty.":
  de: "%{name} trat an %{d} der letzten Tage zu spät an und fuhr heute %{s} Fahrten verspätet: ein Pünktlichkeitskurs, ein Gespräch oder ein anderer Dienst."
  fr: "%{name} a pris son service en retard %{d} des derniers jours et a fait %{s} trajets en retard aujourd'hui : une formation à la ponctualité, un entretien, ou un autre service."
  nl: "%{name} meldde zich op %{d} van de laatste dagen te laat en reed vandaag %{s} ritten te laat: een cursus stiptheid, een gesprek of een andere dienst."
  pl: "%{name} spóźnił się na służbę w %{d} z ostatnich dni i spóźnił dziś %{s} kursów: kurs punktualności, rozmowa albo inna służba."
  ru: "%{name} опаздывал на смену в %{d} из последних дней и сегодня опоздал на %{s} рейсах: курс пунктуальности, беседа или другая смена."
  uk: "%{name} запізнювався на зміну в %{d} з останніх днів і сьогодні запізнився на %{s} рейсах: курс пунктуальності, розмова або інша зміна."
