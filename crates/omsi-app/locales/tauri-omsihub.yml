_version: 2
# Omsi-Hub's look of openOMSI's desktop launcher (launcher/ui/js/omsihub, Trello "Tauri 1/6"):
# the texts only that page shows, and the languages upstream's own texts of it lacked. The page
# reads every table of this folder, so the texts our game-drawn launcher shows already are not
# repeated here. The English text is the key, as in app.yml.

# --- upstream's pages in our look ---------------------------------------------------------------
"A bus loaded as the game loads it: every warning of its files, models and scripts, and the textures that are missing.":
  en: "A bus loaded as the game loads it: every warning of its files, models and scripts, and the textures that are missing."
  nl: "Een bus geladen zoals het spel hem laadt: elke waarschuwing over zijn bestanden, modellen en scripts, en de texturen die ontbreken."
  de: "Ein Bus, geladen wie das Spiel ihn lädt: jede Warnung zu seinen Dateien, Modellen und Skripten und die fehlenden Texturen."
  fr: "Un bus chargé comme le jeu le charge : chaque avertissement sur ses fichiers, modèles et scripts, et les textures manquantes."
  ru: "Автобус, загруженный так, как его загружает игра: все предупреждения о его файлах, моделях и скриптах и недостающие текстуры."
  uk: "Автобус, завантажений так, як його завантажує гра: усі попередження щодо його файлів, моделей і скриптів та відсутні текстури."
  pl: "Autobus wczytany tak, jak wczytuje go gra: każde ostrzeżenie o jego plikach, modelach i skryptach oraz brakujące tekstury."

