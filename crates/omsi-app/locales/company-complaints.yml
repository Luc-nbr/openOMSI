_version: 2
# Passengers' complaints and their talk (Luc 2026-10-15): what the passenger says, the
# company's replies, how it ended.
"I waited at the stop for line %{line} at %{time} and the bus came late. I missed my connection!":
  de: "Ich habe an der Haltestelle auf die Linie %{line} um %{time} gewartet, und der Bus kam zu spät. Ich habe meinen Anschluss verpasst!"
  fr: "J'ai attendu la ligne %{line} de %{time} à l'arrêt et le bus est arrivé en retard. J'ai raté ma correspondance !"
  nl: "Ik stond bij de halte te wachten op lijn %{line} van %{time} en de bus kwam te laat. Ik heb mijn aansluiting gemist!"
  pl: "Czekałem na przystanku na linię %{line} o %{time}, a autobus się spóźnił. Uciekła mi przesiadka!"
  ru: "Я ждал на остановке линию %{line} в %{time}, а автобус опоздал. Я пропустил пересадку!"
  uk: "Я чекав на зупинці лінію %{line} о %{time}, а автобус запізнився. Я пропустив пересадку!"
"Your line %{line} at %{time} was late again. I was late for work because of it.":
  de: "Ihre Linie %{line} um %{time} war schon wieder zu spät. Deshalb kam ich zu spät zur Arbeit."
  fr: "Votre ligne %{line} de %{time} était encore en retard. Je suis arrivé en retard au travail à cause d'elle."
  nl: "Uw lijn %{line} van %{time} was weer te laat. Daardoor kwam ik te laat op mijn werk."
  pl: "Wasza linia %{line} o %{time} znowu się spóźniła. Przez to spóźniłem się do pracy."
  ru: "Ваша линия %{line} в %{time} снова опоздала. Из-за неё я опоздал на работу."
  uk: "Ваша лінія %{line} о %{time} знову запізнилася. Через неї я запізнився на роботу."
"The %{time} bus of line %{line} never came. Nobody told us anything.":
  de: "Der Bus der Linie %{line} um %{time} kam einfach nicht. Niemand hat uns etwas gesagt."
  fr: "Le bus de %{time} de la ligne %{line} n'est jamais venu. Personne ne nous a rien dit."
  nl: "De bus van %{time} van lijn %{line} is nooit gekomen. Niemand heeft ons iets verteld."
  pl: "Autobus linii %{line} o %{time} w ogóle nie przyjechał. Nikt nam nic nie powiedział."
  ru: "Автобус линии %{line} в %{time} так и не пришёл. Нам никто ничего не сказал."
  uk: "Автобус лінії %{line} о %{time} так і не прийшов. Нам ніхто нічого не сказав."
"I stood at the stop for nothing: line %{line} at %{time} simply did not run!":
  de: "Ich stand umsonst an der Haltestelle: Die Linie %{line} um %{time} fuhr einfach nicht!"
  fr: "J'ai attendu pour rien : la ligne %{line} de %{time} n'a tout simplement pas circulé !"
  nl: "Ik stond voor niets bij de halte: lijn %{line} van %{time} reed gewoon niet!"
  pl: "Stałem na przystanku na próżno: linia %{line} o %{time} po prostu nie pojechała!"
  ru: "Я зря простоял на остановке: линия %{line} в %{time} просто не вышла!"
  uk: "Я марно простояв на зупинці: лінія %{line} о %{time} просто не вийшла!"
"My bus on line %{line} broke down at %{time} and we were stuck for ages.":
  de: "Mein Bus der Linie %{line} ist um %{time} liegen geblieben, und wir standen ewig fest."
  fr: "Mon bus de la ligne %{line} est tombé en panne à %{time} et nous sommes restés bloqués une éternité."
  nl: "Mijn bus op lijn %{line} kreeg om %{time} pech en we stonden eindeloos stil."
  pl: "Mój autobus linii %{line} zepsuł się o %{time} i utknęliśmy na wieki."
  ru: "Мой автобус линии %{line} сломался в %{time}, и мы застряли надолго."
  uk: "Мій автобус лінії %{line} зламався о %{time}, і ми застрягли надовго."
"Line %{line} broke down at %{time}. Does anyone ever look after your buses?":
  de: "Die Linie %{line} ist um %{time} liegen geblieben. Kümmert sich überhaupt jemand um Ihre Busse?"
  fr: "La ligne %{line} est tombée en panne à %{time}. Quelqu'un s'occupe-t-il jamais de vos bus ?"
  nl: "Lijn %{line} kreeg om %{time} pech. Kijkt er ooit iemand naar uw bussen?"
  pl: "Linia %{line} zepsuła się o %{time}. Czy ktoś w ogóle dba o wasze autobusy?"
  ru: "Линия %{line} сломалась в %{time}. Кто-нибудь вообще следит за вашими автобусами?"
  uk: "Лінія %{line} зламалася о %{time}. Хтось узагалі доглядає ваші автобуси?"
"The bus on line %{line} at %{time} was so full that it drove past me.":
  de: "Der Bus der Linie %{line} um %{time} war so voll, dass er an mir vorbeigefahren ist."
  fr: "Le bus de la ligne %{line} de %{time} était si plein qu'il ne s'est pas arrêté."
  nl: "De bus op lijn %{line} van %{time} was zo vol dat hij me voorbijreed."
  pl: "Autobus linii %{line} o %{time} był tak pełny, że mnie minął."
  ru: "Автобус линии %{line} в %{time} был так переполнен, что проехал мимо меня."
  uk: "Автобус лінії %{line} о %{time} був такий повний, що проїхав повз мене."
"Line %{line} at %{time} was packed like a tin of sardines.":
  de: "Die Linie %{line} um %{time} war voll wie eine Sardinenbüchse."
  fr: "La ligne %{line} de %{time} était bondée comme une boîte de sardines."
  nl: "Lijn %{line} van %{time} zat zo vol als een blik sardientjes."
  pl: "Linia %{line} o %{time} była zapchana jak puszka sardynek."
  ru: "Линия %{line} в %{time} была набита как банка сардин."
  uk: "Лінія %{line} о %{time} була напхана, як банка сардин."
"The bus I took on line %{line} at %{time} was filthy: rubbish on the seats.":
  de: "Der Bus der Linie %{line} um %{time} war dreckig: Müll auf den Sitzen."
  fr: "Le bus que j'ai pris sur la ligne %{line} à %{time} était crasseux : des déchets sur les sièges."
  nl: "De bus die ik op lijn %{line} om %{time} nam was smerig: afval op de stoelen."
  pl: "Autobus linii %{line} o %{time} był brudny: śmieci na siedzeniach."
  ru: "Автобус линии %{line} в %{time} был грязный: мусор на сиденьях."
  uk: "Автобус лінії %{line} о %{time} був брудний: сміття на сидіннях."
"Line %{line} today: a sticky floor and dirty windows. Disgusting.":
  de: "Linie %{line} heute: klebriger Boden und schmutzige Fenster. Ekelhaft."
  fr: "La ligne %{line} aujourd'hui : un sol collant et des vitres sales. Dégoûtant."
  nl: "Lijn %{line} vandaag: een plakkerige vloer en vuile ramen. Walgelijk."
  pl: "Linia %{line} dziś: lepka podłoga i brudne okna. Obrzydliwe."
  ru: "Линия %{line} сегодня: липкий пол и грязные окна. Отвратительно."
  uk: "Лінія %{line} сьогодні: липка підлога і брудні вікна. Огидно."
"The driver on line %{line} at %{time} was rude to me when I asked about my ticket.":
  de: "Der Fahrer der Linie %{line} um %{time} war unhöflich, als ich nach meiner Fahrkarte fragte."
  fr: "Le conducteur de la ligne %{line} à %{time} a été grossier quand j'ai posé une question sur mon billet."
  nl: "De chauffeur op lijn %{line} om %{time} was onbeschoft toen ik iets over mijn kaartje vroeg."
  pl: "Kierowca linii %{line} o %{time} był niegrzeczny, gdy zapytałem o bilet."
  ru: "Водитель линии %{line} в %{time} нагрубил мне, когда я спросил о билете."
  uk: "Водій лінії %{line} о %{time} нагрубив мені, коли я спитав про квиток."
"Your driver on line %{line} snapped at an old lady at %{time}. Unacceptable.":
  de: "Ihr Fahrer der Linie %{line} hat um %{time} eine alte Dame angefahren. Unmöglich."
  fr: "Votre conducteur de la ligne %{line} a rabroué une vieille dame à %{time}. Inacceptable."
  nl: "Uw chauffeur op lijn %{line} snauwde om %{time} een oude dame af. Onaanvaardbaar."
  pl: "Wasz kierowca linii %{line} nakrzyczał o %{time} na starszą panią. Niedopuszczalne."
  ru: "Ваш водитель линии %{line} в %{time} нагрубил пожилой женщине. Недопустимо."
  uk: "Ваш водій лінії %{line} о %{time} нагрубив літній жінці. Неприпустимо."
"Your fares on line %{line} are far above everyone else's. Why should I pay that?":
  de: "Ihre Tarife auf der Linie %{line} liegen weit über allen anderen. Warum soll ich das bezahlen?"
  fr: "Vos tarifs sur la ligne %{line} sont bien au-dessus de ceux des autres. Pourquoi devrais-je payer ça ?"
  nl: "Uw tarieven op lijn %{line} liggen ver boven die van iedereen. Waarom zou ik dat betalen?"
  pl: "Wasze taryfy na linii %{line} są dużo wyższe niż u innych. Dlaczego mam tyle płacić?"
  ru: "Ваши тарифы на линии %{line} намного выше, чем у всех. Почему я должен столько платить?"
  uk: "Ваші тарифи на лінії %{line} значно вищі, ніж у всіх. Чому я маю стільки платити?"
"%{fare} for a single ticket on line %{line}? That is daylight robbery.":
  de: "%{fare} für eine Einzelfahrt auf der Linie %{line}? Das ist Wucher."
  fr: "%{fare} pour un ticket simple sur la ligne %{line} ? C'est du vol."
  nl: "%{fare} voor een enkeltje op lijn %{line}? Dat is diefstal."
  pl: "%{fare} za bilet jednorazowy na linii %{line}? To rozbój w biały dzień."
  ru: "%{fare} за разовый билет на линии %{line}? Это грабёж средь бела дня."
  uk: "%{fare} за разовий квиток на лінії %{line}? Це грабіж серед білого дня."
"We are sorry. We had no bus for that trip; we are working on our reserve.":
  de: "Es tut uns leid. Wir hatten keinen Bus für diese Fahrt; wir bauen unsere Reserve aus."
  fr: "Nous sommes désolés. Nous n'avions pas de bus pour ce trajet ; nous renforçons notre réserve."
  nl: "Het spijt ons. We hadden geen bus voor die rit; we werken aan onze reserve."
  pl: "Przepraszamy. Nie mieliśmy autobusu na ten kurs; pracujemy nad rezerwą."
  ru: "Нам жаль. У нас не было автобуса на этот рейс; мы работаем над резервом."
  uk: "Нам шкода. У нас не було автобуса на цей рейс; ми працюємо над резервом."
"We are sorry. We had no driver for that duty; it should not have happened.":
  de: "Es tut uns leid. Wir hatten keinen Fahrer für diesen Dienst; das hätte nicht passieren dürfen."
  fr: "Nous sommes désolés. Nous n'avions pas de conducteur pour ce service ; cela n'aurait pas dû arriver."
  nl: "Het spijt ons. We hadden geen chauffeur voor die dienst; dat had niet mogen gebeuren."
  pl: "Przepraszamy. Nie mieliśmy kierowcy na tę służbę; to nie powinno się zdarzyć."
  ru: "Нам жаль. У нас не было водителя на эту смену; такого не должно было случиться."
  uk: "Нам шкода. У нас не було водія на цю зміну; такого не мало статися."
"We are sorry. The driver came late to his duty and the trip was lost.":
  de: "Es tut uns leid. Der Fahrer kam zu spät zum Dienst, und die Fahrt fiel aus."
  fr: "Nous sommes désolés. Le conducteur est arrivé en retard et le trajet a été perdu."
  nl: "Het spijt ons. De chauffeur kwam te laat voor zijn dienst en de rit viel uit."
  pl: "Przepraszamy. Kierowca spóźnił się na służbę i kurs przepadł."
  ru: "Нам жаль. Водитель опоздал на смену, и рейс сорвался."
  uk: "Нам шкода. Водій запізнився на зміну, і рейс зірвався."
"We are sorry. That trip slipped through our planning.":
  de: "Es tut uns leid. Diese Fahrt ist uns in der Planung durchgerutscht."
  fr: "Nous sommes désolés. Ce trajet nous a échappé dans la planification."
  nl: "Het spijt ons. Die rit is door onze planning geglipt."
  pl: "Przepraszamy. Ten kurs umknął naszemu planowaniu."
  ru: "Нам жаль. Этот рейс выпал из нашего планирования."
  uk: "Нам шкода. Цей рейс випав із нашого планування."
"We are sorry. That trip could not run, and we should have told you.":
  de: "Es tut uns leid. Die Fahrt konnte nicht stattfinden, und wir hätten Bescheid sagen müssen."
  fr: "Nous sommes désolés. Ce trajet n'a pas pu circuler, et nous aurions dû vous prévenir."
  nl: "Het spijt ons. Die rit kon niet rijden, en we hadden het u moeten laten weten."
  pl: "Przepraszamy. Ten kurs nie mógł się odbyć i powinniśmy byli to zakomunikować."
  ru: "Нам жаль. Этот рейс не смог выйти, и нам следовало предупредить."
  uk: "Нам шкода. Цей рейс не зміг вийти, і нам слід було попередити."
"We are sorry. The bus was in an accident; we are glad nobody was hurt.":
  de: "Es tut uns leid. Der Bus hatte einen Unfall; wir sind froh, dass niemand verletzt wurde."
  fr: "Nous sommes désolés. Le bus a eu un accident ; heureusement, personne n'a été blessé."
  nl: "Het spijt ons. De bus had een ongeval; we zijn blij dat niemand gewond raakte."
  pl: "Przepraszamy. Autobus miał wypadek; cieszymy się, że nikt nie ucierpiał."
  ru: "Нам жаль. Автобус попал в аварию; к счастью, никто не пострадал."
  uk: "Нам шкода. Автобус потрапив в аварію; на щастя, ніхто не постраждав."
"We are sorry. The bus broke down, and help took too long to come.":
  de: "Es tut uns leid. Der Bus ist liegen geblieben, und Hilfe kam zu spät."
  fr: "Nous sommes désolés. Le bus est tombé en panne et les secours ont mis trop de temps."
  nl: "Het spijt ons. De bus kreeg pech en de hulp duurde te lang."
  pl: "Przepraszamy. Autobus się zepsuł, a pomoc jechała zbyt długo."
  ru: "Нам жаль. Автобус сломался, и помощь шла слишком долго."
  uk: "Нам шкода. Автобус зламався, і допомога йшла задовго."
"We are sorry. Traffic and a timetable that was too tight held the bus up.":
  de: "Es tut uns leid. Verkehr und ein zu knapper Fahrplan haben den Bus aufgehalten."
  fr: "Nous sommes désolés. La circulation et un horaire trop serré ont retardé le bus."
  nl: "Het spijt ons. Verkeer en een te krappe dienstregeling hielden de bus op."
  pl: "Przepraszamy. Korki i zbyt napięty rozkład opóźniły autobus."
  ru: "Нам жаль. Пробки и слишком плотное расписание задержали автобус."
  uk: "Нам шкода. Затори і надто щільний розклад затримали автобус."
"We are sorry. More people rode than we had places for.":
  de: "Es tut uns leid. Es wollten mehr Leute mitfahren, als wir Plätze hatten."
  fr: "Nous sommes désolés. Il y avait plus de voyageurs que de places."
  nl: "Het spijt ons. Er reden meer mensen mee dan we plaatsen hadden."
  pl: "Przepraszamy. Pasażerów było więcej niż miejsc."
  ru: "Нам жаль. Пассажиров было больше, чем мест."
  uk: "Нам шкода. Пасажирів було більше, ніж місць."
"We are sorry. That bus should never have gone out like that.":
  de: "Es tut uns leid. So hätte der Bus nie rausfahren dürfen."
  fr: "Nous sommes désolés. Ce bus n'aurait jamais dû sortir dans cet état."
  nl: "Het spijt ons. Zo had die bus nooit de weg op mogen gaan."
  pl: "Przepraszamy. Ten autobus nigdy nie powinien był tak wyjechać."
  ru: "Нам жаль. Этот автобус никогда не должен был выйти в таком виде."
  uk: "Нам шкода. Цей автобус ніколи не мав виїжджати в такому стані."
"We are sorry. That is not how our drivers should treat anyone.":
  de: "Es tut uns leid. So sollten unsere Fahrer niemanden behandeln."
  fr: "Nous sommes désolés. Ce n'est pas ainsi que nos conducteurs doivent traiter quiconque."
  nl: "Het spijt ons. Zo horen onze chauffeurs niemand te behandelen."
  pl: "Przepraszamy. Nasi kierowcy nie powinni nikogo tak traktować."
  ru: "Нам жаль. Наши водители не должны так обращаться ни с кем."
  uk: "Нам шкода. Наші водії не повинні так поводитися ні з ким."
"We understand. The fare pays for the service, but we hear you.":
  de: "Wir verstehen Sie. Der Tarif bezahlt den Betrieb, aber wir nehmen Sie ernst."
  fr: "Nous comprenons. Le tarif paie le service, mais nous vous entendons."
  nl: "We begrijpen het. Het tarief betaalt de dienst, maar we horen u."
  pl: "Rozumiemy. Taryfa opłaca usługę, ale słyszymy pana."
  ru: "Мы понимаем. Тариф оплачивает работу, но мы вас услышали."
  uk: "Ми розуміємо. Тариф оплачує роботу, але ми вас почули."
"We will give line %{line} more layover so the buses keep to time.":
  de: "Wir geben der Linie %{line} mehr Wendezeit, damit die Busse pünktlich sind."
  fr: "Nous donnerons plus de battement à la ligne %{line} pour que les bus soient à l'heure."
  nl: "We geven lijn %{line} meer keertijd zodat de bussen op tijd rijden."
  pl: "Damy linii %{line} więcej czasu postoju, by autobusy trzymały rozkład."
  ru: "Мы дадим линии %{line} больше отстоя, чтобы автобусы шли по графику."
  uk: "Ми дамо лінії %{line} більше відстою, щоб автобуси йшли за графіком."
"We will keep spare drivers and buses ready for line %{line}.":
  de: "Wir halten Springer und Reservebusse für die Linie %{line} bereit."
  fr: "Nous garderons des conducteurs et des bus de réserve pour la ligne %{line}."
  nl: "We houden reservechauffeurs en -bussen klaar voor lijn %{line}."
  pl: "Będziemy trzymać rezerwowych kierowców i autobusy dla linii %{line}."
  ru: "Мы будем держать резервных водителей и автобусы для линии %{line}."
  uk: "Ми триматимемо резервних водіїв і автобуси для лінії %{line}."
"We will have our buses serviced more often.":
  de: "Wir lassen unsere Busse öfter warten."
  fr: "Nous ferons entretenir nos bus plus souvent."
  nl: "We laten onze bussen vaker onderhouden."
  pl: "Będziemy częściej serwisować autobusy."
  ru: "Мы будем чаще обслуживать автобусы."
  uk: "Ми частіше обслуговуватимемо автобуси."
"We will put a bigger bus or more trips on line %{line}.":
  de: "Wir setzen auf der Linie %{line} einen größeren Bus oder mehr Fahrten ein."
  fr: "Nous mettrons un bus plus grand ou plus de trajets sur la ligne %{line}."
  nl: "We zetten een grotere bus of meer ritten in op lijn %{line}."
  pl: "Damy większy autobus lub więcej kursów na linii %{line}."
  ru: "Мы пустим на линию %{line} автобус побольше или больше рейсов."
  uk: "Ми пустимо на лінію %{line} більший автобус або більше рейсів."
"We will have every bus cleaned each night.":
  de: "Wir lassen jeden Bus jede Nacht reinigen."
  fr: "Nous ferons nettoyer chaque bus tous les soirs."
  nl: "We laten elke bus elke nacht schoonmaken."
  pl: "Każdy autobus będzie sprzątany co noc."
  ru: "Каждый автобус будут убирать каждую ночь."
  uk: "Кожен автобус прибиратимуть щоночі."
"The driver will go on a customer-service course.":
  de: "Der Fahrer kommt in einen Kundenservice-Kurs."
  fr: "Le conducteur suivra un cours de service client."
  nl: "De chauffeur gaat op cursus klantvriendelijkheid."
  pl: "Kierowca pójdzie na kurs obsługi klienta."
  ru: "Водитель пройдёт курс обслуживания клиентов."
  uk: "Водій пройде курс обслуговування клієнтів."
"We will look at the fares of line %{line} again.":
  de: "Wir sehen uns die Tarife der Linie %{line} noch einmal an."
  fr: "Nous reverrons les tarifs de la ligne %{line}."
  nl: "We kijken nog eens naar de tarieven van lijn %{line}."
  pl: "Przyjrzymy się ponownie taryfom linii %{line}."
  ru: "Мы пересмотрим тарифы линии %{line}."
  uk: "Ми переглянемо тарифи лінії %{line}."
"We will refund you %{amount}.":
  de: "Wir erstatten Ihnen %{amount}."
  fr: "Nous vous remboursons %{amount}."
  nl: "We betalen u %{amount} terug."
  pl: "Zwrócimy panu %{amount}."
  ru: "Мы вернём вам %{amount}."
  uk: "Ми повернемо вам %{amount}."
"Please accept a free day pass worth %{amount}.":
  de: "Bitte nehmen Sie eine kostenlose Tageskarte im Wert von %{amount} an."
  fr: "Acceptez un pass journée gratuit d'une valeur de %{amount}."
  nl: "Aanvaard alstublieft een gratis dagkaart ter waarde van %{amount}."
  pl: "Prosimy przyjąć darmowy bilet dobowy wart %{amount}."
  ru: "Примите, пожалуйста, бесплатный дневной билет стоимостью %{amount}."
  uk: "Прийміть, будь ласка, безкоштовний денний квиток вартістю %{amount}."
"The traffic is not our fault. There is nothing we can do.":
  de: "Für den Verkehr können wir nichts. Da lässt sich nichts machen."
  fr: "La circulation n'est pas de notre faute. Nous n'y pouvons rien."
