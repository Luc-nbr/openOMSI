"No complaints. Passengers complain when trips are dropped or late, buses break down, are full or dirty, a driver is rude, or a fare is too high.":
  de: "Keine Beschwerden. Fahrgäste beschweren sich, wenn Fahrten ausfallen oder zu spät sind, Busse liegen bleiben, voll oder schmutzig sind, ein Fahrer unhöflich ist oder ein Tarif zu hoch."
  fr: "Aucune plainte. Les voyageurs se plaignent quand des trajets sont supprimés ou en retard, que des bus tombent en panne, sont pleins ou sales, qu'un conducteur est grossier ou qu'un tarif est trop élevé."
  nl: "Geen klachten. Reizigers klagen als ritten uitvallen of te laat zijn, bussen pech krijgen, vol of vuil zijn, een chauffeur onbeschoft is of een tarief te hoog."
  pl: "Brak skarg. Pasażerowie skarżą się, gdy kursy są odwołane lub spóźnione, autobusy się psują, są pełne lub brudne, kierowca jest niegrzeczny albo taryfa zbyt wysoka."
  ru: "Жалоб нет. Пассажиры жалуются, когда рейсы отменяются или опаздывают, автобусы ломаются, переполнены или грязны, водитель груб или тариф слишком высок."
  uk: "Скарг немає. Пасажири скаржаться, коли рейси скасовуються чи запізнюються, автобуси ламаються, переповнені чи брудні, водій грубий або тариф зависокий."
"Answer each before its deadline: apologise and explain, offer a refund or a day pass, promise a fix - or dismiss it, and the passenger gets angry.":
  de: "Beantworten Sie jede vor ihrer Frist: entschuldigen und erklären, eine Erstattung oder Tageskarte anbieten, Abhilfe versprechen - oder abwimmeln, und der Fahrgast wird wütend."
  fr: "Répondez à chacune avant son échéance : vous excuser et expliquer, proposer un remboursement ou un pass journée, promettre une solution - ou la balayer, et le voyageur se fâche."
  nl: "Beantwoord elke klacht vóór de termijn: excuses aanbieden en uitleggen, een terugbetaling of dagkaart aanbieden, een oplossing beloven - of wegwuiven, en de reiziger wordt boos."
  pl: "Odpowiedz na każdą przed terminem: przeproś i wyjaśnij, zaproponuj zwrot lub bilet dobowy, obiecaj poprawę - albo ją zbądź, a pasażer się zezłości."
  ru: "Ответьте на каждую до срока: извинитесь и объясните, предложите возврат или дневной билет, пообещайте исправить — или отмахнитесь, и пассажир разозлится."
  uk: "Відповідайте на кожну до терміну: вибачтеся й поясніть, запропонуйте повернення чи денний квиток, пообіцяйте виправити — або відмахніться, і пасажир розлютиться."

# Late trips as the lateness model ran them: their minutes and real cause.
"I waited at the stop for line %{line} at %{time} and the bus came %{minutes} minutes late. I missed my connection!":
  de: "Ich habe an der Haltestelle auf die Linie %{line} um %{time} gewartet, und der Bus kam %{minutes} Minuten zu spät. Ich habe meinen Anschluss verpasst!"
  fr: "J'ai attendu la ligne %{line} de %{time} et le bus est arrivé avec %{minutes} minutes de retard. J'ai raté ma correspondance !"
  nl: "Ik stond te wachten op lijn %{line} van %{time} en de bus kwam %{minutes} minuten te laat. Ik heb mijn aansluiting gemist!"
  pl: "Czekałem na linię %{line} o %{time}, a autobus spóźnił się %{minutes} minut. Uciekła mi przesiadka!"
  ru: "Я ждал линию %{line} в %{time}, а автобус опоздал на %{minutes} минут. Я пропустил пересадку!"
  uk: "Я чекав лінію %{line} о %{time}, а автобус запізнився на %{minutes} хвилин. Я пропустив пересадку!"
"Your line %{line} at %{time} was %{minutes} minutes late. I was late for work because of it.":
  de: "Ihre Linie %{line} um %{time} war %{minutes} Minuten zu spät. Deshalb kam ich zu spät zur Arbeit."
  fr: "Votre ligne %{line} de %{time} avait %{minutes} minutes de retard. Je suis arrivé en retard au travail."
  nl: "Uw lijn %{line} van %{time} was %{minutes} minuten te laat. Daardoor kwam ik te laat op mijn werk."
  pl: "Wasza linia %{line} o %{time} spóźniła się %{minutes} minut. Przez to spóźniłem się do pracy."
  ru: "Ваша линия %{line} в %{time} опоздала на %{minutes} минут. Из-за неё я опоздал на работу."
  uk: "Ваша лінія %{line} о %{time} запізнилася на %{minutes} хвилин. Через неї я запізнився на роботу."
"We are sorry. The driver signed on late, so the bus left late.":
  de: "Es tut uns leid. Der Fahrer hat seinen Dienst zu spät angetreten, deshalb fuhr der Bus zu spät los."
  fr: "Nous sommes désolés. Le conducteur a pris son service en retard, donc le bus est parti en retard."
  nl: "Het spijt ons. De chauffeur meldde zich te laat, dus de bus vertrok te laat."
  pl: "Przepraszamy. Kierowca spóźnił się na służbę, więc autobus wyjechał z opóźnieniem."
  ru: "Нам жаль. Водитель поздно заступил на смену, и автобус отправился с опозданием."
  uk: "Нам шкода. Водій пізно заступив на зміну, тож автобус вирушив із запізненням."
"We are sorry. The bus came in late from its trip before and had too little layover to catch up.":
  de: "Es tut uns leid. Der Bus kam verspätet von der Fahrt davor und hatte zu wenig Wendezeit, um aufzuholen."
  fr: "Nous sommes désolés. Le bus est arrivé en retard de son trajet précédent et n'avait pas assez de battement pour rattraper."
  nl: "Het spijt ons. De bus kwam te laat binnen van de rit ervoor en had te weinig keertijd om in te lopen."
  pl: "Przepraszamy. Autobus przyjechał spóźniony z poprzedniego kursu i miał za mało postoju, by nadrobić."
  ru: "Нам жаль. Автобус пришёл с опозданием с предыдущего рейса, и отстоя не хватило, чтобы нагнать."
  uk: "Нам шкода. Автобус прийшов із запізненням з попереднього рейсу, і відстою не вистачило, щоб надолужити."
"We are sorry. The driver came from another duty that ran late.":
  de: "Es tut uns leid. Der Fahrer kam aus einem anderen Dienst, der sich verspätet hatte."
  fr: "Nous sommes désolés. Le conducteur venait d'un autre service qui avait du retard."
  nl: "Het spijt ons. De chauffeur kwam van een andere dienst die uitliep."
  pl: "Przepraszamy. Kierowca przyszedł z innej służby, która się przeciągnęła."
  ru: "Нам жаль. Водитель пришёл с другой смены, которая затянулась."
  uk: "Нам шкода. Водій прийшов з іншої зміни, яка затягнулася."
"We are sorry. A bus broke down and the one sent for it took time.":
  de: "Es tut uns leid. Ein Bus ist liegen geblieben, und der Ersatz brauchte seine Zeit."
  fr: "Nous sommes désolés. Un bus est tombé en panne et celui envoyé pour le remplacer a mis du temps."
  nl: "Het spijt ons. Een bus kreeg pech en de vervangende bus had tijd nodig."
  pl: "Przepraszamy. Autobus się zepsuł, a zastępczy jechał długo."
  ru: "Нам жаль. Автобус сломался, и замена шла долго."
  uk: "Нам шкода. Автобус зламався, і заміна їхала довго."
"We are sorry. The rush-hour traffic held the bus up more than the timetable allows.":
  de: "Es tut uns leid. Der Berufsverkehr hat den Bus stärker aufgehalten, als der Fahrplan erlaubt."
  fr: "Nous sommes désolés. La circulation de l'heure de pointe a retardé le bus plus que l'horaire ne le permet."
  nl: "Het spijt ons. Het spitsverkeer hield de bus meer op dan de dienstregeling toelaat."
  pl: "Przepraszamy. Korki w godzinach szczytu opóźniły autobus bardziej, niż pozwala rozkład."
  ru: "Нам жаль. Пробки в час пик задержали автобус сильнее, чем позволяет расписание."
  uk: "Нам шкода. Затори в годину пік затримали автобус сильніше, ніж дозволяє розклад."
"We are sorry. Traffic held the bus up.":
  de: "Es tut uns leid. Der Verkehr hat den Bus aufgehalten."
  fr: "Nous sommes désolés. La circulation a retardé le bus."
  nl: "Het spijt ons. Het verkeer hield de bus op."
  pl: "Przepraszamy. Korki opóźniły autobus."
  ru: "Нам жаль. Автобус задержали пробки."
  uk: "Нам шкода. Автобус затримали затори."
"We are sorry. The driver drove more slowly than the timetable needs.":
  de: "Es tut uns leid. Der Fahrer fuhr langsamer, als der Fahrplan es verlangt."
  fr: "Nous sommes désolés. Le conducteur a roulé plus lentement que l'horaire ne l'exige."
  nl: "Het spijt ons. De chauffeur reed langzamer dan de dienstregeling vraagt."
  pl: "Przepraszamy. Kierowca jechał wolniej, niż wymaga rozkład."
  ru: "Нам жаль. Водитель ехал медленнее, чем требует расписание."
  uk: "Нам шкода. Водій їхав повільніше, ніж вимагає розклад."
"We are sorry. The bus was in poor condition and could not keep to time.":
  de: "Es tut uns leid. Der Bus war in schlechtem Zustand und konnte die Zeit nicht halten."
  fr: "Nous sommes désolés. Le bus était en mauvais état et n'a pas pu tenir l'horaire."
  nl: "Het spijt ons. De bus was in slechte staat en kon de tijd niet halen."
  pl: "Przepraszamy. Autobus był w złym stanie i nie mógł utrzymać rozkładu."
  ru: "Нам жаль. Автобус был в плохом состоянии и не мог держать график."
  uk: "Нам шкода. Автобус був у поганому стані й не міг тримати графік."
"We are sorry. Roadworks or a diversion on the line held the bus up.":
  de: "Es tut uns leid. Baustellen oder eine Umleitung auf der Linie haben den Bus aufgehalten."
  fr: "Nous sommes désolés. Des travaux ou une déviation sur la ligne ont retardé le bus."
  nl: "Het spijt ons. Werkzaamheden of een omleiding op de lijn hielden de bus op."
  pl: "Przepraszamy. Roboty drogowe lub objazd na linii opóźniły autobus."
  ru: "Нам жаль. Ремонт дороги или объезд на линии задержали автобус."
  uk: "Нам шкода. Ремонт дороги чи об'їзд на лінії затримали автобус."
"We will make sure our drivers sign on in time.":
  de: "Wir sorgen dafür, dass unsere Fahrer ihren Dienst pünktlich antreten."
  fr: "Nous veillerons à ce que nos conducteurs prennent leur service à l'heure."
  nl: "We zorgen dat onze chauffeurs zich op tijd melden."
  pl: "Dopilnujemy, by nasi kierowcy zaczynali służbę na czas."
  ru: "Мы проследим, чтобы водители заступали на смену вовремя."
  uk: "Ми простежимо, щоб водії заступали на зміну вчасно."
"The driver will get more training on the route.":
  de: "Der Fahrer bekommt mehr Schulung auf der Strecke."
  fr: "Le conducteur sera davantage formé sur le parcours."
  nl: "De chauffeur krijgt meer training op de route."
  pl: "Kierowca przejdzie dodatkowe szkolenie na trasie."
  ru: "Водитель пройдёт дополнительное обучение на маршруте."
  uk: "Водій пройде додаткове навчання на маршруті."
"We will plan more time on line %{line} while the works last.":
  de: "Wir planen auf der Linie %{line} mehr Zeit ein, solange die Bauarbeiten dauern."
  fr: "Nous prévoirons plus de temps sur la ligne %{line} pendant les travaux."
  nl: "We plannen meer tijd in op lijn %{line} zolang de werkzaamheden duren."
  pl: "Zaplanujemy więcej czasu na linii %{line}, póki trwają roboty."
  ru: "Мы заложим больше времени на линии %{line}, пока идут работы."
  uk: "Ми закладемо більше часу на лінії %{line}, поки тривають роботи."
