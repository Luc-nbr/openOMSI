  de: "Jede Woche"
  fr: "Chaque semaine"
  nl: "Elke week"
  pl: "Co tydzień"
  ru: "Каждую неделю"
  uk: "Щотижня"
"Its own changes are replaced by the copy":
  de: "Seine eigenen Änderungen werden durch die Kopie ersetzt"
  fr: "Ses propres modifications sont remplacées par la copie"
  nl: "Zijn eigen wijzigingen worden door de kopie vervangen"
  pl: "Jego własne zmiany zastąpi kopia"
  ru: "Его собственные изменения заменит копия"
  uk: "Його власні зміни замінить копія"
"A day of another timetable takes only the trips that match (same line, way, departure and stops). The rest run as its timetable has them and are listed, to plan by hand.":
  de: "Ein Tag mit anderem Fahrplan übernimmt nur die passenden Fahrten (gleiche Linie, Richtung, Abfahrt und Haltestellen). Der Rest fährt, wie sein Fahrplan ihn hat, und wird aufgelistet, um ihn von Hand zu planen."
  fr: "Un jour d'un autre horaire ne prend que les courses qui correspondent (même ligne, sens, départ et arrêts). Les autres roulent comme son horaire les prévoit et sont listées, à planifier à la main."
  nl: "Een dag met een andere dienstregeling neemt alleen de ritten over die passen (zelfde lijn, richting, vertrek en haltes). De rest rijdt zoals zijn dienstregeling hem heeft en wordt opgesomd, om met de hand te plannen."
  pl: "Dzień z innym rozkładem przejmuje tylko pasujące kursy (ta sama linia, kierunek, odjazd i przystanki). Reszta jedzie tak, jak ma ją jego rozkład, i trafia na listę do zaplanowania ręcznie."
  ru: "День с другим расписанием берёт только совпадающие рейсы (та же линия, направление, отправление и остановки). Остальные идут по его расписанию и перечислены, чтобы спланировать их вручную."
  uk: "День з іншим розкладом бере лише рейси, що збігаються (та сама лінія, напрямок, відправлення й зупинки). Решта йде за його розкладом і перелічена, щоб спланувати її вручну."
"Your changes on %{days} are saved too.":
  de: "Ihre Änderungen an %{days} werden ebenfalls gespeichert."
  fr: "Vos modifications de %{days} sont enregistrées aussi."
  nl: "Uw wijzigingen op %{days} worden ook opgeslagen."
  pl: "Twoje zmiany w %{days} też zostaną zapisane."
  ru: "Ваши изменения в %{days} тоже сохраняются."
  uk: "Ваші зміни в %{days} теж зберігаються."
"Copied from %{day}":
  de: "Kopiert von %{day}"
  fr: "Copié depuis %{day}"
  nl: "Gekopieerd van %{day}"
  pl: "Skopiowano z %{day}"
  ru: "Скопировано с %{day}"
  uk: "Скопійовано з %{day}"
