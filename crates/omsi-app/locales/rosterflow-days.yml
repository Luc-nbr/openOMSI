  fr: "Roule selon l'horaire %{days}, pas celui de son jour de semaine : un jour férié ou un jour particulier"
  nl: "Rijdt de dienstregeling %{days}, niet die van zijn weekdag: een feestdag of een andere dag"
  pl: "Jeździ według rozkładu %{days}, nie swojego dnia tygodnia: święto albo inny dzień"
  ru: "Работает по расписанию «%{days}», а не своего дня недели: праздник или особый день"
  uk: "Працює за розкладом «%{days}», а не свого дня тижня: свято або особливий день"
