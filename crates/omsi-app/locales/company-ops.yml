# The company's Operations page (Luc 2026-10-15): service control on the company's day - the
# buses running late, the late drivers, the breakdowns, the ways to bring them back on time and
# what each comes to; the feed's and the inbox's words for it (`control`), the start screen's tile.
"Bus %{bus} on line %{n} turns back early on the %{time} trip":
  de: "Bus %{bus} auf Linie %{n} wendet bei der Fahrt um %{time} vorzeitig"
