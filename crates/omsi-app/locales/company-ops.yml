  nl: "Zo gelaten is hij vanaf de rit van %{time} vanzelf weer op tijd."
  pl: "Bez działania sam wróci do punktualności od kursu o %{time}."
  ru: "Если ничего не делать, он сам вернётся в график с рейса в %{time}."
  uk: "Якщо нічого не робити, він сам повернеться в графік з рейсу о %{time}."
