  fr: "Les conducteurs finissent leur service à"
  nl: "Chauffeurs melden zich af bij"
  pl: "Kierowcy kończą służbę w"
  ru: "Водители сдают смену в"
  uk: "Водії здають зміну в"
"Where the bus is, or a relief point that allows duties to begin and end there: the driver travels to the bus and back as Duty Travel has it. A duty can choose its own in its panel.":
  de: "Wo der Bus steht, oder ein Ablösepunkt, an dem Dienste beginnen und enden dürfen: der Fahrer kommt zum Bus und zurück, wie die Wegezeiten im Dienst es vorgeben. Ein Dienst kann in seinem Fenster einen eigenen wählen."
  fr: "Là où est le bus, ou un point de relève où les services peuvent commencer et finir : le conducteur rejoint le bus et en revient comme le disent les trajets en service. Un service peut choisir le sien dans son panneau."
  nl: "Waar de bus staat, of een aflospunt waar diensten mogen beginnen en eindigen: de chauffeur reist naar de bus en terug zoals Reizen in dienst het zegt. Een dienst kan in zijn paneel een eigen kiezen."
  pl: "Tam, gdzie stoi autobus, albo punkt zmiany, w którym służby mogą się zaczynać i kończyć: kierowca dojeżdża do autobusu i z powrotem tak, jak podają dojazdy w służbie. Służba może wybrać własny w swoim panelu."
  ru: "Там, где автобус, или пункт пересменки, где смены могут начинаться и заканчиваться: водитель добирается до автобуса и обратно, как задано в переездах в смене. Смена может выбрать свой в своей панели."
  uk: "Там, де автобус, або пункт перезміни, де зміни можуть починатися й закінчуватися: водій дістається до автобуса й назад, як задано в переїздах у зміні. Зміна може вибрати свій у своїй панелі."
