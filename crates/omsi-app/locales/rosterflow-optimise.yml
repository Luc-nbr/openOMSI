_version: 2
# RosterFlow's Optimise (testers, 2026-10-15: "optimise feature do not work in rosterflow"): what
# it did in words, or why it could not.
"Optimise makes neither the vehicles nor the duties now: switch one on in the Optimisation settings (the gear beside OPTIMIZE).":
  de: "Optimieren macht jetzt weder die Fahrzeuge noch die Dienste: Schalte eines davon in den Optimierungseinstellungen ein (das Zahnrad neben OPTIMIEREN)."
  fr: "L'optimisation ne fait maintenant ni les véhicules ni les services : activez l'un des deux dans les réglages de l'optimisation (l'engrenage à côté d'OPTIMISER)."
  nl: "Optimaliseren maakt nu de voertuigen noch de diensten: zet er een aan in de instellingen voor optimaliseren (het tandwiel naast OPTIMALISEREN)."
  pl: "Optymalizacja nie tworzy teraz ani pojazdów, ani służb: włącz jedno z nich w ustawieniach optymalizacji (koło zębate obok OPTYMALIZUJ)."
  ru: "Оптимизация сейчас не строит ни машины, ни смены: включите одно из них в настройках оптимизации (шестерёнка рядом с ОПТИМИЗИРОВАТЬ)."
  uk: "Оптимізація зараз не будує ні машин, ні змін: увімкніть одне з них у налаштуваннях оптимізації (шестірня біля ОПТИМІЗУВАТИ)."
"Nothing to optimise: no trips run on this day.":
  de: "Nichts zu optimieren: An diesem Tag fahren keine Fahrten."
  fr: "Rien à optimiser : aucun trajet ne circule ce jour-là."
  nl: "Niets te optimaliseren: op deze dag rijden geen ritten."
  pl: "Nie ma czego optymalizować: tego dnia nie ma kursów."
  ru: "Нечего оптимизировать: в этот день нет рейсов."
  uk: "Нічого оптимізувати: цього дня немає рейсів."
"Optimised: %{duties} duties on %{blocks} vehicles, %{cost} a day (your planning: %{was}).":
  de: "Optimiert: %{duties} Dienste auf %{blocks} Fahrzeugen, %{cost} am Tag (deine Planung: %{was})."
  fr: "Optimisé : %{duties} services sur %{blocks} véhicules, %{cost} par jour (votre planification : %{was})."
  nl: "Geoptimaliseerd: %{duties} diensten op %{blocks} voertuigen, %{cost} per dag (jouw planning: %{was})."
  pl: "Zoptymalizowano: %{duties} służb na %{blocks} pojazdach, %{cost} dziennie (twój plan: %{was})."
  ru: "Оптимизировано: смен %{duties} на %{blocks} машинах, %{cost} в день (ваш план: %{was})."
  uk: "Оптимізовано: змін %{duties} на %{blocks} машинах, %{cost} на день (ваш план: %{was})."
"No better plan found: your planning already costs the least by the preferences.":
  de: "Kein besserer Plan gefunden: Deine Planung kostet nach den Einstellungen schon am wenigsten."
  fr: "Aucun meilleur plan trouvé : votre planification coûte déjà le moins selon les préférences."
  nl: "Geen beter plan gevonden: jouw planning kost volgens de voorkeuren al het minst."
  pl: "Nie znaleziono lepszego planu: według preferencji twój plan kosztuje już najmniej."
  ru: "Лучшего плана не найдено: по предпочтениям ваш план уже обходится дешевле всего."
  uk: "Кращого плану не знайдено: за вподобаннями ваш план уже найдешевший."
"Hard rules broken: %{n}, against %{m} in your planning.":
  de: "Verletzte harte Regeln: %{n}, gegenüber %{m} in deiner Planung."
  fr: "Règles strictes enfreintes : %{n}, contre %{m} dans votre planification."
  nl: "Gebroken harde regels: %{n}, tegen %{m} in jouw planning."
  pl: "Złamane twarde zasady: %{n}, wobec %{m} w twoim planie."
  ru: "Нарушено жёстких правил: %{n}, против %{m} в вашем плане."
  uk: "Порушено жорстких правил: %{n}, проти %{m} у вашому плані."
"%{n} duties can't keep every hard rule, because of: %{why}.":
  de: "%{n} Dienste können nicht jede harte Regel einhalten, wegen: %{why}."
  fr: "%{n} services ne peuvent pas respecter toutes les règles strictes, à cause de : %{why}."
  nl: "%{n} diensten kunnen niet elke harde regel houden, vanwege: %{why}."
  pl: "%{n} służb nie może zachować każdej twardej zasady z powodu: %{why}."
  ru: "Смен, которые не могут соблюсти все жёсткие правила: %{n}, из-за: %{why}."
  uk: "Змін, які не можуть дотриматися всіх жорстких правил: %{n}, через: %{why}."
"%{n} vehicles have no relief point where drivers may change (Preferences › Relief Points).":
  de: "%{n} Fahrzeuge haben keinen Ablösepunkt, an dem Fahrer wechseln dürfen (Einstellungen › Ablösepunkte)."
  fr: "%{n} véhicules n'ont aucun point de relève où les conducteurs peuvent se relayer (Préférences › Points de relève)."
  nl: "%{n} voertuigen hebben geen aflospunt waar chauffeurs mogen wisselen (Voorkeuren › Aflospunten)."
  pl: "%{n} pojazdów nie ma punktu zmiany, w którym kierowcy mogą się zmienić (Preferencje › Punkty zmiany)."
  ru: "Машин без пункта пересменки, где водители могут смениться: %{n} (Предпочтения › Пункты пересменки)."
  uk: "Машин без пункту перезміни, де водії можуть змінитися: %{n} (Вподобання › Пункти перезміни)."
"Also broken: %{why}.":
  de: "Außerdem verletzt: %{why}."
  fr: "Également enfreint : %{why}."
  nl: "Ook gebroken: %{why}."
  pl: "Złamane także: %{why}."
  ru: "Также нарушено: %{why}."
  uk: "Також порушено: %{why}."
