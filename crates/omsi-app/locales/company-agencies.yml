"A booked driver is paid for what was booked even when he has no duty, as agencies bill. Cancelling is free until the day before; on the day itself the agency bills half.":
  de: "Ein gebuchter Fahrer wird für das Gebuchte bezahlt, auch ohne Dienst, wie Agenturen abrechnen. Stornieren ist bis zum Vortag kostenlos; am Tag selbst berechnet die Agentur die Hälfte."
  fr: "Un chauffeur réservé est payé pour ce qui a été réservé même sans service, comme les agences facturent. L'annulation est gratuite jusqu'à la veille ; le jour même, l'agence facture la moitié."
  nl: "Een geboekte chauffeur wordt betaald voor wat geboekt is, ook zonder dienst, zoals uitzendbureaus rekenen. Annuleren is gratis tot de dag ervoor; op de dag zelf rekent het bureau de helft."
  pl: "Zarezerwowany kierowca dostaje zapłatę za to, co zarezerwowano, nawet bez służby – tak liczą agencje. Anulowanie jest bezpłatne do dnia poprzedniego; w sam dzień agencja liczy połowę."
  ru: "Забронированному водителю платят за забронированное, даже если у него нет смены, – так считают агентства. Отмена бесплатна до предыдущего дня; в сам день агентство берёт половину."
  uk: "Заброньованому водієві платять за заброньоване, навіть якщо в нього немає зміни, – так рахують агентства. Скасування безкоштовне до попереднього дня; у сам день агентство бере половину."
