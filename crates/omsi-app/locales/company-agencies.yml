"Booking cancelled on its day: the agency bills %{amount}.":
  de: "Buchung am selben Tag storniert: die Agentur berechnet %{amount}."
  fr: "Réservation annulée le jour même : l'agence facture %{amount}."
  nl: "Boeking op de dag zelf geannuleerd: het bureau rekent %{amount}."
  pl: "Rezerwacja anulowana w jej dniu: agencja liczy %{amount}."
  ru: "Бронь отменена в её день: агентство берёт %{amount}."
  uk: "Бронювання скасовано в його день: агентство бере %{amount}."
"Booking cancelled: it costs nothing.":
  de: "Buchung storniert: es kostet nichts."
  fr: "Réservation annulée : cela ne coûte rien."
  nl: "Boeking geannuleerd: het kost niets."
  pl: "Rezerwacja anulowana: nic to nie kosztuje."
  ru: "Бронь отменена: это ничего не стоит."
  uk: "Бронювання скасовано: це нічого не коштує."
"Cancelled today the agency bills %{amount}":
  de: "Heute storniert berechnet die Agentur %{amount}"
  fr: "Annulée aujourd'hui, l'agence facture %{amount}"
  nl: "Vandaag geannuleerd rekent het bureau %{amount}"
  pl: "Anulowana dziś – agencja policzy %{amount}"
  ru: "При отмене сегодня агентство возьмёт %{amount}"
  uk: "У разі скасування сьогодні агентство візьме %{amount}"
"Days just gone":
  de: "Die letzten Tage"
  fr: "Les jours passés"
  nl: "De afgelopen dagen"
  pl: "Ostatnie dni"
  ru: "Прошедшие дни"
  uk: "Минулі дні"
"Each is paid for %{h}, and for more when he drives more.":
  de: "Jeder wird für %{h} bezahlt, und für mehr, wenn er mehr fährt."
  fr: "Chacun est payé pour %{h}, et davantage s'il conduit davantage."
  nl: "Elk wordt betaald voor %{h}, en voor meer als hij meer rijdt."
  pl: "Każdy dostaje zapłatę za %{h}, a za więcej, gdy jeździ więcej."
  ru: "Каждому платят за %{h}, а если водит больше – за больше."
  uk: "Кожному платять за %{h}, а якщо водить більше – за більше."
"Each is paid for these hours (%{h} at least) and drives only within them.":
  de: "Jeder wird für diese Stunden bezahlt (mindestens %{h}) und fährt nur innerhalb von ihnen."
  fr: "Chacun est payé pour ces heures (au moins %{h}) et ne conduit que pendant celles-ci."
  nl: "Elk wordt betaald voor deze uren (minstens %{h}) en rijdt alleen binnen die uren."
  pl: "Każdy dostaje zapłatę za te godziny (co najmniej %{h}) i jeździ tylko w ich obrębie."
  ru: "Каждому платят за эти часы (не меньше %{h}), и водит он только в них."
  uk: "Кожному платять за ці години (щонайменше %{h}), і водить він лише в них."
"How many drivers":
  de: "Wie viele Fahrer"
  fr: "Combien de chauffeurs"
  nl: "Hoeveel chauffeurs"
  pl: "Ilu kierowców"
  ru: "Сколько водителей"
  uk: "Скільки водіїв"
"No agency drivers are booked. Book them here for a day ahead, or send one on the day itself from the Roster tab.":
  de: "Es sind keine Leihfahrer gebucht. Buchen Sie sie hier für einen kommenden Tag, oder lassen Sie am Tag selbst einen über den Reiter Dienstplan kommen."
  fr: "Aucun intérimaire n'est réservé. Réservez-les ici pour un jour à venir, ou faites-en venir un le jour même depuis l'onglet Roulement."
  nl: "Er zijn geen uitzendkrachten geboekt. Boek ze hier voor een komende dag, of laat er op de dag zelf een komen via het tabblad Rooster."
  pl: "Nie zarezerwowano kierowców z agencji. Zarezerwuj ich tutaj na nadchodzący dzień albo wezwij jednego w sam dzień w karcie Grafik."
  ru: "Водители из агентства не забронированы. Забронируйте их здесь на день вперёд или вызовите одного в сам день на вкладке «График»."
  uk: "Водіїв з агентства не заброньовано. Забронюйте їх тут на день наперед або викличте одного в сам день на вкладці «Графік»."
"No duty of this day is open.":
  de: "Kein Dienst dieses Tages ist offen."
  fr: "Aucun service de ce jour n'est ouvert."
  nl: "Geen dienst van deze dag staat open."
  pl: "Żadna służba tego dnia nie jest otwarta."
  ru: "В этот день открытых смен нет."
  uk: "Цього дня відкритих змін немає."
"On their day they are among the drivers of the Roster tab: give them duties there, or let the dispatcher and Fill the roster take them first for what is open.":
  de: "An ihrem Tag stehen sie unter den Fahrern des Reiters Dienstplan: geben Sie ihnen dort Dienste, oder lassen Sie den Disponenten und Dienstplan füllen sie zuerst für das Offene nehmen."
  fr: "Le jour venu, ils figurent parmi les chauffeurs de l'onglet Roulement : confiez-leur des services là-bas, ou laissez le régulateur et Remplir le roulement les prendre en premier pour ce qui est ouvert."
  nl: "Op hun dag staan ze tussen de chauffeurs van het tabblad Rooster: geef ze daar diensten, of laat de planner en Rooster vullen hen eerst nemen voor wat open staat."
  pl: "W swoim dniu są wśród kierowców w karcie Grafik: przydziel im tam służby albo pozwól dyspozytorowi i funkcji Wypełnij grafik brać ich najpierw do tego, co otwarte."
  ru: "В свой день они среди водителей вкладки «График»: дайте им там смены или пусть диспетчер и «Заполнить график» берут их первыми на открытое."
  uk: "У свій день вони серед водіїв вкладки «Графік»: дайте їм там зміни або нехай диспетчер і «Заповнити графік» беруть їх першими на відкрите."
"Paid at the close: %{amount} booked":
  de: "Beim Tagesabschluss bezahlt: %{amount} gebucht"
  fr: "Payé à la clôture : %{amount} réservés"
  nl: "Betaald bij de afsluiting: %{amount} geboekt"
  pl: "Zapłacono przy zamknięciu: zarezerwowano za %{amount}"
  ru: "Оплачено при закрытии дня: забронировано на %{amount}"
  uk: "Оплачено під час закриття дня: заброньовано на %{amount}"
"Pick the duties they come for.":
  de: "Wählen Sie die Dienste, für die sie kommen."
  fr: "Choisissez les services pour lesquels ils viennent."
  nl: "Kies de diensten waarvoor ze komen."
  pl: "Wybierz służby, na które przychodzą."
  ru: "Выберите смены, на которые они приходят."
  uk: "Виберіть зміни, на які вони приходять."
"The duties are given to them by the working-time rules; each is paid for his duties' hours (%{h} at least).":
  de: "Die Dienste werden ihnen nach den Arbeitszeitregeln gegeben; jeder wird für die Stunden seiner Dienste bezahlt (mindestens %{h})."
  fr: "Les services leur sont confiés selon les règles du temps de travail ; chacun est payé pour les heures de ses services (au moins %{h})."
  nl: "De diensten worden hun gegeven volgens de arbeidstijdregels; elk wordt betaald voor de uren van zijn diensten (minstens %{h})."
  pl: "Służby są im przydzielane według zasad czasu pracy; każdy dostaje zapłatę za godziny swoich służb (co najmniej %{h})."
  ru: "Смены раздаются им по правилам рабочего времени; каждому платят за часы его смен (не меньше %{h})."
  uk: "Зміни роздаються їм за правилами робочого часу; кожному платять за години його змін (щонайменше %{h})."
"The duties of days more than a week ahead are not read yet: book them for a whole day or some hours.":
  de: "Die Dienste von Tagen, die mehr als eine Woche entfernt sind, sind noch nicht gelesen: buchen Sie für einen ganzen Tag oder einige Stunden."
  fr: "Les services des jours à plus d'une semaine ne sont pas encore lus : réservez pour une journée entière ou quelques heures."
  nl: "De diensten van dagen meer dan een week vooruit zijn nog niet gelezen: boek voor een hele dag of een paar uur."
  pl: "Służby dni odległych o ponad tydzień nie są jeszcze wczytane: rezerwuj na cały dzień lub kilka godzin."
  ru: "Смены дней дальше чем через неделю ещё не прочитаны: бронируйте на весь день или на несколько часов."
  uk: "Зміни днів далі ніж за тиждень ще не прочитано: бронюйте на весь день або на кілька годин."
"There is no limit to how many you book: only the cash.":
  de: "Wie viele Sie buchen, ist nicht begrenzt: nur durch das Geld."
  fr: "Il n'y a pas de limite au nombre de réservations : seulement la trésorerie."
  nl: "Er is geen grens aan hoeveel je boekt: alleen het geld."
  pl: "Nie ma limitu, ilu zarezerwujesz: liczy się tylko gotówka."
  ru: "Ограничения на число броней нет: только деньги."
  uk: "Обмеження на кількість бронювань немає: лише гроші."
