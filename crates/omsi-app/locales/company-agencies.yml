_version: 2
# The agency drivers booked ahead for a day (the Staff page's Agencies tab, `co::agency`), and the
# agency without its daily limit in the Roster tab and the planning.
"Agency drivers are booked from tomorrow on. For today, give a duty to an agency driver in the Roster tab.":
  de: "Leihfahrer werden ab morgen gebucht. Für heute geben Sie einen Dienst im Reiter Dienstplan einem Leihfahrer."
  fr: "Les chauffeurs intérimaires se réservent à partir de demain. Pour aujourd'hui, confiez un service à un intérimaire dans l'onglet Roulement."
  nl: "Uitzendkrachten boek je vanaf morgen. Geef voor vandaag een dienst aan een uitzendkracht in het tabblad Rooster."
  pl: "Kierowców z agencji rezerwuje się od jutra. Na dziś przydziel służbę kierowcy z agencji w karcie Grafik."
  ru: "Водителей из агентства бронируют начиная с завтра. На сегодня отдайте смену водителю из агентства на вкладке «График»."
  uk: "Водіїв з агентства бронюють починаючи із завтра. На сьогодні віддайте зміну водієві з агентства на вкладці «Графік»."
"The agency takes bookings up to six weeks ahead.":
  de: "Die Agentur nimmt Buchungen bis zu sechs Wochen im Voraus an."
  fr: "L'agence accepte les réservations jusqu'à six semaines à l'avance."
  nl: "Het uitzendbureau neemt boekingen aan tot zes weken vooruit."
  pl: "Agencja przyjmuje rezerwacje do sześciu tygodni naprzód."
  ru: "Агентство принимает брони не более чем на шесть недель вперёд."
  uk: "Агентство приймає бронювання не більш ніж на шість тижнів наперед."
"Book between 1 and 99 drivers at a time.":
  de: "Buchen Sie 1 bis 99 Fahrer auf einmal."
  fr: "Réservez entre 1 et 99 chauffeurs à la fois."
  nl: "Boek 1 tot 99 chauffeurs tegelijk."
  pl: "Rezerwuj od 1 do 99 kierowców naraz."
  ru: "Бронируйте от 1 до 99 водителей за раз."
  uk: "Бронюйте від 1 до 99 водіїв за раз."
"The hours booked must last an hour at least, within the day.":
  de: "Die gebuchten Stunden müssen mindestens eine Stunde dauern, innerhalb des Tages."
  fr: "Les heures réservées doivent durer au moins une heure, dans la journée."
  nl: "De geboekte uren moeten minstens een uur duren, binnen de dag."
  pl: "Zarezerwowane godziny muszą trwać co najmniej godzinę, w obrębie dnia."
  ru: "Забронированные часы должны длиться не меньше часа, в пределах дня."
  uk: "Заброньовані години мають тривати щонайменше годину, у межах дня."
"This booking's day is over: it can no longer be cancelled.":
  de: "Der Tag dieser Buchung ist vorbei: sie kann nicht mehr storniert werden."
  fr: "Le jour de cette réservation est passé : elle ne peut plus être annulée."
  nl: "De dag van deze boeking is voorbij: ze kan niet meer geannuleerd worden."
  pl: "Dzień tej rezerwacji minął: nie można jej już anulować."
  ru: "День этой брони прошёл: отменить её уже нельзя."
  uk: "День цього бронювання минув: скасувати його вже не можна."
"This booking is no longer there.":
  de: "Diese Buchung gibt es nicht mehr."
  fr: "Cette réservation n'existe plus."
  nl: "Deze boeking bestaat niet meer."
  pl: "Tej rezerwacji już nie ma."
  ru: "Этой брони больше нет."
  uk: "Цього бронювання більше немає."
