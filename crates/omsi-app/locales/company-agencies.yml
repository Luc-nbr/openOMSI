  de: "Gebucht: %{n} Leihfahrer für %{date} (%{amount})."
  fr: "Réservé : %{n} intérimaires pour le %{date} (%{amount})."
  nl: "Geboekt: %{n} uitzendkrachten voor %{date} (%{amount})."
  pl: "Zarezerwowano kierowców z agencji na %{date}: %{n} (%{amount})."
  ru: "Забронировано водителей из агентства на %{date}: %{n} (%{amount})."
  uk: "Заброньовано водіїв з агентства на %{date}: %{n} (%{amount})."
