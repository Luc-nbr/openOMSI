"Booked ahead an agency driver costs %{rate} an hour; one sent on the day itself %{same}.":
  de: "Im Voraus gebucht kostet ein Leihfahrer %{rate} pro Stunde; einer, der am Tag selbst geschickt wird, %{same}."
  fr: "Réservé à l'avance, un intérimaire coûte %{rate} de l'heure ; envoyé le jour même, %{same}."
  nl: "Vooruit geboekt kost een uitzendkracht %{rate} per uur; een die op de dag zelf komt %{same}."
  pl: "Zarezerwowany z wyprzedzeniem kierowca z agencji kosztuje %{rate} za godzinę; przysłany w sam dzień – %{same}."
  ru: "Водитель из агентства, забронированный заранее, стоит %{rate} в час; присланный в сам день – %{same}."
  uk: "Водій з агентства, заброньований заздалегідь, коштує %{rate} на годину; надісланий у сам день – %{same}."
