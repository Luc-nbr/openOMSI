_version: 2
# RosterFlow's Roster tab after Beta 56's testers: an agency driver for the whole duty in the list
# of who drives it and in the duty's menu (with what it costs), one plain button on top of the
# side panel to take a driver or a bus off.
"%{amount} for this duty, every %{day}":
  de: "%{amount} für diesen Dienst, jede Woche (%{day})"
  fr: "%{amount} pour ce service, chaque semaine (%{day})"
  nl: "%{amount} voor deze dienst, elke week (%{day})"
  pl: "%{amount} za tę służbę, co tydzień (%{day})"
  ru: "%{amount} за эту смену, каждую неделю (%{day})"
  uk: "%{amount} за цю зміну, щотижня (%{day})"
"Unassign %{who}":
  de: "%{who} entfernen"
  fr: "Retirer %{who}"
  nl: "%{who} weghalen"
  pl: "Zdejmij: %{who}"
  ru: "Снять: %{who}"
  uk: "Зняти: %{who}"
"Unassign bus %{bus}":
  de: "Bus %{bus} entfernen"
  fr: "Retirer le bus %{bus}"
  nl: "Bus %{bus} weghalen"
  pl: "Zdejmij autobus %{bus}"
  ru: "Снять автобус %{bus}"
  uk: "Зняти автобус %{bus}"
"Cancel the rental bus":
  de: "Mietbus abbestellen"
  fr: "Annuler le bus de location"
  nl: "Huurbus afzeggen"
  pl: "Anuluj autobus z wypożyczalni"
  ru: "Отменить арендованный автобус"
  uk: "Скасувати орендований автобус"
"Take it off (Delete)":
  de: "Entfernen (Entf)"
  fr: "Le retirer (Suppr)"
  nl: "Weghalen (Delete)"
  pl: "Zdejmij (Delete)"
  ru: "Снять (Delete)"
  uk: "Зняти (Delete)"
"Give to an agency driver":
  de: "An einen Leihfahrer geben"
  fr: "Confier à un chauffeur intérimaire"
  nl: "Aan een uitzendkracht geven"
  pl: "Przydziel kierowcy z agencji"
  ru: "Отдать водителю из агентства"
  uk: "Віддати водію з агентства"
"RosterFlow has changes of this day not saved: this tab and the day run the saved duties. Save them to plan with them here.":
  de: "RosterFlow hat nicht gespeicherte Änderungen an diesem Tag: dieser Reiter und der Tag selbst laufen mit den gespeicherten Diensten. Speichern Sie sie, um hier mit ihnen zu planen."
  fr: "RosterFlow a des modifications de ce jour non enregistrées : cet onglet et la journée utilisent les services enregistrés. Enregistrez-les pour planifier avec elles ici."
  nl: "RosterFlow heeft niet-opgeslagen wijzigingen van deze dag: dit tabblad en de dag zelf draaien de opgeslagen diensten. Sla ze op om er hier mee te plannen."
  pl: "RosterFlow ma niezapisane zmiany tego dnia: ta karta i sam dzień korzystają z zapisanych służb. Zapisz je, aby planować z nimi tutaj."
  ru: "В RosterFlow есть несохранённые изменения этого дня: эта вкладка и сам день идут по сохранённым сменам. Сохраните их, чтобы планировать с ними здесь."
  uk: "У RosterFlow є незбережені правки цього дня: ця вкладка і сам день ідуть за збереженими змінами. Збережіть їх, щоб планувати з ними тут."
