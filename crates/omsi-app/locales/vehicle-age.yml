"The plate %{plate} was first registered between %{from} and %{to}.":
  de: "Das Kennzeichen %{plate} wurde zwischen %{from} und %{to} erstmals zugelassen."
  fr: "La plaque %{plate} a été immatriculée pour la première fois entre %{from} et %{to}."
  nl: "Het kenteken %{plate} is voor het eerst geregistreerd tussen %{from} en %{to}."
  pl: "Tablica %{plate} została po raz pierwszy zarejestrowana między %{from} a %{to}."
  ru: "Номер %{plate} впервые зарегистрирован между %{from} и %{to}."
  uk: "Номер %{plate} уперше зареєстровано між %{from} і %{to}."
"You set the date of first registration yourself.":
  de: "Du hast das Datum der Erstzulassung selbst festgelegt."
  fr: "Vous avez fixé vous-même la date de première immatriculation."
  nl: "Je hebt de datum van eerste registratie zelf ingesteld."
  pl: "Datę pierwszej rejestracji ustawiłeś sam."
  ru: "Вы сами задали дату первой регистрации."
  uk: "Ви самі задали дату першої реєстрації."
"Registered new by the company.":
  de: "Vom Betrieb neu zugelassen."
  fr: "Immatriculé neuf par l'entreprise."
  nl: "Nieuw geregistreerd door het bedrijf."
  pl: "Zarejestrowany jako nowy przez firmę."
  ru: "Зарегистрирован новым компанией."
  uk: "Зареєстровано новим компанією."
"The age follows the model's era: its plate does not tell it. Set it yourself if you know it.":
  de: "Das Alter folgt der Bauzeit des Modells: Das Kennzeichen verrät es nicht. Lege es selbst fest, wenn du es weißt."
  fr: "L'âge suit l'époque du modèle : la plaque ne le dit pas. Fixez-le vous-même si vous le connaissez."
  nl: "De leeftijd volgt het tijdperk van het model: het kenteken zegt het niet. Stel hem zelf in als je hem weet."
  pl: "Wiek wynika z okresu produkcji modelu: tablica go nie podaje. Ustaw go sam, jeśli go znasz."
  ru: "Возраст следует эпохе модели: номер его не сообщает. Задайте его сами, если знаете."
  uk: "Вік відповідає епосі моделі: номер його не вказує. Задайте його самі, якщо знаєте."
"The model's plate list tells no age: the age is the market's. Set it yourself if you know it.":
  de: "Die Kennzeichenliste des Modells verrät kein Alter: Das Alter ist das des Marktes. Lege es selbst fest, wenn du es weißt."
  fr: "La liste de plaques du modèle ne donne pas d'âge : l'âge est celui du marché. Fixez-le vous-même si vous le connaissez."
  nl: "De kentekenlijst van het model zegt geen leeftijd: de leeftijd is die van de markt. Stel hem zelf in als je hem weet."
  pl: "Lista tablic modelu nie podaje wieku: wiek pochodzi z rynku. Ustaw go sam, jeśli go znasz."
  ru: "Список номеров модели не сообщает возраст: возраст задан рынком. Задайте его сами, если знаете."
  uk: "Список номерів моделі не вказує вік: вік задано ринком. Задайте його самі, якщо знаєте."
"European plates do not tell a bus's age: the age is the market's. Set it yourself if you know it.":
  de: "Europäische Kennzeichen verraten das Alter eines Busses nicht: Das Alter ist das des Marktes. Lege es selbst fest, wenn du es weißt."
  fr: "Les plaques européennes ne disent pas l'âge d'un bus : l'âge est celui du marché. Fixez-le vous-même si vous le connaissez."
  nl: "Europese kentekens zeggen niets over de leeftijd van een bus: de leeftijd is die van de markt. Stel hem zelf in als je hem weet."
  pl: "Europejskie tablice nie podają wieku autobusu: wiek pochodzi z rynku. Ustaw go sam, jeśli go znasz."
  ru: "Европейские номера не сообщают возраст автобуса: возраст задан рынком. Задайте его сами, если знаете."
  uk: "Європейські номери не вказують вік автобуса: вік задано ринком. Задайте його самі, якщо знаєте."
"set by you":
  de: "von dir festgelegt"
  fr: "fixé par vous"
  nl: "door jou ingesteld"
  pl: "ustawione przez ciebie"
  ru: "задано вами"
  uk: "задано вами"
"New price %{new} × %{age} for %{years} × %{km} for the kilometres × %{condition} for the condition = %{market}.":
  de: "Neupreis %{new} × %{age} für %{years} × %{km} für die Kilometer × %{condition} für den Zustand = %{market}."
  fr: "Prix neuf %{new} × %{age} pour %{years} × %{km} pour les kilomètres × %{condition} pour l'état = %{market}."
  nl: "Nieuwprijs %{new} × %{age} voor %{years} × %{km} voor de kilometers × %{condition} voor de staat = %{market}."
  pl: "Cena nowego %{new} × %{age} za %{years} × %{km} za kilometry × %{condition} za stan = %{market}."
  ru: "Цена нового %{new} × %{age} за %{years} × %{km} за пробег × %{condition} за состояние = %{market}."
  uk: "Ціна нового %{new} × %{age} за %{years} × %{km} за пробіг × %{condition} за стан = %{market}."
"Never more than what was paid for it less what it lost since: %{amount}.":
  de: "Nie mehr als der Kaufpreis abzüglich des Verlusts seitdem: %{amount}."
  fr: "Jamais plus que le prix payé moins ce qu'il a perdu depuis : %{amount}."
  nl: "Nooit meer dan wat ervoor betaald is min wat hij sindsdien verloor: %{amount}."
  pl: "Nigdy więcej niż zapłacono minus to, co od tego czasu stracił: %{amount}."
  ru: "Никогда не больше уплаченного за вычетом потерянного с тех пор: %{amount}."
  uk: "Ніколи не більше сплаченого за вирахуванням втраченого відтоді: %{amount}."
"Set the age yourself":
  de: "Alter selbst festlegen"
  fr: "Fixer l'âge soi-même"
  nl: "Leeftijd zelf instellen"
  pl: "Ustaw wiek samodzielnie"
  ru: "Задать возраст самому"
  uk: "Задати вік самому"
"Year of first registration":
  de: "Jahr der Erstzulassung"
  fr: "Année de première immatriculation"
  nl: "Jaar van eerste registratie"
  pl: "Rok pierwszej rejestracji"
  ru: "Год первой регистрации"
  uk: "Рік першої реєстрації"
"Over what the plate or the market says: its value and running costs follow the year you type.":
  de: "Statt dessen, was Kennzeichen oder Markt sagen: Wert und Betriebskosten folgen dem eingegebenen Jahr."
  fr: "À la place de ce que disent la plaque ou le marché : sa valeur et ses coûts d'exploitation suivent l'année saisie."
  nl: "In plaats van wat het kenteken of de markt zegt: waarde en bedrijfskosten volgen het jaar dat je typt."
  pl: "Zamiast tego, co mówi tablica lub rynek: wartość i koszty eksploatacji wynikają z wpisanego roku."
  ru: "Вместо того, что говорят номер или рынок: стоимость и расходы следуют введённому году."
  uk: "Замість того, що кажуть номер або ринок: вартість і витрати відповідають введеному року."
"Type a year of first registration, as 2015.":
  de: "Gib ein Jahr der Erstzulassung ein, etwa 2015."
  fr: "Saisissez une année de première immatriculation, comme 2015."
  nl: "Typ een jaar van eerste registratie, zoals 2015."
  pl: "Wpisz rok pierwszej rejestracji, np. 2015."
  ru: "Введите год первой регистрации, например 2015."
  uk: "Введіть рік першої реєстрації, наприклад 2015."
