  de: "Flottenwert nach Alter"
  fr: "Valeur de la flotte par âge"
  nl: "Vlootwaarde naar leeftijd"
  pl: "Wartość floty według wieku"
  ru: "Стоимость парка по возрасту"
  uk: "Вартість парку за віком"
"By age band: what the buses cost new, are worth and lost":
  de: "Nach Altersgruppe: was die Busse neu kosteten, wert sind und verloren"
  fr: "Par tranche d'âge : ce que les bus ont coûté neufs, valent et ont perdu"
  nl: "Per leeftijdsgroep: wat de bussen nieuw kostten, waard zijn en verloren"
  pl: "Według grup wieku: ile autobusy kosztowały nowe, są warte i straciły"
  ru: "По возрастным группам: сколько автобусы стоили новыми, стоят и потеряли"
  uk: "За віковими групами: скільки автобуси коштували новими, коштують і втратили"
"A bus loses some 18 % in its first year, then 8-10 % of its new price a year, less as it ages, to a tenth of it at 15-18 years; more kilometres than usual and a worse condition take off more. It is never worth more than the company paid for it. Hover over a band for its buses.":
  de: "Ein Bus verliert im ersten Jahr rund 18 %, danach 8-10 % seines Neupreises im Jahr, mit dem Alter weniger, bis auf ein Zehntel nach 15-18 Jahren; mehr Kilometer als üblich und ein schlechterer Zustand ziehen mehr ab. Er ist nie mehr wert, als der Betrieb bezahlt hat. Fahre über eine Gruppe für ihre Busse."
  fr: "Un bus perd environ 18 % la première année, puis 8-10 % de son prix neuf par an, moins avec l'âge, jusqu'à un dixième à 15-18 ans ; plus de kilomètres que d'habitude et un moins bon état retirent davantage. Il ne vaut jamais plus que ce que l'entreprise a payé. Survolez une tranche pour voir ses bus."
  nl: "Een bus verliest in het eerste jaar zo'n 18 %, daarna 8-10 % van zijn nieuwprijs per jaar, minder naarmate hij ouder wordt, tot een tiende na 15-18 jaar; meer kilometers dan gewoon en een slechtere staat trekken er meer af. Hij is nooit meer waard dan het bedrijf ervoor betaalde. Ga over een groep voor zijn bussen."
  pl: "Autobus traci około 18 % w pierwszym roku, potem 8-10 % ceny nowego rocznie, z wiekiem mniej, do jednej dziesiątej po 15-18 latach; więcej kilometrów niż zwykle i gorszy stan odejmują więcej. Nigdy nie jest wart więcej, niż firma za niego zapłaciła. Najedź na grupę, aby zobaczyć jej autobusy."
  ru: "Автобус теряет около 18 % в первый год, затем 8-10 % цены нового в год, с возрастом меньше, до десятой части к 15-18 годам; пробег выше обычного и худшее состояние отнимают больше. Он никогда не стоит больше, чем за него заплатила компания. Наведите на группу, чтобы увидеть её автобусы."
  uk: "Автобус втрачає близько 18 % у перший рік, далі 8-10 % ціни нового на рік, з віком менше, до десятої частини у 15-18 років; пробіг понад звичайний і гірший стан віднімають більше. Він ніколи не коштує більше, ніж за нього заплатила компанія. Наведіть на групу, щоб побачити її автобуси."
"%{n} leased or rented buses are not the company's and have no value here.":
  de: "%{n} geleaste oder gemietete Busse gehören nicht dem Betrieb und haben hier keinen Wert."
  fr: "%{n} bus en leasing ou loués n'appartiennent pas à l'entreprise et n'ont pas de valeur ici."
  nl: "%{n} geleasede of gehuurde bussen zijn niet van het bedrijf en hebben hier geen waarde."
  pl: "%{n} autobusów w leasingu lub wynajmie nie należy do firmy i nie ma tu wartości."
  ru: "%{n} автобусов в лизинге или аренде не принадлежат компании и здесь не имеют стоимости."
  uk: "%{n} автобусів у лізингу чи оренді не належать компанії й тут не мають вартості."
