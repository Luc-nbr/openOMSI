"Money is shown and typed in this currency. Changing it changes no balance: the amounts keep their value.":
  de: "Geld wird in dieser Währung angezeigt und eingegeben. Ein Wechsel ändert kein Guthaben: Die Beträge behalten ihren Wert."
  fr: "L'argent est affiché et saisi dans cette devise. En changer ne modifie aucun solde : les montants gardent leur valeur."
  nl: "Geld wordt in deze valuta getoond en ingetypt. Wisselen verandert geen saldo: de bedragen houden hun waarde."
  pl: "Pieniądze są pokazywane i wpisywane w tej walucie. Zmiana nie zmienia żadnego salda: kwoty zachowują swoją wartość."
  ru: "Деньги показываются и вводятся в этой валюте. Смена валюты не меняет баланс: суммы сохраняют свою стоимость."
  uk: "Гроші показуються та вводяться в цій валюті. Зміна валюти не змінює баланс: суми зберігають свою вартість."
"The company's money is shown in %{currency} now: %{amount} in the bank.":
  de: "Das Geld des Unternehmens wird jetzt in %{currency} angezeigt: %{amount} auf dem Konto."
  fr: "L'argent de l'entreprise est maintenant affiché en %{currency} : %{amount} en banque."
  nl: "Het geld van het bedrijf wordt nu in %{currency} getoond: %{amount} op de bank."
  pl: "Pieniądze firmy są teraz pokazywane w walucie %{currency}: %{amount} w banku."
  ru: "Деньги компании теперь показываются в валюте %{currency}: %{amount} на счёте."
  uk: "Гроші компанії тепер показуються у валюті %{currency}: %{amount} на рахунку."
"For example %{amount} - or ask for a discount first.":
  de: "Zum Beispiel %{amount} - oder fragen Sie zuerst nach einem Rabatt."
  fr: "Par exemple %{amount} - ou demandez d'abord une remise."
  nl: "Bijvoorbeeld %{amount} - of vraag eerst om korting."
  pl: "Na przykład %{amount} - albo najpierw poproś o rabat."
  ru: "Например, %{amount} - или сначала попросите скидку."
  uk: "Наприклад, %{amount} - або спершу попросіть знижку."
"Ask at least %{amount}.":
  de: "Bieten Sie mindestens %{amount}."
  fr: "Demandez au moins %{amount}."
  nl: "Vraag minstens %{amount}."
  pl: "Zaproponuj co najmniej %{amount}."
  ru: "Заявите не меньше %{amount}."
  uk: "Заявіть не менше %{amount}."
