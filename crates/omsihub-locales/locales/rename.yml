"Omsi-Hub plays the content of an OMSI 2 installation: the original game must be installed (Steam or another copy).":
  de: "Omsi-Hub spielt die Inhalte einer OMSI-2-Installation: Das Originalspiel muss installiert sein (Steam oder eine andere Kopie)."
  fr: "Omsi-Hub utilise le contenu d'une installation d'OMSI 2 : le jeu original doit être installé (Steam ou une autre copie)."
  nl: "Omsi-Hub speelt de inhoud van een OMSI 2-installatie: het originele spel moet geïnstalleerd zijn (Steam of een andere kopie)."
  pl: "Omsi-Hub korzysta z zawartości instalacji OMSI 2: oryginalna gra musi być zainstalowana (Steam lub inna kopia)."
  ru: "Omsi-Hub использует контент установленной OMSI 2: оригинальная игра должна быть установлена (Steam или другая копия)."
  uk: "Omsi-Hub використовує вміст установленої OMSI 2: оригінальна гра має бути встановлена (Steam або інша копія)."
"Copy a font into Omsi-Hub's content folder: an OMSI .oft with its bitmaps, or a TrueType / OpenType font (.ttf, .otf, .ttc)":
  de: "Eine Schrift in den Inhaltsordner von Omsi-Hub kopieren: eine OMSI-.oft mit ihren Bitmaps oder eine TrueType-/OpenType-Schrift (.ttf, .otf, .ttc)"
  fr: "Copier une police dans le dossier de contenu d'Omsi-Hub : un .oft d'OMSI avec ses bitmaps, ou une police TrueType / OpenType (.ttf, .otf, .ttc)"
  nl: "Een lettertype naar de contentmap van Omsi-Hub kopiëren: een OMSI-.oft met zijn bitmaps, of een TrueType-/OpenType-lettertype (.ttf, .otf, .ttc)"
  pl: "Skopiuj czcionkę do folderu zawartości Omsi-Hub: plik .oft z OMSI z jego bitmapami albo czcionkę TrueType / OpenType (.ttf, .otf, .ttc)"
  ru: "Скопировать шрифт в папку контента Omsi-Hub: .oft из OMSI с его растровыми файлами или шрифт TrueType / OpenType (.ttf, .otf, .ttc)"
  uk: "Скопіювати шрифт у папку контенту Omsi-Hub: .oft з OMSI з його растровими файлами або шрифт TrueType / OpenType (.ttf, .otf, .ttc)"
"Omsi-Hub has no folder of its own to put it in":
  de: "Omsi-Hub hat keinen eigenen Ordner, um sie abzulegen"
  fr: "Omsi-Hub n’a pas de dossier à lui où le placer"
  nl: "Omsi-Hub heeft geen eigen map om het in te zetten"
  pl: "Omsi-Hub nie ma własnego folderu, w którym mógłby go umieścić"
  ru: "У Omsi-Hub нет собственной папки, куда его положить"
  uk: "Omsi-Hub не має власної теки, куди його покласти"
"That would be in the OMSI 2 folder, which Omsi-Hub does not write to":
  de: "Das wäre im OMSI-2-Ordner, in den Omsi-Hub nicht schreibt"
  fr: "Ce serait dans le dossier d’OMSI 2, où Omsi-Hub n’écrit pas"
  nl: "Dat zou in de map van OMSI 2 zijn, en daarin schrijft Omsi-Hub niet"
  pl: "To byłby folder OMSI 2, do którego Omsi-Hub nie zapisuje"
  ru: "Это была бы папка OMSI 2, а Omsi-Hub в неё не пишет"
  uk: "Це була б тека OMSI 2, а Omsi-Hub в неї не пише"
"added by Omsi-Hub":
  de: "von Omsi-Hub hinzugefügt"
  fr: "ajouté par Omsi-Hub"
  nl: "toegevoegd door Omsi-Hub"
  pl: "dodany przez Omsi-Hub"
  ru: "добавлен Omsi-Hub"
  uk: "додано Omsi-Hub"
"For this drive Omsi-Hub borrows it from %{folder}, which carries it. Beside this bus it is the bus's own, in its list of depot files.":
  de: "Für diese Fahrt leiht Omsi-Hub sie von %{folder}, der sie hat. Neben diesem Bus gehört sie dem Bus selbst, in seiner Liste der Hofdateien."
  fr: "Pour ce trajet, Omsi-Hub l’emprunte à %{folder}, qui l’a. À côté de ce bus, il devient le sien, dans sa liste de fichiers de dépôt."
  nl: "Voor deze rit leent Omsi-Hub het van %{folder}, die het wel heeft. Naast deze bus wordt het van de bus zelf, in zijn lijst met hof-bestanden."
  pl: "Na tę jazdę Omsi-Hub pożycza go od %{folder}, który go ma. Obok tego autobusu stanie się jego własnym, na jego liście plików zajezdni."
  ru: "В этой поездке Omsi-Hub берёт его у %{folder}, у которого он есть. Рядом с этим автобусом он станет его собственным, в его списке файлов депо."
  uk: "У цій поїздці Omsi-Hub позичає його в %{folder}, де він є. Поруч із цим автобусом він стане його власним, у його списку файлів депо."
"The copy goes into Omsi-Hub's own folder, beside this bus. Nothing in OMSI 2 is changed or written over.":
  de: "Die Kopie kommt in den eigenen Ordner von Omsi-Hub, neben diesen Bus. In OMSI 2 wird nichts geändert oder überschrieben."
  fr: "La copie va dans le dossier propre d’Omsi-Hub, à côté de ce bus. Rien n’est modifié ni écrasé dans OMSI 2."
  nl: "Het exemplaar komt in de eigen map van Omsi-Hub, naast deze bus. In OMSI 2 wordt niets veranderd of overschreven."
  pl: "Kopia trafi do własnego folderu Omsi-Hub, obok tego autobusu. W OMSI 2 nic nie zostanie zmienione ani nadpisane."
  ru: "Копия ляжет в собственную папку Omsi-Hub, рядом с этим автобусом. В OMSI 2 ничего не меняется и не перезаписывается."
  uk: "Копія ляже до власної теки Omsi-Hub, поруч із цим автобусом. В OMSI 2 нічого не змінюється й не перезаписується."
