"Omsi-Hub {version} is installed: start it again yourself.":
  de: "Omsi-Hub {version} ist installiert: Starte es selbst neu."
  fr: "Omsi-Hub {version} est installé : relancez-le vous-même."
  nl: "Omsi-Hub {version} is geïnstalleerd: start het zelf opnieuw."
  pl: "Omsi-Hub {version} jest zainstalowany: uruchom go ponownie samodzielnie."
  ru: "Omsi-Hub {version} установлена: запустите её заново сами."
  uk: "Omsi-Hub {version} встановлено: запустіть її знову самостійно."
"Omsi-Hub {version} is downloaded from GitHub and takes the place of this version; the launcher then starts again. Your mods, settings and saves stay as they are.":
  de: "Omsi-Hub {version} wird von GitHub heruntergeladen und ersetzt diese Version; danach startet der Launcher neu. Deine Mods, Einstellungen und Spielstände bleiben, wie sie sind."
  fr: "Omsi-Hub {version} est téléchargé depuis GitHub et remplace cette version, puis le lanceur redémarre. Vos mods, réglages et sauvegardes restent tels quels."
  nl: "Omsi-Hub {version} wordt van GitHub gedownload en neemt de plaats in van deze versie; daarna start de launcher opnieuw. Je mods, instellingen en opgeslagen spellen blijven zoals ze zijn."
  pl: "Omsi-Hub {version} zostanie pobrany z GitHuba i zastąpi tę wersję, a następnie launcher uruchomi się ponownie. Twoje mody, ustawienia i zapisy pozostaną bez zmian."
  ru: "Omsi-Hub {version} будет загружена с GitHub и заменит эту версию, после чего лаунчер перезапустится. Ваши моды, настройки и сохранения останутся без изменений."
  uk: "Omsi-Hub {version} буде завантажено з GitHub, і вона замінить цю версію, після чого лаунчер перезапуститься. Ваші моди, налаштування та збереження залишаться без змін."
"Update checks are turned off so that this version stays. To come back, choose the latest version in this list, or download it from GitHub if Omsi-Hub {version} does not have this list yet.":
  de: "Die Suche nach Updates wird ausgeschaltet, damit diese Version bleibt. Um zurückzukehren, wähle in dieser Liste die neueste Version oder lade sie von GitHub herunter, falls Omsi-Hub {version} diese Liste noch nicht hat."
  fr: "La recherche de mises à jour est désactivée pour que cette version reste en place. Pour revenir, choisissez la version la plus récente dans cette liste, ou téléchargez-la depuis GitHub si Omsi-Hub {version} n'a pas encore cette liste."
  nl: "Zoeken naar updates wordt uitgeschakeld zodat deze versie blijft. Kies om terug te gaan de nieuwste versie in deze lijst, of download die van GitHub als Omsi-Hub {version} deze lijst nog niet heeft."
  pl: "Sprawdzanie aktualizacji zostanie wyłączone, aby ta wersja pozostała. Aby wrócić, wybierz najnowszą wersję z tej listy albo pobierz ją z GitHuba, jeśli Omsi-Hub {version} nie ma jeszcze tej listy."
  ru: "Проверка обновлений отключается, чтобы эта версия осталась. Чтобы вернуться, выберите последнюю версию в этом списке или скачайте её с GitHub, если в Omsi-Hub {version} этого списка ещё нет."
  uk: "Перевірку оновлень вимкнено, щоб ця версія залишилася. Щоб повернутися, виберіть останню версію в цьому списку або завантажте її з GitHub, якщо в Omsi-Hub {version} цього списку ще немає."
