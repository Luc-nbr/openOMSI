"Corrected by you: for every company. Choose \"as detected\" to undo it.":
  en: "Corrected by you: for every company. Choose \"as detected\" to undo it."
  nl: "Door jou verbeterd: voor elk bedrijf. Kies \"zoals herkend\" om het ongedaan te maken."
  de: "Von dir korrigiert: für jedes Unternehmen. Wähle \"wie erkannt\", um es rückgängig zu machen."
  fr: "Corrigé par vous : pour chaque compagnie. Choisissez « tel que détecté » pour l'annuler."
  ru: "Исправлено вами: для каждой компании. Выберите «как определено», чтобы отменить."
  uk: "Виправлено вами: для кожної компанії. Виберіть «як визначено», щоб скасувати."
  pl: "Poprawione przez ciebie: dla każdej firmy. Wybierz „jak rozpoznano”, aby cofnąć."
"The company has buses of this model: they stay, even when the model is switched off.":
  en: "The company has buses of this model: they stay, even when the model is switched off."
  nl: "Het bedrijf heeft bussen van dit model: die blijven, ook als het model uit staat."
  de: "Das Unternehmen hat Busse dieses Modells: Sie bleiben, auch wenn das Modell ausgeschaltet ist."
  fr: "La compagnie possède des bus de ce modèle : ils restent, même si le modèle est désactivé."
  ru: "У компании есть автобусы этой модели: они остаются, даже если модель отключена."
  uk: "Компанія має автобуси цієї моделі: вони залишаються, навіть якщо модель вимкнено."
  pl: "Firma ma autobusy tego modelu: zostają, nawet gdy model jest wyłączony."
