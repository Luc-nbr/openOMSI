  en: "Your vehicles"
  nl: "Je voertuigen"
  de: "Deine Fahrzeuge"
  fr: "Vos véhicules"
  ru: "Ваши автобусы"
  uk: "Ваші автобуси"
  pl: "Twoje pojazdy"
"The buses the company works with: the dealer, the used market, the day's offers, leasing and renting and the shop offer only these. Buses the company has already stay.":
  en: "The buses the company works with: the dealer, the used market, the day's offers, leasing and renting and the shop offer only these. Buses the company has already stay."
  nl: "De bussen waarmee het bedrijf werkt: de dealer, de tweedehandsmarkt, de aanbiedingen van de dag, leasen en huren en de winkel bieden alleen deze aan. Bussen die het bedrijf al heeft, blijven."
  de: "Die Busse, mit denen das Unternehmen arbeitet: Der Händler, der Gebrauchtmarkt, die Tagesangebote, Leasing und Miete und der Laden bieten nur diese an. Busse, die das Unternehmen schon hat, bleiben."
  fr: "Les bus avec lesquels la compagnie travaille : le concessionnaire, le marché de l'occasion, les offres du jour, le leasing, la location et la boutique ne proposent que ceux-ci. Les bus que la compagnie possède déjà restent."
  ru: "Автобусы, с которыми работает компания: дилер, рынок подержанных, предложения дня, лизинг, аренда и магазин предлагают только их. Автобусы, которые у компании уже есть, остаются."
  uk: "Автобуси, з якими працює компанія: дилер, ринок вживаних, пропозиції дня, лізинг, оренда й магазин пропонують лише їх. Автобуси, які компанія вже має, залишаються."
  pl: "Autobusy, z którymi pracuje firma: dealer, rynek używanych, oferty dnia, leasing, wynajem i sklep oferują tylko te. Autobusy, które firma już ma, zostają."
