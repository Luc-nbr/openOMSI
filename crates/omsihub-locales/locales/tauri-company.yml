  uk: "Категорії та регіони автобусів"
  pl: "Kategorie i regiony autobusów"
"What kind of bus each installed model is, and where it is built for: detected from its files (the side its driver sits on), corrected here for every company - the dealer, the market, the shop and the bus company's lists use it.":
  en: "What kind of bus each installed model is, and where it is built for: detected from its files (the side its driver sits on), corrected here for every company - the dealer, the market, the shop and the bus company's lists use it."
  nl: "Wat voor bus elk geïnstalleerd model is en waarvoor het gebouwd is: herkend uit zijn bestanden (de kant waar de chauffeur zit), hier verbeterd voor elk bedrijf - de dealer, de markt, de winkel en de lijsten van het busbedrijf gebruiken het."
  de: "Welche Art Bus jedes installierte Modell ist und wofür es gebaut ist: aus seinen Dateien erkannt (die Seite, auf der der Fahrer sitzt), hier für jedes Unternehmen korrigiert - der Händler, der Markt, der Laden und die Listen des Busunternehmens nutzen es."
  fr: "Le type de bus de chaque modèle installé et le pays pour lequel il est construit : détectés depuis ses fichiers (le côté où s'assoit le conducteur), corrigés ici pour chaque compagnie - le concessionnaire, le marché, la boutique et les listes de la compagnie de bus s'en servent."
  ru: "Какой автобус каждая установленная модель и для какого рынка она построена: определено по её файлам (сторона, где сидит водитель), исправляется здесь для каждой компании - дилер, рынок, магазин и списки автобусной компании используют это."
  uk: "Який автобус кожна встановлена модель і для якого ринку її збудовано: визначено за її файлами (бік, де сидить водій), виправляється тут для кожної компанії - дилер, ринок, магазин і списки автобусної компанії використовують це."
  pl: "Jakim autobusem jest każdy zainstalowany model i dla jakiego rynku go zbudowano: rozpoznane z jego plików (strona, po której siedzi kierowca), poprawiane tutaj dla każdej firmy - dealer, rynek, sklep i listy firmy autobusowej z tego korzystają."
