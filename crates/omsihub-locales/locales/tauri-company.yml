# The bus company in Omsi-Hub's look of openOMSI's desktop launcher (launcher/ui/js/omsihub/company,
# crates/omsi-launcher-api/src/omsihub/company.rs, Trello "Tauri 2/6"): the texts only that page
# says. The company's own texts are the game-drawn launcher's (company-*.yml and the others), read
# by the page as they are. The English text is the key, as in app.yml.

# --- a part of the company handed over to our game-drawn launcher ------------------------------
"This part of the bus company opens in our own launcher for now.":
  en: "This part of the bus company opens in our own launcher for now."
  nl: "Dit deel van het busbedrijf opent voorlopig in onze eigen launcher."
  de: "Dieser Teil des Busunternehmens öffnet vorerst in unserem eigenen Launcher."
  fr: "Cette partie de la compagnie de bus s'ouvre pour l'instant dans notre propre lanceur."
  ru: "Эта часть автобусной компании пока открывается в нашем собственном лаунчере."
  uk: "Ця частина автобусної компанії поки що відкривається в нашому власному лаунчері."
  pl: "Ta część firmy autobusowej na razie otwiera się w naszym własnym launcherze."

