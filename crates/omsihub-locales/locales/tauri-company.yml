  ru: "Карта выглядит %{region}: компания предлагает такие автобусы. Это можно изменить в любой момент в настройках компании."
  uk: "Мапа виглядає %{region}: компанія пропонує такі автобуси. Це можна змінити будь-коли в налаштуваннях компанії."
