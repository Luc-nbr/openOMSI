_version: 2
# Beta 63: company multiplayer - the host closing a session (or lost, or a player sent away) and
# the AI driving the rest of a duty its player left.
"The host closed this session.":
  de: "Der Gastgeber hat diese Sitzung beendet."
  fr: "L'hôte a fermé cette session."
  nl: "De host heeft deze sessie gesloten."
  pl: "Gospodarz zamknął tę sesję."
  ru: "Хост закрыл эту сессию."
  uk: "Хост закрив цю сесію."
"%{company} - the host closed this session":
  de: "%{company} – der Gastgeber hat diese Sitzung beendet"
  fr: "%{company} – l'hôte a fermé cette session"
  nl: "%{company} – de host heeft deze sessie gesloten"
  pl: "%{company} – gospodarz zamknął tę sesję"
  ru: "%{company} – хост закрыл эту сессию"
  uk: "%{company} – хост закрив цю сесію"
"The host stopped sharing the company, closed it or quit Omsi-Hub.":
  de: "Der Gastgeber teilt den Betrieb nicht mehr, hat ihn geschlossen oder Omsi-Hub beendet."
  fr: "L'hôte ne partage plus l'entreprise, l'a fermée ou a quitté Omsi-Hub."
  nl: "De host deelt het bedrijf niet meer, heeft het gesloten of Omsi-Hub afgesloten."
  pl: "Gospodarz przestał udostępniać firmę, zamknął ją lub wyszedł z Omsi-Hub."
  ru: "Хост перестал делиться компанией, закрыл её или вышел из Omsi-Hub."
  uk: "Хост припинив ділитися компанією, закрив її або вийшов з Omsi-Hub."
"Lost the connection to the host":
  de: "Verbindung zum Gastgeber verloren"
  fr: "Connexion à l'hôte perdue"
  nl: "Verbinding met de host verloren"
  pl: "Utracono połączenie z gospodarzem"
  ru: "Связь с хостом потеряна"
  uk: "Зв'язок із хостом втрачено"
"The host's launcher has not answered for a while: it may have closed, or the network dropped.":
  de: "Der Launcher des Gastgebers antwortet seit einer Weile nicht: Er wurde vielleicht geschlossen, oder das Netzwerk ist weg."
  fr: "Le lanceur de l'hôte ne répond plus depuis un moment : il a peut-être été fermé, ou le réseau est tombé."
  nl: "De launcher van de host antwoordt al een tijdje niet: misschien is hij gesloten, of is het netwerk weggevallen."
  pl: "Launcher gospodarza od dłuższej chwili nie odpowiada: mógł zostać zamknięty albo zerwała się sieć."
  ru: "Лаунчер хоста давно не отвечает: возможно, он закрыт или пропала сеть."
  uk: "Лаунчер хоста давно не відповідає: можливо, його закрито або зникла мережа."
"The host removed you from this session":
  de: "Der Gastgeber hat dich aus dieser Sitzung entfernt"
  fr: "L'hôte vous a retiré de cette session"
  nl: "De host heeft je uit deze sessie verwijderd"
  pl: "Gospodarz usunął cię z tej sesji"
  ru: "Хост удалил вас из этой сессии"
  uk: "Хост видалив вас із цієї сесії"
"Ask the host if you want to join again.":
  de: "Frag den Gastgeber, wenn du wieder beitreten möchtest."
  fr: "Demandez à l'hôte si vous voulez rejoindre à nouveau."
  nl: "Vraag het de host als je weer mee wilt doen."
  pl: "Zapytaj gospodarza, jeśli chcesz dołączyć ponownie."
  ru: "Спросите хоста, если хотите присоединиться снова."
  uk: "Запитайте хоста, якщо хочете приєднатися знову."
"Your game still drives %{duty}, but its results can no longer reach the host.":
  de: "Dein Spiel fährt %{duty} weiter, aber die Ergebnisse erreichen den Gastgeber nicht mehr."
  fr: "Votre jeu conduit toujours %{duty}, mais ses résultats ne peuvent plus parvenir à l'hôte."
  nl: "Je spel rijdt %{duty} nog, maar de resultaten kunnen de host niet meer bereiken."
  pl: "Twoja gra nadal prowadzi %{duty}, ale wyniki nie mogą już dotrzeć do gospodarza."
  ru: "Ваша игра всё ещё ведёт %{duty}, но результаты больше не дойдут до хоста."
  uk: "Ваша гра все ще веде %{duty}, але результати більше не дійдуть до хоста."
"Back to the menu":
  de: "Zurück zum Menü"
  fr: "Retour au menu"
  nl: "Terug naar het menu"
  pl: "Powrót do menu"
  ru: "Назад в меню"
  uk: "Назад до меню"
"Try again":
  de: "Erneut versuchen"
  fr: "Réessayer"
  nl: "Opnieuw proberen"
  pl: "Spróbuj ponownie"
  ru: "Повторить"
  uk: "Спробувати ще раз"
"%{name} left duty %{k} of line %{n} (tour %{tour}): the AI drives the rest of it.":
  de: "%{name} hat Dienst %{k} der Linie %{n} (Umlauf %{tour}) verlassen: Die KI fährt den Rest."
  fr: "%{name} a quitté le service %{k} de la ligne %{n} (tournée %{tour}) : l'IA conduit le reste."
  nl: "%{name} heeft dienst %{k} van lijn %{n} (omloop %{tour}) verlaten: de AI rijdt de rest."
  pl: "%{name} opuścił(a) służbę %{k} linii %{n} (obieg %{tour}): resztę prowadzi SI."
  ru: "%{name} покинул(а) смену %{k} линии %{n} (оборот %{tour}): остаток ведёт ИИ."
  uk: "%{name} покинув(ла) зміну %{k} лінії %{n} (оборот %{tour}): решту веде ШІ."
"%{name} left duty %{k} of line %{n} (tour %{tour}) before its first trip: the AI drives all of it.":
  de: "%{name} hat Dienst %{k} der Linie %{n} (Umlauf %{tour}) vor der ersten Fahrt verlassen: Die KI fährt ihn ganz."
  fr: "%{name} a quitté le service %{k} de la ligne %{n} (tournée %{tour}) avant son premier trajet : l'IA le conduit en entier."
  nl: "%{name} heeft dienst %{k} van lijn %{n} (omloop %{tour}) voor de eerste rit verlaten: de AI rijdt hem helemaal."
  pl: "%{name} opuścił(a) służbę %{k} linii %{n} (obieg %{tour}) przed pierwszym kursem: całą prowadzi SI."
  ru: "%{name} покинул(а) смену %{k} линии %{n} (оборот %{tour}) до первого рейса: её целиком ведёт ИИ."
  uk: "%{name} покинув(ла) зміну %{k} лінії %{n} (оборот %{tour}) до першого рейсу: її повністю веде ШІ."
"%{name} left duty %{k} of line %{n} (tour %{tour}) before its first trip: it is open for another player.":
  de: "%{name} hat Dienst %{k} der Linie %{n} (Umlauf %{tour}) vor der ersten Fahrt verlassen: Er ist frei für einen anderen Spieler."
  fr: "%{name} a quitté le service %{k} de la ligne %{n} (tournée %{tour}) avant son premier trajet : il est libre pour un autre joueur."
  nl: "%{name} heeft dienst %{k} van lijn %{n} (omloop %{tour}) voor de eerste rit verlaten: hij is vrij voor een andere speler."
  pl: "%{name} opuścił(a) służbę %{k} linii %{n} (obieg %{tour}) przed pierwszym kursem: jest wolna dla innego gracza."
  ru: "%{name} покинул(а) смену %{k} линии %{n} (оборот %{tour}) до первого рейса: она свободна для другого игрока."
  uk: "%{name} покинув(ла) зміну %{k} лінії %{n} (оборот %{tour}) до першого рейсу: вона вільна для іншого гравця."
"%{name} takes duty %{k} of line %{n} (tour %{tour}) back from the AI at its next trip.":
  de: "%{name} übernimmt Dienst %{k} der Linie %{n} (Umlauf %{tour}) ab der nächsten Fahrt wieder von der KI."
  fr: "%{name} reprend le service %{k} de la ligne %{n} (tournée %{tour}) à l'IA dès son prochain trajet."
  nl: "%{name} neemt dienst %{k} van lijn %{n} (omloop %{tour}) vanaf de volgende rit terug van de AI."
  pl: "%{name} przejmuje służbę %{k} linii %{n} (obieg %{tour}) z powrotem od SI od następnego kursu."
  ru: "%{name} забирает смену %{k} линии %{n} (оборот %{tour}) у ИИ со следующего рейса."
  uk: "%{name} забирає зміну %{k} лінії %{n} (оборот %{tour}) у ШІ з наступного рейсу."
"%{name} is back: duty %{k} of line %{n} (tour %{tour}) is his again.":
  de: "%{name} ist zurück: Dienst %{k} der Linie %{n} (Umlauf %{tour}) gehört wieder ihm/ihr."
  fr: "%{name} est de retour : le service %{k} de la ligne %{n} (tournée %{tour}) est de nouveau à lui/elle."
  nl: "%{name} is terug: dienst %{k} van lijn %{n} (omloop %{tour}) is weer van hem/haar."
  pl: "%{name} wrócił(a): służba %{k} linii %{n} (obieg %{tour}) znów należy do niego/niej."
  ru: "%{name} вернулся(лась): смена %{k} линии %{n} (оборот %{tour}) снова его/её."
  uk: "%{name} повернувся(лася): зміна %{k} лінії %{n} (оборот %{tour}) знову його/її."
"The AI drives the rest of this duty: take it back from the next trip.":
  de: "Die KI fährt den Rest dieses Dienstes: Übernimm ihn ab der nächsten Fahrt wieder."
  fr: "L'IA conduit le reste de ce service : reprenez-le dès le prochain trajet."
  nl: "De AI rijdt de rest van deze dienst: neem hem terug vanaf de volgende rit."
  pl: "Resztę tej służby prowadzi SI: przejmij ją od następnego kursu."
  ru: "Остаток этой смены ведёт ИИ: заберите её со следующего рейса."
  uk: "Решту цієї зміни веде ШІ: заберіть її з наступного рейсу."
"The AI has finished this duty: no trip is left to take back.":
  de: "Die KI hat diesen Dienst beendet: Es ist keine Fahrt mehr übrig."
  fr: "L'IA a terminé ce service : il ne reste aucun trajet à reprendre."
  nl: "De AI heeft deze dienst afgemaakt: er is geen rit meer over om terug te nemen."
  pl: "SI zakończyła tę służbę: nie został żaden kurs do przejęcia."
  ru: "ИИ завершил эту смену: рейсов, которые можно забрать, не осталось."
  uk: "ШІ завершив цю зміну: рейсів, які можна забрати, не лишилося."
"The AI does not drive this duty.":
  de: "Die KI fährt diesen Dienst nicht."
  fr: "L'IA ne conduit pas ce service."
  nl: "De AI rijdt deze dienst niet."
  pl: "SI nie prowadzi tej służby."
  ru: "ИИ не ведёт эту смену."
  uk: "ШІ не веде цю зміну."
"Left it: the AI drives the rest":
  de: "Verlassen: Die KI fährt den Rest"
  fr: "Quitté : l'IA conduit le reste"
  nl: "Verlaten: de AI rijdt de rest"
  pl: "Opuszczona: resztę prowadzi SI"
  ru: "Покинута: остаток ведёт ИИ"
  uk: "Покинута: решту веде ШІ"
"Open a duty its player left before its first trip":
  de: "Einen Dienst freigeben, den sein Spieler vor der ersten Fahrt verlassen hat"
  fr: "Libérer un service que son joueur a quitté avant le premier trajet"
  nl: "Een dienst die de speler voor de eerste rit verliet weer vrijgeven"
  pl: "Zwolnij służbę, którą gracz opuścił przed pierwszym kursem"
  ru: "Освобождать смену, которую игрок покинул до первого рейса"
  uk: "Звільняти зміну, яку гравець покинув до першого рейсу"
"Off: the AI drives a duty its player left, all of it or from where they got to. The route carries on either way.":
  de: "Aus: Die KI fährt einen verlassenen Dienst, ganz oder ab dort, wo der Spieler war. Die Linie läuft so oder so weiter."
  fr: "Désactivé : l'IA conduit un service quitté par son joueur, en entier ou depuis là où il s'est arrêté. La ligne continue dans tous les cas."
  nl: "Uit: de AI rijdt een verlaten dienst, helemaal of vanaf waar de speler was. De lijn rijdt hoe dan ook door."
  pl: "Wyłączone: SI prowadzi opuszczoną służbę, całą lub od miejsca, w którym gracz skończył. Linia i tak kursuje dalej."
  ru: "Выкл.: покинутую смену ведёт ИИ – целиком или с того места, где остановился игрок. Маршрут в любом случае продолжается."
  uk: "Вимк.: покинуту зміну веде ШІ – повністю або з місця, де зупинився гравець. Маршрут у будь-якому разі триває."
"AI (%{name} left)":
  de: "KI (%{name} weg)"
  fr: "IA (%{name} parti)"
  nl: "AI (%{name} weg)"
  pl: "SI (%{name} wyszedł)"
  ru: "ИИ (%{name} ушёл)"
  uk: "ШІ (%{name} пішов)"
"You left it: the AI drives it":
  de: "Du hast ihn verlassen: Die KI fährt ihn"
  fr: "Vous l'avez quitté : l'IA le conduit"
  nl: "Je hebt hem verlaten: de AI rijdt hem"
  pl: "Opuściłeś ją: prowadzi ją SI"
  ru: "Вы её покинули: её ведёт ИИ"
  uk: "Ви її покинули: її веде ШІ"
"You left it: the AI drives the rest of it":
  de: "Du hast ihn verlassen: Die KI fährt den Rest"
  fr: "Vous l'avez quitté : l'IA conduit le reste"
  nl: "Je hebt hem verlaten: de AI rijdt de rest"
  pl: "Opuściłeś ją: resztę prowadzi SI"
  ru: "Вы её покинули: остаток ведёт ИИ"
  uk: "Ви її покинули: решту веде ШІ"
"Take the duty back from the next trip":
  de: "Dienst ab der nächsten Fahrt zurücknehmen"
  fr: "Reprendre le service au prochain trajet"
  nl: "Dienst terugnemen vanaf de volgende rit"
  pl: "Przejmij służbę od następnego kursu"
  ru: "Забрать смену со следующего рейса"
  uk: "Забрати зміну з наступного рейсу"
"The AI drove the rest of it: %{n} trips":
  de: "Den Rest fuhr die KI: %{n} Fahrten"
  fr: "L'IA a conduit le reste : %{n} trajets"
  nl: "De rest reed de AI: %{n} ritten"
  pl: "Resztę poprowadziła SI: %{n} kursów"
  ru: "Остаток провёл ИИ: рейсов – %{n}"
  uk: "Решту провів ШІ: рейсів – %{n}"
