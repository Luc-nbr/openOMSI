"The company has bid on no tender yet. The Concessions page lists the lines out to tender: bid there, and your bids show here with their deadline and result.":
  de: "Das Unternehmen hat noch auf keine Ausschreibung geboten. Die Seite Konzessionen zeigt die ausgeschriebenen Linien: Bieten Sie dort, und Ihre Gebote erscheinen hier mit Frist und Ergebnis."
  fr: "L'entreprise n'a encore fait d'offre sur aucun appel d'offres. La page Concessions liste les lignes mises en concurrence : faites-y une offre, et vos offres s'affichent ici avec leur échéance et leur résultat."
  nl: "Het bedrijf heeft nog op geen aanbesteding geboden. De pagina Concessies toont de aanbestede lijnen: bied daar, en je biedingen staan hier met hun termijn en uitslag."
  pl: "Firma nie złożyła jeszcze oferty w żadnym przetargu. Strona Koncesje pokazuje linie w przetargu: licytuj tam, a twoje oferty pojawią się tutaj z terminem i wynikiem."
  ru: "Компания ещё не делала ставок на тендерах. На странице «Концессии» перечислены линии на тендере: делайте ставки там, и они появятся здесь со сроком и результатом."
  uk: "Компанія ще не робила ставок на тендерах. На сторінці «Концесії» перелічено лінії на тендері: робіть ставки там, і вони з'являться тут із терміном і результатом."
