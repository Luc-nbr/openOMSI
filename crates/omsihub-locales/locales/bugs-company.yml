"%{n} things fell out this morning: drivers ill or late, buses that did not start. Choose how to cover each, or leave it to the central.":
  de: "Heute Morgen ist %{n}-mal etwas ausgefallen: kranke oder verspätete Fahrer, Busse, die nicht angesprungen sind. Wählen Sie, wie Sie es jeweils abdecken, oder überlassen Sie es der Leitstelle."
  fr: "%{n} choses ont manqué ce matin : chauffeurs malades ou en retard, bus qui n'ont pas démarré. Choisissez comment couvrir chacune, ou laissez faire la centrale."
  nl: "Vanmorgen vielen %{n} dingen uit: zieke of te late chauffeurs, bussen die niet startten. Kies hoe je elk opvangt, of laat het aan de centrale."
  pl: "Dziś rano wypadło %{n} rzeczy: chorzy lub spóźnieni kierowcy, autobusy, które nie zapaliły. Wybierz, jak obsadzić każdą, albo zostaw to centrali."
  ru: "Этим утром выпало %{n}: больные или опоздавшие водители, автобусы, которые не завелись. Выберите, как закрыть каждое, или оставьте это диспетчерскому центру."
  uk: "Цього ранку випало %{n}: хворі чи запізнілі водії, автобуси, що не завелися. Виберіть, як закрити кожне, або залиште це диспетчерському центру."
# A bus that broke down or did not start: a spare bus of the fleet, a rental bus, dropping its trips.
"Spare bus %{bus}":
  de: "Ersatzbus %{bus}"
  fr: "Bus de réserve %{bus}"
  nl: "Reservebus %{bus}"
  pl: "Autobus rezerwowy %{bus}"
  ru: "Резервный автобус %{bus}"
  uk: "Резервний автобус %{bus}"
"Free then":
  de: "Dann frei"
  fr: "Libre à ce moment"
  nl: "Dan vrij"
  pl: "Wtedy wolny"
  ru: "В это время свободен"
  uk: "У цей час вільний"
"No rental bus: no place in the depot or not the cash (%{amount})":
  de: "Kein Mietbus: kein Platz im Depot oder nicht genug Geld (%{amount})"
  fr: "Pas de bus de location : pas de place au dépôt ou pas assez d'argent (%{amount})"
  nl: "Geen huurbus: geen plek in de remise of niet genoeg geld (%{amount})"
  pl: "Brak autobusu z wynajmu: brak miejsca w zajezdni lub pieniędzy (%{amount})"
  ru: "Нет арендного автобуса: нет места в депо или денег (%{amount})"
  uk: "Немає орендного автобуса: немає місця в депо або грошей (%{amount})"
"It was on line %{n}; it goes to the workshop. No spare bus of the fleet is free until the end of its day. A rental bus can take over its trips from %{time} for %{amount}; else its trips are dropped for the rest of the day, with the contract's penalty.":
  de: "Er war auf Linie %{n}; er kommt in die Werkstatt. Kein Ersatzbus der Flotte ist bis zum Ende seines Tages frei. Ein Mietbus kann seine Fahrten ab %{time} für %{amount} übernehmen; sonst fallen seine Fahrten für den Rest des Tages aus, mit der Vertragsstrafe."
  fr: "Il était sur la ligne %{n} ; il part à l'atelier. Aucun bus de réserve de la flotte n'est libre jusqu'à la fin de sa journée. Un bus de location peut reprendre ses courses à partir de %{time} pour %{amount} ; sinon ses courses sont supprimées pour le reste de la journée, avec la pénalité du contrat."
  nl: "Hij reed op lijn %{n}; hij gaat naar de werkplaats. Geen reservebus van de vloot is vrij tot het eind van zijn dag. Een huurbus kan zijn ritten vanaf %{time} overnemen voor %{amount}; anders vallen zijn ritten de rest van de dag uit, met de boete van het contract."
  pl: "Był na linii %{n}; jedzie do warsztatu. Żaden autobus rezerwowy floty nie jest wolny do końca jego dnia. Autobus z wynajmu może przejąć jego kursy od %{time} za %{amount}; inaczej jego kursy przepadają do końca dnia, z karą z umowy."
  ru: "Он был на линии %{n}; он отправляется в мастерскую. Ни один резервный автобус парка не свободен до конца его дня. Арендный автобус может взять его рейсы с %{time} за %{amount}; иначе его рейсы отменяются до конца дня, со штрафом по договору."
  uk: "Він був на лінії %{n}; він їде до майстерні. Жоден резервний автобус парку не вільний до кінця його дня. Орендний автобус може взяти його рейси з %{time} за %{amount}; інакше його рейси скасовуються до кінця дня, зі штрафом за договором."
"It was on line %{n}; it goes to the workshop. A spare bus of the fleet can take over its trips from %{spare}; a rental bus from %{time} for %{amount}; else its trips are dropped for the rest of the day, with the contract's penalty.":
  de: "Er war auf Linie %{n}; er kommt in die Werkstatt. Ein Ersatzbus der Flotte kann seine Fahrten ab %{spare} übernehmen, ein Mietbus ab %{time} für %{amount}; sonst fallen seine Fahrten für den Rest des Tages aus, mit der Vertragsstrafe."
  fr: "Il était sur la ligne %{n} ; il part à l'atelier. Un bus de réserve de la flotte peut reprendre ses courses à partir de %{spare}, un bus de location à partir de %{time} pour %{amount} ; sinon ses courses sont supprimées pour le reste de la journée, avec la pénalité du contrat."
  nl: "Hij reed op lijn %{n}; hij gaat naar de werkplaats. Een reservebus van de vloot kan zijn ritten vanaf %{spare} overnemen, een huurbus vanaf %{time} voor %{amount}; anders vallen zijn ritten de rest van de dag uit, met de boete van het contract."
  pl: "Był na linii %{n}; jedzie do warsztatu. Autobus rezerwowy floty może przejąć jego kursy od %{spare}, autobus z wynajmu od %{time} za %{amount}; inaczej jego kursy przepadają do końca dnia, z karą z umowy."
  ru: "Он был на линии %{n}; он отправляется в мастерскую. Резервный автобус парка может взять его рейсы с %{spare}, арендный — с %{time} за %{amount}; иначе его рейсы отменяются до конца дня, со штрафом по договору."
  uk: "Він був на лінії %{n}; він їде до майстерні. Резервний автобус парку може взяти його рейси з %{spare}, орендний — з %{time} за %{amount}; інакше його рейси скасовуються до кінця дня, зі штрафом за договором."
