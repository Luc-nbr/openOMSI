"Players may take open duties themselves":
  de: "Spieler dürfen offene Dienste selbst übernehmen"
  fr: "Les joueurs peuvent prendre eux-mêmes les services à pourvoir"
  nl: "Spelers mogen zelf open diensten nemen"
  pl: "Gracze mogą sami brać otwarte służby"
  ru: "Игроки могут сами брать открытые смены"
  uk: "Гравці можуть самі брати відкриті зміни"
"Off: they ask for a duty, and you say yes or no here.":
  de: "Aus: sie fragen nach einem Dienst, und du sagst hier ja oder nein."
  fr: "Désactivé : ils demandent un service, et vous dites oui ou non ici."
  nl: "Uit: ze vragen om een dienst, en jij zegt hier ja of nee."
  pl: "Wyłączone: proszą o służbę, a ty mówisz tutaj tak lub nie."
  ru: "Выключено: они просят смену, а вы здесь отвечаете да или нет."
  uk: "Вимкнено: вони просять зміну, а ви тут відповідаєте так чи ні."
"A session of another of your companies runs: starting one here ends it.":
  de: "Eine Sitzung eines anderen deiner Betriebe läuft: eine hier zu starten beendet sie."
  fr: "Une session d'une autre de vos entreprises est en cours : en lancer une ici y met fin."
  nl: "Er loopt een sessie van een ander bedrijf van je: hier een starten beëindigt die."
  pl: "Trwa sesja innej twojej firmy: rozpoczęcie tutaj ją zakończy."
  ru: "Идёт сессия другой вашей компании: если начать здесь, она завершится."
  uk: "Триває сесія іншої вашої компанії: якщо почати тут, вона завершиться."
