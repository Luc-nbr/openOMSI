  de: "über einen Cloudflare-Tunnel (%{url})"
  fr: "par un tunnel Cloudflare (%{url})"
  nl: "via een Cloudflare-tunnel (%{url})"
  pl: "przez tunel Cloudflare (%{url})"
  ru: "через туннель Cloudflare (%{url})"
  uk: "через тунель Cloudflare (%{url})"
"the tunnel is starting…":
  de: "der Tunnel startet…"
  fr: "le tunnel démarre…"
  nl: "de tunnel start…"
  pl: "tunel się uruchamia…"
  ru: "туннель запускается…"
  uk: "тунель запускається…"
"no tunnel: friends over the internet need the same VPN":
  de: "kein Tunnel: Freunde über das Internet brauchen dasselbe VPN"
  fr: "pas de tunnel : les amis par Internet ont besoin du même VPN"
  nl: "geen tunnel: vrienden via internet hebben hetzelfde VPN nodig"
  pl: "brak tunelu: znajomi przez internet potrzebują tego samego VPN"
  ru: "туннеля нет: друзьям через интернет нужен тот же VPN"
  uk: "тунелю немає: друзям через інтернет потрібен той самий VPN"
"no tunnel (switched off): friends over the internet need the same VPN":
  de: "kein Tunnel (ausgeschaltet): Freunde über das Internet brauchen dasselbe VPN"
  fr: "pas de tunnel (désactivé) : les amis par Internet ont besoin du même VPN"
  nl: "geen tunnel (uitgezet): vrienden via internet hebben hetzelfde VPN nodig"
  pl: "brak tunelu (wyłączony): znajomi przez internet potrzebują tego samego VPN"
  ru: "туннеля нет (выключен): друзьям через интернет нужен тот же VPN"
  uk: "тунелю немає (вимкнено): друзям через інтернет потрібен той самий VPN"
"Your world is open: friends drive their duties in it.":
  de: "Deine Welt ist offen: Freunde fahren darin ihre Dienste."
  fr: "Votre monde est ouvert : vos amis y conduisent leurs services."
  nl: "Je wereld is open: vrienden rijden er hun diensten in."
  pl: "Twój świat jest otwarty: znajomi jeżdżą w nim swoje służby."
  ru: "Ваш мир открыт: друзья выполняют в нём свои смены."
  uk: "Ваш світ відкритий: друзі виконують у ньому свої зміни."
"Your game runs another map: friends can only drive in the company's world.":
  de: "Dein Spiel läuft auf einer anderen Karte: Freunde können nur in der Welt des Betriebs fahren."
  fr: "Votre jeu tourne sur une autre carte : vos amis ne peuvent conduire que dans le monde de l'entreprise."
  nl: "Je spel draait een andere kaart: vrienden kunnen alleen in de wereld van het bedrijf rijden."
  pl: "Twoja gra działa na innej mapie: znajomi mogą jeździć tylko w świecie firmy."
  ru: "Ваша игра запущена на другой карте: друзья могут ездить только в мире компании."
  uk: "Ваша гра запущена на іншій мапі: друзі можуть їздити лише у світі компанії."
"Your world isn't open yet: friends cannot drive until it is. Drive a duty of your own, or open the world with you on foot at the depot.":
  de: "Deine Welt ist noch nicht offen: bis dahin können Freunde nicht fahren. Fahre selbst einen Dienst, oder öffne die Welt mit dir zu Fuß am Betriebshof."
  fr: "Votre monde n'est pas encore ouvert : vos amis ne peuvent pas conduire avant. Conduisez vous-même un service, ou ouvrez le monde avec vous à pied au dépôt."
  nl: "Je wereld is nog niet open: tot dan kunnen vrienden niet rijden. Rijd zelf een dienst, of open de wereld met jou te voet bij de remise."
  pl: "Twój świat nie jest jeszcze otwarty: do tego czasu znajomi nie mogą jeździć. Sam jedź służbę albo otwórz świat, stojąc pieszo w zajezdni."
  ru: "Ваш мир ещё не открыт: до тех пор друзья не могут ездить. Выполняйте смену сами или откройте мир, стоя пешком в депо."
  uk: "Ваш світ ще не відкритий: доти друзі не можуть їздити. Виконуйте зміну самі або відкрийте світ, стоячи пішки в депо."
"Open the world":
  de: "Welt öffnen"
  fr: "Ouvrir le monde"
  nl: "Wereld openen"
  pl: "Otwórz świat"
  ru: "Открыть мир"
  uk: "Відкрити світ"
"Over the internet: both need the same VPN (Hamachi, Radmin VPN, ZeroTier, Tailscale), or a friend comes in through your tunnel. Everybody needs the same version of Omsi-Hub.":
  de: "Über das Internet: beide brauchen dasselbe VPN (Hamachi, Radmin VPN, ZeroTier, Tailscale), oder ein Freund kommt über deinen Tunnel herein. Alle brauchen dieselbe Version von Omsi-Hub."
  fr: "Par Internet : il faut le même VPN des deux côtés (Hamachi, Radmin VPN, ZeroTier, Tailscale), ou votre ami passe par votre tunnel. Tout le monde a besoin de la même version d'Omsi-Hub."
  nl: "Via internet: beiden hebben hetzelfde VPN nodig (Hamachi, Radmin VPN, ZeroTier, Tailscale), of een vriend komt binnen via je tunnel. Iedereen heeft dezelfde versie van Omsi-Hub nodig."
  pl: "Przez internet: obaj potrzebujecie tego samego VPN (Hamachi, Radmin VPN, ZeroTier, Tailscale) albo znajomy wchodzi przez twój tunel. Wszyscy potrzebują tej samej wersji Omsi-Hub."
  ru: "Через интернет: обоим нужен один и тот же VPN (Hamachi, Radmin VPN, ZeroTier, Tailscale), или друг заходит через ваш туннель. Всем нужна одна и та же версия Omsi-Hub."
  uk: "Через інтернет: обом потрібен той самий VPN (Hamachi, Radmin VPN, ZeroTier, Tailscale), або друг заходить через ваш тунель. Усім потрібна однакова версія Omsi-Hub."
"Not in a company session.":
  de: "Nicht in einer Betriebssitzung."
  fr: "Pas dans une session d'entreprise."
  nl: "Niet in een bedrijfssessie."
  pl: "Nie jesteś w sesji firmy."
  ru: "Вы не в сессии компании."
  uk: "Ви не в сесії компанії."
"Looking for the boss's launcher…":
  de: "Suche den Launcher des Chefs…"
  fr: "Recherche du lanceur du patron…"
  nl: "Launcher van de baas zoeken…"
  pl: "Szukam launchera szefa…"
  ru: "Ищем лаунчер босса…"
  uk: "Шукаємо лаунчер боса…"
"A game is running: close it, then drive the duty.":
  de: "Ein Spiel läuft: schließe es, dann fahre den Dienst."
  fr: "Un jeu est en cours : fermez-le, puis conduisez le service."
  nl: "Er loopt een spel: sluit het en rijd dan de dienst."
  pl: "Gra jest uruchomiona: zamknij ją, a potem jedź służbę."
  ru: "Игра запущена: закройте её, затем выполняйте смену."
  uk: "Гра запущена: закрийте її, потім виконуйте зміну."
"The duty's bus is not installed on this computer: %{bus}. Install it, or ask the boss to give the tour another bus.":
  de: "Der Bus des Dienstes ist auf diesem Computer nicht installiert: %{bus}. Installiere ihn, oder bitte den Chef, dem Umlauf einen anderen Bus zu geben."
  fr: "Le bus du service n'est pas installé sur cet ordinateur : %{bus}. Installez-le, ou demandez au patron de donner un autre bus à la tournée."
  nl: "De bus van de dienst is niet geïnstalleerd op deze computer: %{bus}. Installeer hem, of vraag de baas de omloop een andere bus te geven."
  pl: "Autobus tej służby nie jest zainstalowany na tym komputerze: %{bus}. Zainstaluj go albo poproś szefa o inny autobus dla brygady."
  ru: "Автобус этой смены не установлен на этом компьютере: %{bus}. Установите его или попросите босса дать выходу другой автобус."
  uk: "Автобус цієї зміни не встановлено на цьому комп'ютері: %{bus}. Встановіть його або попросіть боса дати обороту інший автобус."
"Bus %{bus}":
  de: "Bus %{bus}"
  fr: "Bus %{bus}"
  nl: "Bus %{bus}"
  pl: "Autobus %{bus}"
