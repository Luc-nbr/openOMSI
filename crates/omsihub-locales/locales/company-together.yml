_version: 2
# "Play together" in the bus company (Beta 58): the boss's session (its code, the players online,
# the duties asked for, his world) and a friend's view of the boss's company (the day, the open
# duties, his own duties and results), the refusals of claims and reports and the notices.
"No port for the session: %{e}":
  de: "Kein Port für die Sitzung: %{e}"
  fr: "Aucun port pour la session : %{e}"
  nl: "Geen poort voor de sessie: %{e}"
  pl: "Brak portu dla sesji: %{e}"
  ru: "Нет порта для сессии: %{e}"
  uk: "Немає порту для сесії: %{e}"
"Close what uses the port, or start the launcher again.":
  de: "Schließe, was den Port belegt, oder starte den Launcher neu."
  fr: "Fermez ce qui utilise le port, ou redémarrez le lanceur."
  nl: "Sluit wat de poort gebruikt, of start de launcher opnieuw."
  pl: "Zamknij to, co używa portu, albo uruchom launcher ponownie."
  ru: "Закройте то, что занимает порт, или перезапустите лаунчер."
  uk: "Закрийте те, що займає порт, або перезапустіть лаунчер."
"Play together: friends drive duties of your company in your world":
  de: "Zusammen spielen: Freunde fahren Dienste deines Betriebs in deiner Welt"
  fr: "Jouer ensemble : des amis conduisent les services de votre entreprise dans votre monde"
  nl: "Samen spelen: vrienden rijden diensten van je bedrijf in jouw wereld"
  pl: "Wspólna gra: znajomi jeżdżą służby twojej firmy w twoim świecie"
  ru: "Играть вместе: друзья выполняют смены вашей компании в вашем мире"
  uk: "Грати разом: друзі виконують зміни вашої компанії у вашому світі"
"Play together: %{n} online":
  de: "Zusammen spielen: %{n} online"
  fr: "Jouer ensemble : %{n} en ligne"
  nl: "Samen spelen: %{n} online"
  pl: "Wspólna gra: %{n} online"
  ru: "Играть вместе: %{n} в сети"
  uk: "Грати разом: %{n} у мережі"
"Your world is open while it runs.":
  de: "Deine Welt ist offen, solange es läuft."
  fr: "Votre monde est ouvert tant qu'il tourne."
  nl: "Je wereld is open zolang het loopt."
  pl: "Twój świat jest otwarty, dopóki gra działa."
  ru: "Ваш мир открыт, пока игра запущена."
  uk: "Ваш світ відкритий, поки гра запущена."
"Friends join it when it hosts a session; close it to open another.":
  de: "Freunde treten bei, wenn es eine Sitzung hostet; schließe es, um eine andere Welt zu öffnen."
  fr: "Vos amis le rejoignent s'il héberge une session ; fermez-le pour en ouvrir un autre."
  nl: "Vrienden doen mee als het een sessie host; sluit het om een andere te openen."
  pl: "Znajomi dołączą, gdy gra hostuje sesję; zamknij ją, aby otworzyć inną."
  ru: "Друзья присоединятся, если игра проводит сессию; закройте её, чтобы открыть другую."
  uk: "Друзі приєднаються, якщо гра проводить сесію; закрийте її, щоб відкрити іншу."
"The world opens with you on foot beside a bus of the fleet.":
  de: "Die Welt öffnet sich mit dir zu Fuß neben einem Bus der Flotte."
  fr: "Le monde s'ouvre avec vous à pied à côté d'un bus de la flotte."
  nl: "De wereld opent met jou te voet naast een bus van de vloot."
  pl: "Świat otwiera się z tobą pieszo obok autobusu floty."
  ru: "Мир открывается, а вы стоите пешком рядом с автобусом парка."
  uk: "Світ відкривається, а ви стоїте пішки біля автобуса парку."
"Buy or lease a bus first.":
  de: "Kaufe oder lease zuerst einen Bus."
  fr: "Achetez ou louez d'abord un bus."
  nl: "Koop of lease eerst een bus."
  pl: "Najpierw kup lub weź w leasing autobus."
  ru: "Сначала купите или возьмите в лизинг автобус."
  uk: "Спершу купіть або візьміть у лізинг автобус."
"Opening your company's world…":
  de: "Die Welt deines Betriebs wird geöffnet…"
  fr: "Ouverture du monde de votre entreprise…"
  nl: "De wereld van je bedrijf wordt geopend…"
  pl: "Otwieranie świata twojej firmy…"
  ru: "Открывается мир вашей компании…"
  uk: "Відкривається світ вашої компанії…"
"Drives %{duty}":
  de: "Fährt %{duty}"
  fr: "Conduit %{duty}"
  nl: "Rijdt %{duty}"
  pl: "Jedzie: %{duty}"
  ru: "Выполняет: %{duty}"
  uk: "Виконує: %{duty}"
"Waits for your world to drive %{duty}":
  de: "Wartet auf deine Welt, um %{duty} zu fahren"
  fr: "Attend votre monde pour conduire %{duty}"
  nl: "Wacht op je wereld om %{duty} te rijden"
  pl: "Czeka na twój świat, by jechać: %{duty}"
  ru: "Ждёт ваш мир, чтобы выполнить: %{duty}"
  uk: "Чекає на ваш світ, щоб виконати: %{duty}"
"Online · %{n} duties today":
  de: "Online · heute %{n} Dienste"
  fr: "En ligne · %{n} services aujourd'hui"
  nl: "Online · vandaag %{n} diensten"
  pl: "Online · dziś %{n} służb"
  ru: "В сети · сегодня смен: %{n}"
  uk: "У мережі · сьогодні змін: %{n}"
"Offline · %{n} duties today":
  de: "Offline · heute %{n} Dienste"
  fr: "Hors ligne · %{n} services aujourd'hui"
  nl: "Offline · vandaag %{n} diensten"
  pl: "Offline · dziś %{n} służb"
  ru: "Не в сети · сегодня смен: %{n}"
  uk: "Не в мережі · сьогодні змін: %{n}"
"Play together":
  de: "Zusammen spielen"
  fr: "Jouer ensemble"
  nl: "Samen spelen"
  pl: "Wspólna gra"
  ru: "Играть вместе"
  uk: "Грати разом"
"Copied":
  de: "Kopiert"
  fr: "Copié"
  nl: "Gekopieerd"
  pl: "Skopiowano"
  ru: "Скопировано"
  uk: "Скопійовано"
"Start a session":
  de: "Sitzung starten"
  fr: "Lancer une session"
  nl: "Sessie starten"
  pl: "Rozpocznij sesję"
  ru: "Начать сессию"
  uk: "Почати сесію"
"Friends join your company with a session code and drive duties of its day for it, in your world. Money, planning and staff stay yours: their trips are booked as your drivers' are.":
  de: "Freunde treten deinem Betrieb mit einem Sitzungscode bei und fahren Dienste seines Tages für ihn, in deiner Welt. Geld, Planung und Personal bleiben deine Sache: ihre Fahrten werden gebucht wie die deiner Fahrer."
  fr: "Vos amis rejoignent votre entreprise avec un code de session et conduisent pour elle des services de sa journée, dans votre monde. L'argent, la planification et le personnel restent à vous : leurs trajets sont comptabilisés comme ceux de vos conducteurs."
  nl: "Vrienden doen met een sessiecode mee met je bedrijf en rijden diensten van zijn dag ervoor, in jouw wereld. Geld, planning en personeel blijven van jou: hun ritten worden geboekt zoals die van je chauffeurs."
  pl: "Znajomi dołączają do twojej firmy kodem sesji i jeżdżą dla niej służby z jej dnia, w twoim świecie. Pieniądze, planowanie i personel zostają twoje: ich kursy są księgowane jak kursy twoich kierowców."
  ru: "Друзья присоединяются к вашей компании по коду сессии и выполняют для неё смены её дня в вашем мире. Деньги, планирование и персонал остаются за вами: их рейсы учитываются, как рейсы ваших водителей."
  uk: "Друзі приєднуються до вашої компанії за кодом сесії й виконують для неї зміни її дня у вашому світі. Гроші, планування й персонал залишаються за вами: їхні рейси обліковуються, як рейси ваших водіїв."
"Start a session: you get a code to send your friends.":
  de: "Starte eine Sitzung: du bekommst einen Code für deine Freunde."
  fr: "Lancez une session : vous obtenez un code à envoyer à vos amis."
  nl: "Start een sessie: je krijgt een code om naar je vrienden te sturen."
  pl: "Rozpocznij sesję: dostaniesz kod do wysłania znajomym."
  ru: "Начните сессию: вы получите код, который нужно отправить друзьям."
  uk: "Почніть сесію: ви отримаєте код, який треба надіслати друзям."
"They choose \"Join a company\" in Omsi-Hub and paste it.":
  de: "Sie wählen in Omsi-Hub „Einem Betrieb beitreten“ und fügen ihn ein."
  fr: "Ils choisissent « Rejoindre une entreprise » dans Omsi-Hub et le collent."
  nl: "Zij kiezen in Omsi-Hub \"Meedoen met een bedrijf\" en plakken hem."
  pl: "Wybierają w Omsi-Hub „Dołącz do firmy” i wklejają go."
  ru: "Они выбирают в Omsi-Hub «Присоединиться к компании» и вставляют его."
  uk: "Вони обирають в Omsi-Hub «Приєднатися до компанії» і вставляють його."
"They take open duties (or you give them one in RosterFlow's Roster), and drive them in your world: open it here, or drive a duty of your own.":
  de: "Sie übernehmen offene Dienste (oder du gibst ihnen einen im Dienstplan von RosterFlow) und fahren sie in deiner Welt: öffne sie hier oder fahre selbst einen Dienst."
  fr: "Ils prennent des services à pourvoir (ou vous leur en donnez un dans le Roster de RosterFlow) et les conduisent dans votre monde : ouvrez-le ici, ou conduisez vous-même un service."
  nl: "Zij nemen open diensten (of jij geeft ze er een in het Rooster van RosterFlow) en rijden ze in jouw wereld: open die hier, of rijd zelf een dienst."
  pl: "Biorą otwarte służby (albo dajesz im jedną w grafiku RosterFlow) i jeżdżą je w twoim świecie: otwórz go tutaj albo sam jedź jakąś służbę."
  ru: "Они берут открытые смены (или вы даёте им смену в графике RosterFlow) и выполняют их в вашем мире: откройте его здесь или сами выполняйте смену."
  uk: "Вони беруть відкриті зміни (або ви даєте їм зміну в графіку RosterFlow) і виконують їх у вашому світі: відкрийте його тут або самі виконуйте зміну."
