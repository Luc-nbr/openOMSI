  pl: "Jeździ: %{name}"
  ru: "Выполняет: %{name}"
  uk: "Виконує: %{name}"
"Join a company":
  de: "Einem Betrieb beitreten"
  fr: "Rejoindre une entreprise"
  nl: "Meedoen met een bedrijf"
  pl: "Dołącz do firmy"
  ru: "Присоединиться к компании"
  uk: "Приєднатися до компанії"
"A friend runs a bus company and plays as its boss. Paste the session code he sent you: you drive duties of his company's day for it, in his world.":
  de: "Ein Freund führt einen Busbetrieb und spielt als dessen Chef. Füge den Sitzungscode ein, den er dir geschickt hat: du fährst Dienste vom Tag seines Betriebs für ihn, in seiner Welt."
  fr: "Un ami dirige une entreprise de bus et joue en tant que patron. Collez le code de session qu'il vous a envoyé : vous conduisez pour son entreprise des services de sa journée, dans son monde."
  nl: "Een vriend runt een busbedrijf en speelt als de baas. Plak de sessiecode die hij je stuurde: je rijdt diensten van de dag van zijn bedrijf ervoor, in zijn wereld."
  pl: "Znajomy prowadzi firmę autobusową i gra jako jej szef. Wklej kod sesji, który ci wysłał: jeździsz dla jego firmy służby z jej dnia, w jego świecie."
  ru: "Друг управляет автобусной компанией и играет как её босс. Вставьте код сессии, который он вам прислал: вы выполняете для его компании смены её дня в его мире."
  uk: "Друг керує автобусною компанією й грає як її бос. Вставте код сесії, який він вам надіслав: ви виконуєте для його компанії зміни її дня в його світі."
"Session code (HUB-…)":
  de: "Sitzungscode (HUB-…)"
  fr: "Code de session (HUB-…)"
  nl: "Sessiecode (HUB-…)"
  pl: "Kod sesji (HUB-…)"
  ru: "Код сессии (HUB-…)"
  uk: "Код сесії (HUB-…)"
"Both need the same version of Omsi-Hub.":
  de: "Beide brauchen dieselbe Version von Omsi-Hub."
  fr: "Il faut la même version d'Omsi-Hub des deux côtés."
  nl: "Beiden hebben dezelfde versie van Omsi-Hub nodig."
  pl: "Obaj potrzebujecie tej samej wersji Omsi-Hub."
  ru: "Обоим нужна одна и та же версия Omsi-Hub."
  uk: "Обом потрібна однакова версія Omsi-Hub."
"The same network, the same VPN (Hamachi, Radmin VPN, ZeroTier, Tailscale), or the boss's tunnel.":
  de: "Dasselbe Netzwerk, dasselbe VPN (Hamachi, Radmin VPN, ZeroTier, Tailscale) oder der Tunnel des Chefs."
  fr: "Le même réseau, le même VPN (Hamachi, Radmin VPN, ZeroTier, Tailscale), ou le tunnel du patron."
  nl: "Hetzelfde netwerk, hetzelfde VPN (Hamachi, Radmin VPN, ZeroTier, Tailscale), of de tunnel van de baas."
  pl: "Ta sama sieć, ten sam VPN (Hamachi, Radmin VPN, ZeroTier, Tailscale) albo tunel szefa."
  ru: "Та же сеть, тот же VPN (Hamachi, Radmin VPN, ZeroTier, Tailscale) или туннель босса."
  uk: "Та сама мережа, той самий VPN (Hamachi, Radmin VPN, ZeroTier, Tailscale) або тунель боса."
"The boss's company map, and the buses of his duties, installed.":
  de: "Die Karte des Betriebs und die Busse seiner Dienste installiert."
  fr: "La carte de l'entreprise du patron et les bus de ses services, installés."
  nl: "De kaart van het bedrijf van de baas, en de bussen van zijn diensten, geïnstalleerd."
  pl: "Zainstalowana mapa firmy szefa i autobusy jego służb."
  ru: "Установлены карта компании босса и автобусы её смен."
  uk: "Встановлені мапа компанії боса й автобуси її змін."
"No open duty right now: the boss can give you one.":
  de: "Gerade kein offener Dienst: der Chef kann dir einen geben."
  fr: "Aucun service à pourvoir pour l'instant : le patron peut vous en donner un."
  nl: "Nu geen open dienst: de baas kan je er een geven."
  pl: "Teraz brak otwartej służby: szef może ci jakąś dać."
  ru: "Сейчас нет открытых смен: босс может дать вам смену."
  uk: "Зараз немає відкритих змін: бос може дати вам зміну."
"No duty of yours yet: take an open one.":
  de: "Noch kein Dienst von dir: übernimm einen offenen."
  fr: "Aucun service à vous pour l'instant : prenez-en un à pourvoir."
  nl: "Nog geen dienst van jou: neem een open dienst."
  pl: "Nie masz jeszcze służby: weź otwartą."
  ru: "У вас пока нет смены: возьмите открытую."
  uk: "У вас поки немає зміни: візьміть відкриту."
"The rest of the day":
  de: "Der Rest des Tages"
  fr: "Le reste de la journée"
  nl: "De rest van de dag"
  pl: "Reszta dnia"
  ru: "Остальной день"
  uk: "Решта дня"
"My results":
