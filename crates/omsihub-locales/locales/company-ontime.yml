  uk: "Гарантовані пересадки"
"A train or another line at a stop: the line's buses wait for its passengers, at the most the hold - or their passengers change to it. The driver is told on the way.":
  de: "Ein Zug oder eine andere Linie an einer Haltestelle: Die Busse der Linie warten auf ihre Fahrgäste, höchstens die Wartezeit - oder ihre Fahrgäste steigen in sie um. Der Fahrer erfährt es unterwegs."
  fr: "Un train ou une autre ligne à un arrêt : les bus de la ligne attendent ses voyageurs, au plus le temps d'attente - ou leurs voyageurs y changent. Le conducteur en est averti en route."
  nl: "Een trein of een andere lijn bij een halte: de bussen van de lijn wachten op de reizigers, hooguit de wachttijd - of hun reizigers stappen erop over. De chauffeur hoort het onderweg."
  pl: "Pociąg lub inna linia na przystanku: autobusy linii czekają na jej pasażerów, najwyżej przez czas oczekiwania - albo ich pasażerowie się na nią przesiadają. Kierowca dowiaduje się o tym w drodze."
  ru: "Поезд или другая линия на остановке: автобусы линии ждут её пассажиров, не дольше времени ожидания, - или их пассажиры пересаживаются на неё. Водителю сообщают об этом в пути."
  uk: "Потяг або інша лінія на зупинці: автобуси лінії чекають на її пасажирів, не довше часу очікування, - або їхні пасажири пересідають на неї. Водієві повідомляють про це в дорозі."
