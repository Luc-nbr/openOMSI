"On a company duty: how you stand against the timetable, the gap to the buses ahead and behind, the connections to wait for and the diversions of the day.":
  de: "Bei einem Dienst der Firma: wie du zum Fahrplan stehst, der Abstand zu den Bussen vor und hinter dir, die Anschlüsse, auf die du wartest, und die Umleitungen des Tages."
  fr: "Lors d'un service de l'entreprise : votre écart par rapport à l'horaire, l'intervalle avec les bus devant et derrière, les correspondances à attendre et les déviations du jour."
  nl: "Bij een dienst van het bedrijf: hoe je ervoor staat ten opzichte van de dienstregeling, de afstand tot de bussen voor en achter je, de aansluitingen om op te wachten en de omleidingen van de dag."
  pl: "Na służbie firmy: jak stoisz względem rozkładu, odstęp do autobusów przed i za tobą, przesiadki, na które czekasz, i objazdy dnia."
  ru: "На смене компании: как вы идёте относительно расписания, интервал до автобусов впереди и позади, пересадки, которые нужно ждать, и объезды дня."
  uk: "На зміні компанії: як ви йдете відносно розкладу, інтервал до автобусів попереду й позаду, пересадки, на які треба чекати, і об'їзди дня."
