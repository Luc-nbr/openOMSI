"%{month} is closed: leases, depreciation, insurance and tax, overheads and loan rates are booked. The month's result: %{amount}.":
  de: "%{month} ist abgeschlossen: Leasing, Abschreibung, Versicherung und Steuer, Gemeinkosten und Kreditraten sind gebucht. Das Ergebnis des Monats: %{amount}."
  fr: "%{month} est clôturé : leasings, amortissements, assurance et taxes, frais généraux et échéances de prêt sont comptabilisés. Le résultat du mois : %{amount}."
  nl: "%{month} is afgesloten: lease, afschrijving, verzekering en belasting, overheadkosten en aflossingen zijn geboekt. Het resultaat van de maand: %{amount}."
  pl: "%{month} zamknięty: leasing, amortyzacja, ubezpieczenie i podatki, koszty ogólne i raty kredytów są zaksięgowane. Wynik miesiąca: %{amount}."
  ru: "%{month} закрыт: лизинг, амортизация, страховка и налоги, накладные расходы и платежи по кредитам проведены. Результат месяца: %{amount}."
  uk: "%{month} закрито: лізинг, амортизацію, страхування й податки, накладні витрати та платежі за кредитами проведено. Результат місяця: %{amount}."
"Drivers' wages %{amount}: %{hours} hours of duty paid (%{over} overtime) and %{guaranteed} hours of the week's guarantee.":
  de: "Fahrerlöhne %{amount}: %{hours} bezahlte Dienststunden (%{over} Überstunden) und %{guaranteed} Stunden aus der Wochengarantie."
  fr: "Salaires des conducteurs %{amount} : %{hours} heures de service payées (%{over} heures supplémentaires) et %{guaranteed} heures de la garantie hebdomadaire."
  nl: "Chauffeurslonen %{amount}: %{hours} betaalde diensturen (%{over} overuren) en %{guaranteed} uur uit de weekgarantie."
  pl: "Płace kierowców %{amount}: %{hours} płatnych godzin służby (%{over} nadgodzin) i %{guaranteed} godzin z gwarancji tygodniowej."
  ru: "Зарплата водителей %{amount}: оплачено %{hours} часов смен (%{over} сверхурочно) и %{guaranteed} часов по недельной гарантии."
  uk: "Зарплата водіїв %{amount}: оплачено %{hours} годин змін (%{over} понаднормово) і %{guaranteed} годин за тижневою гарантією."
