_version: 2
# RosterFlow, Beta 66 (Luc's Beta 65 reports): Discard leaving what is locked, the reason a link
# is refused, unassigning the duties ticked, the Optimise settings, the Timeplan's trips chosen
# and its running times copied to other days.
"Discarded: back to the saved planning - the locked vehicles and duties stay as they are.":
  de: "Verworfen: zurück zur gespeicherten Planung - die gesperrten Fahrzeuge und Dienste bleiben, wie sie sind."
  fr: "Abandonné : retour à la planification enregistrée - les véhicules et services verrouillés restent tels quels."
  nl: "Verworpen: terug naar de opgeslagen planning - de vergrendelde voertuigen en diensten blijven zoals ze zijn."
  pl: "Odrzucono: powrót do zapisanego planu - zablokowane pojazdy i służby pozostają bez zmian."
  ru: "Отменено: возврат к сохранённому плану - заблокированные машины и смены остаются как есть."
  uk: "Скасовано: повернення до збереженого плану - заблоковані машини та зміни залишаються як є."
"Link the trips chosen: they stay together on one bus, and Optimise keeps them so":
  de: "Die gewählten Fahrten verknüpfen: Sie bleiben zusammen auf einem Bus, und Optimieren behält das bei"
  fr: "Lier les courses choisies : elles restent ensemble sur un même bus, et l'optimisation les garde ainsi"
  nl: "De gekozen ritten koppelen: ze blijven samen op één bus, en Optimaliseren houdt ze zo"
  pl: "Połącz wybrane kursy: zostają razem na jednym autobusie, a optymalizacja tak je zachowuje"
  ru: "Связать выбранные рейсы: они остаются вместе на одном автобусе, и оптимизация сохраняет это"
  uk: "Зв'язати вибрані рейси: вони залишаються разом на одному автобусі, і оптимізація це зберігає"
"Unassign all trips":
  de: "Alle Fahrten zurücknehmen"
  fr: "Désaffecter toutes les courses"
  nl: "Alle ritten ontkoppelen"
  pl: "Odepnij wszystkie kursy"
  ru: "Снять все рейсы"
  uk: "Зняти всі рейси"
"Unassign every trip of %{n} duties to the stack?":
  de: "Jede Fahrt von %{n} Diensten auf den Stapel zurücknehmen?"
  fr: "Remettre chaque course de %{n} services sur la pile ?"
  nl: "Elke rit van %{n} diensten terug naar de stapel?"
  pl: "Odpiąć wszystkie kursy %{n} służb na stos?"
  ru: "Снять все рейсы %{n} смен в стопку?"
  uk: "Зняти всі рейси %{n} змін у стос?"
"Every trip of the duties ticked back to the stack, to plan them anew (asked first; Undo puts them back)":
  de: "Jede Fahrt der angehakten Dienste zurück auf den Stapel, um sie neu zu planen (erst gefragt; Rückgängig stellt sie wieder her)"
  fr: "Chaque course des services cochés remise sur la pile, pour les planifier à nouveau (demandé d'abord ; Annuler les remet)"
  nl: "Elke rit van de aangevinkte diensten terug naar de stapel, om ze opnieuw te plannen (eerst gevraagd; Ongedaan maken zet ze terug)"
  pl: "Każdy kurs zaznaczonych służb z powrotem na stos, aby zaplanować je od nowa (najpierw pytanie; Cofnij je przywraca)"
  ru: "Все рейсы отмеченных смен обратно в стопку, чтобы спланировать их заново (сначала спросит; Отмена возвращает их)"
  uk: "Усі рейси позначених змін назад у стос, щоб спланувати їх заново (спершу запитає; Скасування повертає їх)"
"The duties ticked run no trips.":
  de: "Die angehakten Dienste fahren keine Fahrten."
  fr: "Les services cochés n'assurent aucune course."
  nl: "De aangevinkte diensten rijden geen ritten."
  pl: "Zaznaczone służby nie obsługują żadnych kursów."
  ru: "Отмеченные смены не выполняют рейсов."
  uk: "Позначені зміни не виконують рейсів."
"Trips of %{n} duties unassigned to the stack":
  de: "Fahrten von %{n} Diensten auf den Stapel zurückgenommen"
  fr: "Courses de %{n} services remises sur la pile"
  nl: "Ritten van %{n} diensten terug naar de stapel"
  pl: "Kursy %{n} służb odpięte na stos"
  ru: "Рейсы %{n} смен сняты в стопку"
  uk: "Рейси %{n} змін знято у стос"
"Trips of %{n} duties unassigned to the stack: Undo (Ctrl+Z) puts them back.":
  de: "Fahrten von %{n} Diensten auf den Stapel zurückgenommen: Rückgängig (Strg+Z) stellt sie wieder her."
  fr: "Courses de %{n} services remises sur la pile : Annuler (Ctrl+Z) les remet."
  nl: "Ritten van %{n} diensten terug naar de stapel: Ongedaan maken (Ctrl+Z) zet ze terug."
  pl: "Kursy %{n} służb odpięte na stos: Cofnij (Ctrl+Z) je przywraca."
  ru: "Рейсы %{n} смен сняты в стопку: Отмена (Ctrl+Z) возвращает их."
  uk: "Рейси %{n} змін знято у стос: Скасування (Ctrl+Z) повертає їх."
"Trips of %{n} duties unassigned to the stack; %{k} trips stay, their vehicle or duty is locked. Undo (Ctrl+Z) puts them back.":
  de: "Fahrten von %{n} Diensten auf den Stapel zurückgenommen; %{k} Fahrten bleiben, ihr Fahrzeug oder Dienst ist gesperrt. Rückgängig (Strg+Z) stellt sie wieder her."
  fr: "Courses de %{n} services remises sur la pile ; %{k} courses restent, leur véhicule ou service est verrouillé. Annuler (Ctrl+Z) les remet."
  nl: "Ritten van %{n} diensten terug naar de stapel; %{k} ritten blijven, hun voertuig of dienst is vergrendeld. Ongedaan maken (Ctrl+Z) zet ze terug."
  pl: "Kursy %{n} służb odpięte na stos; zostaje kursów: %{k}, ich pojazd lub służba są zablokowane. Cofnij (Ctrl+Z) je przywraca."
  ru: "Рейсы %{n} смен сняты в стопку; остаются рейсов: %{k}, их машина или смена заблокирована. Отмена (Ctrl+Z) возвращает их."
  uk: "Рейси %{n} змін знято у стос; залишаються рейсів: %{k}, їхня машина або зміна заблокована. Скасування (Ctrl+Z) повертає їх."
"None of the duties ticked could be unassigned: their vehicles or duties are locked.":
  de: "Keiner der angehakten Dienste konnte zurückgenommen werden: Ihre Fahrzeuge oder Dienste sind gesperrt."
  fr: "Aucun des services cochés n'a pu être désaffecté : leurs véhicules ou services sont verrouillés."
  nl: "Geen van de aangevinkte diensten kon worden ontkoppeld: hun voertuigen of diensten zijn vergrendeld."
  pl: "Żadnej z zaznaczonych służb nie udało się odpiąć: ich pojazdy lub służby są zablokowane."
  ru: "Ни одну из отмеченных смен не удалось снять: их машины или смены заблокированы."
  uk: "Жодну з позначених змін не вдалося зняти: їхні машини або зміни заблоковані."
"Switch on the vehicles, the duties or both: Optimise has nothing to make.":
  de: "Schalte die Fahrzeuge, die Dienste oder beides ein: Optimieren hat sonst nichts zu tun."
  fr: "Activez les véhicules, les services ou les deux : l'optimisation n'a rien à faire."
  nl: "Zet de voertuigen, de diensten of beide aan: Optimaliseren heeft niets te doen."
  pl: "Włącz pojazdy, służby albo oba: optymalizacja nie ma nic do zrobienia."
  ru: "Включите машины, смены или и то, и другое: оптимизации нечего делать."
  uk: "Увімкніть машини, зміни або обидва: оптимізації нічого робити."
"Choose every trip of the day (Ctrl+A)":
  de: "Jede Fahrt des Tages wählen (Strg+A)"
  fr: "Choisir chaque course du jour (Ctrl+A)"
  nl: "Elke rit van de dag kiezen (Ctrl+A)"
  pl: "Wybierz każdy kurs dnia (Ctrl+A)"
  ru: "Выбрать все рейсы дня (Ctrl+A)"
  uk: "Вибрати всі рейси дня (Ctrl+A)"
"Copy timings to…":
  de: "Fahrzeiten kopieren nach…"
  fr: "Copier les temps vers…"
  nl: "Rijtijden kopiëren naar…"
  pl: "Kopiuj czasy przejazdu do…"
  ru: "Копировать время хода в…"
  uk: "Копіювати час ходу в…"
"Copy timings to… other day groups: the running times of this one, for both directions or the one shown":
  de: "Fahrzeiten kopieren nach… andere Tagesgruppen: die Fahrzeiten dieser, für beide Richtungen oder die gezeigte"
  fr: "Copier les temps vers… d'autres groupes de jours : les temps de parcours de celui-ci, pour les deux sens ou celui affiché"
  nl: "Rijtijden kopiëren naar… andere dagsoorten: de rijtijden van deze, voor beide richtingen of de getoonde"
  pl: "Kopiuj czasy przejazdu do… innych grup dni: czasy tej grupy, dla obu kierunków albo pokazanego"
  ru: "Копировать время хода в… другие группы дней: время хода этой группы, для обоих направлений или показанного"
  uk: "Копіювати час ходу в… інші групи днів: час ходу цієї групи, для обох напрямків або показаного"
"The running times of %{day}, to:":
  de: "Die Fahrzeiten von %{day}, nach:"
  fr: "Les temps de parcours de %{day}, vers :"
  nl: "De rijtijden van %{day}, naar:"
  pl: "Czasy przejazdu z %{day}, do:"
  ru: "Время хода для %{day}, в:"
  uk: "Час ходу для %{day}, у:"
"Both directions":
  de: "Beide Richtungen"
  fr: "Les deux sens"
  nl: "Beide richtingen"
  pl: "Oba kierunki"
  ru: "Оба направления"
  uk: "Обидва напрямки"
"Only the direction shown":
  de: "Nur die gezeigte Richtung"
  fr: "Seulement le sens affiché"
  nl: "Alleen de getoonde richting"
  pl: "Tylko pokazany kierunek"
  ru: "Только показанное направление"
  uk: "Лише показаний напрямок"
"There are no running times to copy.":
  de: "Es gibt keine Fahrzeiten zum Kopieren."
  fr: "Il n'y a pas de temps de parcours à copier."
  nl: "Er zijn geen rijtijden om te kopiëren."
  pl: "Brak czasów przejazdu do skopiowania."
  ru: "Нет времени хода для копирования."
  uk: "Немає часу ходу для копіювання."
"The running times of %{from}, both directions, copied to %{days}: their trips follow them. Save keeps them, Undo takes them back.":
  de: "Die Fahrzeiten von %{from}, beide Richtungen, nach %{days} kopiert: Ihre Fahrten folgen ihnen. Speichern behält sie, Rückgängig nimmt sie zurück."
  fr: "Les temps de parcours de %{from}, les deux sens, copiés vers %{days} : leurs courses les suivent. Enregistrer les garde, Annuler les retire."
  nl: "De rijtijden van %{from}, beide richtingen, gekopieerd naar %{days}: hun ritten volgen ze. Opslaan houdt ze, Ongedaan maken neemt ze terug."
  pl: "Czasy przejazdu z %{from}, oba kierunki, skopiowane do %{days}: ich kursy za nimi podążają. Zapisz je zachowuje, Cofnij je wycofuje."
  ru: "Время хода для %{from}, оба направления, скопировано в %{days}: их рейсы следуют за ним. Сохранить оставляет его, Отмена возвращает."
  uk: "Час ходу для %{from}, обидва напрямки, скопійовано в %{days}: їхні рейси слідують за ним. Зберегти залишає його, Скасування повертає."
"The running times of %{from}, this direction, copied to %{days}: their trips follow them. Save keeps them, Undo takes them back.":
  de: "Die Fahrzeiten von %{from}, diese Richtung, nach %{days} kopiert: Ihre Fahrten folgen ihnen. Speichern behält sie, Rückgängig nimmt sie zurück."
  fr: "Les temps de parcours de %{from}, ce sens, copiés vers %{days} : leurs courses les suivent. Enregistrer les garde, Annuler les retire."
  nl: "De rijtijden van %{from}, deze richting, gekopieerd naar %{days}: hun ritten volgen ze. Opslaan houdt ze, Ongedaan maken neemt ze terug."
  pl: "Czasy przejazdu z %{from}, ten kierunek, skopiowane do %{days}: ich kursy za nimi podążają. Zapisz je zachowuje, Cofnij je wycofuje."
  ru: "Время хода для %{from}, это направление, скопировано в %{days}: их рейсы следуют за ним. Сохранить оставляет его, Отмена возвращает."
  uk: "Час ходу для %{from}, цей напрямок, скопійовано в %{days}: їхні рейси слідують за ним. Зберегти залишає його, Скасування повертає."
