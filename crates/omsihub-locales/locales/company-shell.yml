# (the company's tour, where the shell changed what it points at)
"Cash and reputation":
  de: "Kasse und Ruf"
  fr: "Trésorerie et réputation"
  nl: "Kas en reputatie"
  pl: "Gotówka i reputacja"
  ru: "Касса и репутация"
  uk: "Каса й репутація"
"Always in view up here: the company's cash and its reputation; the trophies earned with goals and contracts are in their tooltips. A click opens the page about it.":
  de: "Hier oben immer im Blick: die Kasse des Unternehmens und sein Ruf; die mit Zielen und Verträgen verdienten Trophäen stehen in ihren Tooltips. Ein Klick öffnet die passende Seite."
  fr: "Toujours en vue ici en haut : la trésorerie de l'entreprise et sa réputation ; les trophées gagnés avec les objectifs et les contrats sont dans leurs infobulles. Un clic ouvre la page correspondante."
  nl: "Hier bovenaan altijd in beeld: de kas van het bedrijf en zijn reputatie; de trofeeën verdiend met doelen en contracten staan in hun tooltips. Een klik opent de pagina erover."
  pl: "Zawsze widoczne tu na górze: gotówka firmy i jej reputacja; trofea zdobyte za cele i kontrakty są w ich podpowiedziach. Kliknięcie otwiera odpowiednią stronę."
  ru: "Всегда на виду здесь, наверху: касса компании и её репутация; трофеи за цели и контракты — во всплывающих подсказках. Щелчок открывает нужную страницу."
  uk: "Завжди на виду тут, угорі: каса компанії та її репутація; трофеї за цілі й контракти — у спливних підказках. Клік відкриває потрібну сторінку."
"Always in view up here: your cash and your reputation. A click on the cash opens the money.":
  de: "Hier oben immer im Blick: deine Kasse und dein Ruf. Ein Klick auf die Kasse öffnet das Geld."
  fr: "Toujours en vue ici en haut : ta trésorerie et ta réputation. Un clic sur la trésorerie ouvre l'argent."
  nl: "Hier bovenaan altijd in beeld: je kas en je reputatie. Een klik op de kas opent het geld."
  pl: "Zawsze widoczne tu na górze: twoja gotówka i reputacja. Kliknięcie gotówki otwiera finanse."
  ru: "Всегда на виду здесь, наверху: твоя касса и репутация. Щелчок по кассе открывает деньги."
  uk: "Завжди на виду тут, угорі: твоя каса й репутація. Клік по касі відкриває гроші."
"The company runs in a time of its own. Simulate to tomorrow runs the rest of the day; the arrow beside it lets the clock run, adds an hour or opens the clock with its other steps. At midnight the day is closed: the tours are run and the money is booked.":
  de: "Das Unternehmen läuft in seiner eigenen Zeit. „Bis morgen simulieren“ lässt den Rest des Tages laufen; der Pfeil daneben lässt die Uhr laufen, fügt eine Stunde hinzu oder öffnet die Uhr mit ihren weiteren Schritten. Um Mitternacht wird der Tag abgeschlossen: Die Umläufe sind gefahren und das Geld ist gebucht."
  fr: "L'entreprise vit à son propre rythme. « Simuler jusqu'à demain » fait passer le reste de la journée ; la flèche à côté fait tourner l'horloge, ajoute une heure ou ouvre l'horloge et ses autres pas. À minuit, la journée est close : les services sont effectués et l'argent est comptabilisé."
  nl: "Het bedrijf loopt in een eigen tijd. Simuleren tot morgen laat de rest van de dag lopen; het pijltje ernaast laat de klok lopen, voegt een uur toe of opent de klok met zijn andere stappen. Om middernacht wordt de dag afgesloten: de omlopen zijn gereden en het geld is geboekt."
  pl: "Firma żyje we własnym czasie. „Symuluj do jutra” przewija resztę dnia; strzałka obok uruchamia zegar, dodaje godzinę albo otwiera zegar z innymi krokami. O północy dzień się zamyka: kursy są przejechane, a pieniądze zaksięgowane."
  ru: "Компания живёт в своём времени. «Симулировать до завтра» прокручивает остаток дня; стрелка рядом запускает часы, добавляет час или открывает часы с другими шагами. В полночь день закрывается: рейсы выполнены, деньги проведены."
  uk: "Компанія живе у своєму часі. «Симулювати до завтра» прокручує решту дня; стрілка поруч запускає годинник, додає годину або відкриває годинник з іншими кроками. Опівночі день закривається: рейси виконано, гроші проведено."
"Every page at hand":
  de: "Jede Seite griffbereit"
  fr: "Chaque page à portée de main"
  nl: "Elke pagina bij de hand"
  pl: "Każda strona pod ręką"
  ru: "Все страницы под рукой"
  uk: "Усі сторінки під рукою"
"Every page is in the sidebar, grouped as the start screen groups them, a badge where something waits. A star pins a page to the top; the arrow folds the sidebar to its icons and Ctrl+B slides it away. Ctrl+K finds any page or action, and Escape takes you back to the start screen.":
  de: "Jede Seite steht in der Seitenleiste, gruppiert wie auf dem Startbildschirm, mit einem Abzeichen, wo etwas wartet. Ein Stern heftet eine Seite oben an; der Pfeil klappt die Leiste auf ihre Symbole zusammen und Strg+B blendet sie aus. Strg+K findet jede Seite und Aktion, und Escape bringt dich zum Startbildschirm zurück."
  fr: "Chaque page est dans la barre latérale, groupée comme sur l'écran d'accueil, avec un badge là où quelque chose attend. Une étoile épingle une page en haut ; la flèche réduit la barre à ses icônes et Ctrl+B la fait disparaître. Ctrl+K trouve n'importe quelle page ou action, et Échap te ramène à l'écran d'accueil."
  nl: "Elke pagina staat in de zijbalk, gegroepeerd zoals op het startscherm, met een badge waar iets wacht. Een ster zet een pagina bovenaan vast; het pijltje klapt de zijbalk in tot zijn pictogrammen en Ctrl+B schuift hem weg. Ctrl+K vindt elke pagina of actie, en Escape brengt je terug naar het startscherm."
  pl: "Każda strona jest na pasku bocznym, pogrupowana jak na ekranie startowym, z plakietką tam, gdzie coś czeka. Gwiazdka przypina stronę na górze; strzałka zwija pasek do ikon, a Ctrl+B go chowa. Ctrl+K znajduje każdą stronę i działanie, a Escape wraca do ekranu startowego."
  ru: "Все страницы — на боковой панели, сгруппированные как на стартовом экране, со значком там, где что-то ждёт. Звёздочка закрепляет страницу сверху; стрелка сворачивает панель до значков, а Ctrl+B прячет её. Ctrl+K находит любую страницу или действие, а Escape возвращает на стартовый экран."
  uk: "Усі сторінки — на бічній панелі, згруповані як на стартовому екрані, зі значком там, де щось чекає. Зірочка закріплює сторінку зверху; стрілка згортає панель до значків, а Ctrl+B ховає її. Ctrl+K знаходить будь-яку сторінку чи дію, а Escape повертає на стартовий екран."
"What needs you now, each with the button that does it: tours without a bus or a driver, lines not planned, bus contracts at risk, breakdowns, complaints and the coming week.":
  de: "Was dich jetzt braucht, jeweils mit dem Knopf, der es erledigt: Umläufe ohne Bus oder Fahrer, ungeplante Linien, gefährdete Busverträge, Pannen, Beschwerden und die kommende Woche."
  fr: "Ce qui t'attend maintenant, chaque fois avec le bouton qui s'en charge : services sans bus ni conducteur, lignes non planifiées, contrats de bus menacés, pannes, réclamations et la semaine à venir."
  nl: "Wat nu op je wacht, elk met de knop die het doet: omlopen zonder bus of chauffeur, lijnen die niet gepland zijn, buscontracten in gevaar, pannes, klachten en de komende week."
  pl: "Co teraz czeka na ciebie, każde z przyciskiem, który to załatwia: kursy bez autobusu lub kierowcy, niezaplanowane linie, zagrożone umowy autobusowe, awarie, skargi i nadchodzący tydzień."
  ru: "Что требует тебя сейчас, каждое с кнопкой, которая это делает: обороты без автобуса или водителя, незапланированные линии, контракты под угрозой, поломки, жалобы и ближайшая неделя."
  uk: "Що потребує тебе зараз, кожне з кнопкою, яка це робить: обороти без автобуса чи водія, незаплановані лінії, контракти під загрозою, поломки, скарги й найближчий тиждень."
"Your round menu up here has the account, multiplayer, the settings, the light or dark look and this tour again. Good luck with your company!":
  de: "Dein rundes Menü hier oben hat das Konto, den Mehrspielermodus, die Einstellungen, das helle oder dunkle Aussehen und diese Tour noch einmal. Viel Erfolg mit deinem Unternehmen!"
  fr: "Ton menu rond ici en haut contient le compte, le multijoueur, les paramètres, l'apparence claire ou sombre et cette visite à nouveau. Bonne chance avec ton entreprise !"
  nl: "Je ronde menu hier bovenaan heeft het account, multiplayer, de instellingen, het lichte of donkere uiterlijk en deze rondleiding opnieuw. Veel succes met je bedrijf!"
  pl: "Twoje okrągłe menu tu na górze ma konto, tryb wieloosobowy, ustawienia, jasny lub ciemny wygląd i ponownie tę wycieczkę. Powodzenia z twoją firmą!"
  ru: "В твоём круглом меню наверху — аккаунт, мультиплеер, настройки, светлое или тёмное оформление и снова эта экскурсия. Удачи с твоей компанией!"
  uk: "У твоєму круглому меню вгорі — обліковий запис, мультиплеєр, налаштування, світле чи темне оформлення і знову ця екскурсія. Успіхів з твоєю компанією!"
"Every bus as a card, with its age and its condition. Repairs happen by themselves; Buy a bus opens the shop, the buses that fit your lines first. The sidebar opens every page.":
  de: "Jeder Bus als Karte, mit seinem Alter und Zustand. Reparaturen passieren von selbst; „Bus kaufen“ öffnet den Laden, die Busse, die zu deinen Linien passen, zuerst. Die Seitenleiste öffnet jede Seite."
  fr: "Chaque bus en carte, avec son âge et son état. Les réparations se font toutes seules ; « Acheter un bus » ouvre la boutique, les bus adaptés à tes lignes d'abord. La barre latérale ouvre chaque page."
  nl: "Elke bus als kaart, met zijn leeftijd en staat. Reparaties gebeuren vanzelf; Bus kopen opent de winkel, de bussen die bij je lijnen passen eerst. De zijbalk opent elke pagina."
  pl: "Każdy autobus jako karta, z wiekiem i stanem. Naprawy dzieją się same; „Kup autobus” otwiera sklep, najpierw autobusy pasujące do twoich linii. Pasek boczny otwiera każdą stronę."
  ru: "Каждый автобус — карточка с его возрастом и состоянием. Ремонт идёт сам; «Купить автобус» открывает магазин, сначала автобусы для твоих линий. Боковая панель открывает любую страницу."
  uk: "Кожен автобус — картка з його віком і станом. Ремонт відбувається сам; «Купити автобус» відкриває магазин, спершу автобуси для твоїх ліній. Бічна панель відкриває будь-яку сторінку."
