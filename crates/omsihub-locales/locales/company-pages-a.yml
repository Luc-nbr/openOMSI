"Set an ask to see your expected score.":
  de: "Lege eine Forderung fest, um deine erwartete Wertung zu sehen."
  fr: "Fixez une demande pour voir votre note attendue."
  nl: "Stel een vraagprijs in om je verwachte score te zien."
  pl: "Ustaw ofertę, aby zobaczyć spodziewany wynik."
  ru: "Укажите запрос, чтобы увидеть ожидаемый балл."
  uk: "Вкажіть запит, щоб побачити очікуваний бал."
"Price: the lowest ask gets all 70 points, every other ask lowest ÷ ask of them.":
  de: "Preis: Die niedrigste Forderung erhält alle 70 Punkte, jede andere den Anteil niedrigste ÷ eigene Forderung davon."
  fr: "Prix : la demande la plus basse obtient les 70 points, toute autre demande la part plus basse ÷ sa demande."
  nl: "Prijs: de laagste vraagprijs krijgt alle 70 punten, elke andere laagste ÷ eigen vraagprijs daarvan."
  pl: "Cena: najniższa oferta dostaje wszystkie 70 punktów, każda inna ich część najniższa ÷ jej oferta."
  ru: "Цена: самый низкий запрос получает все 70 баллов, любой другой — их долю «самый низкий ÷ его запрос»."
  uk: "Ціна: найнижчий запит отримує всі 70 балів, будь-який інший — їхню частку «найнижчий ÷ його запит»."
"Quality: your track record, 100 % less 2 % a default point - yours %{pts} points, %{q} of 30.":
  de: "Qualität: deine Bilanz, 100 % abzüglich 2 % je Vertragsstrafpunkt - deine %{pts} Punkte, %{q} von 30."
  fr: "Qualité : votre historique, 100 % moins 2 % par point de défaut - les vôtres %{pts} points, %{q} sur 30."
  nl: "Kwaliteit: je staat van dienst, 100 % min 2 % per boetepunt - jouw %{pts} punten, %{q} van 30."
  pl: "Jakość: twoja historia, 100 % minus 2 % za każdy punkt karny - twoje %{pts} punktów, %{q} z 30."
  ru: "Качество: ваша история исполнения, 100 % минус 2 % за штрафной балл — у вас %{pts} баллов, %{q} из 30."
  uk: "Якість: ваша історія виконання, 100 % мінус 2 % за штрафний бал — у вас %{pts} балів, %{q} з 30."
"Asks above the cap do not count; on equal totals the price decides, then quality.":
  de: "Forderungen über der Obergrenze zählen nicht; bei gleicher Summe entscheidet der Preis, dann die Qualität."
  fr: "Les demandes au-dessus du plafond ne comptent pas ; à égalité, le prix départage, puis la qualité."
  nl: "Vraagprijzen boven het plafond tellen niet; bij een gelijke som beslist de prijs, dan de kwaliteit."
  pl: "Oferty powyżej limitu się nie liczą; przy równej sumie decyduje cena, potem jakość."
  ru: "Запросы выше потолка не учитываются; при равной сумме решает цена, затем качество."
  uk: "Запити понад стелю не враховуються; за рівної суми вирішує ціна, потім якість."
