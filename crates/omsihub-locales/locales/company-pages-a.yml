"What it drives: how many ride (from about −9 % to +15 %), what advertisers pay, your rating in stars, an own weekend line's tourism grant and a little of what lenders allow. Your quality in tenders is not the reputation but your contracts' track record of default points. Below 40, only half of a further loss counts for the passengers and the grant.":
  de: "Was er bewirkt: wie viele mitfahren (von etwa −9 % bis +15 %), was Werbekunden zahlen, deine Bewertung in Sternen, den Tourismuszuschuss einer eigenen Wochenendlinie und ein wenig dessen, was Geldgeber gewähren. Deine Qualität bei Ausschreibungen ist nicht der Ruf, sondern die Bilanz deiner Verträge an Vertragsstrafpunkten. Unter 40 zählt ein weiterer Verlust für Fahrgäste und Zuschuss nur zur Hälfte."
  fr: "Ce qu'elle influence : combien voyagent (d'environ −9 % à +15 %), ce que paient les annonceurs, votre note en étoiles, la subvention touristique d'une ligne de week-end propre et un peu de ce que les prêteurs accordent. Votre qualité dans les appels d'offres n'est pas la réputation mais l'historique de points de défaut de vos contrats. Sous 40, seule la moitié d'une nouvelle perte compte pour les voyageurs et la subvention."
  nl: "Wat ze bepaalt: hoeveel mensen meerijden (van ongeveer −9 % tot +15 %), wat adverteerders betalen, je beoordeling in sterren, de toerismesubsidie van een eigen weekendlijn en een beetje van wat geldschieters toestaan. Je kwaliteit bij aanbestedingen is niet de reputatie maar de staat van dienst van je contracten in boetepunten. Onder 40 telt een verder verlies maar half mee voor de reizigers en de subsidie."
  pl: "Na co wpływa: ilu ludzi jeździ (od ok. −9 % do +15 %), ile płacą reklamodawcy, twoja ocena w gwiazdkach, dotacja turystyczna własnej linii weekendowej i trochę tego, na co pozwalają pożyczkodawcy. Jakość w przetargach to nie reputacja, lecz historia punktów karnych twoich umów. Poniżej 40 dalsza strata liczy się tylko w połowie dla pasażerów i dotacji."
  ru: "На что она влияет: сколько людей ездит (примерно от −9 % до +15 %), сколько платят рекламодатели, ваш рейтинг в звёздах, туристическая субсидия собственной линии выходного дня и немного того, что позволяют кредиторы. Качество в тендерах — это не репутация, а история штрафных баллов ваших контрактов. Ниже 40 дальнейшая потеря учитывается для пассажиров и субсидии лишь наполовину."
  uk: "На що вона впливає: скільки людей їздить (приблизно від −9 % до +15 %), скільки платять рекламодавці, ваш рейтинг у зірках, туристична субсидія власної лінії вихідного дня і трохи того, що дозволяють кредитори. Якість у тендерах — це не репутація, а історія штрафних балів ваших контрактів. Нижче 40 подальша втрата враховується для пасажирів і субсидії лише наполовину."
