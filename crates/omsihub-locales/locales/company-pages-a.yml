"Your reputation runs from 0 to 100 and starts at 50. Good days raise it a little, bad days lower it - never by more than the day's and the week's cap.":
  de: "Dein Ruf reicht von 0 bis 100 und beginnt bei 50. Gute Tage heben ihn ein wenig, schlechte senken ihn - nie mehr als die Grenze des Tages und der Woche."
  fr: "Votre réputation va de 0 à 100 et commence à 50. Les bonnes journées la font monter un peu, les mauvaises la font baisser - jamais plus que le plafond du jour et de la semaine."
  nl: "Je reputatie loopt van 0 tot 100 en begint op 50. Goede dagen verhogen haar een beetje, slechte verlagen haar - nooit meer dan de grens van de dag en de week."
  pl: "Reputacja wynosi od 0 do 100 i zaczyna od 50. Dobre dni lekko ją podnoszą, złe obniżają - nigdy bardziej niż limit dnia i tygodnia."
  ru: "Репутация идёт от 0 до 100 и начинается с 50. Хорошие дни немного поднимают её, плохие опускают — не больше дневного и недельного предела."
