  nl: "Laat de bussen onderhouden voordat ze kapotgaan, en repareer de kapotte snel."
  pl: "Serwisuj autobusy, zanim się zepsują, a zepsute naprawiaj szybko."
  ru: "Обслуживайте автобусы до поломки, а сломанные чините быстро."
  uk: "Обслуговуйте автобуси до поломки, а зламані ремонтуйте швидко."
"Optimise your depot":
  de: "Optimiere deinen Betriebshof"
  fr: "Optimisez votre dépôt"
  nl: "Optimaliseer je depot"
  pl: "Usprawnij zajezdnię"
  ru: "Улучшите депо"
  uk: "Покращте депо"
"Keep the buses and the yard clean: cleaners and a washing bay.":
  de: "Halte Busse und Hof sauber: Reinigungskräfte und eine Waschhalle."
  fr: "Gardez les bus et la cour propres : des nettoyeurs et une station de lavage."
  nl: "Houd de bussen en het terrein schoon: schoonmakers en een wasstraat."
  pl: "Dbaj o czystość autobusów i placu: sprzątacze i myjnia."
  ru: "Держите автобусы и двор в чистоте: уборщики и мойка."
  uk: "Тримайте автобуси й двір у чистоті: прибиральники й мийка."
"Invest in research":
  de: "In Forschung investieren"
  fr: "Investissez dans la recherche"
  nl: "Investeer in onderzoek"
  pl: "Inwestuj w badania"
  ru: "Вкладывайте в исследования"
  uk: "Вкладайте в дослідження"
"Research WLAN and air conditioning; then sign the internet and the cleaning company on the Contracts page.":
  de: "Erforsche WLAN und Klimaanlage; schließe dann Internet und Reinigungsfirma auf der Seite Verträge ab."
  fr: "Recherchez le Wi-Fi et la climatisation ; signez ensuite l'internet et l'entreprise de nettoyage sur la page Contrats."
  nl: "Onderzoek wifi en airconditioning; sluit daarna internet en het schoonmaakbedrijf af op de pagina Contracten."
  pl: "Zbadaj WLAN i klimatyzację; potem podpisz internet i firmę sprzątającą na stronie Umowy."
  ru: "Исследуйте Wi-Fi и кондиционеры; затем подпишите интернет и клининг на странице «Контракты»."
  uk: "Дослідіть Wi-Fi та кондиціонери; потім підпишіть інтернет і клінінг на сторінці «Контракти»."
"Answer the complaints":
  de: "Beschwerden beantworten"
  fr: "Répondez aux réclamations"
  nl: "Beantwoord de klachten"
  pl: "Odpowiadaj na skargi"
  ru: "Отвечайте на жалобы"
  uk: "Відповідайте на скарги"
"Answer the passengers' complaints before they run out: a good answer wins reputation back.":
  de: "Beantworte die Beschwerden der Fahrgäste, bevor sie ablaufen: Eine gute Antwort gewinnt Ruf zurück."
  fr: "Répondez aux réclamations des voyageurs avant leur échéance : une bonne réponse regagne de la réputation."
  nl: "Beantwoord de klachten van reizigers voordat ze verlopen: een goed antwoord wint reputatie terug."
  pl: "Odpowiadaj na skargi pasażerów przed terminem: dobra odpowiedź odzyskuje reputację."
  ru: "Отвечайте на жалобы пассажиров до срока: хороший ответ возвращает репутацию."
  uk: "Відповідайте на скарги пасажирів до терміну: добра відповідь повертає репутацію."
"Keep the fares fair":
  de: "Faire Fahrpreise"
  fr: "Des tarifs justes"
  nl: "Houd de tarieven eerlijk"
  pl: "Uczciwe ceny biletów"
  ru: "Честные тарифы"
  uk: "Чесні тарифи"
"Fares far above the association's cost reputation every day; bigger buses or more trips help full lines.":
  de: "Fahrpreise weit über denen des Verbunds kosten jeden Tag Ruf; größere Busse oder mehr Fahrten helfen vollen Linien."
  fr: "Des tarifs bien au-dessus de ceux de l'autorité organisatrice coûtent de la réputation chaque jour ; des bus plus grands ou plus de trajets soulagent les lignes pleines."
  nl: "Tarieven ver boven die van de vervoerregio kosten elke dag reputatie; grotere bussen of meer ritten helpen volle lijnen."
  pl: "Ceny dużo powyżej cen związku kosztują reputację każdego dnia; większe autobusy lub więcej kursów pomagają pełnym liniom."
  ru: "Тарифы намного выше тарифов объединения каждый день стоят репутации; большие автобусы или больше рейсов помогают переполненным линиям."
  uk: "Тарифи набагато вищі за тарифи об'єднання щодня коштують репутації; більші автобуси або більше рейсів допомагають переповненим лініям."
# --- career -----------------------------------------------------------------------------------
"Plan yourself a duty":
  de: "Plane dir einen Dienst"
  fr: "Planifiez-vous un service"
  nl: "Plan jezelf een dienst"
  pl: "Zaplanuj sobie służbę"
  ru: "Назначьте себе смену"
  uk: "Призначте собі наряд"
"Plan yourself":
  de: "Plane dich ein"
  fr: "Planifiez-vous"
  nl: "Plan jezelf in"
  pl: "Zaplanuj się"
  ru: "Назначьте себя"
  uk: "Призначте себе"
"In the Planning, choose a duty and \"You\" as its driver: it is yours on that weekday every week.":
  de: "Wähle in der Planung einen Dienst und \"Du\" als Fahrer: Er gehört dann jede Woche an diesem Wochentag dir."
  fr: "Dans la Planification, choisissez un service et « Vous » comme conducteur : il est à vous ce jour de la semaine, chaque semaine."
  nl: "Kies in de Planning een dienst en \"Jij\" als chauffeur: hij is dan elke week op die weekdag van jou."
  pl: "W Planowaniu wybierz służbę i „Ty” jako kierowcę: będzie twoja w ten dzień tygodnia co tydzień."
  ru: "В Планировании выберите смену и «Вы» как водителя: она будет вашей в этот день недели каждую неделю."
  uk: "У Плануванні виберіть наряд і «Ви» як водія: він буде вашим у цей день тижня щотижня."
"Drive it":
  de: "Fahre ihn"
  fr: "Conduisez-le"
  nl: "Rijd hem"
  pl: "Jedź nią"
  ru: "Проведите её"
  uk: "Проїдьте його"
"\"Drive\" opens the start of the drive with everything set: the map, the line and tour, the company's bus in its livery, the day and the time.":
  de: "\"Fahren\" öffnet den Start der Fahrt mit allem eingestellt: Karte, Linie und Umlauf, den Bus des Unternehmens in seiner Lackierung, Tag und Uhrzeit."
  fr: "« Conduire » ouvre le départ avec tout réglé : la carte, la ligne et le service, le bus de l'entreprise dans sa livrée, le jour et l'heure."
  nl: "\"Rijden\" opent de start van de rit met alles ingesteld: de kaart, de lijn en omloop, de bus van het bedrijf in zijn lak, de dag en de tijd."
  pl: "„Jedź” otwiera start jazdy ze wszystkim ustawionym: mapą, linią i brygadą, autobusem firmy w jego malowaniu, dniem i godziną."
  ru: "«Поездка» открывает старт со всеми настройками: карта, линия и выход, автобус компании в его ливрее, день и время."
  uk: "«Їхати» відкриває старт з усіма налаштуваннями: карта, лінія й оборот, автобус компанії в його лівреї, день і час."
"It counts":
  de: "Es zählt"
  fr: "Ça compte"
  nl: "Het telt"
  pl: "To się liczy"
  ru: "Это засчитывается"
  uk: "Це зараховується"
"What you drive counts for the company, as measured, when its day is closed; a duty of yours not driven is open for the central to fill.":
  de: "Was du fährst, zählt für das Unternehmen als gemessen, wenn sein Tag abgeschlossen wird; ein nicht gefahrener Dienst von dir ist für die Zentrale offen."
  fr: "Ce que vous conduisez compte pour l'entreprise, comme mesuré, à la clôture de sa journée ; un service non conduit reste ouvert pour la centrale."
  nl: "Wat je rijdt telt voor het bedrijf, als gemeten, zodra de dag wordt afgesloten; een dienst van jou die je niet rijdt staat open voor de centrale."
  pl: "To, co przejedziesz, liczy się dla firmy jako zmierzone przy zamknięciu jej dnia; nieprzejechana twoja służba pozostaje otwarta dla centrali."
  ru: "То, что вы проедете, засчитывается компании как измеренное при закрытии её дня; не проеханная вами смена остаётся открытой для центральной."
  uk: "Те, що ви проїдете, зараховується компанії як виміряне при закритті її дня; не проїханий вами наряд лишається відкритим для центральної."
