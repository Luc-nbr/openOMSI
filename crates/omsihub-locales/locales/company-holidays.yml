"Approved holidays are planned ahead: free colleagues cover the duties of who is off, and the roster keeps their place for when they are back.":
  de: "Genehmigter Urlaub wird vorausgeplant: Freie Kollegen übernehmen die Dienste der Abwesenden, und der Dienstplan hält ihren Platz frei, bis sie zurück sind."
  fr: "Les congés accordés sont planifiés à l'avance : des collègues libres assurent les services des absents, et le planning garde leur place pour leur retour."
  nl: "Goedgekeurde vakanties worden vooruit gepland: vrije collega's nemen de diensten over van wie vrij is, en het rooster houdt hun plek vast voor als ze terug zijn."
  pl: "Zatwierdzone urlopy są planowane z wyprzedzeniem: wolni koledzy przejmują służby nieobecnych, a grafik zachowuje ich miejsce na powrót."
  ru: "Одобренные отпуска планируются заранее: свободные коллеги берут смены отсутствующих, а график сохраняет их место до возвращения."
  uk: "Схвалені відпустки плануються заздалегідь: вільні колеги беруть зміни відсутніх, а графік зберігає їхнє місце до повернення."
"A rejection costs satisfaction, more each time it happens to the same person, and weighs on them for half a year. An approval pleases them a little.":
  de: "Eine Ablehnung kostet Zufriedenheit, jedes Mal mehr bei derselben Person, und belastet sie ein halbes Jahr lang. Eine Genehmigung freut sie ein wenig."
  fr: "Un refus coûte de la satisfaction, davantage à chaque fois pour la même personne, et pèse sur elle pendant six mois. Un accord lui fait un peu plaisir."
  nl: "Een afwijzing kost tevredenheid, elke keer meer bij dezelfde persoon, en weegt een halfjaar op hen. Een goedkeuring maakt hen iets blijer."
  pl: "Odmowa obniża zadowolenie, za każdym razem bardziej u tej samej osoby, i ciąży jej przez pół roku. Zgoda trochę ją cieszy."
  ru: "Отказ снижает удовлетворённость, с каждым разом сильнее у того же человека, и давит на него полгода. Одобрение его немного радует."
  uk: "Відмова знижує задоволеність, щоразу сильніше в тієї самої людини, і тисне на неї пів року. Схвалення її трохи тішить."
