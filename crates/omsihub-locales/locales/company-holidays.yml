"No requests are waiting. Your staff ask for their holidays ahead: most for the summer and Christmas, seldom at short notice.":
  de: "Keine Anträge offen. Ihr Personal beantragt Urlaub im Voraus: meist für den Sommer und Weihnachten, selten kurzfristig."
  fr: "Aucune demande en attente. Votre personnel demande ses congés à l'avance : surtout pour l'été et Noël, rarement au dernier moment."
  nl: "Er wachten geen aanvragen. Uw personeel vraagt vakantie vooruit aan: vooral voor de zomer en Kerst, zelden op korte termijn."
  pl: "Brak oczekujących wniosków. Personel prosi o urlop z wyprzedzeniem: najczęściej na lato i święta, rzadko w ostatniej chwili."
  ru: "Ожидающих заявок нет. Персонал просит отпуск заранее: чаще всего на лето и Рождество, редко в последний момент."
  uk: "Заявок, що чекають, немає. Персонал просить відпустку заздалегідь: найчастіше на літо й Різдво, рідко в останню мить."
