# The bus company's holiday requests (Beta 57, tester feedback on Beta 56): staff ask ahead,
# the Staff page's Holidays tab plans them against a limit of drivers off a day, the inbox asks
# with Approve and Reject, and the planner answers by the game mode.
"%{name} asks for a holiday":
  de: "%{name} beantragt Urlaub"
  fr: "%{name} demande des congés"
  nl: "%{name} vraagt vakantie aan"
  pl: "%{name} prosi o urlop"
  ru: "%{name} просит отпуск"
  uk: "%{name} просить відпустку"
"%{name} asks for %{from} until %{until} off (%{n} working days). Reason: %{why}. Answer by %{date}, or the planner's suggestion holds.":
  de: "%{name} möchte von %{from} bis %{until} frei (%{n} Arbeitstage). Grund: %{why}. Antworten Sie bis %{date}, sonst gilt der Vorschlag des Planers."
  fr: "%{name} demande à être absent(e) du %{from} au %{until} (%{n} jours ouvrés). Motif : %{why}. Répondez d'ici le %{date}, sinon la proposition du planificateur s'applique."
  nl: "%{name} vraagt vrij van %{from} tot en met %{until} (%{n} werkdagen). Reden: %{why}. Antwoord uiterlijk %{date}, anders geldt het voorstel van de planner."
  pl: "%{name} prosi o wolne od %{from} do %{until} (%{n} dni roboczych). Powód: %{why}. Odpowiedz do %{date}, inaczej obowiązuje propozycja planisty."
  ru: "%{name} просит выходные с %{from} по %{until} (%{n} рабочих дн.). Причина: %{why}. Ответьте до %{date}, иначе действует предложение планировщика."
  uk: "%{name} просить вихідні з %{from} по %{until} (%{n} робочих дн.). Причина: %{why}. Дайте відповідь до %{date}, інакше діє пропозиція планувальника."
"%{name} asks for %{from} until %{until} off (%{n} working days). Reason: %{why}. Answer by %{date}: no answer is a no.":
  de: "%{name} möchte von %{from} bis %{until} frei (%{n} Arbeitstage). Grund: %{why}. Antworten Sie bis %{date}: Keine Antwort ist ein Nein."
  fr: "%{name} demande à être absent(e) du %{from} au %{until} (%{n} jours ouvrés). Motif : %{why}. Répondez d'ici le %{date} : sans réponse, c'est non."
  nl: "%{name} vraagt vrij van %{from} tot en met %{until} (%{n} werkdagen). Reden: %{why}. Antwoord uiterlijk %{date}: geen antwoord is nee."
  pl: "%{name} prosi o wolne od %{from} do %{until} (%{n} dni roboczych). Powód: %{why}. Odpowiedz do %{date}: brak odpowiedzi oznacza odmowę."
  ru: "%{name} просит выходные с %{from} по %{until} (%{n} рабочих дн.). Причина: %{why}. Ответьте до %{date}: нет ответа — значит нет."
  uk: "%{name} просить вихідні з %{from} по %{until} (%{n} робочих дн.). Причина: %{why}. Дайте відповідь до %{date}: немає відповіді — означає ні."
"%{name}'s holiday was approved":
