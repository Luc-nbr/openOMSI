"Approving %{name}'s holiday puts %{most} off on holiday where your limit is %{max}, on: %{days}. Their duties then need free colleagues, an agency driver or are dropped.":
  de: "Mit dem Urlaub von %{name} sind %{most} im Urlaub, wo Ihr Limit %{max} ist, am: %{days}. Ihre Dienste brauchen dann freie Kollegen oder einen Leihfahrer, sonst fallen sie aus."
  fr: "Accorder les congés de %{name} met %{most} personnes en congé là où votre limite est de %{max}, les : %{days}. Leurs services demandent alors des collègues libres ou un chauffeur intérimaire, sinon ils sont supprimés."
  nl: "Met de vakantie van %{name} erbij zijn er %{most} met vakantie waar uw grens %{max} is, op: %{days}. Hun diensten hebben dan vrije collega's of een uitzendkracht nodig, of vallen uit."
  pl: "Zatwierdzenie urlopu dla %{name} daje %{most} osób na urlopie przy limicie %{max}, w dni: %{days}. Ich służby potrzebują wtedy wolnych kolegów lub kierowcy z agencji, inaczej wypadają."
  ru: "Если одобрить отпуск для %{name}, в отпуске будут %{most} человек при лимите %{max}, в дни: %{days}. Их сменам тогда нужны свободные коллеги или водитель из агентства, иначе они выпадут."
  uk: "Якщо схвалити відпустку для %{name}, у відпустці будуть %{most} людей за ліміту %{max}, у дні: %{days}. Їхнім змінам тоді потрібні вільні колеги чи водій з агентства, інакше вони випадуть."
