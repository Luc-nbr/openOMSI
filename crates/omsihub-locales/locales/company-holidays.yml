"The company approved %{name}'s holiday from %{from} until %{until} (%{why}): %{what}.":
  de: "Das Unternehmen hat den Urlaub von %{name} von %{from} bis %{until} genehmigt (%{why}): %{what}."
  fr: "L'entreprise a accordé les congés de %{name} du %{from} au %{until} (%{why}) : %{what}."
  nl: "Het bedrijf heeft de vakantie van %{name} van %{from} tot en met %{until} goedgekeurd (%{why}): %{what}."
  pl: "Firma zatwierdziła urlop dla %{name} od %{from} do %{until} (%{why}): %{what}."
  ru: "Компания одобрила отпуск для %{name} с %{from} по %{until} (%{why}): %{what}."
