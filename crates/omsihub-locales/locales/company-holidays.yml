"%{name}'s request for %{from} until %{until} was due without your answer: the planner rejected it, as %{what}. They are less satisfied.":
  de: "Der Antrag von %{name} für %{from} bis %{until} war ohne Ihre Antwort fällig: Der Planer hat ihn abgelehnt, denn %{what}. Die Person ist unzufriedener."
  fr: "La demande de %{name} pour le %{from} au %{until} est arrivée à échéance sans votre réponse : le planificateur l'a refusée, car %{what}. Cette personne est moins satisfaite."
  nl: "De aanvraag van %{name} voor %{from} tot en met %{until} verliep zonder uw antwoord: de planner heeft hem afgewezen, want %{what}. Diegene is minder tevreden."
  pl: "Wniosek %{name} na %{from} – %{until} minął bez Twojej odpowiedzi: planista go odrzucił, ponieważ %{what}. Ta osoba jest mniej zadowolona."
