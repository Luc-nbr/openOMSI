"Cover short: %{away} of the roster's %{n} drivers away, only %{spare} free to stand in":
  de: "Vertretung knapp: %{away} von %{n} Fahrern des Dienstplans fehlen, nur %{spare} frei zum Einspringen"
  fr: "Remplacement insuffisant : %{away} des %{n} conducteurs du planning absents, seulement %{spare} libres pour remplacer"
