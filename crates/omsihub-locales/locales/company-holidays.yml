"%{name} asked for %{from} until %{until} off and heard nothing back: they take it as a no, and are less satisfied.":
  de: "%{name} hat für %{from} bis %{until} frei beantragt und keine Antwort bekommen: Das gilt als Nein, und die Person ist unzufriedener."
  fr: "%{name} a demandé un congé du %{from} au %{until} sans recevoir de réponse : c'est un non, et cette personne est moins satisfaite."
  nl: "%{name} vroeg vrij van %{from} tot en met %{until} en hoorde niets terug: dat geldt als nee, en diegene is minder tevreden."
  pl: "%{name} prosi o wolne od %{from} do %{until} i nie dostaje odpowiedzi: to oznacza odmowę, a ta osoba jest mniej zadowolona."
  ru: "%{name} просит выходные с %{from} по %{until} и не получает ответа: это считается отказом, и сотрудник менее доволен."
  uk: "%{name} просить вихідні з %{from} по %{until} і не отримує відповіді: це вважається відмовою, і працівник менш задоволений."
