"Cover: %{away} of the roster's %{n} drivers away, %{spare} free drivers can stand in":
  de: "Vertretung: %{away} von %{n} Fahrern des Dienstplans fehlen, %{spare} freie Fahrer können einspringen"
  fr: "Remplacement : %{away} des %{n} conducteurs du planning absents, %{spare} conducteurs libres peuvent les remplacer"
  nl: "Bezetting: %{away} van de %{n} chauffeurs van het rooster weg, %{spare} vrije chauffeurs kunnen invallen"
