"Casual: requests within the limit are approved by themselves, the others rejected.":
  de: "Entspannt: Anträge innerhalb des Limits werden von selbst genehmigt, die anderen abgelehnt."
  fr: "Détente : les demandes dans la limite sont accordées d'elles-mêmes, les autres refusées."
  nl: "Casual: aanvragen binnen de grens worden vanzelf goedgekeurd, de andere afgewezen."
  pl: "Swobodny: wnioski w limicie są zatwierdzane same, pozostałe odrzucane."
  ru: "Казуальный: заявки в пределах лимита одобряются сами, остальные отклоняются."
  uk: "Казуальний: заявки в межах ліміту схвалюються самі, решта відхиляється."
"Normal: the planner suggests an answer to each request; one not answered by its day gets the planner's answer.":
  de: "Normal: Der Planer schlägt für jeden Antrag eine Antwort vor; ein bis zu seinem Tag unbeantworteter Antrag bekommt die Antwort des Planers."
  fr: "Normal : le planificateur propose une réponse à chaque demande ; une demande sans réponse à son échéance reçoit celle du planificateur."
  nl: "Normaal: de planner stelt voor elke aanvraag een antwoord voor; een aanvraag die op zijn dag nog niet beantwoord is, krijgt het antwoord van de planner."
  pl: "Normalna: planista proponuje odpowiedź na każdy wniosek; wniosek bez odpowiedzi w terminie dostaje odpowiedź planisty."
  ru: "Обычное: планировщик предлагает ответ на каждую заявку; заявка без ответа к сроку получает ответ планировщика."
  uk: "Нормальне: планувальник пропонує відповідь на кожну заявку; заявка без відповіді до строку отримує відповідь планувальника."
"Realistic: every answer is yours. A request not answered by its day counts as rejected.":
  de: "Realistisch: Jede Antwort liegt bei Ihnen. Ein bis zu seinem Tag unbeantworteter Antrag gilt als abgelehnt."
  fr: "Réaliste : chaque réponse vous revient. Une demande sans réponse à son échéance compte comme refusée."
  nl: "Realistisch: elk antwoord is aan u. Een aanvraag die op zijn dag nog niet beantwoord is, geldt als afgewezen."
  pl: "Realistyczny: każda odpowiedź należy do Ciebie. Wniosek bez odpowiedzi w terminie liczy się jako odrzucony."
  ru: "Реалистично: каждый ответ за вами. Заявка без ответа к сроку считается отклонённой."
  uk: "Реалістично: кожна відповідь за вами. Заявка без відповіді до строку вважається відхиленою."
"Drivers off on holiday a day, at most":
