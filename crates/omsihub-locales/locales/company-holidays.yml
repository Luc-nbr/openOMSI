"%{name}'s request for %{from} until %{until} was due without your answer: the planner approved it, as %{what}.":
  de: "Der Antrag von %{name} für %{from} bis %{until} war ohne Ihre Antwort fällig: Der Planer hat ihn genehmigt, denn %{what}."
  fr: "La demande de %{name} pour le %{from} au %{until} est arrivée à échéance sans votre réponse : le planificateur l'a accordée, car %{what}."
  nl: "De aanvraag van %{name} voor %{from} tot en met %{until} verliep zonder uw antwoord: de planner heeft hem goedgekeurd, want %{what}."
  pl: "Wniosek %{name} na %{from} – %{until} minął bez Twojej odpowiedzi: planista go zatwierdził, ponieważ %{what}."
  ru: "Срок ответа на заявку %{name} на %{from} – %{until} истёк без вашего ответа: планировщик её одобрил, так как %{what}."
  uk: "Строк відповіді на заявку %{name} на %{from} – %{until} минув без вашої відповіді: планувальник її схвалив, бо %{what}."
