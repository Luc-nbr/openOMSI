"The company rejected %{name}'s holiday from %{from} until %{until} (%{why}): %{what}. Rejections make people less satisfied; a higher limit on the Staff page's Holidays tab lets more go at once.":
  de: "Das Unternehmen hat den Urlaub von %{name} von %{from} bis %{until} abgelehnt (%{why}): %{what}. Ablehnungen machen die Leute unzufriedener; ein höheres Limit im Reiter Urlaub der Personalseite lässt mehr gleichzeitig gehen."
  fr: "L'entreprise a refusé les congés de %{name} du %{from} au %{until} (%{why}) : %{what}. Les refus rendent le personnel moins satisfait ; une limite plus haute dans l'onglet Congés de la page Personnel en laisse partir davantage à la fois."
  nl: "Het bedrijf heeft de vakantie van %{name} van %{from} tot en met %{until} afgewezen (%{why}): %{what}. Afwijzingen maken mensen minder tevreden; een hogere grens op het tabblad Vakanties van de personeelspagina laat er meer tegelijk gaan."
  pl: "Firma odrzuciła urlop dla %{name} od %{from} do %{until} (%{why}): %{what}. Odmowy obniżają zadowolenie; wyższy limit w zakładce Urlopy na stronie Personelu pozwala na więcej urlopów naraz."
  ru: "Компания отклонила отпуск для %{name} с %{from} по %{until} (%{why}): %{what}. Отказы снижают удовлетворённость; более высокий лимит на вкладке «Отпуска» страницы персонала отпускает больше людей одновременно."
  uk: "Компанія відхилила відпустку для %{name} з %{from} по %{until} (%{why}): %{what}. Відмови знижують задоволеність; вищий ліміт на вкладці «Відпустки» сторінки персоналу відпускає більше людей одночасно."
