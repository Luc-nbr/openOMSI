  fr: "Déviation à venir : suivez les panneaux"
  nl: "Omleiding verderop: volg de borden"
  pl: "Objazd przed tobą: jedź zgodnie ze znakami"
  ru: "Впереди объезд: следуйте указателям"
  uk: "Попереду об'їзд: дотримуйтеся вказівників"
"Road closed ahead: expect delays":
