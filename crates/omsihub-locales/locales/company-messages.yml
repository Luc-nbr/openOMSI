_version: 2
# The control room's messages to the drivers and theirs (docs/omsihub/MESSAGES.md): the canned
# texts and the dispatcher's (`co::messages`), the feed's lines, the Operations page's compose box
# and list (`company/messages.rs`, `ops.rs`), the driver's buttons, the plugin's inbox in the game
# (`lua/messages.lua`) and the add-on's features for it (`compat.rs`).
"You are running %{min} min late":
  de: "Sie sind %{min} Min. verspätet"
  fr: "Vous avez %{min} min de retard"
  nl: "Je rijdt %{min} min te laat"
  pl: "Masz %{min} min opóźnienia"
  ru: "Вы опаздываете на %{min} мин"
  uk: "Ви запізнюєтеся на %{min} хв"
"Please make up time where you safely can":
  de: "Bitte holen Sie Zeit auf, wo es sicher geht"
  fr: "Rattrapez du temps là où c'est sans danger"
  nl: "Haal tijd in waar dat veilig kan"
  pl: "Nadrób czas tam, gdzie to bezpieczne"
  ru: "Наверстайте время там, где это безопасно"
  uk: "Надолужте час там, де це безпечно"
"Well done: you are back on time":
  de: "Gut gemacht: Sie sind wieder pünktlich"
  fr: "Bravo : vous êtes de nouveau à l'heure"
  nl: "Goed gedaan: je rijdt weer op tijd"
  pl: "Brawo: znowu jedziesz punktualnie"
  ru: "Отлично: вы снова по расписанию"
  uk: "Чудово: ви знову за розкладом"
"Short-turn on the %{time} trip: turn back early, the next trip leaves on time":
  de: "Vorzeitig wenden bei der Fahrt um %{time}: die nächste Fahrt fährt pünktlich ab"
  fr: "Demi-tour anticipé sur le trajet de %{time} : le trajet suivant part à l'heure"
  nl: "Eerder keren op de rit van %{time}: de volgende rit vertrekt op tijd"
  pl: "Wcześniejszy zawrót na kursie o %{time}: następny kurs odjedzie punktualnie"
  ru: "Ранний разворот на рейсе в %{time}: следующий рейс уйдёт по расписанию"
  uk: "Ранній розворот на рейсі о %{time}: наступний рейс вирушить за розкладом"
"Take a shorter layover before the %{time} trip":
  de: "Machen Sie vor der Fahrt um %{time} eine kürzere Wendezeit"
  fr: "Raccourcissez votre battement avant le trajet de %{time}"
  nl: "Neem een kortere keertijd voor de rit van %{time}"
  pl: "Skróć postój przed kursem o %{time}"
  ru: "Сократите стоянку перед рейсом в %{time}"
  uk: "Скоротіть стоянку перед рейсом о %{time}"
"Spare bus %{bus} takes over at the terminus for the %{time} trip: take your bus back to the depot":
  de: "Ersatzbus %{bus} übernimmt an der Endhaltestelle ab der Fahrt um %{time}: bringen Sie Ihren Bus ins Depot"
  fr: "Le bus de réserve %{bus} prend le relais au terminus pour le trajet de %{time} : ramenez votre bus au dépôt"
  nl: "Reservebus %{bus} neemt aan het eindpunt over voor de rit van %{time}: breng je bus terug naar de remise"
  pl: "Autobus rezerwowy %{bus} przejmuje na pętli kurs o %{time}: odprowadź swój autobus do zajezdni"
  ru: "Резервный автобус %{bus} сменит вас на конечной с рейса в %{time}: отведите свой автобус в парк"
  uk: "Резервний автобус %{bus} змінить вас на кінцевій з рейсу о %{time}: відведіть свій автобус у парк"
"Hold %{min} min at the next stop: a connection is coming":
  de: "Warten Sie %{min} Min. an der nächsten Haltestelle: ein Anschluss kommt"
  fr: "Attendez %{min} min au prochain arrêt : une correspondance arrive"
  nl: "Wacht %{min} min bij de volgende halte: er komt een aansluiting"
  pl: "Poczekaj %{min} min na następnym przystanku: nadjeżdża przesiadka"
  ru: "Задержитесь на %{min} мин на следующей остановке: подходит пересадка"
  uk: "Затримайтеся на %{min} хв на наступній зупинці: підходить пересадка"
"Hold %{min} min at the next stop to even out the headway":
  de: "Warten Sie %{min} Min. an der nächsten Haltestelle, um den Takt auszugleichen"
  fr: "Attendez %{min} min au prochain arrêt pour régulariser l'intervalle"
  nl: "Wacht %{min} min bij de volgende halte om de interval gelijk te trekken"
  pl: "Poczekaj %{min} min na następnym przystanku, aby wyrównać odstęp"
  ru: "Задержитесь на %{min} мин на следующей остановке, чтобы выровнять интервал"
  uk: "Затримайтеся на %{min} хв на наступній зупинці, щоб вирівняти інтервал"
"A relief takes your bus over at %{stop} at %{time}":
  de: "Eine Ablösung übernimmt Ihren Bus um %{time} an %{stop}"
  fr: "Une relève reprend votre bus à %{stop} à %{time}"
  nl: "Een aflossing neemt je bus over bij %{stop} om %{time}"
  pl: "Zmiennik przejmie twój autobus na przystanku %{stop} o %{time}"
  ru: "Сменщик примет ваш автобус на остановке %{stop} в %{time}"
  uk: "Змінник прийме ваш автобус на зупинці %{stop} о %{time}"
"Spare bus %{bus} is on its way: it takes over at %{time}":
  de: "Ersatzbus %{bus} ist unterwegs: er übernimmt um %{time}"
  fr: "Le bus de réserve %{bus} est en route : il prend le relais à %{time}"
  nl: "Reservebus %{bus} is onderweg: hij neemt om %{time} over"
  pl: "Autobus rezerwowy %{bus} jest w drodze: przejmie o %{time}"
  ru: "Резервный автобус %{bus} в пути: сменит вас в %{time}"
  uk: "Резервний автобус %{bus} у дорозі: змінить вас о %{time}"
"A spare bus is waiting at the depot":
  de: "Ein Ersatzbus wartet im Depot"
  fr: "Un bus de réserve attend au dépôt"
  nl: "Er staat een reservebus klaar in de remise"
  pl: "W zajezdni czeka autobus rezerwowy"
  ru: "В парке ждёт резервный автобус"
  uk: "У парку чекає резервний автобус"
"Diversion ahead: follow the signs":
