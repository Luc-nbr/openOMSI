  fr: "Choisissez un message type, écrivez le vôtre ou choisissez une consigne."
  nl: "Kies een standaardbericht, typ er zelf een of kies een opdracht."
  pl: "Wybierz gotową wiadomość, wpisz własną albo wybierz polecenie."
  ru: "Выберите шаблон, напишите свой текст или выберите указание."
  uk: "Виберіть шаблон, напишіть свій текст або виберіть вказівку."
"Choose who the message goes to.":
  de: "Wählen Sie, an wen die Nachricht geht."
  fr: "Choisissez le destinataire du message."
  nl: "Kies naar wie het bericht gaat."
  pl: "Wybierz, do kogo idzie wiadomość."
  ru: "Выберите, кому отправить сообщение."
  uk: "Виберіть, кому надіслати повідомлення."
