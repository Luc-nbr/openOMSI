  pl: "Brak wiadomości: przycisk Wiadomość w wierszu pisze do jego kierowcy."
  ru: "Сообщений пока нет: кнопка «Сообщение» в строке пишет её водителю."
  uk: "Повідомлень поки немає: кнопка «Повідомлення» в рядку пише його водієві."
