"The company has no bus contract. Win a tender on the Concessions page; your own school lines run as a private hire.":
  de: "Das Unternehmen hat keinen Busvertrag. Gewinnen Sie eine Ausschreibung auf der Seite Konzessionen; Ihre eigenen Schullinien fahren als Anmietung."
  fr: "L'entreprise n'a aucun contrat de bus. Remportez un appel d'offres sur la page Concessions ; vos propres lignes scolaires roulent en location privée."
  nl: "Het bedrijf heeft geen buscontract. Win een aanbesteding op de pagina Concessies; je eigen schoollijnen rijden als besloten vervoer."
  pl: "Firma nie ma umowy przewozowej. Wygraj przetarg na stronie Koncesje; twoje własne linie szkolne jeżdżą jako wynajem prywatny."
  ru: "У компании нет контракта на перевозки. Выиграйте тендер на странице «Концессии»; ваши школьные линии работают как заказная перевозка."
  uk: "Компанія не має контракту на перевезення. Виграйте тендер на сторінці «Концесії»; ваші шкільні лінії працюють як замовне перевезення."
