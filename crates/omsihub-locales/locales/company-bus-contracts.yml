"Ends the contract today: it costs a month's average payment, and a map line goes with it.":
  de: "Beendet den Vertrag heute: das kostet eine durchschnittliche Monatszahlung, und eine Linie der Karte geht mit."
  fr: "Met fin au contrat aujourd'hui : cela coûte un paiement mensuel moyen, et une ligne de la carte part avec."
  nl: "Beëindigt het contract vandaag: dat kost een gemiddelde maandbetaling, en een lijn van de kaart gaat mee."
  pl: "Kończy umowę dziś: kosztuje to średnią miesięczną płatność, a linia z mapy odchodzi razem z nią."
  ru: "Расторгает контракт сегодня: это стоит среднего месячного платежа, и линия карты уходит вместе с ним."
