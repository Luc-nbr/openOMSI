"Your track record: %{pts} average net default points a contract over twelve months, %{q} of 30 quality points in the next tenders.":
  de: "Ihre Bilanz: im Schnitt %{pts} Netto-Strafpunkte je Vertrag in zwölf Monaten, %{q} von 30 Qualitätspunkten in den nächsten Ausschreibungen."
  fr: "Votre bilan : en moyenne %{pts} points de pénalité nets par contrat sur douze mois, %{q} des 30 points de qualité aux prochains appels d'offres."
  nl: "Je staat van dienst: gemiddeld %{pts} netto strafpunten per contract in twaalf maanden, %{q} van de 30 kwaliteitspunten in de volgende aanbestedingen."
  pl: "Twoja historia: średnio %{pts} punktów karnych netto na umowę w ciągu dwunastu miesięcy, %{q} z 30 punktów za jakość w kolejnych przetargach."
  ru: "Ваша репутация у заказчика: в среднем %{pts} чистых штрафных баллов на контракт за двенадцать месяцев, %{q} из 30 баллов качества в следующих тендерах."
  uk: "Ваша репутація в замовника: у середньому %{pts} чистих штрафних балів на контракт за дванадцять місяців, %{q} з 30 балів якості в наступних тендерах."
"No track record yet: the authority scores a newcomer as %{pts} points, %{q} of 30 quality points in the next tenders.":
  de: "Noch keine Bilanz: der Aufgabenträger bewertet Neulinge mit %{pts} Punkten, %{q} von 30 Qualitätspunkten in den nächsten Ausschreibungen."
  fr: "Pas encore de bilan : l'autorité compte un nouveau venu à %{pts} points, %{q} des 30 points de qualité aux prochains appels d'offres."
  nl: "Nog geen staat van dienst: de opdrachtgever rekent een nieuwkomer %{pts} punten, %{q} van de 30 kwaliteitspunten in de volgende aanbestedingen."
  pl: "Brak historii: organizator ocenia nowicjusza na %{pts} punktów, %{q} z 30 punktów za jakość w kolejnych przetargach."
  ru: "Истории пока нет: заказчик оценивает новичка в %{pts} балла, %{q} из 30 баллов качества в следующих тендерах."
  uk: "Історії поки немає: замовник оцінює новачка в %{pts} бала, %{q} з 30 балів якості в наступних тендерах."
