"Scored 70 % price, 30 % quality: the lowest ask gets all 70 price points, others lowest ÷ ask of them; quality is your track record, 100 % less 2 % a default point - yours %{pts} points, %{p} of 30. Asks above the cap do not count; on equal totals the price decides, then quality.":
  de: "Bewertet zu 70 % Preis, 30 % Qualität: das niedrigste Angebot bekommt alle 70 Preispunkte, die anderen niedrigstes ÷ eigenes davon; Qualität ist Ihre Bilanz, 100 % minus 2 % je Strafpunkt - Ihre %{pts} Punkte, %{p} von 30. Angebote über der Obergrenze zählen nicht; bei gleicher Summe entscheidet der Preis, dann die Qualität."
  fr: "Noté à 70 % sur le prix, 30 % sur la qualité : l'offre la plus basse obtient les 70 points de prix, les autres la plus basse ÷ la leur ; la qualité est votre bilan, 100 % moins 2 % par point de pénalité - vous avez %{pts} points, %{p} sur 30. Les offres au-dessus du plafond ne comptent pas ; à total égal le prix décide, puis la qualité."
  nl: "Beoordeeld op 70 % prijs, 30 % kwaliteit: de laagste vraagprijs krijgt alle 70 prijspunten, de andere laagste ÷ eigen deel ervan; kwaliteit is je staat van dienst, 100 % min 2 % per strafpunt - jij hebt %{pts} punten, %{p} van 30. Vraagprijzen boven het plafond tellen niet; bij een gelijk totaal beslist de prijs, dan de kwaliteit."
  pl: "Ocena: 70 % cena, 30 % jakość: najniższa oferta dostaje wszystkie 70 punktów za cenę, pozostałe najniższa ÷ własna; jakość to twoja historia, 100 % minus 2 % za punkt karny - masz %{pts} pkt, %{p} z 30. Oferty powyżej limitu się nie liczą; przy równej sumie decyduje cena, potem jakość."
  ru: "Оценка: 70 % цена, 30 % качество: самая низкая заявка получает все 70 ценовых баллов, остальные — наименьшая ÷ своя; качество — это ваша репутация, 100 % минус 2 % за штрафной балл - у вас %{pts} балла, %{p} из 30. Заявки выше предела не учитываются; при равной сумме решает цена, затем качество."
  uk: "Оцінка: 70 % ціна, 30 % якість: найнижча заявка отримує всі 70 цінових балів, інші — найменша ÷ своя; якість — це ваша репутація, 100 % мінус 2 % за штрафний бал - у вас %{pts} бала, %{p} з 30. Заявки понад межу не враховуються; за рівної суми вирішує ціна, далі якість."
