# --- the Preferences: the threshold, and what breaks each rule as edited ------------------------------
"Show a gap as a break from":
  en: "Show a gap as a break from"
  nl: "Een gat als pauze tonen vanaf"
  de: "Eine Lücke als Pause zeigen ab"
  fr: "Montrer un intervalle comme pause à partir de"
  ru: "Считать промежуток перерывом от"
  uk: "Вважати проміжок перервою від"
  pl: "Pokazuj lukę jako przerwę od"
"A shorter gap between two pieces or two trips is standing time: no break, it ends no driving period and counts for no rule.":
  en: "A shorter gap between two pieces or two trips is standing time: no break, it ends no driving period and counts for no rule."
  nl: "Een korter gat tussen twee delen of twee ritten is staantijd: geen pauze, het sluit geen rijperiode af en telt voor geen enkele regel."
  de: "Eine kürzere Lücke zwischen zwei Teilen oder zwei Fahrten ist Standzeit: keine Pause, sie beendet keinen Fahrabschnitt und zählt für keine Regel."
  fr: "Un intervalle plus court entre deux tronçons ou deux courses est un temps d'attente : pas de pause, il ne termine aucune période de conduite et ne compte pour aucune règle."
  ru: "Более короткий промежуток между двумя частями или рейсами — стоянка: не перерыв, он не завершает период вождения и не учитывается ни одним правилом."
  uk: "Коротший проміжок між двома частинами або рейсами — стоянка: не перерва, він не завершує період водіння і не враховується жодним правилом."
  pl: "Krótsza luka między dwiema częściami lub kursami to postój: nie przerwa, nie kończy okresu jazdy i nie liczy się dla żadnej reguły."
"The meal break begins before the duty has worked that long.":
  en: "The meal break begins before the duty has worked that long."
  nl: "De maaltijdpauze begint voordat de dienst zo lang gewerkt heeft."
  de: "Die Essenspause beginnt, bevor der Dienst so lange gearbeitet hat."
  fr: "La pause repas commence avant que le service ait travaillé aussi longtemps."
  ru: "Обеденный перерыв начинается раньше, чем смена отработает столько."
  uk: "Обідня перерва починається раніше, ніж зміна відпрацює стільки."
  pl: "Przerwa na posiłek zaczyna się, zanim służba przepracuje tyle czasu."
"Gaps shorter than %{t} are standing time (Duty Breaks: show a gap as a break from).":
  en: "Gaps shorter than %{t} are standing time (Duty Breaks: show a gap as a break from)."
  nl: "Gaten korter dan %{t} zijn staantijd (Dienstpauzes: een gat als pauze tonen vanaf)."
  de: "Lücken kürzer als %{t} sind Standzeit (Dienstpausen: eine Lücke als Pause zeigen ab)."
  fr: "Les intervalles de moins de %{t} sont du temps d'attente (Pauses de service : montrer un intervalle comme pause à partir de)."
  ru: "Промежутки короче %{t} — стоянка (Перерывы в смене: считать промежуток перерывом от)."
  uk: "Проміжки коротші за %{t} — стоянка (Перерви у зміні: вважати проміжок перервою від)."
  pl: "Luki krótsze niż %{t} to postój (Przerwy w służbie: pokazuj lukę jako przerwę od)."
