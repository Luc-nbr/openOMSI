"Saved for this date only: its weekday keeps the planning it had (an exception for one day).":
  de: "Nur für dieses Datum gespeichert: sein Wochentag behält seine Planung (eine Ausnahme für einen Tag)."
  fr: "Enregistré pour cette date seulement : son jour de semaine garde sa planification (une exception d'un jour)."
  nl: "Alleen voor deze datum opgeslagen: zijn weekdag houdt de planning die hij had (een uitzondering voor één dag)."
  pl: "Zapis tylko dla tej daty: jej dzień tygodnia zachowuje swój plan (wyjątek na jeden dzień)."
  ru: "Сохраняется только для этой даты: её день недели сохраняет прежний план (исключение на один день)."
  uk: "Зберігається лише для цієї дати: її день тижня зберігає попередній план (виняток на один день)."
"Saved for this weekday: its planning holds every week.":
  de: "Für diesen Wochentag gespeichert: seine Planung gilt jede Woche."
  fr: "Enregistré pour ce jour de semaine : sa planification vaut chaque semaine."
  nl: "Opgeslagen voor deze weekdag: zijn planning geldt elke week."
  pl: "Zapis dla tego dnia tygodnia: jego plan obowiązuje co tydzień."
  ru: "Сохраняется для этого дня недели: его план действует каждую неделю."
  uk: "Зберігається для цього дня тижня: його план діє щотижня."
"Apply to":
  de: "Anwenden auf"
  fr: "Appliquer à"
  nl: "Toepassen op"
  pl: "Zastosuj do"
  ru: "Применить к"
  uk: "Застосувати до"
"until":
  de: "bis"
  fr: "jusqu'au"
  nl: "tot en met"
  pl: "do"
  ru: "по"
  uk: "по"
"These dates only: afterwards each runs its weekday's planning again.":
  de: "Nur diese Daten: danach fährt jeder wieder die Planung seines Wochentags."
  fr: "Ces dates seulement : ensuite chacune suit de nouveau la planification de son jour de semaine."
  nl: "Alleen deze data: daarna rijdt elke dag weer de planning van zijn weekdag."
  pl: "Tylko te daty: potem każda znów działa według planu swojego dnia tygodnia."
  ru: "Только эти даты: потом каждая снова работает по плану своего дня недели."
  uk: "Лише ці дати: потім кожна знову працює за планом свого дня тижня."
"Vehicles (the buses' blocks)":
  de: "Fahrzeuge (die Umläufe der Busse)"
  fr: "Véhicules (les blocs des bus)"
  nl: "Voertuigen (de omlopen van de bussen)"
  pl: "Pojazdy (obiegi autobusów)"
  ru: "Машины (выпуски автобусов)"
  uk: "Машини (випуски автобусів)"
"Drivers (the duties)":
  de: "Fahrer (die Dienste)"
  fr: "Conducteurs (les services)"
  nl: "Chauffeurs (de diensten)"
  pl: "Kierowcy (służby)"
  ru: "Водители (смены)"
  uk: "Водії (зміни)"
