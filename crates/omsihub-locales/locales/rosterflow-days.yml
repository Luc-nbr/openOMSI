  ru: "%{n} рейсов шаблона в этот день не ходят."
  uk: "%{n} рейсів шаблону цього дня не ходять."
"To plan by hand: they run as the day's timetable has them.":
  de: "Von Hand zu planen: sie fahren, wie der Fahrplan des Tages sie hat."
  fr: "À planifier à la main : elles roulent comme l'horaire du jour les prévoit."
  nl: "Met de hand te plannen: ze rijden zoals de dienstregeling van de dag ze heeft."
  pl: "Do zaplanowania ręcznie: jadą tak, jak ma je rozkład tego dnia."
  ru: "Спланировать вручную: они идут по расписанию этого дня."
  uk: "Спланувати вручну: вони йдуть за розкладом цього дня."
