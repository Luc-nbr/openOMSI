  nl: "De met de hand te plannen ritten, elk met een link ernaartoe"
  pl: "Kursy do zaplanowania ręcznie, każdy z odnośnikiem"
  ru: "Рейсы для ручного планирования, у каждого ссылка на него"
  uk: "Рейси для ручного планування, у кожного посилання на нього"
"Make this day as its pattern is again: its own changes go":
  de: "Diesen Tag wieder wie sein Muster machen: seine eigenen Änderungen verfallen"
  fr: "Rendre ce jour à nouveau comme son modèle : ses propres modifications disparaissent"
  nl: "Deze dag weer maken zoals zijn patroon is: zijn eigen wijzigingen vervallen"
  pl: "Przywróć ten dzień do wzorca: jego własne zmiany przepadną"
  ru: "Сделать этот день снова как его шаблон: собственные изменения пропадут"
  uk: "Зробити цей день знову як його шаблон: власні зміни зникнуть"
"Reset to pattern":
  de: "Auf Muster zurücksetzen"
  fr: "Revenir au modèle"
  nl: "Terug naar patroon"
  pl: "Przywróć wzorzec"
  ru: "Вернуть к шаблону"
  uk: "Повернути до шаблону"
"Its pattern changed since it was copied: copy it again":
  de: "Sein Muster hat sich seit dem Kopieren geändert: erneut kopieren"
  fr: "Son modèle a changé depuis la copie : le copier de nouveau"
  nl: "Zijn patroon is sinds het kopiëren veranderd: opnieuw kopiëren"
  pl: "Jego wzorzec zmienił się od skopiowania: skopiuj ponownie"
  ru: "Шаблон изменился после копирования: скопировать заново"
  uk: "Шаблон змінився після копіювання: скопіювати знову"
"Stop following: this day keeps its planning as it is":
  de: "Nicht mehr folgen: dieser Tag behält seine Planung, wie sie ist"
  fr: "Ne plus suivre : ce jour garde sa planification telle quelle"
  nl: "Niet meer volgen: deze dag houdt zijn planning zoals ze is"
  pl: "Przestań podążać: ten dzień zachowa swój plan bez zmian"
  ru: "Больше не следовать: этот день сохраняет свой план как есть"
  uk: "Більше не слідувати: цей день зберігає свій план як є"
"Save and apply to other days: every day of this day type, the days with the same timetable, or from a date until a date":
  de: "Speichern und auf andere Tage anwenden: jeden Tag dieser Tagesart, die Tage mit demselben Fahrplan oder von einem Datum bis zu einem Datum"
  fr: "Enregistrer et appliquer à d'autres jours : chaque jour de ce type, les jours avec le même horaire, ou d'une date à une date"
  nl: "Opslaan en op andere dagen toepassen: elke dag van dit dagtype, de dagen met dezelfde dienstregeling, of van een datum tot een datum"
  pl: "Zapisz i zastosuj do innych dni: każdy dzień tego typu, dni z tym samym rozkładem albo od daty do daty"
  ru: "Сохранить и применить к другим дням: каждый день этого типа, дни с тем же расписанием или с даты по дату"
  uk: "Зберегти й застосувати до інших днів: кожен день цього типу, дні з тим самим розкладом або з дати по дату"
"The days of the coming week that run this timetable":
  de: "Die Tage der kommenden Woche, die diesen Fahrplan fahren"
  fr: "Les jours de la semaine à venir qui suivent cet horaire"
  nl: "De dagen van de komende week die deze dienstregeling rijden"
  pl: "Dni nadchodzącego tygodnia, które jeżdżą według tego rozkładu"
  ru: "Дни ближайшей недели, работающие по этому расписанию"
  uk: "Дні найближчого тижня, що працюють за цим розкладом"
"Another timetable: all %{n} of its trips match":
  de: "Anderer Fahrplan: alle %{n} seiner Fahrten passen"
  fr: "Autre horaire : ses %{n} courses correspondent toutes"
  nl: "Andere dienstregeling: alle %{n} ritten passen"
  pl: "Inny rozkład: pasują wszystkie jego %{n} kursy"
  ru: "Другое расписание: совпадают все его %{n} рейсов"
  uk: "Інший розклад: збігаються всі його %{n} рейсів"
"%{n} of this day's trips do not run there":
  de: "%{n} Fahrten dieses Tages fahren dort nicht"
  fr: "%{n} courses de ce jour n'y roulent pas"
  nl: "%{n} ritten van deze dag rijden daar niet"
  pl: "%{n} kursów tego dnia tam nie jeździ"
  ru: "%{n} рейсов этого дня там не ходят"
  uk: "%{n} рейсів цього дня там не ходять"
# a copy that could not be made says why, and what to do instead (testers: "sometimes it works,
# sometimes it doesn't")
"%{days} run this planning already: nothing to copy there.":
  de: "%{days} fahren diese Planung schon: dort gibt es nichts zu kopieren."
  fr: "%{days} suivent déjà cette planification : rien à y copier."
  nl: "%{days} rijden deze planning al: daar valt niets te kopiëren."
  pl: "%{days} jeżdżą już według tego planu: nie ma tam czego kopiować."
  ru: "%{days} уже работают по этому плану: туда нечего копировать."
  uk: "%{days} вже працюють за цим планом: туди нічого копіювати."
"%{days} have no trips of the company's lines: there was nothing to copy onto.":
  de: "%{days} haben keine Fahrten der Linien des Unternehmens: es gab nichts, worauf kopiert werden konnte."
  fr: "%{days} n'ont aucune course des lignes de l'entreprise : il n'y avait rien sur quoi copier."
  nl: "%{days} hebben geen ritten van de lijnen van het bedrijf: er was niets om op te kopiëren."
  pl: "%{days} nie mają kursów linii firmy: nie było na co kopiować."
  ru: "У %{days} нет рейсов линий компании: копировать было не на что."
  uk: "У %{days} немає рейсів ліній компанії: копіювати було нікуди."
"Nothing of the planning matched on %{days}: no trip there is one of this day's (same line, way, departure and stops), so they run as their timetable has them.":
  de: "An %{days} passte nichts von der Planung: keine Fahrt dort ist eine dieses Tages (gleiche Linie, Richtung, Abfahrt und Haltestellen), also fahren sie nach ihrem Fahrplan."
  fr: "Rien de la planification ne correspondait %{days} : aucune course là-bas n'est une de ce jour (même ligne, sens, départ et arrêts), elles roulent donc selon leur horaire."
  nl: "Niets van de planning paste op %{days}: geen rit daar is er een van deze dag (zelfde lijn, richting, vertrek en haltes), dus ze rijden zoals hun dienstregeling ze heeft."
  pl: "Nic z planu nie pasowało w %{days}: żaden kurs tam nie jest kursem tego dnia (ta sama linia, kierunek, odjazd i przystanki), więc jeżdżą według swojego rozkładu."
  ru: "Ничего из плана не совпало в %{days}: ни один рейс там не является рейсом этого дня (та же линия, направление, отправление и остановки), поэтому они идут по своему расписанию."
  uk: "Нічого з плану не збіглося в %{days}: жоден рейс там не є рейсом цього дня (та сама лінія, напрямок, відправлення й зупинки), тож вони йдуть за своїм розкладом."
"This day follows no other day: there is nothing to reset it to.":
  de: "Dieser Tag folgt keinem anderen Tag: es gibt nichts, worauf er zurückgesetzt werden kann."
  fr: "Ce jour ne suit aucun autre jour : il n'y a rien vers quoi le réinitialiser."
  nl: "Deze dag volgt geen andere dag: er is niets om hem naar terug te zetten."
  pl: "Ten dzień nie podąża za żadnym innym dniem: nie ma do czego go przywrócić."
  ru: "Этот день не следует никакому другому дню: сбрасывать его не к чему."
  uk: "Цей день не слідує жодному іншому дню: скидати його нема до чого."
"%{day} has changes not saved: SAVE them first - a copy takes the saved planning - then try again.":
  de: "%{day} hat nicht gespeicherte Änderungen: zuerst SPEICHERN - eine Kopie nimmt die gespeicherte Planung - und dann noch einmal versuchen."
  fr: "%{day} a des modifications non enregistrées : ENREGISTRER d'abord - une copie prend la planification enregistrée - puis réessayer."
  nl: "%{day} heeft wijzigingen die niet zijn opgeslagen: eerst OPSLAAN - een kopie neemt de opgeslagen planning - en dan opnieuw proberen."
  pl: "%{day} ma niezapisane zmiany: najpierw ZAPISZ - kopia bierze zapisany plan - a potem spróbuj ponownie."
  ru: "У %{day} есть несохранённые изменения: сначала СОХРАНИТЬ - копия берёт сохранённый план - и попробовать снова."
  uk: "У %{day} є незбережені зміни: спершу ЗБЕРЕГТИ - копія бере збережений план - і спробувати знову."
"The rows to copy are no longer on %{day}: tick them again there and copy.":
  de: "Die zu kopierenden Zeilen sind nicht mehr auf %{day}: dort erneut ankreuzen und kopieren."
  fr: "Les lignes à copier ne sont plus sur %{day} : coche-les à nouveau là-bas et copie."
  nl: "De rijen om te kopiëren staan niet meer op %{day}: vink ze daar opnieuw aan en kopieer."
  pl: "Wierszy do skopiowania nie ma już w %{day}: zaznacz je tam ponownie i skopiuj."
  ru: "Строк для копирования больше нет в %{day}: отметь их там снова и скопируй."
  uk: "Рядків для копіювання більше немає в %{day}: познач їх там знову й скопіюй."
"Nothing was copied: a locked vehicle or duty there holds those trips. Unlock it there and copy again.":
  de: "Nichts kopiert: ein gesperrtes Fahrzeug oder ein gesperrter Dienst dort hat diese Fahrten. Dort entsperren und erneut kopieren."
  fr: "Rien n'a été copié : un véhicule ou un service verrouillé là-bas a ces courses. Déverrouille-le là-bas et copie à nouveau."
  nl: "Er is niets gekopieerd: een vergrendeld voertuig of een vergrendelde dienst daar heeft die ritten. Ontgrendel het daar en kopieer opnieuw."
  pl: "Nic nie skopiowano: te kursy ma tam zablokowany pojazd lub służba. Odblokuj je tam i skopiuj ponownie."
  ru: "Ничего не скопировано: эти рейсы у заблокированной там машины или смены. Разблокируй её там и скопируй снова."
  uk: "Нічого не скопійовано: ці рейси в заблокованої там машини чи зміни. Розблокуй її там і скопіюй знову."
"Nothing was copied: no trip of those days matches the rows' trips (same line, way, departure and stops).":
  de: "Nichts kopiert: keine Fahrt dieser Tage passt zu den Fahrten der Zeilen (gleiche Linie, Richtung, Abfahrt und Haltestellen)."
  fr: "Rien n'a été copié : aucune course de ces jours ne correspond aux courses des lignes (même ligne, sens, départ et arrêts)."
  nl: "Er is niets gekopieerd: geen rit van die dagen past bij de ritten van de rijen (zelfde lijn, richting, vertrek en haltes)."
  pl: "Nic nie skopiowano: żaden kurs tych dni nie pasuje do kursów wierszy (ta sama linia, kierunek, odjazd i przystanki)."
  ru: "Ничего не скопировано: ни один рейс этих дней не совпадает с рейсами строк (та же линия, направление, отправление и остановки)."
  uk: "Нічого не скопійовано: жоден рейс цих днів не збігається з рейсами рядків (та сама лінія, напрямок, відправлення й зупинки)."
"%{n} of their trips are held by a locked vehicle or duty there: unlock it there and copy again to take them.":
  de: "%{n} ihrer Fahrten hat dort ein gesperrtes Fahrzeug oder ein gesperrter Dienst: dort entsperren und erneut kopieren, um sie zu übernehmen."
  fr: "%{n} de leurs courses sont tenues par un véhicule ou un service verrouillé là-bas : déverrouille-le là-bas et copie à nouveau pour les prendre."
  nl: "%{n} van hun ritten heeft een vergrendeld voertuig of een vergrendelde dienst daar: ontgrendel het daar en kopieer opnieuw om ze mee te nemen."
  pl: "%{n} ich kursów ma tam zablokowany pojazd lub służba: odblokuj je tam i skopiuj ponownie, aby je przenieść."
  ru: "%{n} их рейсов у заблокированной там машины или смены: разблокируй её там и скопируй снова, чтобы их забрать."
  uk: "%{n} їхніх рейсів у заблокованої там машини чи зміни: розблокуй її там і скопіюй знову, щоб їх забрати."
"%{days} run a planning of their own for that date: the rows went into the planning of every week, which that date does not run. Copy again with “This date only” to change that date.":
  de: "%{days} fahren für dieses Datum eine eigene Planung: die Zeilen gingen in die Planung jeder Woche, die dieses Datum nicht fährt. Mit „Nur dieses Datum“ erneut kopieren, um dieses Datum zu ändern."
  fr: "%{days} suivent une planification propre à cette date : les lignes sont allées dans la planification de chaque semaine, que cette date ne suit pas. Copie à nouveau avec « Cette date seulement » pour changer cette date."
  nl: "%{days} rijden voor die datum een eigen planning: de rijen gingen naar de planning van elke week, die die datum niet rijdt. Kopieer opnieuw met „Alleen deze datum” om die datum te wijzigen."
  pl: "%{days} mają własny plan na tę datę: wiersze trafiły do planu każdego tygodnia, którego ta data nie używa. Skopiuj ponownie z „Tylko ta data”, aby zmienić tę datę."
  ru: "У %{days} свой план на эту дату: строки попали в план каждой недели, по которому эта дата не работает. Скопируй снова с «Только эта дата», чтобы изменить эту дату."
  uk: "У %{days} власний план на цю дату: рядки потрапили в план кожного тижня, за яким ця дата не працює. Скопіюй знову з «Лише ця дата», щоб змінити цю дату."
