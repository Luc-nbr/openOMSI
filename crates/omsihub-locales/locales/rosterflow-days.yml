  de: "Die Fahrt an ihrem Tag zeigen"
  fr: "Montrer la course à son jour"
  nl: "De rit op zijn dag tonen"
  pl: "Pokaż kurs w jego dniu"
  ru: "Показать рейс в его день"
  uk: "Показати рейс у його день"
"The trips to plan by hand, each a link to it":
