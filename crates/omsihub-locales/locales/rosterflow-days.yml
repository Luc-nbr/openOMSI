_version: 2
# RosterFlow: a day's plan copied to the other days it works with (Trello #100) - SAVE's "Apply
# to" window, the report of what was copied, the day chip and the day switcher's marks, "Reset to
# pattern", and the Timeplan's strip of the days that run its timetable.
"This date only":
  de: "Nur dieses Datum"
  fr: "Cette date seulement"
  nl: "Alleen deze datum"
  pl: "Tylko ta data"
  ru: "Только эта дата"
  uk: "Лише ця дата"
"Follows %{day}":
  de: "Folgt %{day}"
  fr: "Suit %{day}"
  nl: "Volgt %{day}"
  pl: "Według %{day}"
  ru: "Следует %{day}"
  uk: "Слідує %{day}"
"Own changes":
  de: "Eigene Änderungen"
  fr: "Modifications propres"
  nl: "Eigen wijzigingen"
  pl: "Własne zmiany"
  ru: "Свои изменения"
  uk: "Власні зміни"
"%{n} trips to plan by hand":
  de: "%{n} Fahrten von Hand planen"
  fr: "%{n} courses à planifier à la main"
  nl: "%{n} ritten met de hand plannen"
  pl: "%{n} kursów do zaplanowania ręcznie"
  ru: "%{n} рейсов спланировать вручную"
  uk: "%{n} рейсів спланувати вручну"
"Pattern: %{days}":
  de: "Muster für: %{days}"
  fr: "Modèle de : %{days}"
  nl: "Patroon voor: %{days}"
  pl: "Wzorzec dla: %{days}"
  ru: "Шаблон для: %{days}"
  uk: "Шаблон для: %{days}"
"Choose what to copy: the vehicles, the drivers or both.":
  de: "Wählen Sie, was kopiert wird: die Fahrzeuge, die Fahrer oder beides."
  fr: "Choisissez ce qu'il faut copier : les véhicules, les conducteurs ou les deux."
  nl: "Kies wat er gekopieerd wordt: de voertuigen, de chauffeurs of beide."
  pl: "Wybierz, co skopiować: pojazdy, kierowców albo jedno i drugie."
  ru: "Выберите, что копировать: машины, водителей или и то, и другое."
  uk: "Виберіть, що копіювати: машини, водіїв або те й інше."
"Saved for %{day} only: its weekday's planning stays as it was.":
  de: "Nur für %{day} gespeichert: die Planung seines Wochentags bleibt, wie sie war."
  fr: "Enregistré pour %{day} seulement : la planification de son jour de semaine reste telle quelle."
  nl: "Alleen voor %{day} opgeslagen: de planning van zijn weekdag blijft zoals ze was."
  pl: "Zapisano tylko dla %{day}: plan jego dnia tygodnia zostaje bez zmian."
  ru: "Сохранено только для %{day}: план его дня недели остаётся прежним."
  uk: "Збережено лише для %{day}: план його дня тижня лишається як був."
"Copied to %{days}: the roster, those days and the game run it now.":
  de: "Kopiert nach %{days}: Dienstplan, diese Tage und das Spiel fahren sie jetzt."
  fr: "Copié vers %{days} : le roulement, ces jours et le jeu la suivent maintenant."
  nl: "Gekopieerd naar %{days}: het rooster, die dagen en het spel rijden haar nu."
  pl: "Skopiowano na %{days}: grafik, te dni i gra działają teraz według niego."
  ru: "Скопировано на %{days}: график, эти дни и игра теперь работают по нему."
  uk: "Скопійовано на %{days}: графік, ці дні й гра тепер працюють за ним."
"%{n} trips matched nothing: they run as their timetable has them, to plan by hand.":
  de: "%{n} Fahrten passten zu nichts: sie fahren, wie ihr Fahrplan sie hat - von Hand zu planen."
  fr: "%{n} courses ne correspondent à rien : elles roulent comme leur horaire les prévoit, à planifier à la main."
  nl: "%{n} ritten pasten nergens bij: ze rijden zoals hun dienstregeling ze heeft, met de hand te plannen."
  pl: "%{n} kursów niczego nie odpowiada: jadą tak, jak ma je ich rozkład - do zaplanowania ręcznie."
  ru: "%{n} рейсов ни с чем не совпали: они идут по своему расписанию, спланируйте их вручную."
  uk: "%{n} рейсів ні з чим не збіглися: вони йдуть за своїм розкладом, сплануйте їх вручну."
"Not copied, their timetable is still being read: %{days}.":
  de: "Nicht kopiert, ihr Fahrplan wird noch gelesen: %{days}."
  fr: "Non copié, leur horaire est encore en lecture : %{days}."
  nl: "Niet gekopieerd, hun dienstregeling wordt nog gelezen: %{days}."
  pl: "Nie skopiowano, ich rozkład jest jeszcze wczytywany: %{days}."
  ru: "Не скопировано, их расписание ещё читается: %{days}."
  uk: "Не скопійовано, їхній розклад ще читається: %{days}."
"%{day} runs its weekday's planning again.":
  de: "%{day} fährt wieder die Planung seines Wochentags."
  fr: "%{day} suit de nouveau la planification de son jour de semaine."
  nl: "%{day} rijdt weer de planning van zijn weekdag."
  pl: "%{day} znów działa według planu swojego dnia tygodnia."
  ru: "%{day} снова работает по плану своего дня недели."
  uk: "%{day} знову працює за планом свого дня тижня."
"The day this one follows is not in the coming week: apply its planning again from there.":
  de: "Der Tag, dem dieser folgt, liegt nicht in der kommenden Woche: wenden Sie seine Planung von dort aus erneut an."
  fr: "Le jour que celui-ci suit n'est pas dans la semaine à venir : appliquez de nouveau sa planification depuis ce jour."
  nl: "De dag die deze volgt valt niet in de komende week: pas zijn planning van daaruit opnieuw toe."
  pl: "Dnia, według którego działa ten dzień, nie ma w nadchodzącym tygodniu: zastosuj jego plan ponownie stamtąd."
  ru: "День, которому следует этот, не входит в ближайшую неделю: примените его план заново оттуда."
  uk: "День, якому слідує цей, не входить у найближчий тиждень: застосуйте його план знову звідти."
"%{day} follows %{pattern} again: %{a} of %{b} trips as it has them.":
  de: "%{day} folgt wieder %{pattern}: %{a} von %{b} Fahrten wie dort."
  fr: "%{day} suit de nouveau %{pattern} : %{a} courses sur %{b} comme là-bas."
  nl: "%{day} volgt weer %{pattern}: %{a} van %{b} ritten zoals daar."
  pl: "%{day} znów działa według %{pattern}: %{a} z %{b} kursów jak tam."
  ru: "%{day} снова следует %{pattern}: %{a} из %{b} рейсов как там."
  uk: "%{day} знову слідує %{pattern}: %{a} з %{b} рейсів як там."
"%{day} keeps its planning as it is: it follows no other day now.":
  de: "%{day} behält seine Planung, wie sie ist: er folgt jetzt keinem anderen Tag."
  fr: "%{day} garde sa planification telle quelle : il ne suit plus aucun autre jour."
  nl: "%{day} houdt zijn planning zoals ze is: hij volgt nu geen andere dag."
  pl: "%{day} zachowuje swój plan bez zmian: nie działa już według innego dnia."
  ru: "%{day} сохраняет свой план как есть: он больше не следует другому дню."
  uk: "%{day} зберігає свій план як є: він більше не слідує іншому дню."
"No trips of this line on this day":
  de: "An diesem Tag keine Fahrten dieser Linie"
  fr: "Aucune course de cette ligne ce jour-là"
  nl: "Geen ritten van deze lijn op deze dag"
  pl: "Brak kursów tej linii w tym dniu"
  ru: "В этот день нет рейсов этой линии"
  uk: "Цього дня немає рейсів цієї лінії"
"Runs the %{days} timetable":
  de: "Fährt den Fahrplan %{days}"
  fr: "Roule selon l'horaire %{days}"
  nl: "Rijdt de dienstregeling %{days}"
  pl: "Jeździ według rozkładu %{days}"
  ru: "Работает по расписанию «%{days}»"
  uk: "Працює за розкладом «%{days}»"
"Runs the %{days} timetable, not its weekday's: a holiday or another day":
