  uk: "Пошкоджений в аварії"
"That duty is not in the planning of the day.":
  de: "Dieser Dienst steht nicht in der Planung des Tages."
  fr: "Ce service ne figure pas dans la planification du jour."
  nl: "Die dienst staat niet in de planning van de dag."
  pl: "Tej służby nie ma w planie dnia."
  ru: "Этой смены нет в плане дня."
  uk: "Цієї зміни немає в плані дня."
"That duty is not yours.":
  de: "Dieser Dienst ist nicht deiner."
  fr: "Ce service n’est pas le vôtre."
  nl: "Die dienst is niet van jou."
  pl: "To nie jest twoja służba."
  ru: "Это не ваша смена."
  uk: "Це не ваша зміна."
"That duty has begun already.":
  de: "Dieser Dienst hat schon begonnen."
  fr: "Ce service a déjà commencé."
  nl: "Die dienst is al begonnen."
  pl: "Ta służba już się zaczęła."
  ru: "Эта смена уже началась."
  uk: "Ця зміна вже почалася."
"A swap of that duty is asked for already.":
  de: "Für diesen Dienst ist schon ein Tausch angefragt."
  fr: "Un échange de ce service est déjà demandé."
  nl: "Voor die dienst is al een ruil gevraagd."
  pl: "O zamianę tej służby już poproszono."
  ru: "Обмен этой смены уже запрошен."
  uk: "Обмін цієї зміни вже запитано."
"There is no such colleague.":
  de: "Diese Kollegin oder diesen Kollegen gibt es nicht."
  fr: "Ce collègue n’existe pas."
  nl: "Die collega bestaat niet."
  pl: "Nie ma takiego współpracownika."
  ru: "Такого коллеги нет."
  uk: "Такого колеги немає."
"Swaps go between the staff and you, or between the players of the session.":
  de: "Getauscht wird zwischen dir und dem Personal oder zwischen den Spielern der Sitzung."
  fr: "Les échanges se font entre vous et le personnel, ou entre les joueurs de la session."
  nl: "Ruilen gaat tussen jou en het personeel, of tussen de spelers van de sessie."
  pl: "Zamiany odbywają się między tobą a personelem albo między graczami sesji."
  ru: "Меняться можно между вами и персоналом или между игроками сессии."
  uk: "Обмінюватися можна між вами й персоналом або між гравцями сесії."
"That swap request is no longer there.":
  de: "Diese Tauschanfrage gibt es nicht mehr."
  fr: "Cette demande d’échange n’existe plus."
  nl: "Dat ruilverzoek is er niet meer."
  pl: "Tej prośby o zamianę już nie ma."
  ru: "Этого запроса на обмен больше нет."
  uk: "Цього запиту на обмін більше немає."
"They are off that day.":
  de: "An dem Tag hat sie oder er frei."
  fr: "Ce jour-là, ce collègue ne travaille pas."
  nl: "Die dag is die collega vrij."
  pl: "Tego dnia ma wolne."
  ru: "В этот день у коллеги выходной."
  uk: "Цього дня в колеги вихідний."
"They have more than one duty that day.":
  de: "An dem Tag hat sie oder er mehr als einen Dienst."
  fr: "Ce jour-là, ce collègue a plus d’un service."
  nl: "Die collega heeft die dag meer dan één dienst."
  pl: "Tego dnia ma więcej niż jedną służbę."
  ru: "В этот день у коллеги больше одной смены."
  uk: "Цього дня в колеги більше однієї зміни."
"The rules do not let them drive your duty: their licence or their working time.":
  de: "Die Regeln lassen sie oder ihn deinen Dienst nicht fahren: Führerschein oder Arbeitszeit."
  fr: "Les règles ne lui permettent pas d’assurer votre service : son permis ou son temps de travail."
  nl: "De regels laten die collega jouw dienst niet rijden: het rijbewijs of de werktijd."
  pl: "Przepisy nie pozwalają mu prowadzić twojej służby: prawo jazdy albo czas pracy."
  ru: "Правила не позволяют коллеге взять вашу смену: права или рабочее время."
  uk: "Правила не дозволяють колезі взяти вашу зміну: посвідчення або робочий час."
"Their duty clashes with your other work that day.":
  de: "Ihr oder sein Dienst überschneidet sich mit deiner anderen Arbeit an dem Tag."
  fr: "Son service empiète sur votre autre travail ce jour-là."
  nl: "Die dienst botst met je andere werk van die dag."
  pl: "Jego służba koliduje z twoją inną pracą tego dnia."
  ru: "Смена коллеги пересекается с вашей другой работой в этот день."
  uk: "Зміна колеги перетинається з вашою іншою роботою цього дня."
"They would rather keep their own duty.":
  de: "Sie oder er behält lieber den eigenen Dienst."
  fr: "Ce collègue préfère garder son propre service."
  nl: "Die collega houdt liever de eigen dienst."
  pl: "Woli zostać przy swojej służbie."
  ru: "Коллега предпочитает оставить свою смену."
  uk: "Колега воліє залишити свою зміну."
"%{name} swaps with you: you drive %{theirs}, they drive %{mine}":
  de: "%{name} tauscht mit dir: du fährst %{theirs}, dafür wird %{mine} übernommen"
  fr: "%{name} échange avec vous : vous assurez %{theirs}, en échange de %{mine}"
  nl: "%{name} ruilt met je: jij rijdt %{theirs}, in ruil voor %{mine}"
  pl: "%{name} zamienia się z tobą: prowadzisz %{theirs} w zamian za %{mine}"
  ru: "%{name} меняется с вами: вы едете %{theirs} вместо %{mine}"
  uk: "%{name} міняється з вами: ви їдете %{theirs} замість %{mine}"
"%{name} takes over your duty %{mine}":
  de: "%{name} übernimmt deinen Dienst %{mine}"
  fr: "%{name} reprend votre service %{mine}"
  nl: "%{name} neemt je dienst %{mine} over"
  pl: "%{name} przejmuje twoją służbę %{mine}"
  ru: "%{name} берёт вашу смену %{mine}"
  uk: "%{name} бере вашу зміну %{mine}"
"%{name} does not swap: %{why}":
  de: "%{name} tauscht nicht: %{why}"
  fr: "%{name} n’échange pas : %{why}"
  nl: "%{name} ruilt niet: %{why}"
  pl: "%{name} nie zamienia się: %{why}"
  ru: "%{name} не меняется: %{why}"
  uk: "%{name} не міняється: %{why}"
"%{name} asks you to swap duty %{mine}":
  de: "%{name} bittet dich, den Dienst %{mine} zu tauschen"
  fr: "%{name} vous demande d’échanger le service %{mine}"
  nl: "%{name} vraagt je dienst %{mine} te ruilen"
  pl: "%{name} prosi cię o zamianę służby %{mine}"
  ru: "%{name} просит вас поменяться сменой %{mine}"
  uk: "%{name} просить вас помінятися зміною %{mine}"
"A day off today is a sick call.":
  de: "Wer heute frei braucht, meldet sich krank."
  fr: "Un jour de congé aujourd’hui, c’est un arrêt maladie."
  nl: "Vandaag vrij is een ziekmelding."
  pl: "Wolne dzisiaj to zgłoszenie choroby."
  ru: "Выходной сегодня — это больничный."
  uk: "Вихідний сьогодні — це лікарняний."
"Those days are not right.":
  de: "Diese Tage stimmen nicht."
  fr: "Ces jours ne conviennent pas."
  nl: "Die dagen kloppen niet."
  pl: "Te dni są nieprawidłowe."
  ru: "Эти дни указаны неверно."
  uk: "Ці дні вказано неправильно."
"Ask for three weeks at most.":
  de: "Frag nach höchstens drei Wochen."
  fr: "Demandez trois semaines au plus."
  nl: "Vraag hooguit drie weken."
  pl: "Poproś o najwyżej trzy tygodnie."
  ru: "Просите не больше трёх недель."
  uk: "Просіть не більше трьох тижнів."
"You have asked for those days already.":
  de: "Diese Tage hast du schon beantragt."
  fr: "Vous avez déjà demandé ces jours."
  nl: "Die dagen heb je al gevraagd."
  pl: "O te dni już prosiłeś."
  ru: "Вы уже просили эти дни."
  uk: "Ви вже просили ці дні."
