_version: 2
# The drivers' side of the bus company (r67-crew): the duty strip in the game, handover notes on
# the buses, the walk-around's defects for the workshop, duty swaps, the player's holidays and
# sick calls - the company's words (`company::crew`), the plugin's (`lua/duty_strip.lua`), the
# phone's crew card (`companion/company.rs`) and the launcher's pages. A text another table has
# already keeps that table's translation; it is here too so this one is whole.
"Bus %{bus}: %{note}":
