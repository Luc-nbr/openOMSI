  fr: "Bus %{bus} : %{note}"
  nl: "Bus %{bus}: %{note}"
  pl: "Autobus %{bus}: %{note}"
  ru: "Автобус %{bus}: %{note}"
  uk: "Автобус %{bus}: %{note}"
"Bus %{bus}: %{defect} reported to the workshop":
  de: "Bus %{bus}: %{defect} an die Werkstatt gemeldet"
