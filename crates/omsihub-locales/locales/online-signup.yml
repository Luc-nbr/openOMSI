_version: 2
# Beta 67: the account panel's code steps (launcher/ui/js/omsihub/online.js;
# crates/omsi-launcher-api/src/omsihub/online.rs; crates/omsihub-online/src/codes.rs) - the code
# asked for alone, the address and the password kept from the step before, and an email that may
# carry a link instead of a code (Supabase's own templates, until Omsi-Hub's are pasted in:
# docs/omsihub/ONLINE.md). Formal register, as the privacy texts. "I have opened the link" is the
# button's own label, quoted in the sentence before it.
"Confirm your email address first, with the code or the link in the email we sent you.":
  de: "Bitte bestätigen Sie zuerst Ihre E-Mail-Adresse, mit dem Code oder dem Link aus der E-Mail, die wir Ihnen gesendet haben."
  fr: "Veuillez d'abord confirmer votre adresse e-mail, avec le code ou le lien de l'e-mail que nous vous avons envoyé."
  nl: "Bevestigt u eerst uw e-mailadres, met de code of de link uit de e-mail die wij u hebben gestuurd."
  pl: "Prosimy najpierw potwierdzić adres e-mail kodem lub linkiem z wiadomości, którą wysłaliśmy."
  ru: "Сначала подтвердите адрес электронной почты кодом или ссылкой из письма, которое мы Вам отправили."
  uk: "Спершу підтвердьте адресу електронної пошти кодом або посиланням із листа, який ми Вам надіслали."
"A new email is on its way.":
  de: "Eine neue E-Mail ist unterwegs."
  fr: "Un nouvel e-mail est en route."
  nl: "Er is een nieuwe e-mail onderweg."
  pl: "Nowa wiadomość e-mail jest w drodze."
  ru: "Новое письмо уже в пути."
  uk: "Новий лист уже в дорозі."
"If an account has this address, an email is on its way to it.":
  de: "Wenn ein Konto diese Adresse hat, ist eine E-Mail an sie unterwegs."
  fr: "Si un compte utilise cette adresse, un e-mail y est en route."
  nl: "Als een account dit adres heeft, is er een e-mail naar onderweg."
  pl: "Jeśli do tego adresu jest przypisane konto, wysłaliśmy na niego wiadomość e-mail."
  ru: "Если к этому адресу привязан аккаунт, на него уже отправлено письмо."
  uk: "Якщо до цієї адреси прив'язано обліковий запис, на неї вже надіслано листа."
"Enter the code from the email we sent to %{email}. If the email has a link instead, open it, then choose \"I have opened the link\".":
  de: "Geben Sie den Code aus der E-Mail ein, die wir an %{email} gesendet haben. Enthält die E-Mail stattdessen einen Link, öffnen Sie ihn und wählen Sie dann „Ich habe den Link geöffnet“."
  fr: "Saisissez le code de l'e-mail que nous avons envoyé à %{email}. Si l'e-mail contient plutôt un lien, ouvrez-le, puis choisissez « J'ai ouvert le lien »."
  nl: "Voer de code in uit de e-mail die wij naar %{email} hebben gestuurd. Bevat de e-mail in plaats daarvan een link, open die dan en kies daarna „Ik heb de link geopend”."
  pl: "Wpisz kod z wiadomości wysłanej na adres %{email}. Jeśli zamiast kodu wiadomość zawiera link, otwórz go, a następnie wybierz „Otworzyłem(-am) link”."
  ru: "Введите код из письма, отправленного на %{email}. Если в письме вместо кода ссылка, откройте её, затем выберите «Я открыл(а) ссылку»."
  uk: "Введіть код із листа, надісланого на %{email}. Якщо в листі замість коду посилання, відкрийте його, а потім виберіть «Я відкрив(-ла) посилання»."
"I have opened the link":
  de: "Ich habe den Link geöffnet"
  fr: "J'ai ouvert le lien"
  nl: "Ik heb de link geopend"
  pl: "Otworzyłem(-am) link"
  ru: "Я открыл(а) ссылку"
  uk: "Я відкрив(-ла) посилання"
"Send the email again":
  de: "E-Mail erneut senden"
  fr: "Renvoyer l'e-mail"
  nl: "E-mail opnieuw sturen"
  pl: "Wyślij wiadomość ponownie"
  ru: "Отправить письмо ещё раз"
  uk: "Надіслати листа ще раз"
"We send an email to %{email}. With its code you choose a new password here.":
  de: "Wir senden eine E-Mail an %{email}. Mit dem Code daraus wählen Sie hier ein neues Passwort."
  fr: "Nous envoyons un e-mail à %{email}. Avec son code, vous choisissez ici un nouveau mot de passe."
  nl: "Wij sturen een e-mail naar %{email}. Met de code daaruit kiest u hier een nieuw wachtwoord."
  pl: "Wyślemy wiadomość na adres %{email}. Kodem z niej ustawisz tutaj nowe hasło."
  ru: "Мы отправим письмо на %{email}. С кодом из него Вы зададите здесь новый пароль."
  uk: "Ми надішлемо листа на %{email}. З кодом із нього Ви встановите тут новий пароль."
"We send an email to your email address. With its code you choose a new password here.":
  de: "Wir senden eine E-Mail an Ihre E-Mail-Adresse. Mit dem Code daraus wählen Sie hier ein neues Passwort."
  fr: "Nous envoyons un e-mail à votre adresse e-mail. Avec son code, vous choisissez ici un nouveau mot de passe."
  nl: "Wij sturen een e-mail naar uw e-mailadres. Met de code daaruit kiest u hier een nieuw wachtwoord."
  pl: "Wyślemy wiadomość na Twój adres e-mail. Kodem z niej ustawisz tutaj nowe hasło."
  ru: "Мы отправим письмо на Ваш адрес электронной почты. С кодом из него Вы зададите здесь новый пароль."
  uk: "Ми надішлемо листа на Вашу адресу електронної пошти. З кодом із нього Ви встановите тут новий пароль."
"Use another address":
  de: "Andere Adresse verwenden"
  fr: "Utiliser une autre adresse"
  nl: "Een ander adres gebruiken"
  pl: "Użyj innego adresu"
  ru: "Использовать другой адрес"
  uk: "Використати іншу адресу"
"Send the email":
  de: "E-Mail senden"
  fr: "Envoyer l'e-mail"
  nl: "E-mail sturen"
  pl: "Wyślij wiadomość"
  ru: "Отправить письмо"
  uk: "Надіслати листа"
"Enter the code from the email we sent to %{email}. If the email has a link instead, open it and choose your new password there.":
  de: "Geben Sie den Code aus der E-Mail ein, die wir an %{email} gesendet haben. Enthält die E-Mail stattdessen einen Link, öffnen Sie ihn und wählen Sie dort Ihr neues Passwort."
  fr: "Saisissez le code de l'e-mail que nous avons envoyé à %{email}. Si l'e-mail contient plutôt un lien, ouvrez-le et choisissez-y votre nouveau mot de passe."
  nl: "Voer de code in uit de e-mail die wij naar %{email} hebben gestuurd. Bevat de e-mail in plaats daarvan een link, open die dan en kies daar uw nieuwe wachtwoord."
  pl: "Wpisz kod z wiadomości wysłanej na adres %{email}. Jeśli zamiast kodu wiadomość zawiera link, otwórz go i ustaw tam nowe hasło."
  ru: "Введите код из письма, отправленного на %{email}. Если в письме вместо кода ссылка, откройте её и задайте там новый пароль."
  uk: "Введіть код із листа, надісланого на %{email}. Якщо в листі замість коду посилання, відкрийте його та встановіть там новий пароль."
