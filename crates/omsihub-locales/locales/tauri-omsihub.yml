"Pick a line to see what to type into the IBIS. Shift+U in the game types it for you and puts the bus into service.":
  ca: "Tria una línia per veure què has d'introduir a l'IBIS. Maj+U al joc ho introdueix per tu i posa l'autobús en servei."
  ru: "Выберите линию, чтобы увидеть, что ввести в IBIS. Shift+U в игре введёт это за вас и подготовит автобус."
  de: "Wähle eine Linie, um zu sehen, was ins IBIS einzugeben ist. Shift+U im Spiel tippt es ein und nimmt den Bus in Betrieb."
  fr: "Choisissez une ligne pour voir quoi saisir dans l'IBIS. Shift+U dans le jeu le saisit pour vous et démarre le bus."
  uk: "Оберіть лінію, щоб побачити, що вводити в IBIS. Shift+U у грі введе це за вас і виведе автобус на маршрут."
  be: "Абярыце лінію, каб убачыць, што ўводзіць у IBIS. Shift+U у гульні ўвядзе гэта за вас і выведзе аўтобус на маршрут."
  kk: "IBIS-ке не теру керегін көру үшін желіні таңдаңыз. Ойындағы Shift+U оны өзі тереді және автобусты іске қосады."
  pl: "Wybierz linię, aby zobaczyć, co wpisać w IBIS. Shift+U w grze wpisze to za ciebie i uruchomi autobus."
  cs: "Vyberte linku a uvidíte, co zadat do IBIS. Shift+U ve hře to zadá za vás a uvede autobus do provozu."
  hu: "Válassz járatot, hogy lásd, mit kell beírni az IBIS-be. A játékban a Shift+U beírja helyetted, és üzembe helyezi a buszt."
  es: "Elige una línea para ver qué escribir en el IBIS. Shift+U en el juego lo escribe por ti y pone el autobús en servicio."
  pt: "Escolha uma linha para ver o que inserir no IBIS. No jogo, Shift+U preenche os dados automaticamente e coloca o ônibus em serviço."
  pt-pt: "Escolha uma linha para ver o que inserir no IBIS. No jogo, Shift+U preenche os dados automaticamente e coloca o autocarro em serviço."
  it: "Scegli una linea per vedere cosa digitare nell'IBIS. Shift+U nel gioco lo digita per te e mette il bus in servizio."
  nl: "Kies een lijn om te zien wat je in de IBIS moet invoeren. Shift+U in het spel doet dat voor je en neemt de bus in dienst."
  tr: "IBIS'e ne yazacağınızı görmek için bir hat seçin. Oyunda Shift+U bunu sizin yerinize yazar ve otobüsü çalıştırır."
  ja: "系統を選ぶと、IBISに入力する内容が表示されます。ゲーム内でShift+Uを押すと自動で入力され、バスが運行状態になります。"
  zh: "选择线路即可查看要在IBIS中输入的内容。游戏中按Shift+U会自动输入并使巴士投入运营。"
  hi: "IBIS में क्या टाइप करना है यह देखने के लिए एक लाइन चुनें। गेम में Shift+U इसे आपके लिए टाइप कर देता है और बस को सर्विस में ले आता है।"
  zh-tw: "選擇路線後可查看 IBIS 需要輸入的資料。在遊戲中按 Shift+U 可自動輸入，並讓巴士投入服務。"
  ko: "노선을 선택하면 IBIS 입력값이 표시됩니다. 게임에서 Shift+U를 누르면 자동 입력하고 버스 운행을 준비합니다."
  th: "เลือกสายรถเพื่อดูข้อมูลที่ต้องใส่ใน IBIS กด Shift+U ในเกมเพื่อกรอกอัตโนมัติและนำรถเข้าบริการ"
  vi: "Chọn tuyến để xem nội dung cần nhập vào IBIS. Nhấn Shift+U trong trò chơi để tự động nhập và đưa xe vào phục vụ."
  id: "Pilih jalur untuk melihat apa yang perlu dimasukkan ke IBIS. Shift+U dalam game mengisinya dan menyiapkan bus untuk beroperasi."
  ms: "Pilih laluan untuk melihat input IBIS. Shift+U dalam permainan mengisinya dan menyediakan bas untuk perkhidmatan."
  tl: "Pumili ng linya para makita ang ilalagay sa IBIS. Awtomatikong ilalagay ito ng Shift+U sa laro at ihahanda ang bus sa serbisyo."
