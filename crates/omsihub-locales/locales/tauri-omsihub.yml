# --- the app is Omsi-Hub (Beta 53): our texts that name the app, as their openOMSI twins were
# translated (the texts that name the engine or its content folder keep openOMSI) -------------
"Choose how long you want to drive and when: Omsi-Hub puts a shift together from the timetable's real trips, on with another line where lines meet.":
  nl: "Kies zelf hoe lang je wilt rijden en wanneer: Omsi-Hub stelt een dienst samen uit echte ritten van de dienstregeling, verder met een andere lijn waar lijnen elkaar raken."
  de: "Wähle selbst, wie lange und wann du fahren willst: Omsi-Hub stellt aus echten Fahrten des Fahrplans einen Dienst zusammen, weiter mit einer anderen Linie, wo sich Linien treffen."
  fr: "Choisis combien de temps et quand tu veux conduire : Omsi-Hub compose un poste à partir des vrais trajets de l'horaire, avec une autre ligne là où les lignes se croisent."
  ru: "Выберите, как долго и когда вы хотите ездить: Omsi-Hub составит смену из настоящих рейсов расписания, с переходом на другую линию там, где линии встречаются."
  uk: "Виберіть, як довго і коли ви хочете їздити: Omsi-Hub складе зміну зі справжніх рейсів розкладу, з переходом на іншу лінію там, де лінії зустрічаються."
  pl: "Wybierz, jak długo i kiedy chcesz jeździć: Omsi-Hub ułoży zmianę z prawdziwych kursów rozkładu, z przejściem na inną linię tam, gdzie linie się spotykają."
"Omsi-Hub puts real duties together from the timetables of your own OMSI maps and gets the game ready for you. In a minute you'll know where everything is.":
  nl: "Omsi-Hub maakt echte diensten uit de dienstregelingen van je eigen OMSI-kaarten en zet het spel voor je klaar. In een minuut weet je waar alles zit."
  de: "Omsi-Hub baut echte Dienste aus den Fahrplänen deiner eigenen OMSI-Karten und richtet das Spiel für dich ein. In einer Minute weißt du, wo alles ist."
  fr: "Omsi-Hub crée de vrais postes à partir des horaires de tes propres cartes OMSI et prépare le jeu pour toi. En une minute, tu sauras où tout se trouve."
  ru: "Omsi-Hub составляет настоящие смены из расписаний твоих карт OMSI и готовит для тебя игру. Через минуту ты будешь знать, где что находится."
  uk: "Omsi-Hub складає справжні зміни з розкладів твоїх мап OMSI і готує для тебе гру. За хвилину ти знатимеш, де що є."
  pl: "Omsi-Hub układa prawdziwe zmiany z rozkładów twoich własnych map OMSI i przygotowuje dla ciebie grę. Za minutę będziesz wiedzieć, gdzie co jest."
"Say how long your shift is and in which part of the day it starts. Omsi-Hub looks for shifts like that among the timetable's real trips.":
  nl: "Zeg hoe lang je dienst duurt en in welk deel van de dag hij begint. Omsi-Hub zoekt zulke diensten tussen de echte ritten van de dienstregeling."
  de: "Sag, wie lang dein Dienst ist und zu welcher Tageszeit er beginnt. Omsi-Hub sucht solche Dienste unter den echten Fahrten des Fahrplans."
  fr: "Dis combien de temps dure ton poste et à quel moment de la journée il commence. Omsi-Hub cherche de tels postes parmi les vrais trajets de l'horaire."
  ru: "Укажи, сколько длится твоя смена и в какое время дня она начинается. Omsi-Hub найдёт такие смены среди настоящих рейсов расписания."
  uk: "Вкажи, скільки триває твоя зміна і в яку пору дня вона починається. Omsi-Hub знайде такі зміни серед справжніх рейсів розкладу."
  pl: "Powiedz, ile trwa twoja zmiana i o jakiej porze dnia się zaczyna. Omsi-Hub szuka takich zmian wśród prawdziwych kursów rozkładu."
"Omsi-Hub drives on the maps and buses of the original OMSI 2. Point once to the folder you play from.":
  nl: "Omsi-Hub rijdt op de kaarten en met de bussen van het originele OMSI 2. Wijs eenmaal de map aan waaruit je speelt."
  de: "Omsi-Hub fährt auf den Karten und mit den Bussen des originalen OMSI 2. Zeig einmal auf den Ordner, aus dem du spielst."
  fr: "Omsi-Hub roule sur les cartes et avec les bus de l’OMSI 2 d’origine. Indique une fois le dossier depuis lequel tu joues."
  ru: "Omsi-Hub ездит по картам и на автобусах оригинального OMSI 2. Один раз укажи папку, из которой ты играешь."
  uk: "Omsi-Hub їздить мапами й автобусами оригінального OMSI 2. Один раз вкажи теку, з якої ти граєш."
  pl: "Omsi-Hub jeździ po mapach i autobusami oryginalnego OMSI 2. Wskaż raz folder, z którego grasz."
"Welcome to Omsi-Hub":
  nl: "Welkom bij Omsi-Hub"
  de: "Willkommen bei Omsi-Hub"
  fr: "Bienvenue dans Omsi-Hub"
  ru: "Добро пожаловать в Omsi-Hub"
  uk: "Ласкаво просимо до Omsi-Hub"
  pl: "Witaj w Omsi-Hub"
"Omsi-Hub did not find OMSI 2 by itself. Choose the folder with Omsi.exe in it.":
  nl: "Omsi-Hub heeft OMSI 2 niet zelf gevonden. Kies de map waar Omsi.exe in staat."
  de: "Omsi-Hub hat OMSI 2 nicht selbst gefunden. Wähle den Ordner, in dem die Omsi.exe liegt."
  fr: "Omsi-Hub n’a pas trouvé OMSI 2 tout seul. Choisis le dossier qui contient Omsi.exe."
  ru: "Omsi-Hub не нашёл OMSI 2 сам. Выбери папку, в которой лежит Omsi.exe."
  uk: "Omsi-Hub не знайшов OMSI 2 сам. Обери теку, у якій лежить Omsi.exe."
  pl: "Omsi-Hub nie znalazł OMSI 2 sam. Wybierz folder, w którym jest Omsi.exe."
"That is Omsi-Hub's own folder. Choose the original OMSI 2, the one with Omsi.exe in it.":
  nl: "Dat is de eigen map van Omsi-Hub. Kies het originele OMSI 2, die met Omsi.exe erin."
  de: "Das ist der eigene Ordner von Omsi-Hub. Wähle das originale OMSI 2, das mit der Omsi.exe darin."
  fr: "C’est le dossier propre à Omsi-Hub. Choisis l’OMSI 2 d’origine, celui qui contient Omsi.exe."
  ru: "Это собственная папка Omsi-Hub. Выбери оригинальный OMSI 2 — тот, где лежит Omsi.exe."
  uk: "Це власна тека Omsi-Hub. Обери оригінальний OMSI 2 — той, де лежить Omsi.exe."
  pl: "To własny folder Omsi-Hub. Wybierz oryginalne OMSI 2, to z Omsi.exe w środku."
"Steam, the box version, a folder you moved yourself - all fine. Omsi-Hub only reads it and never writes into it.":
  nl: "Steam, de doosversie, een map die je zelf hebt verplaatst - allemaal goed. Omsi-Hub leest er alleen uit en schrijft er nooit in."
  de: "Steam, die Box-Version, ein selbst verschobener Ordner - alles recht. Omsi-Hub liest nur daraus und schreibt nie hinein."
  fr: "Steam, la version en boîte, un dossier déplacé à la main - tout convient. Omsi-Hub ne fait qu’y lire et n’y écrit jamais."
  ru: "Steam, коробочная версия, папка, которую ты перенёс сам, - всё подходит. Omsi-Hub только читает её и никогда в неё не пишет."
  uk: "Steam, коробкова версія, тека, яку ти переніс сам, - усе підходить. Omsi-Hub лише читає її й ніколи в неї не пише."
  pl: "Steam, wersja pudełkowa, folder przeniesiony samodzielnie - wszystko w porządku. Omsi-Hub tylko z niego czyta i nigdy do niego nie zapisuje."
"Run with the real clock, also while Omsi-Hub is closed":
  de: "Mit der echten Uhr laufen, auch wenn Omsi-Hub geschlossen ist"
  fr: "Suivre l'horloge réelle, même quand Omsi-Hub est fermé"
  nl: "Met de echte klok meelopen, ook als Omsi-Hub dicht is"
  pl: "Płyń z prawdziwym zegarem, także gdy Omsi-Hub jest zamknięty"
  ru: "Идти вместе с реальными часами, даже когда Omsi-Hub закрыт"
  uk: "Іти разом із реальним годинником, навіть коли Omsi-Hub закрито"
"In step with the real clock: the company's time goes on while Omsi-Hub is closed, and is caught up when you open the company.":
  de: "Im Takt der echten Uhr: Die Firmenzeit läuft weiter, während Omsi-Hub geschlossen ist, und wird aufgeholt, wenn du das Unternehmen öffnest."
  fr: "Au rythme de l'horloge réelle : le temps de l'entreprise continue quand Omsi-Hub est fermé, et il est rattrapé quand tu ouvres l'entreprise."
  nl: "In de pas met de echte klok: de bedrijfstijd loopt door terwijl Omsi-Hub dicht is, en wordt ingehaald als je het bedrijf opent."
  pl: "Zgodnie z prawdziwym zegarem: czas firmy płynie dalej, gdy Omsi-Hub jest zamknięty, i jest nadrabiany, gdy otworzysz firmę."
  ru: "В такт с реальными часами: время компании идёт, пока Omsi-Hub закрыт, и наверстывается, когда вы открываете компанию."
  uk: "У такт із реальним годинником: час компанії йде, поки Omsi-Hub закрито, і надолужується, коли ви відкриваєте компанію."
