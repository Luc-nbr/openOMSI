"An empty field takes the way back's time, else the relief point's own, else the default.":
  de: "Ein leeres Feld nimmt die Zeit des Rückwegs, sonst die des Ablösepunkts, sonst den Standard."
  fr: "Un champ vide prend le temps du retour, sinon celui du point de relève, sinon la valeur par défaut."
  nl: "Een leeg veld neemt de tijd van de terugweg, anders die van het aflospunt, anders de standaard."
  pl: "Puste pole bierze czas drogi powrotnej, inaczej czas punktu zmiany, inaczej domyślny."
  ru: "Пустое поле берёт время обратного пути, иначе время пункта пересменки, иначе значение по умолчанию."
  uk: "Порожнє поле бере час зворотного шляху, інакше час пункту перезміни, інакше типове значення."
"Relief points are set in Relief Points: the depot, the lines' termini and the stops you add.":
  de: "Ablösepunkte werden unter Ablösepunkte festgelegt: das Depot, die Endhaltestellen der Linien und die Haltestellen, die Sie hinzufügen."
  fr: "Les points de relève se règlent dans Points de relève : le dépôt, les terminus des lignes et les arrêts que vous ajoutez."
  nl: "Aflospunten stelt u in bij Aflospunten: de remise, de eindpunten van de lijnen en de haltes die u toevoegt."
  pl: "Punkty zmiany ustawia się w Punktach zmiany: zajezdnia, pętle linii i przystanki, które dodasz."
  ru: "Пункты пересменки задаются в разделе «Пункты пересменки»: депо, конечные маршрутов и добавленные вами остановки."
  uk: "Пункти перезміни задаються в розділі «Пункти перезміни»: депо, кінцеві маршрутів і додані вами зупинки."
