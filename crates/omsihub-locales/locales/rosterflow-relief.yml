"Click to cut the duty here, on the way: a driver takes over at %{stop} (%{time}).":
  de: "Klicken, um den Dienst hier unterwegs zu teilen: ein Fahrer übernimmt in %{stop} (%{time})."
  fr: "Cliquez pour couper le service ici, en route : un conducteur prend la relève à %{stop} (%{time})."
  nl: "Klik om de dienst hier onderweg te knippen: een chauffeur neemt het over bij %{stop} (%{time})."
  pl: "Kliknij, aby podzielić tu służbę na trasie: kierowca przejmuje autobus w %{stop} (%{time})."
  ru: "Нажмите, чтобы разрезать смену здесь, в пути: водитель сменяет на %{stop} (%{time})."
  uk: "Натисніть, щоб розрізати зміну тут, у дорозі: водій змінює на %{stop} (%{time})."
"Duty cut on %{v} on the way, at %{stop} (%{time})":
  de: "Dienst auf %{v} unterwegs geteilt, in %{stop} (%{time})"
  fr: "Service coupé sur %{v} en route, à %{stop} (%{time})"
  nl: "Dienst op %{v} onderweg geknipt, bij %{stop} (%{time})"
  pl: "Służba na %{v} podzielona na trasie, w %{stop} (%{time})"
  ru: "Смена на %{v} разрезана в пути, на %{stop} (%{time})"
  uk: "Зміну на %{v} розрізано в дорозі, на %{stop} (%{time})"
"Relief Points":
  de: "Ablösepunkte"
  fr: "Points de relève"
  nl: "Aflospunten"
  pl: "Punkty zmiany"
  ru: "Пункты пересменки"
  uk: "Пункти перезміни"
"Where drivers may begin or end a duty, change on the bus and take a break: the depot and the lines' termini by themselves, and the stops on a line's way you add.":
  de: "Wo Fahrer einen Dienst beginnen oder beenden, im Bus wechseln und Pause machen dürfen: das Depot und die Endhaltestellen der Linien von selbst, und die Haltestellen unterwegs, die Sie hinzufügen."
  fr: "Où les conducteurs peuvent commencer ou finir un service, se relayer dans le bus et prendre une pause : le dépôt et les terminus des lignes d'office, et les arrêts en route que vous ajoutez."
  nl: "Waar chauffeurs een dienst mogen beginnen of eindigen, in de bus wisselen en pauze nemen: de remise en de eindpunten van de lijnen vanzelf, en de haltes onderweg die u toevoegt."
  pl: "Gdzie kierowcy mogą zaczynać lub kończyć służbę, zmieniać się w autobusie i robić przerwę: zajezdnia i pętle linii same z siebie oraz przystanki na trasie, które dodasz."
  ru: "Где водители могут начинать и заканчивать смену, меняться в автобусе и делать перерыв: депо и конечные маршрутов сами по себе, а также остановки в пути, которые вы добавите."
  uk: "Де водії можуть починати й закінчувати зміну, змінюватися в автобусі та робити перерву: депо й кінцеві маршрутів самі собою, а також зупинки в дорозі, які ви додасте."
