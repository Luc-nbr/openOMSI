_version: 2
# Beta 66: the privacy statement (docs/omsihub/PRIVACY.md, which stays English: the binding text) -
# its dialog and links, the tick before an account is made or signed in to, the question asked of a
# signed-in player who has not agreed to its current version, the "Delete account" button
# (launcher/ui/js/omsihub/privacy.js, online.js, cloud.js, settings-extra.js;
# crates/omsi-launcher-api/src/omsihub/online.rs; the code `privacy` of crates/omsihub-online).
"Privacy statement":
  de: "Datenschutzerklärung"
  fr: "Déclaration de confidentialité"
  nl: "Privacyverklaring"
  pl: "Oświadczenie o prywatności"
  ru: "Заявление о конфиденциальности"
  uk: "Заява про конфіденційність"
"Privacy statement, version %{n}":
  de: "Datenschutzerklärung, Version %{n}"
  fr: "Déclaration de confidentialité, version %{n}"
  nl: "Privacyverklaring, versie %{n}"
  pl: "Oświadczenie o prywatności, wersja %{n}"
  ru: "Заявление о конфиденциальности, версия %{n}"
  uk: "Заява про конфіденційність, версія %{n}"
"The privacy statement is in English. The English text is the binding one.":
  de: "Die Datenschutzerklärung ist auf Englisch. Verbindlich ist der englische Text."
  fr: "La déclaration de confidentialité est en anglais. Seul le texte anglais fait foi."
  nl: "De privacyverklaring is in het Engels. De Engelse tekst is bindend."
  pl: "Oświadczenie o prywatności jest po angielsku. Wiążący jest tekst angielski."
  ru: "Заявление о конфиденциальности написано на английском. Обязывающим является английский текст."
  uk: "Заява про конфіденційність написана англійською. Обов'язковим є англійський текст."
"I have read and agree to the privacy statement":
  de: "Ich habe die Datenschutzerklärung gelesen und stimme ihr zu"
  fr: "J'ai lu la déclaration de confidentialité et je l'accepte"
  nl: "Ik heb de privacyverklaring gelezen en ga ermee akkoord"
  pl: "Przeczytałem(-am) oświadczenie o prywatności i akceptuję je"
  ru: "Я прочитал(а) заявление о конфиденциальности и согласен(на) с ним"
  uk: "Я прочитав(ла) заяву про конфіденційність і погоджуюся з нею"
"Read the privacy statement":
  de: "Datenschutzerklärung lesen"
  fr: "Lire la déclaration de confidentialité"
  nl: "Privacyverklaring lezen"
  pl: "Przeczytaj oświadczenie o prywatności"
  ru: "Прочитать заявление о конфиденциальности"
  uk: "Прочитати заяву про конфіденційність"
"Tick the box above first: you agree to the privacy statement.":
  de: "Setze zuerst oben den Haken: Du stimmst der Datenschutzerklärung zu."
  fr: "Cochez d'abord la case ci-dessus : vous acceptez la déclaration de confidentialité."
  nl: "Vink eerst het vakje hierboven aan: je gaat akkoord met de privacyverklaring."
  pl: "Najpierw zaznacz pole powyżej: akceptujesz oświadczenie o prywatności."
  ru: "Сначала отметьте флажок выше: вы соглашаетесь с заявлением о конфиденциальности."
  uk: "Спершу позначте прапорець вище: ви погоджуєтеся із заявою про конфіденційність."
"Before you use your account":
  de: "Bevor du dein Konto nutzt"
  fr: "Avant d'utiliser votre compte"
  nl: "Voordat je je account gebruikt"
  pl: "Zanim użyjesz swojego konta"
  ru: "Прежде чем пользоваться аккаунтом"
  uk: "Перш ніж користуватися обліковим записом"
"Your friends, invites, the leaderboard and your cloud saves work once you agree to the privacy statement. When it changes, you are asked again.":
  de: "Deine Freunde, Einladungen, die Bestenliste und deine Cloud-Spielstände funktionieren, sobald du der Datenschutzerklärung zustimmst. Ändert sie sich, wirst du erneut gefragt."
  fr: "Vos amis, les invitations, le classement et vos sauvegardes cloud fonctionnent dès que vous acceptez la déclaration de confidentialité. Si elle change, la question vous est reposée."
  nl: "Je vrienden, uitnodigingen, het klassement en je cloudopslag werken zodra je akkoord gaat met de privacyverklaring. Verandert ze, dan vragen we het opnieuw."
  pl: "Znajomi, zaproszenia, ranking i zapisy w chmurze działają, gdy zaakceptujesz oświadczenie o prywatności. Gdy się zmieni, zapytamy ponownie."
  ru: "Друзья, приглашения, таблица лидеров и облачные сохранения заработают, как только вы согласитесь с заявлением о конфиденциальности. Если оно изменится, вас спросят снова."
  uk: "Друзі, запрошення, таблиця лідерів і хмарні збереження запрацюють, щойно ви погодитеся із заявою про конфіденційність. Якщо вона зміниться, вас запитають знову."
"Your account keeps your email address, display name, friends, invites, statistics and at most 2 cloud saves, on servers in the EU.":
  de: "Dein Konto speichert deine E-Mail-Adresse, deinen Anzeigenamen, Freunde, Einladungen, Statistiken und höchstens 2 Cloud-Spielstände, auf Servern in der EU."
  fr: "Votre compte conserve votre adresse e-mail, votre pseudo, vos amis, les invitations, vos statistiques et au plus 2 sauvegardes cloud, sur des serveurs dans l'UE."
  nl: "Je account bewaart je e-mailadres, weergavenaam, vrienden, uitnodigingen, statistieken en hooguit 2 cloudopslagen, op servers in de EU."
  pl: "Twoje konto przechowuje adres e-mail, nazwę wyświetlaną, znajomych, zaproszenia, statystyki i najwyżej 2 zapisy w chmurze, na serwerach w UE."
  ru: "Аккаунт хранит ваш адрес эл. почты, отображаемое имя, друзей, приглашения, статистику и не более 2 облачных сохранений на серверах в ЕС."
  uk: "Обліковий запис зберігає вашу адресу ел. пошти, відображуване ім'я, друзів, запрошення, статистику та щонайбільше 2 хмарні збереження на серверах у ЄС."
"Nothing is sold, and there are no ads and no tracking.":
  de: "Nichts wird verkauft, es gibt keine Werbung und kein Tracking."
  fr: "Rien n'est vendu, et il n'y a ni publicité ni pistage."
  nl: "Er wordt niets verkocht, en er zijn geen advertenties en geen tracking."
  pl: "Nic nie jest sprzedawane, nie ma reklam ani śledzenia."
  ru: "Ничего не продаётся, нет ни рекламы, ни отслеживания."
  uk: "Нічого не продається, немає ні реклами, ні стеження."
"You can delete your account at any time: Account, then Delete account.":
  de: "Du kannst dein Konto jederzeit löschen: Konto, dann Konto löschen."
  fr: "Vous pouvez supprimer votre compte à tout moment : Compte, puis Supprimer le compte."
  nl: "Je kunt je account altijd verwijderen: Account, dan Account verwijderen."
  pl: "Możesz w każdej chwili usunąć konto: Konto, potem Usuń konto."
  ru: "Вы можете удалить аккаунт в любой момент: Аккаунт, затем Удалить аккаунт."
  uk: "Ви можете будь-коли видалити обліковий запис: Обліковий запис, потім Видалити обліковий запис."
"Playing without an account needs none of this: sign out, and Omsi-Hub plays on locally.":
  de: "Ohne Konto zu spielen braucht nichts davon: Melde dich ab, und Omsi-Hub läuft lokal weiter."
  fr: "Jouer sans compte ne demande rien de tout cela : déconnectez-vous, et Omsi-Hub continue en local."
  nl: "Spelen zonder account heeft dit allemaal niet nodig: log uit, en Omsi-Hub speelt lokaal verder."
  pl: "Gra bez konta nie wymaga niczego z tego: wyloguj się, a Omsi-Hub działa dalej lokalnie."
  ru: "Для игры без аккаунта ничего этого не нужно: выйдите, и Omsi-Hub продолжит работать локально."
  uk: "Для гри без облікового запису нічого з цього не потрібно: вийдіть, і Omsi-Hub працюватиме далі локально."
"Agree":
  de: "Zustimmen"
  fr: "Accepter"
  nl: "Akkoord"
  pl: "Akceptuję"
  ru: "Согласиться"
  uk: "Погодитися"
"Delete account":
  de: "Konto löschen"
  fr: "Supprimer le compte"
  nl: "Account verwijderen"
  pl: "Usuń konto"
  ru: "Удалить аккаунт"
  uk: "Видалити обліковий запис"
"Agree to the privacy statement first: then your account works.":
  de: "Stimme zuerst der Datenschutzerklärung zu: Dann funktioniert dein Konto."
  fr: "Acceptez d'abord la déclaration de confidentialité : ensuite votre compte fonctionne."
  nl: "Ga eerst akkoord met de privacyverklaring: dan werkt je account."
  pl: "Najpierw zaakceptuj oświadczenie o prywatności: wtedy konto zadziała."
  ru: "Сначала согласитесь с заявлением о конфиденциальности: тогда аккаунт заработает."
  uk: "Спершу погодьтеся із заявою про конфіденційність: тоді обліковий запис запрацює."
"Signed in. Agree to the privacy statement to use your account.":
  de: "Angemeldet. Stimme der Datenschutzerklärung zu, um dein Konto zu nutzen."
  fr: "Connecté. Acceptez la déclaration de confidentialité pour utiliser votre compte."
  nl: "Ingelogd. Ga akkoord met de privacyverklaring om je account te gebruiken."
  pl: "Zalogowano. Zaakceptuj oświadczenie o prywatności, aby korzystać z konta."
  ru: "Вход выполнен. Согласитесь с заявлением о конфиденциальности, чтобы пользоваться аккаунтом."
  uk: "Вхід виконано. Погодьтеся із заявою про конфіденційність, щоб користуватися обліковим записом."
"Thank you. Your account is ready.":
  de: "Danke. Dein Konto ist bereit."
  fr: "Merci. Votre compte est prêt."
  nl: "Bedankt. Je account is klaar."
  pl: "Dziękujemy. Twoje konto jest gotowe."
  ru: "Спасибо. Ваш аккаунт готов."
  uk: "Дякуємо. Ваш обліковий запис готовий."
"Cloud saves stay private to your account.":
  de: "Cloud-Spielstände bleiben privat in deinem Konto."
  fr: "Les sauvegardes cloud restent privées, liées à votre compte."
  nl: "Cloudopslag blijft privé, bij je account."
  pl: "Zapisy w chmurze pozostają prywatne, w Twoim koncie."
  ru: "Облачные сохранения остаются приватными в вашем аккаунте."
  uk: "Хмарні збереження залишаються приватними у вашому обліковому записі."
