_version: 2
# RosterFlow's Routes tab (Beta 61): Optibus's route editor inside RosterFlow - the route bar (the
# route, a new one, its days, its colour, its directions), the stops of a direction on the left,
# the line editor's map with START and END and a stop search, and the trip-time strip along the foot.
"Mon-Fri, Sat, Sun":
  de: "Mo-Fr, Sa, So"
  fr: "Lun-Ven, Sam, Dim"
  nl: "Ma-Vr, Za, Zo"
  pl: "Pn-Pt, Sob, Nd"
  ru: "Пн-Пт, Сб, Вс"
  uk: "Пн-Пт, Сб, Нд"
"Mon-Fri, school days":
  de: "Mo-Fr, Schultage"
  fr: "Lun-Ven, jours d'école"
  nl: "Ma-Vr, schooldagen"
  pl: "Pn-Pt, dni szkolne"
  ru: "Пн-Пт, учебные дни"
  uk: "Пн-Пт, навчальні дні"
"Sat, Sun":
  de: "Sa, So"
  fr: "Sam, Dim"
  nl: "Za, Zo"
  pl: "Sob, Nd"
  ru: "Сб, Вс"
  uk: "Сб, Нд"
"Mon-Fri, Sat, Sun, on demand":
  de: "Mo-Fr, Sa, So, Rufbus"
  fr: "Lun-Ven, Sam, Dim, à la demande"
  nl: "Ma-Vr, Za, Zo, op afroep"
  pl: "Pn-Pt, Sob, Nd, na żądanie"
  ru: "Пн-Пт, Сб, Вс, по заказу"
  uk: "Пн-Пт, Сб, Нд, за викликом"
"The days the route runs, as its kind of service has them: the Timeplan makes its trips on these days":
  de: "Die Tage, an denen die Route fährt, wie ihre Verkehrsart sie vorgibt: Der Fahrplanentwurf legt ihre Fahrten auf diese Tage"
  fr: "Les jours où l'itinéraire circule, selon son type de service : le plan horaire place ses courses ces jours-là"
  nl: "De dagen waarop de route rijdt, zoals het soort vervoer ze bepaalt: het dienstregelingsplan maakt de ritten op deze dagen"
  pl: "Dni, w które kursuje trasa, wynikające z rodzaju przewozu: plan rozkładu układa jej kursy na te dni"
  ru: "Дни, по которым ходит маршрут, по его виду перевозок: план расписания ставит его рейсы на эти дни"
  uk: "Дні, коли курсує маршрут, за його видом перевезень: план розкладу ставить його рейси на ці дні"
"New route: click its stops on the map":
  de: "Neue Route: ihre Haltestellen auf der Karte anklicken"
  fr: "Nouvel itinéraire : cliquez ses arrêts sur la carte"
  nl: "Nieuwe route: klik de haltes op de kaart aan"
  pl: "Nowa trasa: kliknij jej przystanki na mapie"
  ru: "Новый маршрут: щёлкните его остановки на карте"
  uk: "Новий маршрут: клацніть його зупинки на карті"
"The route's colour":
  de: "Die Farbe der Route"
  fr: "La couleur de l'itinéraire"
  nl: "De kleur van de route"
  pl: "Kolor trasy"
  ru: "Цвет маршрута"
  uk: "Колір маршруту"
"To %{stop}":
  de: "Nach %{stop}"
  fr: "Vers %{stop}"
  nl: "Naar %{stop}"
  pl: "→ %{stop}"
  ru: "→ %{stop}"
  uk: "→ %{stop}"
"Ring":
  de: "Ring"
  fr: "Circulaire"
  nl: "Ring"
  pl: "Okrężna"
  ru: "Кольцевой"
  uk: "Кільцевий"
"%{n} km":
  de: "%{n} km"
  fr: "%{n} km"
  nl: "%{n} km"
  pl: "%{n} km"
  ru: "%{n} км"
  uk: "%{n} км"
"%{n} mi":
  de: "%{n} mi"
  fr: "%{n} mi"
  nl: "%{n} mijl"
  pl: "%{n} mil"
  ru: "%{n} миль"
  uk: "%{n} миль"
"Drag it to another place in the order":
  de: "Die Haltestelle an eine andere Stelle der Reihenfolge ziehen"
  fr: "Glisser l'arrêt à une autre place dans l'ordre"
  nl: "Sleep de halte naar een andere plek in de volgorde"
  pl: "Przeciągnij przystanek w inne miejsce kolejności"
  ru: "Перетащите остановку на другое место в порядке"
  uk: "Перетягніть зупинку на інше місце в порядку"
"New stops go in after %{stop}: click it again to add them at the end.":
  de: "Neue Haltestellen kommen nach %{stop}: noch einmal anklicken, um sie am Ende anzufügen."
  fr: "Les nouveaux arrêts viennent après %{stop} : cliquez-le de nouveau pour les ajouter à la fin."
  nl: "Nieuwe haltes komen na %{stop}: klik er nog eens op om ze aan het eind toe te voegen."
  pl: "Nowe przystanki trafią po %{stop}: kliknij go ponownie, aby dodawać je na końcu."
  ru: "Новые остановки встанут после %{stop}: щёлкните её ещё раз, чтобы добавлять их в конец."
  uk: "Нові зупинки стануть після %{stop}: клацніть її ще раз, щоб додавати їх у кінець."
"This route has no way back yet: without one the bus goes round to its first stop.":
  de: "Diese Route hat noch keinen Rückweg: Ohne ihn fährt der Bus im Kreis zu seiner ersten Haltestelle."
  fr: "Cet itinéraire n'a pas encore de retour : sans lui, le bus revient en boucle à son premier arrêt."
  nl: "Deze route heeft nog geen terugweg: zonder terugweg rijdt de bus rond naar zijn eerste halte."
  pl: "Ta trasa nie ma jeszcze drogi powrotnej: bez niej autobus wraca okrężnie do pierwszego przystanku."
  ru: "У этого маршрута ещё нет обратного пути: без него автобус по кругу возвращается к первой остановке."
  uk: "Цей маршрут ще не має зворотного шляху: без нього автобус по колу повертається до першої зупинки."
"START":
  de: "START"
  fr: "DÉPART"
  nl: "START"
  pl: "START"
  ru: "СТАРТ"
  uk: "СТАРТ"
"END":
  de: "ZIEL"
  fr: "ARRIVÉE"
  nl: "EIND"
  pl: "KONIEC"
  ru: "КОНЕЦ"
  uk: "КІНЕЦЬ"
"START · END":
  de: "START · ZIEL"
  fr: "DÉPART · ARRIVÉE"
  nl: "START · EIND"
  pl: "START · KONIEC"
  ru: "СТАРТ · КОНЕЦ"
  uk: "СТАРТ · КІНЕЦЬ"
"The whole route":
  de: "Die ganze Route"
  fr: "L'itinéraire entier"
  nl: "De hele route"
  pl: "Cała trasa"
  ru: "Весь маршрут"
  uk: "Увесь маршрут"
"Search a stop":
  de: "Haltestelle suchen"
  fr: "Chercher un arrêt"
  nl: "Halte zoeken"
  pl: "Szukaj przystanku"
  ru: "Найти остановку"
  uk: "Знайти зупинку"
"No stop of that name":
  de: "Keine Haltestelle dieses Namens"
  fr: "Aucun arrêt de ce nom"
  nl: "Geen halte met die naam"
  pl: "Brak przystanku o tej nazwie"
  ru: "Нет остановки с таким названием"
  uk: "Немає зупинки з такою назвою"
"Show it on the map":
  de: "Auf der Karte zeigen"
  fr: "Le montrer sur la carte"
  nl: "Op de kaart tonen"
  pl: "Pokaż na mapie"
  ru: "Показать на карте"
  uk: "Показати на карті"
"On the route":
  de: "Auf der Route"
  fr: "Sur l'itinéraire"
  nl: "Op de route"
  pl: "Na trasie"
  ru: "На маршруте"
  uk: "На маршруті"
"Add it to the direction":
  de: "Zur Richtung hinzufügen"
  fr: "L'ajouter au sens"
  nl: "Aan de richting toevoegen"
  pl: "Dodaj do kierunku"
  ru: "Добавить в направление"
  uk: "Додати до напрямку"
"Two stops at least: then the minutes from stop to stop are here.":
  de: "Mindestens zwei Haltestellen: Dann stehen hier die Minuten von Haltestelle zu Haltestelle."
  fr: "Deux arrêts au moins : les minutes d'arrêt en arrêt s'affichent alors ici."
  nl: "Minstens twee haltes: dan staan hier de minuten van halte tot halte."
  pl: "Co najmniej dwa przystanki: wtedy tutaj są minuty od przystanku do przystanku."
  ru: "Нужно хотя бы две остановки: тогда здесь будут минуты от остановки до остановки."
  uk: "Потрібно щонайменше дві зупинки: тоді тут будуть хвилини від зупинки до зупинки."
"The minutes from %{a} to %{b}: click to change them":
  de: "Die Minuten von %{a} bis %{b}: zum Ändern anklicken"
  fr: "Les minutes de %{a} à %{b} : cliquez pour les changer"
  nl: "De minuten van %{a} tot %{b}: klik om ze te wijzigen"
  pl: "Minuty od %{a} do %{b}: kliknij, aby je zmienić"
  ru: "Минуты от %{a} до %{b}: щёлкните, чтобы изменить"
  uk: "Хвилини від %{a} до %{b}: клацніть, щоб змінити"
"From the roads: the Timeplan starts its running times from these":
  de: "Aus den Straßen: Der Fahrplanentwurf beginnt seine Fahrzeiten mit diesen"
  fr: "D'après les routes : le plan horaire part de ces temps pour ses temps de parcours"
  nl: "Uit de wegen: het dienstregelingsplan begint zijn rijtijden met deze"
  pl: "Z dróg: plan rozkładu zaczyna od nich swoje czasy przejazdu"
  ru: "По дорогам: план расписания берёт их за основу времени хода"
  uk: "За дорогами: план розкладу бере їх за основу часу руху"
"Typed in: the Timeplan starts its running times from these":
  de: "Eingetippt: Der Fahrplanentwurf beginnt seine Fahrzeiten mit diesen"
  fr: "Saisis : le plan horaire part de ces temps pour ses temps de parcours"
  nl: "Ingetypt: het dienstregelingsplan begint zijn rijtijden met deze"
  pl: "Wpisane: plan rozkładu zaczyna od nich swoje czasy przejazdu"
  ru: "Введены вручную: план расписания берёт их за основу времени хода"
  uk: "Введено вручну: план розкладу бере їх за основу часу руху"
"The route has changes not saved: save them, or do it again to leave them.":
  de: "Die Route hat ungespeicherte Änderungen: Speichern Sie sie, oder tun Sie es noch einmal, um sie zu verwerfen."
  fr: "L'itinéraire a des changements non enregistrés : enregistrez-les, ou recommencez pour les abandonner."
  nl: "De route heeft wijzigingen die niet zijn opgeslagen: sla ze op, of doe het nog eens om ze te laten vallen."
  pl: "Trasa ma niezapisane zmiany: zapisz je albo zrób to jeszcze raz, aby je porzucić."
  ru: "У маршрута есть несохранённые изменения: сохраните их или повторите действие, чтобы отказаться от них."
  uk: "Маршрут має незбережені зміни: збережіть їх або повторіть дію, щоб відмовитися від них."
"The line editor could not be opened.":
  de: "Der Linieneditor ließ sich nicht öffnen."
  fr: "L'éditeur de lignes n'a pas pu s'ouvrir."
  nl: "De lijneneditor kon niet worden geopend."
  pl: "Nie udało się otworzyć edytora linii."
  ru: "Не удалось открыть редактор линий."
  uk: "Не вдалося відкрити редактор ліній."
# The trip-time strip on the Timeplan's running times (r62): one source of the minutes from stop to
# stop - typed in the strip or in the Timeplan, the same running time.
"The Timeplan's running times: %{day}, the band from 00:00":
  de: "Die Fahrzeiten des Fahrplanentwurfs: %{day}, das Zeitband ab 00:00"
  fr: "Les temps de parcours du plan horaire : %{day}, la tranche dès 00:00"
  nl: "De rijtijden van het dienstregelingsplan: %{day}, de tijdband vanaf 00:00"
  pl: "Czasy przejazdu planu rozkładu: %{day}, przedział od 00:00"
  ru: "Время хода плана расписания: %{day}, интервал с 00:00"
  uk: "Час руху плану розкладу: %{day}, проміжок з 00:00"
"Press again: the roads' minutes replace the running times of every time band of %{day}, %{dir}, in the Timeplan":
  de: "Noch einmal drücken: Die Minuten aus den Straßen ersetzen die Fahrzeiten aller Zeitbänder von %{day}, %{dir}, im Fahrplanentwurf"
  fr: "Appuyez encore : les minutes d'après les routes remplacent les temps de parcours de chaque tranche de %{day}, %{dir}, dans le plan horaire"
  nl: "Druk nog eens: de minuten uit de wegen vervangen de rijtijden van elke tijdband van %{day}, %{dir}, in het dienstregelingsplan"
  pl: "Naciśnij ponownie: minuty z dróg zastąpią czasy przejazdu każdego przedziału dnia %{day}, %{dir}, w planie rozkładu"
  ru: "Нажмите ещё раз: минуты по дорогам заменят время хода во всех интервалах дня %{day}, %{dir}, в плане расписания"
  uk: "Натисніть ще раз: хвилини за дорогами замінять час руху в усіх проміжках дня %{day}, %{dir}, у плані розкладу"
"The day group whose running times these are, as the Timeplan shows it":
  de: "Die Tagesgruppe, deren Fahrzeiten das sind, wie der Fahrplanentwurf sie zeigt"
  fr: "Le groupe de jours dont ce sont les temps de parcours, tel que le plan horaire le montre"
  nl: "De dagengroep waarvan dit de rijtijden zijn, zoals het dienstregelingsplan hem toont"
  pl: "Grupa dni, do której należą te czasy przejazdu, tak jak pokazuje ją plan rozkładu"
  ru: "Группа дней, чьё это время хода, как её показывает план расписания"
  uk: "Група днів, чий це час руху, як її показує план розкладу"
"no service":
  de: "kein Betrieb"
  fr: "pas de service"
  nl: "geen dienst"
  pl: "bez kursów"
  ru: "нет рейсов"
  uk: "немає рейсів"
"The running times changed here are in the Timeplan, not saved yet":
  de: "Die hier geänderten Fahrzeiten stehen im Fahrplanentwurf, noch nicht gespeichert"
  fr: "Les temps de parcours changés ici sont dans le plan horaire, pas encore enregistrés"
  nl: "De hier gewijzigde rijtijden staan in het dienstregelingsplan, nog niet opgeslagen"
  pl: "Zmienione tu czasy przejazdu są w planie rozkładu, jeszcze niezapisane"
  ru: "Изменённое здесь время хода находится в плане расписания и ещё не сохранено"
  uk: "Змінений тут час руху є в плані розкладу і ще не збережений"
"Not saved: save in the Timeplan":
  de: "Nicht gespeichert: im Fahrplanentwurf speichern"
  fr: "Non enregistré : enregistrez dans le plan horaire"
  nl: "Niet opgeslagen: sla op in het dienstregelingsplan"
  pl: "Niezapisane: zapisz w planie rozkładu"
  ru: "Не сохранено: сохраните в плане расписания"
  uk: "Не збережено: збережіть у плані розкладу"
"The route's stops are not saved yet: these are its own minutes, the Timeplan's running times once it is saved.":
  de: "Die Haltestellen der Route sind noch nicht gespeichert: Das sind ihre eigenen Minuten, die Fahrzeiten des Fahrplanentwurfs, sobald sie gespeichert ist."
  fr: "Les arrêts de l'itinéraire ne sont pas encore enregistrés : ce sont ses propres minutes, les temps de parcours du plan horaire une fois enregistré."
  nl: "De haltes van de route zijn nog niet opgeslagen: dit zijn haar eigen minuten, de rijtijden van het dienstregelingsplan zodra ze is opgeslagen."
  pl: "Przystanki trasy nie są jeszcze zapisane: to jej własne minuty, czasy przejazdu planu rozkładu po zapisaniu."
  ru: "Остановки маршрута ещё не сохранены: это его собственные минуты, время хода плана расписания после сохранения."
  uk: "Зупинки маршруту ще не збережені: це його власні хвилини, час руху плану розкладу після збереження."
"The Timeplan has changes to another line not saved: save them there first, then these minutes are the Timeplan's.":
  de: "Der Fahrplanentwurf hat ungespeicherte Änderungen an einer anderen Linie: Speichere sie dort zuerst, dann sind diese Minuten die des Fahrplanentwurfs."
  fr: "Le plan horaire a des changements non enregistrés sur une autre ligne : enregistrez-les d'abord, puis ces minutes seront celles du plan horaire."
  nl: "Het dienstregelingsplan heeft niet opgeslagen wijzigingen aan een andere lijn: sla die daar eerst op, dan zijn deze minuten die van het plan."
  pl: "Plan rozkładu ma niezapisane zmiany innej linii: najpierw je tam zapisz, potem te minuty będą minutami planu."
  ru: "В плане расписания есть несохранённые изменения другой линии: сначала сохраните их там, тогда эти минуты станут минутами плана."
  uk: "У плані розкладу є незбережені зміни іншої лінії: спершу збережіть їх там, тоді ці хвилини стануть хвилинами плану."
"Line %{n}, %{day}: every time band of the direction runs on the minutes from the roads now - save them in the Timeplan.":
  de: "Linie %{n}, %{day}: Alle Zeitbänder der Richtung fahren jetzt nach den Minuten aus den Straßen - speichere sie im Fahrplanentwurf."
  fr: "Ligne %{n}, %{day} : chaque tranche de la direction roule maintenant sur les minutes d'après les routes - enregistrez-les dans le plan horaire."
  nl: "Lijn %{n}, %{day}: elke tijdband van de richting rijdt nu op de minuten uit de wegen - sla ze op in het dienstregelingsplan."
  pl: "Linia %{n}, %{day}: każdy przedział kierunku jedzie teraz według minut z dróg - zapisz je w planie rozkładu."
  ru: "Линия %{n}, %{day}: все интервалы направления теперь идут по минутам по дорогам - сохраните их в плане расписания."
  uk: "Лінія %{n}, %{day}: усі проміжки напрямку тепер ідуть за хвилинами за дорогами - збережіть їх у плані розкладу."
