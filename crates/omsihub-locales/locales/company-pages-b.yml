  pl: "Pauza zachowuje wykonaną pracę: nikt nad tym nie pracuje, dopóki nie wznowisz."
  ru: "Пауза сохраняет сделанную работу: никто не работает над этим, пока вы не продолжите."
  uk: "Пауза зберігає виконану роботу: ніхто не працює над цим, доки ви не продовжите."
