"Starts sharing if it is not on yet, then sends them the session code.":
  de: "Startet das Teilen, falls es noch nicht läuft, und schickt ihnen den Sitzungscode."
  fr: "Lance le partage s'il n'est pas encore actif, puis leur envoie le code de session."
  nl: "Start het delen als dat nog niet aan staat en stuurt hun de sessiecode."
  pl: "Włącza udostępnianie, jeśli jeszcze nie działa, i wysyła im kod sesji."
  ru: "Включает общий доступ, если он ещё не включён, и отправляет им код сессии."
  uk: "Вмикає спільний доступ, якщо він ще не ввімкнений, і надсилає їм код сесії."
"None of your friends is online right now.":
  de: "Gerade ist keiner deiner Freunde online."
  fr: "Aucun de vos amis n'est en ligne pour le moment."
  nl: "Er is nu geen van je vrienden online."
  pl: "Żaden z twoich znajomych nie jest teraz online."
  ru: "Сейчас никого из ваших друзей нет в сети."
  uk: "Зараз нікого з ваших друзів немає в мережі."
"Omsi-Hub online cannot be reached now: send the session code yourself.":
  de: "Omsi-Hub online ist gerade nicht erreichbar: schick den Sitzungscode selbst."
  fr: "Omsi-Hub en ligne est injoignable pour le moment : envoyez le code de session vous-même."
  nl: "Omsi-Hub online is nu niet bereikbaar: stuur de sessiecode zelf."
  pl: "Omsi-Hub online jest teraz niedostępny: wyślij kod sesji sam."
  ru: "Omsi-Hub online сейчас недоступен: отправьте код сессии сами."
  uk: "Omsi-Hub online зараз недоступний: надішліть код сесії самі."
"Sign in or make an account to see your friends here and invite them. Without one, send the session code yourself.":
  de: "Melde dich an oder erstelle ein Konto, um deine Freunde hier zu sehen und einzuladen. Ohne Konto schickst du den Sitzungscode selbst."
  fr: "Connectez-vous ou créez un compte pour voir vos amis ici et les inviter. Sans compte, envoyez le code de session vous-même."
  nl: "Log in of maak een account om je vrienden hier te zien en uit te nodigen. Zonder account stuur je de sessiecode zelf."
  pl: "Zaloguj się lub załóż konto, aby widzieć tu znajomych i ich zapraszać. Bez konta wyślij kod sesji sam."
  ru: "Войдите или создайте аккаунт, чтобы видеть здесь друзей и приглашать их. Без аккаунта отправьте код сессии сами."
  uk: "Увійдіть або створіть акаунт, щоб бачити тут друзів і запрошувати їх. Без акаунта надішліть код сесії самі."
