  uk: "Без банкрутства, безкоштовні кредити, більше доходів і менше витрат, менше неприємностей."
"Less income, higher costs and penalties, more breakdowns and delays.":
  de: "Weniger Einnahmen, höhere Kosten und Strafen, mehr Pannen und Verspätungen."
  fr: "Moins de recettes, des coûts et pénalités plus élevés, plus de pannes et de retards."
  nl: "Minder inkomsten, hogere kosten en boetes, meer pech en vertragingen."
  pl: "Niższe przychody, wyższe koszty i kary, więcej awarii i opóźnień."
  ru: "Меньше доходов, выше расходы и штрафы, больше поломок и опозданий."
  uk: "Менше доходів, вищі витрати й штрафи, більше поломок і запізнень."
"Every setting as a career company has it.":
  de: "Jede Einstellung wie bei einem Karriere-Unternehmen."
  fr: "Chaque réglage comme dans une compagnie en carrière."
  nl: "Elke instelling zoals een carrièrebedrijf die heeft."
  pl: "Każde ustawienie jak w firmie w trybie kariery."
  ru: "Все настройки как у компании в карьере."
  uk: "Усі налаштування як у компанії в кар'єрі."
