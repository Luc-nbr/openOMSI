  uk: "%{n} людино-днів роботи"
"The research is paused: the work done is kept.":
  de: "Die Forschung ist pausiert: Die geleistete Arbeit bleibt erhalten."
  fr: "La recherche est en pause : le travail fait est conservé."
  nl: "Het onderzoek is gepauzeerd: het gedane werk blijft bewaard."
  pl: "Badania są wstrzymane: wykonana praca zostaje zachowana."
  ru: "Исследование приостановлено: сделанная работа сохранена."
  uk: "Дослідження призупинено: виконану роботу збережено."
