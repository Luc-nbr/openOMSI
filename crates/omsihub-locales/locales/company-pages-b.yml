  de: "Rollen"
  fr: "Rôles"
  nl: "Rollen"
  pl: "Role"
  ru: "Роли"
  uk: "Ролі"
"You choose each player's role once they have joined, and can tick more or fewer permissions on top of it.":
  de: "Du wählst die Rolle jedes Spielers, sobald er beigetreten ist, und kannst darüber mehr oder weniger Rechte ankreuzen."
  fr: "Vous choisissez le rôle de chaque joueur une fois qu'il a rejoint, et pouvez cocher plus ou moins de droits en plus."
  nl: "Je kiest de rol van elke speler zodra die is binnengekomen, en kunt daarbovenop meer of minder rechten aanvinken."
  pl: "Rolę każdego gracza wybierasz po jego dołączeniu i możesz dodać lub odjąć uprawnienia."
  ru: "Вы выбираете роль каждого игрока, когда он присоединится, и можете добавить или убрать права поверх неё."
  uk: "Ви обираєте роль кожного гравця, коли він приєднається, і можете додати чи прибрати права поверх неї."
