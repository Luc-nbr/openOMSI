"This research has already been completed. Its benefits are now active in your operations.":
  de: "Diese Forschung ist abgeschlossen. Ihre Vorteile wirken jetzt in deinem Betrieb."
  fr: "Cette recherche est terminée. Ses avantages sont désormais actifs dans votre exploitation."
  nl: "Dit onderzoek is afgerond. De voordelen werken nu in je bedrijfsvoering."
  pl: "To badanie zostało ukończone. Jego korzyści działają już w twojej firmie."
  ru: "Это исследование завершено. Его преимущества уже действуют в вашей работе."
  uk: "Це дослідження завершено. Його переваги вже діють у вашій роботі."
"This research is under way: its benefits come when its stage is done.":
  de: "Diese Forschung läuft: Ihre Vorteile kommen, wenn ihre Stufe fertig ist."
  fr: "Cette recherche est en cours : ses avantages arrivent quand son étape est terminée."
  nl: "Dit onderzoek loopt: de voordelen komen als de fase klaar is."
  pl: "To badanie trwa: korzyści pojawią się po ukończeniu etapu."
  ru: "Это исследование идёт: преимущества появятся, когда этап будет завершён."
  uk: "Це дослідження триває: переваги з'являться, коли етап буде завершено."
"Everything it needs is there: start it when you like. One research runs at a time.":
  de: "Alles, was sie braucht, ist da: starte sie, wann du willst. Es läuft immer nur eine Forschung."
  fr: "Tout ce qu'il lui faut est là : lancez-la quand vous voulez. Une seule recherche à la fois."
  nl: "Alles wat het nodig heeft is er: start het wanneer je wilt. Er loopt één onderzoek tegelijk."
  pl: "Wszystko, czego potrzebuje, jest gotowe: rozpocznij, kiedy chcesz. Naraz trwa jedno badanie."
  ru: "Всё нужное есть: начните, когда захотите. Одновременно идёт одно исследование."
  uk: "Усе потрібне є: почніть, коли захочете. Одночасно триває одне дослідження."
"It waits for what it needs: research that first, or reach the level it asks.":
  de: "Sie wartet auf ihre Voraussetzungen: erforsche diese zuerst oder erreiche die verlangte Stufe."
  fr: "Elle attend ses prérequis : recherchez-les d'abord ou atteignez le niveau demandé."
  nl: "Het wacht op wat het nodig heeft: onderzoek dat eerst of bereik het gevraagde niveau."
  pl: "Czeka na wymagania: najpierw zbadaj je lub osiągnij wymagany poziom."
  ru: "Ждёт требований: сначала исследуйте их или достигните нужного уровня."
  uk: "Чекає на вимоги: спершу дослідіть їх або досягніть потрібного рівня."
"Invest in new technologies and improvements to make your operations more efficient, sustainable and profitable.":
  de: "Investiere in neue Technik und Verbesserungen, damit dein Betrieb effizienter, nachhaltiger und rentabler wird."
  fr: "Investissez dans de nouvelles technologies et améliorations pour une exploitation plus efficace, durable et rentable."
  nl: "Investeer in nieuwe technologie en verbeteringen om je bedrijf efficiënter, duurzamer en winstgevender te maken."
  pl: "Inwestuj w nowe technologie i ulepszenia, by firma działała wydajniej, bardziej ekologicznie i z większym zyskiem."
  ru: "Вкладывайте в новые технологии и улучшения, чтобы работа стала эффективнее, экологичнее и прибыльнее."
  uk: "Інвестуйте в нові технології та вдосконалення, щоб робота стала ефективнішою, екологічнішою й прибутковішою."
