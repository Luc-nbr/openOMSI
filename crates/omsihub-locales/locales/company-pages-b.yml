"Pausing keeps the work done: nobody works on it until you resume it.":
  de: "Pausieren behält die geleistete Arbeit: Niemand arbeitet daran, bis du fortsetzt."
  fr: "La pause garde le travail fait : personne n'y travaille jusqu'à la reprise."
  nl: "Pauzeren houdt het gedane werk: niemand werkt eraan tot je verdergaat."
  pl: "Pauza zachowuje wykonaną pracę: nikt nad tym nie pracuje, dopóki nie wznowisz."
  ru: "Пауза сохраняет сделанную работу: никто не работает над этим, пока вы не продолжите."
  uk: "Пауза зберігає виконану роботу: ніхто не працює над цим, доки ви не продовжите."
