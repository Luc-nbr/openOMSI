  fr: "Remplacer %{name}"
  nl: "%{name} vervangen"
  pl: "Zastąp %{name}"
  ru: "Заменить %{name}"
  uk: "Замінити %{name}"
"Replace %{name} for good?":
  de: "%{name} endgültig ersetzen?"
  fr: "Remplacer %{name} définitivement ?"
  nl: "%{name} definitief vervangen?"
  pl: "Zastąpić %{name} na dobre?"
  ru: "Заменить %{name} навсегда?"
  uk: "Замінити %{name} назавжди?"
"Replacing removes that company from the cloud. Its copy on this PC, if any, stays as a local save.":
  de: "Ersetzen entfernt diesen Betrieb aus der Cloud. Seine Kopie auf diesem PC, falls vorhanden, bleibt als lokaler Spielstand."
  fr: "Remplacer retire cette entreprise du cloud. Sa copie sur ce PC, s'il y en a une, reste en sauvegarde locale."
  nl: "Vervangen verwijdert dat bedrijf uit de cloud. Een kopie op deze pc blijft als lokale opslag."
  pl: "Zastąpienie usuwa tę firmę z chmury. Jej kopia na tym PC, jeśli jest, zostaje jako zapis lokalny."
  ru: "Замена удаляет ту компанию из облака. Её копия на этом ПК, если есть, остаётся локальным сохранением."
  uk: "Заміна видаляє ту компанію з хмари. Її копія на цьому ПК, якщо є, залишається локальним збереженням."
"At most 2 companies in the cloud. Every other company is a local save on this PC: unlimited, and it can still host company multiplayer.":
  de: "Höchstens 2 Betriebe in der Cloud. Jeder andere Betrieb ist ein lokaler Spielstand auf diesem PC: unbegrenzt, und er kann weiterhin Betriebs-Mehrspieler hosten."
  fr: "Au plus 2 entreprises dans le cloud. Toute autre entreprise est une sauvegarde locale sur ce PC : illimitée, et elle peut toujours héberger le multijoueur d'entreprise."
  nl: "Maximaal 2 bedrijven in de cloud. Elk ander bedrijf is lokale opslag op deze pc: onbeperkt, en het kan nog steeds bedrijfsmultiplayer hosten."
  pl: "Najwyżej 2 firmy w chmurze. Każda inna firma to zapis lokalny na tym PC: bez limitu i nadal może hostować tryb wieloosobowy firmy."
  ru: "Не больше 2 компаний в облаке. Любая другая компания — локальное сохранение на этом ПК: без ограничений, и она по-прежнему может проводить совместную игру компании."
  uk: "Не більше 2 компаній у хмарі. Будь-яка інша компанія — локальне збереження на цьому ПК: без обмежень, і вона, як і раніше, може проводити спільну гру компанії."
