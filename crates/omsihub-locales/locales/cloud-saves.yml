"Keep both: this PC's copy stays as %{copy}, a local save; the cloud's opens.":
  de: "Beide behalten: Die Kopie dieses PCs bleibt als %{copy}, ein lokaler Spielstand; die aus der Cloud wird geöffnet."
  fr: "Garder les deux : la copie de ce PC reste sous le nom %{copy}, en sauvegarde locale ; celle du cloud s'ouvre."
  nl: "Allebei houden: de kopie van deze pc blijft als %{copy}, een lokale opslag; die uit de cloud gaat open."
  pl: "Zachowaj oba: kopia z tego PC zostaje jako %{copy}, zapis lokalny; otworzy się ta z chmury."
  ru: "Оставить обе: копия с этого ПК остаётся как %{copy}, локальное сохранение; открывается копия из облака."
  uk: "Залишити обидві: копія з цього ПК залишається як %{copy}, локальне збереження; відкривається копія з хмари."
