  uk: "Не синхронізовано"
"Both cloud slots are taken: keep this company local, or replace one of your 2 cloud companies.":
  de: "Beide Cloud-Plätze sind belegt: Behalte diesen Betrieb lokal oder ersetze einen deiner 2 Cloud-Betriebe."
  fr: "Les deux emplacements cloud sont pris : gardez cette entreprise en local, ou remplacez l'une de vos 2 entreprises cloud."
  nl: "Beide cloudplekken zijn bezet: houd dit bedrijf lokaal, of vervang een van je 2 cloudbedrijven."
  pl: "Oba miejsca w chmurze są zajęte: zostaw tę firmę lokalnie albo zastąp jedną z 2 firm w chmurze."
  ru: "Оба облачных слота заняты: оставьте эту компанию локальной или замените одну из 2 облачных компаний."
  uk: "Обидва хмарні слоти зайняті: залиште цю компанію локальною або замініть одну з 2 хмарних компаній."
"This company changed on this PC and in the cloud since it was last synced.":
  de: "Dieser Betrieb wurde seit dem letzten Abgleich auf diesem PC und in der Cloud geändert."
  fr: "Cette entreprise a changé sur ce PC et dans le cloud depuis la dernière synchronisation."
  nl: "Dit bedrijf is sinds de laatste synchronisatie op deze pc en in de cloud gewijzigd."
  pl: "Ta firma zmieniła się na tym PC i w chmurze od ostatniej synchronizacji."
  ru: "Эта компания изменилась и на этом ПК, и в облаке с последней синхронизации."
  uk: "Ця компанія змінилася і на цьому ПК, і в хмарі з останньої синхронізації."
"This company is too large for the cloud (at most 25 MB compressed). It stays local.":
  de: "Dieser Betrieb ist zu groß für die Cloud (höchstens 25 MB komprimiert). Er bleibt lokal."
  fr: "Cette entreprise est trop grande pour le cloud (25 Mo compressés au plus). Elle reste en local."
  nl: "Dit bedrijf is te groot voor de cloud (maximaal 25 MB gecomprimeerd). Het blijft lokaal."
  pl: "Ta firma jest za duża na chmurę (najwyżej 25 MB po kompresji). Zostaje lokalnie."
  ru: "Эта компания слишком велика для облака (не больше 25 МБ в сжатом виде). Она остаётся локальной."
  uk: "Ця компанія завелика для хмари (не більше 25 МБ у стиснутому вигляді). Вона залишається локальною."
"This cloud save is not there any more.":
  de: "Dieser Cloud-Spielstand ist nicht mehr da."
  fr: "Cette sauvegarde cloud n'existe plus."
  nl: "Deze cloudopslag is er niet meer."
  pl: "Tego zapisu w chmurze już nie ma."
  ru: "Этого облачного сохранения больше нет."
  uk: "Цього хмарного збереження більше немає."
"The cloud storage refused the upload. Try again.":
  de: "Der Cloud-Speicher hat den Upload abgelehnt. Versuch es noch einmal."
  fr: "Le stockage cloud a refusé l'envoi. Réessayez."
  nl: "De cloudopslag heeft de upload geweigerd. Probeer het opnieuw."
  pl: "Magazyn w chmurze odrzucił wysyłany plik. Spróbuj ponownie."
  ru: "Облачное хранилище отклонило загрузку. Попробуйте ещё раз."
  uk: "Хмарне сховище відхилило вивантаження. Спробуйте ще раз."
"The cloud save is damaged: its checksum is wrong. Nothing was changed.":
  de: "Der Cloud-Spielstand ist beschädigt: Seine Prüfsumme stimmt nicht. Es wurde nichts geändert."
  fr: "La sauvegarde cloud est endommagée : sa somme de contrôle est fausse. Rien n'a été modifié."
  nl: "De cloudopslag is beschadigd: de controlesom klopt niet. Er is niets gewijzigd."
  pl: "Zapis w chmurze jest uszkodzony: suma kontrolna się nie zgadza. Nic nie zmieniono."
  ru: "Облачное сохранение повреждено: контрольная сумма не совпадает. Ничего не изменено."
  uk: "Хмарне збереження пошкоджене: контрольна сума не збігається. Нічого не змінено."
"This deletes your profile, your friends, your invites, your cloud saves and then the account itself. Your companies on this PC stay, as local saves. It cannot be undone.":
  de: "Das löscht dein Profil, deine Freunde, deine Einladungen, deine Cloud-Spielstände und dann das Konto selbst. Deine Betriebe auf diesem PC bleiben als lokale Spielstände. Es lässt sich nicht rückgängig machen."
  fr: "Cela supprime votre profil, vos amis, vos invitations, vos sauvegardes cloud puis le compte lui-même. Vos entreprises sur ce PC restent, en sauvegardes locales. C'est irréversible."
  nl: "Dit verwijdert je profiel, je vrienden, je uitnodigingen, je cloudopslag en daarna het account zelf. Je bedrijven op deze pc blijven, als lokale opslag. Het kan niet ongedaan worden gemaakt."
  pl: "To usunie twój profil, znajomych, zaproszenia, zapisy w chmurze, a potem samo konto. Twoje firmy na tym PC zostaną jako zapisy lokalne. Nie da się tego cofnąć."
  ru: "Будут удалены ваш профиль, друзья, приглашения, облачные сохранения, а затем и сам аккаунт. Ваши компании на этом ПК останутся локальными сохранениями. Отменить это нельзя."
  uk: "Буде видалено ваш профіль, друзів, запрошення, хмарні збереження, а потім і сам обліковий запис. Ваші компанії на цьому ПК залишаться локальними збереженнями. Скасувати це неможливо."
"Local company to put in the cloud":
  de: "Lokales Unternehmen für die Cloud"
  fr: "Entreprise locale à mettre dans le cloud"
  nl: "Lokaal bedrijf om in de cloud te zetten"
  pl: "Lokalna firma do umieszczenia w chmurze"
  ru: "Локальная компания для облака"
  uk: "Локальна компанія для хмари"
