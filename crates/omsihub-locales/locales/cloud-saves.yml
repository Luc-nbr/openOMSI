_version: 2
# Beta 63: the cloud saves - a company kept in the account's cloud (at most 2), its sync and its
# conflicts, the badges of the company chooser and the account panel's "Cloud saves"
# (crates/omsi-launcher-api/src/omsihub/cloud.rs, launcher/ui/js/omsihub/cloud.js, the codes of
# crates/omsihub-online/src/codes.rs).
"Cloud save":
  de: "Cloud-Spielstand"
  fr: "Sauvegarde cloud"
  nl: "Cloudopslag"
  pl: "Zapis w chmurze"
  ru: "Облачное сохранение"
  uk: "Хмарне збереження"
"Removed from the cloud. A company of it on this PC stays as a local save.":
  de: "Aus der Cloud entfernt. Ein Betrieb davon auf diesem PC bleibt als lokaler Spielstand."
  fr: "Supprimée du cloud. Une entreprise qui en vient sur ce PC reste en sauvegarde locale."
  nl: "Uit de cloud verwijderd. Een bedrijf ervan op deze pc blijft als lokale opslag."
  pl: "Usunięto z chmury. Firma z tego zapisu na tym PC zostaje jako zapis lokalny."
  ru: "Удалено из облака. Компания из него на этом ПК остаётся локальным сохранением."
  uk: "Видалено з хмари. Компанія з нього на цьому ПК залишається локальним збереженням."
"%{name} is no longer in the cloud: it stays on this PC as a local save.":
  de: "%{name} ist nicht mehr in der Cloud: Der Betrieb bleibt als lokaler Spielstand auf diesem PC."
  fr: "%{name} n'est plus dans le cloud : l'entreprise reste sur ce PC en sauvegarde locale."
  nl: "%{name} staat niet meer in de cloud: het blijft als lokale opslag op deze pc."
  pl: "%{name} nie ma już w chmurze: zostaje na tym PC jako zapis lokalny."
  ru: "%{name} больше нет в облаке: компания остаётся на этом ПК локальным сохранением."
  uk: "%{name} більше немає в хмарі: компанія залишається на цьому ПК локальним збереженням."
