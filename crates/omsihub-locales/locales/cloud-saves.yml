  de: "Diesen Betrieb in die Cloud legen"
  fr: "Mettre cette entreprise dans le cloud"
  nl: "Dit bedrijf in de cloud zetten"
  pl: "Umieść tę firmę w chmurze"
  ru: "Поместить эту компанию в облако"
  uk: "Розмістити цю компанію в хмарі"
"%{name} stays local. Local saves are unlimited and can still host company multiplayer.":
  de: "%{name} bleibt lokal. Lokale Spielstände sind unbegrenzt und können weiterhin Betriebs-Mehrspieler hosten."
  fr: "%{name} reste en local. Les sauvegardes locales sont illimitées et peuvent toujours héberger le multijoueur d'entreprise."
  nl: "%{name} blijft lokaal. Lokale opslag is onbeperkt en kan nog steeds bedrijfsmultiplayer hosten."
  pl: "%{name} zostaje lokalnie. Zapisy lokalne są bez limitu i nadal mogą hostować tryb wieloosobowy firmy."
  ru: "%{name} остаётся локальной. Локальных сохранений сколько угодно, и они по-прежнему могут проводить совместную игру компании."
  uk: "%{name} залишається локальною. Локальних збережень скільки завгодно, і вони, як і раніше, можуть проводити спільну гру компанії."
"Keep it local":
