"A newer %{name} is in the cloud":
  de: "In der Cloud ist ein neuerer Stand von %{name}"
  fr: "Une version plus récente de %{name} est dans le cloud"
  nl: "Er staat een nieuwere %{name} in de cloud"
  pl: "W chmurze jest nowsza wersja %{name}"
  ru: "В облаке есть более новая версия %{name}"
  uk: "У хмарі є новіша версія %{name}"
"This PC and the cloud both have changes since the last sync. Which copy do you want to keep? Nothing is lost until you choose.":
  de: "Dieser PC und die Cloud haben beide Änderungen seit dem letzten Abgleich. Welche Kopie möchtest du behalten? Bis du wählst, geht nichts verloren."
  fr: "Ce PC et le cloud ont tous deux des modifications depuis la dernière synchronisation. Quelle copie voulez-vous garder ? Rien n'est perdu tant que vous n'avez pas choisi."
  nl: "Deze pc en de cloud hebben allebei wijzigingen sinds de laatste synchronisatie. Welke kopie wil je houden? Er gaat niets verloren tot je kiest."
  pl: "Ten PC i chmura mają zmiany od ostatniej synchronizacji. Którą kopię chcesz zachować? Nic nie zginie, dopóki nie wybierzesz."
  ru: "И на этом ПК, и в облаке есть изменения с последней синхронизации. Какую копию оставить? Пока вы не выберете, ничего не теряется."
  uk: "І на цьому ПК, і в хмарі є зміни з останньої синхронізації. Яку копію залишити? Доки ви не оберете, нічого не втрачається."
"Another computer saved this company after this PC did. Download the newer version before you play?":
  de: "Ein anderer Computer hat diesen Betrieb nach diesem PC gespeichert. Die neuere Version vor dem Spielen herunterladen?"
  fr: "Un autre ordinateur a enregistré cette entreprise après ce PC. Télécharger la version plus récente avant de jouer ?"
  nl: "Een andere computer heeft dit bedrijf na deze pc opgeslagen. De nieuwere versie downloaden voor je speelt?"
  pl: "Inny komputer zapisał tę firmę później niż ten PC. Pobrać nowszą wersję przed grą?"
  ru: "Другой компьютер сохранил эту компанию позже этого ПК. Скачать более новую версию перед игрой?"
  uk: "Інший комп'ютер зберіг цю компанію пізніше за цей ПК. Завантажити новішу версію перед грою?"
