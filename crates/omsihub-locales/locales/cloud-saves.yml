  ru: "Свободный слот"
  uk: "Вільний слот"
"Put a company in the cloud to play it on every PC you sign in on.":
  de: "Leg einen Betrieb in die Cloud, um ihn auf jedem PC zu spielen, an dem du dich anmeldest."
  fr: "Mettez une entreprise dans le cloud pour la jouer sur chaque PC où vous vous connectez."
  nl: "Zet een bedrijf in de cloud om het te spelen op elke pc waarop je inlogt."
  pl: "Umieść firmę w chmurze, aby grać nią na każdym PC, na którym się zalogujesz."
  ru: "Поместите компанию в облако, чтобы играть ею на любом ПК, где вы входите в аккаунт."
  uk: "Розмістіть компанію в хмарі, щоб грати нею на будь-якому ПК, де ви входите в обліковий запис."
