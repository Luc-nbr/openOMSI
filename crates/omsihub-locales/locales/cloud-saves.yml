"Offline: your companies play on as local saves and sync when the network is back.":
  de: "Offline: Deine Betriebe laufen als lokale Spielstände weiter und werden abgeglichen, sobald das Netzwerk zurück ist."
  fr: "Hors ligne : vos entreprises continuent en sauvegardes locales et se synchronisent dès le retour du réseau."
  nl: "Offline: je bedrijven spelen door als lokale opslag en synchroniseren zodra het netwerk terug is."
  pl: "Offline: twoje firmy działają dalej jako zapisy lokalne i zsynchronizują się, gdy wróci sieć."
  ru: "Офлайн: ваши компании продолжают работать как локальные сохранения и синхронизируются, когда появится сеть."
  uk: "Офлайн: ваші компанії продовжують працювати як локальні збереження й синхронізуються, коли з'явиться мережа."
