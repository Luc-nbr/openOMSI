# the fare dialog
"Your own line: its adult single is yours to set, from %{lo} to %{hi}. Its standard fare, by the length of its trips, is %{p0}.":
  de: "Ihre eigene Linie: Den Einzelfahrschein für Erwachsene setzen Sie selbst, von %{lo} bis %{hi}. Ihr Standardtarif nach der Länge ihrer Fahrten ist %{p0}."
  fr: "Votre propre ligne : vous fixez son ticket adulte, de %{lo} à %{hi}. Son tarif standard, selon la longueur de ses courses, est de %{p0}."
  nl: "Je eigen lijn: het enkeltje voor volwassenen bepaal je zelf, van %{lo} tot %{hi}. Het standaardtarief naar de lengte van de ritten is %{p0}."
  pl: "Twoja własna linia: bilet jednorazowy normalny ustalasz sam, od %{lo} do %{hi}. Jej taryfa standardowa według długości kursów to %{p0}."
  ru: "Ваша собственная линия: разовый взрослый билет устанавливаете вы, от %{lo} до %{hi}. Её стандартный тариф по длине рейсов — %{p0}."
  uk: "Ваша власна лінія: разовий дорослий квиток встановлюєте ви, від %{lo} до %{hi}. Її стандартний тариф за довжиною рейсів — %{p0}."
"A map line: its adult single may be set from %{lo} to %{hi}, round its standard fare of %{p0} by the length of its trips.":
  de: "Eine Linie der Karte: Ihr Einzelfahrschein für Erwachsene darf zwischen %{lo} und %{hi} liegen, rund um ihren Standardtarif von %{p0} nach der Länge ihrer Fahrten."
  fr: "Une ligne de la carte : son ticket adulte peut aller de %{lo} à %{hi}, autour de son tarif standard de %{p0} selon la longueur de ses courses."
  nl: "Een lijn van de kaart: het enkeltje voor volwassenen mag van %{lo} tot %{hi}, rond het standaardtarief van %{p0} naar de lengte van de ritten."
  pl: "Linia z mapy: bilet jednorazowy dla dorosłych można ustawić od %{lo} do %{hi}, wokół taryfy standardowej %{p0} według długości kursów."
  ru: "Линия карты: разовый взрослый билет можно установить от %{lo} до %{hi}, около стандартного тарифа %{p0} по длине её рейсов."
  uk: "Лінія карти: разовий дорослий квиток можна встановити від %{lo} до %{hi}, довкола стандартного тарифу %{p0} за довжиною її рейсів."
