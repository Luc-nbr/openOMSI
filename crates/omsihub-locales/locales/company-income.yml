"About ten passengers a bus-hour, a third of them on concession passes.":
  de: "Etwa zehn Fahrgäste pro Busstunde, ein Drittel davon mit Ermäßigungsausweis."
  fr: "Une dizaine de voyageurs par heure-bus, dont un tiers avec une carte de réduction."
  nl: "Zo'n tien reizigers per busuur, een derde op een kortingspas."
  pl: "Około dziesięciu pasażerów na wozogodzinę, jedna trzecia na legitymacjach ulgowych."
  ru: "Около десяти пассажиров на машино-час, треть из них по льготным проездным."
  uk: "Близько десяти пасажирів на машино-годину, третина з них за пільговими проїзними."
"Busy all day: some 28 passengers a bus-hour, many on network passes.":
  de: "Den ganzen Tag voll: etwa 28 Fahrgäste pro Busstunde, viele mit Verbundkarten."
  fr: "Chargée toute la journée : environ 28 voyageurs par heure-bus, beaucoup avec un abonnement réseau."
  nl: "De hele dag druk: zo'n 28 reizigers per busuur, velen op een netwerkabonnement."
  pl: "Cały dzień tłoczno: około 28 pasażerów na wozogodzinę, wielu na biletach sieciowych."
  ru: "Загружена весь день: около 28 пассажиров на машино-час, многие по сетевым проездным."
  uk: "Завантажена весь день: близько 28 пасажирів на машино-годину, багато хто за мережевими проїзними."
"Between towns: 13 to 16 a trip, many on concession passes.":
  de: "Zwischen Städten: 13 bis 16 pro Fahrt, viele mit Ermäßigungsausweis."
  fr: "Entre les villes : 13 à 16 par course, beaucoup avec une carte de réduction."
  nl: "Tussen steden: 13 tot 16 per rit, velen op een kortingspas."
  pl: "Między miastami: 13 do 16 na kurs, wielu na legitymacjach ulgowych."
  ru: "Между городами: от 13 до 16 за рейс, многие по льготным проездным."
  uk: "Між містами: від 13 до 16 за рейс, багато хто за пільговими проїзними."
"Few riders, most of them on concession passes.":
  de: "Wenige Fahrgäste, die meisten mit Ermäßigungsausweis."
  fr: "Peu de voyageurs, la plupart avec une carte de réduction."
  nl: "Weinig reizigers, de meesten op een kortingspas."
  pl: "Niewielu pasażerów, większość na legitymacjach ulgowych."
  ru: "Мало пассажиров, большинство по льготным проездным."
  uk: "Мало пасажирів, більшість за пільговими проїзними."
"Short trips with few on each, at a cheap flat fare.":
  de: "Kurze Fahrten mit wenigen Fahrgästen, zu einem günstigen Einheitstarif."
  fr: "Des courses courtes avec peu de monde, à un tarif unique bon marché."
  nl: "Korte ritten met weinig reizigers, tegen een goedkoop vast tarief."
  pl: "Krótkie kursy z kilkoma osobami, po taniej jednolitej cenie."
  ru: "Короткие рейсы с немногими пассажирами по дешёвому единому тарифу."
  uk: "Короткі рейси з небагатьма пасажирами за дешевим єдиним тарифом."
"Quiet hours: about 7 a trip, most of them paying.":
  de: "Ruhige Stunden: etwa 7 pro Fahrt, die meisten zahlen."
  fr: "Heures creuses : environ 7 par course, la plupart payants."
  nl: "Rustige uren: zo'n 7 per rit, de meesten betalend."
  pl: "Spokojne godziny: około 7 na kurs, większość płaci."
  ru: "Тихие часы: около 7 за рейс, большинство платят."
  uk: "Тихі години: близько 7 за рейс, більшість платять."
"A company's staff to their shifts: some 15 a trip, paid by its contract.":
  de: "Die Belegschaft eines Unternehmens zu ihren Schichten: etwa 15 pro Fahrt, bezahlt über dessen Vertrag."
  fr: "Le personnel d'une entreprise vers ses postes : environ 15 par course, payés par son contrat."
  nl: "Het personeel van een bedrijf naar hun diensten: zo'n 15 per rit, betaald via zijn contract."
  pl: "Pracownicy firmy na zmiany: około 15 na kurs, opłacani z jej umowy."
  ru: "Сотрудники предприятия на смену: около 15 за рейс, оплачивается по его договору."
  uk: "Працівники підприємства на зміну: близько 15 за рейс, оплачується за його договором."
"Pupils on school passes: 20 to 55 a trip, on school days only.":
  de: "Schüler mit Schülerkarten: 20 bis 55 pro Fahrt, nur an Schultagen."
  fr: "Des élèves avec abonnement scolaire : 20 à 55 par course, les jours d'école seulement."
  nl: "Leerlingen op een schoolabonnement: 20 tot 55 per rit, alleen op schooldagen."
  pl: "Uczniowie na biletach szkolnych: 20 do 55 na kurs, tylko w dni nauki."
  ru: "Школьники по школьным проездным: от 20 до 55 за рейс, только в учебные дни."
  uk: "Школярі за шкільними проїзними: від 20 до 55 за рейс, лише в навчальні дні."
