  uk: "%{p} пасажирів, %{h} на машино-годину, %{l} лишилися на зупинці"
"%{n} trips were full; %{p} passengers were left at the stop - fares lost, and they complain. Bigger buses or more trips help.":
  de: "%{n} Fahrten waren voll; %{p} Fahrgäste blieben an der Haltestelle stehen – verlorene Fahrgelder, und sie beschweren sich. Größere Busse oder mehr Fahrten helfen."
  fr: "%{n} courses étaient pleines ; %{p} voyageurs sont restés à l'arrêt – des recettes perdues, et ils se plaignent. Des bus plus grands ou plus de courses aident."
  nl: "%{n} ritten zaten vol; %{p} reizigers bleven aan de halte staan – gemiste opbrengst, en ze klagen. Grotere bussen of meer ritten helpen."
  pl: "%{n} kursów było pełnych; %{p} pasażerów zostało na przystanku – stracone wpływy z biletów, a oni się skarżą. Pomogą większe autobusy lub więcej kursów."
  ru: "%{n} рейсов были переполнены; %{p} пассажиров остались на остановке – потерянная выручка, и они жалуются. Помогут автобусы побольше или больше рейсов."
  uk: "%{n} рейсів були переповнені; %{p} пасажирів лишилися на зупинці – втрачена виручка, і вони скаржаться. Допоможуть більші автобуси або більше рейсів."
"A typical adult single costs %{single}, more for longer trips; most passengers ride on passes. The authority reimburses %{share} of the fare for every ride on a concession pass and pays a grant of %{bsog} for every kilometre in service.":
  de: "Ein üblicher Einzelfahrschein für Erwachsene kostet %{single}, für längere Fahrten mehr; die meisten Fahrgäste fahren mit Zeitkarten. Die Behörde erstattet %{share} des Fahrpreises für jede Fahrt mit einem Ermäßigungsausweis und zahlt einen Zuschuss von %{bsog} für jeden Kilometer im Linienbetrieb."
  fr: "Un ticket adulte ordinaire coûte %{single}, plus pour les trajets longs ; la plupart des voyageurs ont un abonnement. L'autorité rembourse %{share} du tarif pour chaque trajet avec une carte de réduction et verse une aide de %{bsog} par kilomètre en service."
  nl: "Een gewoon enkeltje voor volwassenen kost %{single}, meer voor langere ritten; de meeste reizigers rijden met een abonnement. De overheid vergoedt %{share} van het tarief voor elke rit op een kortingspas en betaalt een subsidie van %{bsog} voor elke kilometer in dienst."
  pl: "Zwykły bilet jednorazowy dla dorosłych kosztuje %{single}, więcej na dłuższe trasy; większość pasażerów jeździ na bilety okresowe. Organizator zwraca %{share} ceny za każdy przejazd na legitymację ulgową i płaci dopłatę %{bsog} za każdy kilometr w kursie."
  ru: "Обычный разовый взрослый билет стоит %{single}, на длинные поездки дороже; большинство пассажиров ездят по проездным. Власти возмещают %{share} тарифа за каждую поездку по льготному проездному и платят субсидию %{bsog} за каждый километр на линии."
  uk: "Звичайний разовий дорослий квиток коштує %{single}, на довші поїздки дорожче; більшість пасажирів їздять за проїзними. Влада відшкодовує %{share} тарифу за кожну поїздку за пільговим проїзним і платить субсидію %{bsog} за кожен кілометр на лінії."
"The adult single this line asks: change it, and see what it does to passengers and takings":
