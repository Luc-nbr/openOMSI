"At %{fare}: about %{pax} passengers a day (%{dp} against the standard fare) and %{rev} of takings a day - fares, passes and the concession reimbursement (%{dr}), once they have got used to it - a few weeks. The first days: about %{first} passengers.":
  de: "Bei %{fare}: etwa %{pax} Fahrgäste am Tag (%{dp} gegenüber dem Standardtarif) und %{rev} Einnahmen am Tag – Fahrgelder, Zeitkarten und die Erstattung für Ermäßigungen (%{dr}), sobald sie sich daran gewöhnt haben – ein paar Wochen. Die ersten Tage: etwa %{first} Fahrgäste."
  fr: "À %{fare} : environ %{pax} voyageurs par jour (%{dp} par rapport au tarif standard) et %{rev} de recettes par jour – billets, abonnements et remboursement des réductions (%{dr}), une fois qu'ils s'y sont habitués – quelques semaines. Les premiers jours : environ %{first} voyageurs."
  nl: "Bij %{fare}: zo'n %{pax} reizigers per dag (%{dp} tegenover het standaardtarief) en %{rev} aan opbrengst per dag – kaartjes, abonnementen en de vergoeding voor kortingspassen (%{dr}), zodra ze eraan gewend zijn – een paar weken. De eerste dagen: zo'n %{first} reizigers."
  pl: "Przy %{fare}: około %{pax} pasażerów dziennie (%{dp} wobec taryfy standardowej) i %{rev} wpływów dziennie – bilety, bilety okresowe i zwrot za ulgi (%{dr}), gdy się przyzwyczają – kilka tygodni. Pierwsze dni: około %{first} pasażerów."
  ru: "При %{fare}: около %{pax} пассажиров в день (%{dp} к стандартному тарифу) и %{rev} выручки в день – билеты, проездные и возмещение льгот (%{dr}), когда они привыкнут – несколько недель. Первые дни: около %{first} пассажиров."
  uk: "За %{fare}: близько %{pax} пасажирів на день (%{dp} щодо стандартного тарифу) і %{rev} виручки на день – квитки, проїзні й відшкодування пільг (%{dr}), коли вони звикнуть – кілька тижнів. Перші дні: близько %{first} пасажирів."
"Far above the standard fare: every day of it costs reputation as well.":
  de: "Weit über dem Standardtarif: Jeder Tag kostet auch Ansehen."
  fr: "Bien au-dessus du tarif standard : chaque jour coûte aussi de la réputation."
  nl: "Ver boven het standaardtarief: elke dag kost ook reputatie."
  pl: "Znacznie powyżej taryfy standardowej: każdy dzień kosztuje też reputację."
  ru: "Намного выше стандартного тарифа: каждый день стоит ещё и репутации."
  uk: "Набагато вище стандартного тарифу: кожен день коштує ще й репутації."
"Its passengers now: %{p} of what the standard fare would bring.":
  de: "Ihre Fahrgäste jetzt: %{p} dessen, was der Standardtarif brächte."
  fr: "Ses voyageurs maintenant : %{p} de ce que le tarif standard apporterait."
  nl: "De reizigers nu: %{p} van wat het standaardtarief zou opleveren."
  pl: "Pasażerów teraz: %{p} tego, co dałaby taryfa standardowa."
  ru: "Пассажиров сейчас: %{p} от того, что дал бы стандартный тариф."
  uk: "Пасажирів зараз: %{p} від того, що дав би стандартний тариф."
